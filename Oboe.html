<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oboe Pro Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; font-family: 'Sarabun', sans-serif; background-color: #1a1a1a; overflow: hidden; }
        .oboe-body { background: linear-gradient(90deg, #0f0f0f 0%, #2b1d12 40%, #1a120b 60%, #050505 100%); box-shadow: inset 0 0 20px #000; position: relative; }
        .key-btn { background: radial-gradient(circle at 30% 30%, #ffffff, #d1d5db, #6b7280, #374151); border: 2px solid #9ca3af; box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 -2px 4px rgba(0,0,0,0.3); transition: transform 0.05s; aspect-ratio: 1 / 1; }
        .key-btn:active, .key-btn.active { transform: scale(0.95) translateY(2px); filter: brightness(1.2); }
        .note-float { position: absolute; color: #fbbf24; font-weight: bold; font-size: 1.2rem; pointer-events: none; z-index: 100; animation: floatUp 1s ease-out forwards; text-shadow: 0 0 5px black; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.5); } }
        .rec-dot { width: 10px; height: 10px; background-color: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col text-white">

    <!-- Header -->
    <div class="bg-gray-900 p-3 flex justify-between items-center border-b border-gray-700">
        <h1 class="text-lg font-bold text-amber-500">OBOE PRO</h1>
        <div class="flex gap-2">
            <button id="recordBtn" class="bg-red-700 p-2 rounded text-xs font-bold">REC</button>
            <button id="stopRecBtn" class="hidden bg-gray-600 p-2 rounded text-xs font-bold">STOP</button>
        </div>
    </div>

    <!-- Settings -->
    <div class="bg-gray-800 p-3 grid grid-cols-2 gap-4 text-xs">
        <div><label>Volume</label><input type="range" id="volRange" min="0" max="1" step="0.1" value="0.5" class="w-full"></div>
        <div><label>Reverb</label><input type="range" id="revRange" min="0" max="0.5" step="0.1" value="0.2" class="w-full"></div>
    </div>

    <!-- Demo Songs -->
    <div class="bg-black/20 p-2 flex gap-2 justify-center">
        <button onclick="playSong('happyBirthday')" class="bg-amber-800 text-[10px] px-2 py-1 rounded">BDAY</button>
        <button onclick="playSong('twinkle')" class="bg-blue-800 text-[10px] px-2 py-1 rounded">STAR</button>
        <button onclick="stopSong()" class="bg-red-900 text-[10px] px-2 py-1 rounded">STOP</button>
    </div>

    <!-- Body -->
    <div class="oboe-body flex-grow flex items-center justify-center p-4">
        <div id="keys-container" class="grid grid-cols-4 gap-4 w-full max-w-sm"></div>
    </div>

    <script>
        let audioCtx, masterGain, reverbNode, activeOscillators = {};
        const NOTES = [
            { note: 'C5', freq: 523.25, label: 'Do' }, { note: 'B4', freq: 493.88, label: 'Ti' },
            { note: 'A4', freq: 440.00, label: 'La' }, { note: 'G4', freq: 392.00, label: 'So' },
            { note: 'F4', freq: 349.23, label: 'Fa' }, { note: 'E4', freq: 329.63, label: 'Mi' },
            { note: 'D4', freq: 293.66, label: 'Re' }, { note: 'C4', freq: 261.63, label: 'Do' }
        ];

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            reverbNode = audioCtx.createConvolver();
            masterGain.connect(audioCtx.destination);
        }

        function playNote(freq, id, element) {
            initAudio();
            if (activeOscillators[id]) return;

            const t = audioCtx.currentTime;
            
            // Oscillator Layering
            const osc1 = audioCtx.createOscillator(); // Main Tone
            osc1.type = 'sawtooth';
            osc1.frequency.value = freq;

            const osc2 = audioCtx.createOscillator(); // Harmonic Overtone
            osc2.type = 'square';
            osc2.frequency.value = freq * 1.005; // Slightly detuned

            // Breath/Reed Noise
            const noise = audioCtx.createBufferSource();
            const bufferSize = audioCtx.sampleRate * 0.1;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;

            // Envelopes
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, t);
            filter.frequency.exponentialRampToValueAtTime(1500, t + 0.1); // Reed bite

            gainNode.gain.setValueAtTime(0, t);
            gainNode.gain.linearRampToValueAtTime(0.4, t + 0.05);

            osc1.connect(filter); osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(masterGain);

            osc1.start(); osc2.start();
            activeOscillators[id] = { osc1, osc2, gainNode, filter };
            if (element) createFloatingNote(NOTES.find(n=>n.freq===freq)?.label || '♪', element);
        }

        function stopNote(id) {
            if (!activeOscillators[id]) return;
            const { osc1, osc2, gainNode } = activeOscillators[id];
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc1.stop(audioCtx.currentTime + 0.1);
            osc2.stop(audioCtx.currentTime + 0.1);
            delete activeOscillators[id];
        }

        function createFloatingNote(label, element) {
            const rect = element.getBoundingClientRect();
            const noteDiv = document.createElement('div');
            noteDiv.className = 'note-float';
            noteDiv.innerText = label;
            noteDiv.style.left = (rect.left + rect.width/3) + 'px';
            noteDiv.style.top = (rect.top - 20) + 'px';
            document.body.appendChild(noteDiv);
            setTimeout(() => noteDiv.remove(), 1000);
        }

        const container = document.getElementById('keys-container');
        NOTES.forEach((n, i) => {
            const btn = document.createElement('div');
            btn.className = "key-btn flex items-center justify-center font-bold text-gray-800";
            btn.innerHTML = n.label;
            btn.onmousedown = () => { playNote(n.freq, i, btn); btn.classList.add('active'); };
            btn.onmouseup = () => { stopNote(i); btn.classList.remove('active'); };
            btn.ontouchstart = (e) => { e.preventDefault(); btn.onmousedown(); };
            btn.ontouchend = () => btn.onmouseup();
            container.appendChild(btn);
        });

        const SONGS = {
            happyBirthday: [7, 7, 6, 7, 4, 5, 7, 7, 6, 7, 3, 4],
            twinkle: [7, 7, 3, 3, 2, 2, 4, 3, 3, 2, 2, 3, 4]
        };

        let songInterval = null;
        function playSong(key) {
            stopSong();
            let i = 0;
            songInterval = setInterval(() => {
                if(i >= SONGS[key].length) return stopSong();
                const idx = SONGS[key][i];
                const btn = container.children[7-idx];
                playNote(NOTES[7-idx].freq, 'song', btn);
                setTimeout(() => stopNote('song'), 400);
                i++;
            }, 600);
        }

        function stopSong() { clearInterval(songInterval); Object.keys(activeOscillators).forEach(stopNote); }
    </script>
</body>
</html>
