<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trumpet Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Mono:wght@400;500&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd700;--gold2:#c8980a;--gold3:#8b5e0a;--bg:#0c0904;--dim:#7a6030;--red:#c0392b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:#fff9ec;font-family:'Sarabun',sans-serif;overflow:hidden;}
body{display:flex;flex-direction:column;height:100dvh;}

#ov{position:fixed;inset:0;z-index:999;background:radial-gradient(ellipse at 50% 40%,#1c1005,#0c0904 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
.ov-e{font-size:4.5rem;margin-bottom:10px;filter:drop-shadow(0 0 18px rgba(255,215,0,.5));}
.ov-t{font-family:'Playfair Display',serif;font-size:2rem;color:var(--gold);margin:0 0 6px;}
.ov-s{font-size:.85rem;color:var(--dim);margin:0 0 4px;}
.ov-m{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--gold3);letter-spacing:.06em;margin:0 0 26px;}
#start-btn{padding:14px 48px;border-radius:50px;border:1px solid rgba(255,215,0,.4);background:linear-gradient(145deg,var(--gold),var(--gold2));color:#3d2000;font-family:'Playfair Display',serif;font-size:1.1rem;cursor:pointer;min-height:52px;box-shadow:0 6px 28px rgba(200,152,10,.4),inset 0 1px 0 rgba(255,255,255,.35);animation:glow 2.5s ease-in-out infinite alternate;}
@keyframes glow{from{box-shadow:0 6px 24px rgba(200,152,10,.35);}to{box-shadow:0 8px 40px rgba(200,152,10,.6);}}
.ov-h{margin-top:18px;font-size:.75rem;color:#4a3015;}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;flex-shrink:0;border-bottom:1px solid rgba(200,152,10,.12);background:#100a03;}
.logo{font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);letter-spacing:.04em;white-space:nowrap;}
.logo em{font-style:italic;color:var(--gold2);font-size:.82rem;}
.cr{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;}
.sw{display:flex;align-items:center;gap:5px;}
.sl{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--dim);letter-spacing:.06em;}
input[type=range]{-webkit-appearance:none;width:64px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold2),var(--gold3));outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9d0,var(--gold),var(--gold2));cursor:pointer;box-shadow:0 0 6px rgba(255,215,0,.4);}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(200,152,10,.25);background:rgba(255,215,0,.06);color:var(--gold2);font-size:.82rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.ibtn:active{transform:scale(.92);}
.ibtn.rec{color:var(--red);border-color:rgba(192,57,43,.35);}
.ibtn.rec.on{background:rgba(192,57,43,.15);animation:rp 1.2s infinite;}
.ibtn:disabled{opacity:.3;cursor:not-allowed;}
@keyframes rp{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.4);}50%{box-shadow:0 0 0 7px rgba(192,57,43,0);}}

.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;}
.glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.07) 0%,transparent 70%);pointer-events:none;opacity:0;transition:opacity .25s;}
.glow.lit{opacity:1;animation:br 2s ease-in-out infinite;}
@keyframes br{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
.rings{position:absolute;right:calc(50% - 115px);top:50%;transform:translateY(-50%);pointer-events:none;}
.ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,215,0,.45);opacity:0;left:0;top:0;transform:translate(-50%,-50%);}
.rings.lit .ring:nth-child(1){animation:ro 1.8s ease-out 0s infinite;}
.rings.lit .ring:nth-child(2){animation:ro 1.8s ease-out .55s infinite;}
.rings.lit .ring:nth-child(3){animation:ro 1.8s ease-out 1.1s infinite;}
@keyframes ro{0%{width:14px;height:14px;opacity:.8;}100%{width:190px;height:190px;opacity:0;}}
#vu{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold3),var(--gold),#fff);transform-origin:left;transform:scaleX(0);transition:transform .04s linear;pointer-events:none;}
.foot{position:absolute;bottom:4px;width:100%;text-align:center;font-family:'DM Mono',monospace;font-size:.55rem;color:#2a1a06;letter-spacing:.08em;pointer-events:none;}

.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));width:100%;max-width:500px;flex-shrink:0;}
.key{aspect-ratio:1;border-radius:14px;border:1px solid rgba(200,152,10,.2);background:linear-gradient(145deg,#231507,#110a02);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,215,0,.07);transition:transform .07s,box-shadow .07s;}
.key::after{content:'';position:absolute;width:72%;height:72%;border-radius:50%;border:1px solid rgba(200,152,10,.14);pointer-events:none;}
.kth{font-size:1.15rem;font-weight:700;color:var(--gold);position:relative;z-index:2;line-height:1;}
.ken{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--gold3);position:relative;z-index:2;margin-top:3px;}
.key.dn{transform:scale(.95) translateY(2px);background:linear-gradient(145deg,#3c1f06,#1b0e02);border-color:rgba(255,215,0,.38);box-shadow:0 1px 6px rgba(0,0,0,.9),0 0 16px rgba(255,215,0,.12),inset 0 3px 8px rgba(0,0,0,.65);}
.key.dn .kth{color:#fff9d0;text-shadow:0 0 10px rgba(255,215,0,.6);}
.key.dn::after{border-color:rgba(255,215,0,.28);}
.ripple{position:absolute;border-radius:50%;background:rgba(255,215,0,.18);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none;}
@keyframes rip{to{transform:scale(4);opacity:0;}}
@media(max-width:380px){.keys{gap:7px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));}.kth{font-size:1rem;}input[type=range]{width:50px;}}
</style>
</head>
<body>

<div id="ov">
    <div class="ov-e">🎺</div>
    <h1 class="ov-t">Trumpet Pro</h1>
    <p class="ov-s">เสียงทรัมเป็ตจำลองฟิสิกส์จริง</p>
    <p class="ov-m">HARMONIC SERIES · FORMANT FILTER · LIP BUZZ</p>
    <button id="start-btn">▶ เริ่มเล่น</button>
    <p class="ov-h">กดค้าง = เป่า · ปล่อย = หยุด · PC: A S D F G H J K</p>
</div>

<div class="hdr">
    <div class="logo">Trumpet <em>Pro</em></div>
    <div class="cr">
        <div class="sw"><span class="sl">VOL</span><input type="range" id="vol" min="0" max="100" value="80"></div>
        <div class="sw"><span class="sl">TONE</span><input type="range" id="tone" min="0" max="100" value="60"></div>
        <div class="sw"><span class="sl">REV</span><input type="range" id="rev" min="0" max="100" value="30"></div>
        <button class="ibtn rec" id="btn-rec" title="บันทึก">●</button>
        <button class="ibtn" id="btn-dl" title="ดาวน์โหลด" disabled>↓</button>
    </div>
</div>

<div class="stage">
    <div class="glow" id="glow"></div>
    <div class="rings" id="rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
    <svg viewBox="0 0 320 130" width="295" height="115" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f2d055"/><stop offset="45%" stop-color="#c8980a"/><stop offset="100%" stop-color="#6a3e05"/></linearGradient>
            <radialGradient id="bg" cx="32%" cy="30%"><stop offset="0%" stop-color="#fff7cc"/><stop offset="38%" stop-color="#d4a017"/><stop offset="72%" stop-color="#9a5e0e"/><stop offset="100%" stop-color="#3a1c00"/></radialGradient>
            <radialGradient id="vg" cx="30%" cy="28%"><stop offset="0%" stop-color="#f5ead0"/><stop offset="50%" stop-color="#b8b8b8"/><stop offset="100%" stop-color="#707070"/></radialGradient>
        </defs>
        <path d="M42 67 Q42 100 80 100 Q118 100 118 67" stroke="url(#tg)" stroke-width="11" fill="none" stroke-linecap="round"/>
        <rect x="42" y="54" width="140" height="14" rx="7" fill="url(#tg)"/>
        <path d="M90 54 Q90 28 120 28 Q150 28 150 54" stroke="url(#tg)" stroke-width="10" fill="none" stroke-linecap="round"/>
        <rect x="10" y="58" width="36" height="7" rx="3.5" fill="#b8860b"/>
        <ellipse cx="10" cy="61.5" rx="6" ry="7.5" fill="#d4a017" stroke="#f0d060" stroke-width=".8"/>
        <path d="M182 47 Q242 47 272 18 Q298 0 308 10 Q294 30 260 57 Q240 72 182 72 Z" fill="url(#bg)"/>
        <path d="M182 52 Q220 52 248 35 Q264 24 270 28 Q258 45 230 59 Q212 68 182 68 Z" fill="rgba(0,0,0,.18)"/>
        <path d="M182 47 L182 72" stroke="#f0d060" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M220 30 Q250 17 270 15" stroke="rgba(255,255,255,.16)" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="78" y="44" width="21" height="38" rx="3.5" fill="url(#tg)"/>
        <rect x="81" y="39" width="15" height="8" rx="3" fill="url(#vg)"/>
        <rect x="81" y="75" width="15" height="8" rx="3" fill="url(#vg)"/>
        <circle cx="88.5" cy="63" r="7" fill="url(#vg)" stroke="#d4a017" stroke-width=".8"/>
        <rect x="106" y="44" width="21" height="38" rx="3.5" fill="url(#tg)"/>
        <rect x="109" y="39" width="15" height="8" rx="3" fill="url(#vg)"/>
        <rect x="109" y="75" width="15" height="8" rx="3" fill="url(#vg)"/>
        <circle cx="116.5" cy="63" r="7" fill="url(#vg)" stroke="#d4a017" stroke-width=".8"/>
        <rect x="134" y="44" width="21" height="38" rx="3.5" fill="url(#tg)"/>
        <rect x="137" y="39" width="15" height="8" rx="3" fill="url(#vg)"/>
        <rect x="137" y="75" width="15" height="8" rx="3" fill="url(#vg)"/>
        <circle cx="144.5" cy="63" r="7" fill="url(#vg)" stroke="#d4a017" stroke-width=".8"/>
    </svg>
    <div id="vu"></div>
    <div class="foot">WEB AUDIO API — BRASS PHYSICS ENGINE</div>
</div>

<div class="keys">
    <button class="key" data-note="C4"><span class="kth">โด</span><span class="ken">C4</span></button>
    <button class="key" data-note="D4"><span class="kth">เร</span><span class="ken">D4</span></button>
    <button class="key" data-note="E4"><span class="kth">มี</span><span class="ken">E4</span></button>
    <button class="key" data-note="F4"><span class="kth">ฟา</span><span class="ken">F4</span></button>
    <button class="key" data-note="G4"><span class="kth">ซอล</span><span class="ken">G4</span></button>
    <button class="key" data-note="A4"><span class="kth">ลา</span><span class="ken">A4</span></button>
    <button class="key" data-note="B4"><span class="kth">ที</span><span class="ken">B4</span></button>
    <button class="key" data-note="C5"><span class="kth">โด↑</span><span class="ken">C5</span></button>
</div>

<script>
const FREQ={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,C5:523.25};
let ctx=null,masterGain,reverbGain,dryGain,conv,recDest;
const active=new Map();
let P={vol:.80,tone:.60,rev:.30};

function initAudio(){
    if(ctx) return;
    ctx=new (window.AudioContext||window.webkitAudioContext)();

    masterGain=ctx.createGain();
    masterGain.gain.value=P.vol;

    dryGain=ctx.createGain();
    reverbGain=ctx.createGain();
    conv=ctx.createConvolver();
    conv.buffer=makeIR();
    recDest=ctx.createMediaStreamDestination();

    dryGain.gain.value=1-P.rev;
    reverbGain.gain.value=P.rev*.5;

    masterGain.connect(dryGain);
    masterGain.connect(conv);
    conv.connect(reverbGain);
    dryGain.connect(ctx.destination);
    dryGain.connect(recDest);
    reverbGain.connect(ctx.destination);
    reverbGain.connect(recDest);
}

function makeIR(){
    const sr=ctx.sampleRate,len=sr*2|0,buf=ctx.createBuffer(2,len,sr);
    for(let c=0;c<2;c++){
        const d=buf.getChannelData(c);
        for(let i=0;i<len;i++){
            const t=i/sr;
            d[i]=(Math.random()*2-1)*Math.exp(-t*(Math.log(1000)/1.5))*(c===0?1:.92);
        }
    }
    return buf;
}

function makeCurve(drive){
    const N=256,c=new Float32Array(N);
    for(let i=0;i<N;i++){
        const x=2*i/N-1;
        c[i]=x>0?(1+drive)*x/(1+drive*x):(1+drive*.6)*x/(1+drive*.6*Math.abs(x));
    }
    return c;
}

function playNote(freq,id){
    if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume();
    if(active.has(id)) stopNote(id,true);

    const t=ctx.currentTime,tone=P.tone;

    // Harmonic bank: sawtooth-heavy = brass timbre
    const HARMS=[[1,1.0,'sawtooth'],[2,.78,'sawtooth'],[3,.60,'triangle'],
                  [4,.46,'sawtooth'],[5,.34,'triangle'],[6,.24,'sawtooth'],
                  [7,.16,'triangle'],[8,.10,'sine']];

    const oscs=HARMS.map(([n,amp,type])=>{
        const osc=ctx.createOscillator(),g=ctx.createGain();
        osc.type=type;
        osc.frequency.value=freq*n*(1+.001*n*n); // slight inharmonicity
        const bf=n<=3?1:1+(tone-.5)*(n-3)*.18;
        g.gain.value=amp*Math.max(.04,bf);
        osc.connect(g);
        return{osc,g};
    });

    const sum=ctx.createGain();
    sum.gain.value=1.0; // full level
    oscs.forEach(({g})=>g.connect(sum));

    // Bell formant resonators
    const FMT=[{f:520,Q:4.5,gdb:6},{f:1100,Q:3.5,gdb:8},{f:2300,Q:2.2,gdb:5},{f:3600,Q:1.5,gdb:3}];
    let chain=sum;
    FMT.forEach(({f,Q,gdb})=>{
        const flt=ctx.createBiquadFilter();
        flt.type='peaking'; flt.frequency.value=f; flt.Q.value=Q;
        flt.gain.value=gdb*(.5+tone);
        chain.connect(flt); chain=flt;
    });

    // Brightness lowpass
    const lpf=ctx.createBiquadFilter();
    lpf.type='lowpass'; lpf.Q.value=.5;
    const cutoff=freq*(2+tone*6);
    lpf.frequency.setValueAtTime(300,t);
    lpf.frequency.exponentialRampToValueAtTime(cutoff,t+.04);
    lpf.frequency.exponentialRampToValueAtTime(cutoff*.6,t+.4);
    chain.connect(lpf);

    // Wave shaper — brass "edge"
    const ws=ctx.createWaveShaper();
    ws.curve=makeCurve(10+tone*18);
    ws.oversample='2x';
    lpf.connect(ws);

    // Amplitude envelope
    const amp=ctx.createGain();
    amp.gain.setValueAtTime(.001,t);
    amp.gain.exponentialRampToValueAtTime(1.0,t+.025);
    amp.gain.linearRampToValueAtTime(.85,t+.10);
    ws.connect(amp);
    amp.connect(masterGain);

    // Pitch envelope (lip tension on attack)
    oscs.slice(0,4).forEach(({osc},i)=>{
        const r=14/(i+1);
        osc.detune.setValueAtTime(-r*.5,t);
        osc.detune.linearRampToValueAtTime(r,t+.018);
        osc.detune.linearRampToValueAtTime(0,t+.04);
    });

    // Vibrato LFO — starts after delay
    const lfo=ctx.createOscillator(),lfoG=ctx.createGain();
    lfo.type='sine'; lfo.frequency.value=5.3+Math.random()*.3;
    lfoG.gain.value=0;
    lfo.connect(lfoG);
    oscs.forEach(({osc})=>lfoG.connect(osc.detune));

    // Breath burst
    const bb=makeBreath();
    const bSrc=ctx.createBufferSource(),bG=ctx.createGain(),bH=ctx.createBiquadFilter();
    bSrc.buffer=bb; bH.type='highpass'; bH.frequency.value=500;
    bG.gain.setValueAtTime(0,t);
    bG.gain.linearRampToValueAtTime(.12,t+.01);
    bG.gain.exponentialRampToValueAtTime(.001,t+.2);
    bSrc.connect(bH); bH.connect(bG); bG.connect(masterGain);

    oscs.forEach(({osc})=>osc.start(t));
    lfo.start(t); bSrc.start(t);

    const vTid=setTimeout(()=>{
        if(!active.has(id)) return;
        const now=ctx.currentTime;
        lfoG.gain.setValueAtTime(0,now);
        lfoG.gain.linearRampToValueAtTime(3.5,now+.2);
    },370);

    active.set(id,{oscs,lfo,lfoG,amp,lpf,vTid});
}

function makeBreath(){
    const sr=ctx.sampleRate,len=sr*.25|0,buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);
    let y=0;
    for(let i=0;i<len;i++){
        y=.5*(Math.random()*2-1)+.5*y;
        const e=Math.pow(i/len<.05?i/(len*.05):(1-i/len),1.2);
        d[i]=y*e;
    }
    return buf;
}

function stopNote(id,immediate=false){
    const n=active.get(id);
    if(!n||!ctx) return;
    clearTimeout(n.vTid);
    const t=ctx.currentTime,rt=immediate?.035:.08;
    n.amp.gain.cancelScheduledValues(t);
    n.amp.gain.setValueAtTime(Math.max(n.amp.gain.value,.001),t);
    n.amp.gain.exponentialRampToValueAtTime(.0001,t+rt);
    n.oscs.slice(0,3).forEach(({osc},i)=>{
        try{osc.detune.cancelScheduledValues(t);osc.detune.setValueAtTime(0,t);osc.detune.linearRampToValueAtTime(-10/(i+1),t+.05);}catch(e){}
    });
    n.lpf.frequency.cancelScheduledValues(t);
    n.lpf.frequency.setValueAtTime(n.lpf.frequency.value,t);
    n.lpf.frequency.exponentialRampToValueAtTime(200,t+rt*.8);
    n.lfoG.gain.cancelScheduledValues(t);
    n.lfoG.gain.setValueAtTime(n.lfoG.gain.value,t);
    n.lfoG.gain.linearRampToValueAtTime(0,t+.04);
    const st=t+rt+.05;
    n.oscs.forEach(({osc})=>{try{osc.stop(st);}catch(e){}});
    n.lfo.stop(st);
    setTimeout(()=>active.delete(id),(rt+.08)*1000);
}

// Recorder
let mr,chunks=[],recBlob,recURL,isRec=false;
function toggleRec(){isRec?stopRec():startRec();}
function startRec(){
    if(!recDest) return;
    chunks=[];
    const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg'].find(m=>MediaRecorder.isTypeSupported(m));
    try{mr=new MediaRecorder(recDest.stream,{mimeType:mime});}
    catch(e){alert('ไม่รองรับการบันทึก');return;}
    mr.ondataavailable=e=>e.data.size>0&&chunks.push(e.data);
    mr.onstop=()=>{recBlob=new Blob(chunks,{type:mr.mimeType});recURL=URL.createObjectURL(recBlob);document.getElementById('btn-dl').disabled=false;};
    mr.start(80);isRec=true;
    const b=document.getElementById('btn-rec');b.classList.add('on');b.textContent='■';
}
function stopRec(){
    if(mr?.state!=='inactive')mr.stop();
    isRec=false;
    const b=document.getElementById('btn-rec');b.classList.remove('on');b.textContent='●';
}
function download(){
    if(!recURL)return;
    const a=document.createElement('a');
    a.href=recURL;a.download=`trumpet-${Date.now().toString(36)}.${recBlob.type.includes('webm')?'webm':'ogg'}`;a.click();
}

// VU meter
let vu=0;
(function loop(){
    vu=active.size>0?Math.min(1,vu+.10):Math.max(0,vu-.06);
    document.getElementById('vu').style.transform=`scaleX(${vu})`;
    const lit=active.size>0;
    document.getElementById('glow').classList.toggle('lit',lit);
    document.getElementById('rings').classList.toggle('lit',lit);
    requestAnimationFrame(loop);
})();

// Ripple helper
function ripple(btn){
    const r=document.createElement('span');
    r.className='ripple';
    const s=btn.offsetWidth*.7;
    r.style.cssText=`width:${s}px;height:${s}px;left:${(btn.offsetWidth-s)/2}px;top:${(btn.offsetHeight-s)/2}px`;
    btn.appendChild(r);setTimeout(()=>r.remove(),500);
}

// Start button
document.getElementById('start-btn').addEventListener('click',()=>{
    initAudio();
    const ov=document.getElementById('ov');
    ov.style.transition='opacity .4s';ov.style.opacity='0';
    setTimeout(()=>ov.remove(),420);
    if(navigator.vibrate)navigator.vibrate(20);
});

// Sliders
document.getElementById('vol').oninput=e=>{P.vol=e.target.value/100;if(masterGain&&ctx)masterGain.gain.setTargetAtTime(P.vol,ctx.currentTime,.01);};
document.getElementById('tone').oninput=e=>{P.tone=e.target.value/100;};
document.getElementById('rev').oninput=e=>{P.rev=e.target.value/100;if(ctx){dryGain.gain.setTargetAtTime(1-P.rev,ctx.currentTime,.04);reverbGain.gain.setTargetAtTime(P.rev*.5,ctx.currentTime,.04);}};
document.getElementById('btn-rec').onclick=toggleRec;
document.getElementById('btn-dl').onclick=download;

// Keys
document.querySelectorAll('.key').forEach(btn=>{
    const id=btn.dataset.note,freq=FREQ[id];
    const onD=e=>{e.preventDefault();if(!ctx)return;btn.classList.add('dn');ripple(btn);playNote(freq,id);if(navigator.vibrate)navigator.vibrate(10);};
    const onU=e=>{e.preventDefault();btn.classList.remove('dn');stopNote(id);};
    btn.addEventListener('touchstart',onD,{passive:false});
    btn.addEventListener('touchend',onU,{passive:false});
    btn.addEventListener('touchcancel',onU,{passive:false});
    btn.addEventListener('mousedown',onD);
    btn.addEventListener('mouseup',onU);
    btn.addEventListener('mouseleave',onU);
    btn.oncontextmenu=e=>e.preventDefault();
});

// Keyboard
const KB={a:'C4',s:'D4',d:'E4',f:'F4',g:'G4',h:'A4',j:'B4',k:'C5'};
const held=new Set();
document.addEventListener('keydown',e=>{
    if(e.repeat||held.has(e.key)||!ctx)return;
    const id=KB[e.key.toLowerCase()];if(!id)return;
    held.add(e.key);
    document.querySelector(`.key[data-note="${id}"]`)?.classList.add('dn');
    playNote(FREQ[id],id);
});
document.addEventListener('keyup',e=>{
    held.delete(e.key);
    const id=KB[e.key.toLowerCase()];if(!id)return;
    document.querySelector(`.key[data-note="${id}"]`)?.classList.remove('dn');
    stopNote(id);
});

// iOS unlock
document.addEventListener('touchstart',()=>{ctx?.state==='suspended'&&ctx.resume();},{once:true,passive:true});
</script>
</body>
