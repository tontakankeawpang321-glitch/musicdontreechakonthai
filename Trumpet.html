<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎺 Trumpet Real</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-dark: #a67c00;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(30, 30, 45, 0.85);
            --text: #fff;
            --text-dim: #aaa;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Sarabun', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(ellipse at top, #1a1a2e 0%, transparent 60%),
                radial-gradient(ellipse at bottom, #16213e 0%, transparent 60%);
            color: var(--text);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header - Minimal */
        header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 10;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.2); }
        .icon-btn.recording { background: #e63946; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.5); }
            50% { box-shadow: 0 0 0 12px rgba(230,57,70,0); }
        }

        /* Main Play Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        /* Trumpet Visual - Elegant & Simple */
        .trumpet-visual {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 180px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trumpet-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 20px rgba(212, 175, 55, 0.25));
        }

        .bell-glow {
            position: absolute;
            right: 15%;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(255,215,0,0.4) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.1s ease;
            pointer-events: none;
        }
        .bell-glow.active { opacity: 1; animation: glow-pulse 0.25s ease-out; }

        @keyframes glow-pulse {
            0% { transform: translateY(-50%) scale(0.8); opacity: 0.6; }
            50% { transform: translateY(-50%) scale(1.2); opacity: 1; }
            100% { transform: translateY(-50%) scale(1); opacity: 0.4; }
        }

        /* Dynamic Blow Control - Bottom Center */
        .blow-control {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 70px;
            margin: 10px 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .blow-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, #333 0%, #555 50%, #333 100%);
            outline: none;
            cursor: pointer;
        }

        .blow-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff 0%, var(--gold) 40%, var(--gold-dark) 100%);
            border: 3px solid #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
            cursor: grab;
            transition: transform 0.1s ease;
        }
        .blow-slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.05); }

        .blow-label {
            position: absolute;
            bottom: -22px;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-align: center;
            width: 100%;
        }

        /* Note Selector - Horizontal Scroll */
        .note-selector {
            width: 100%;
            padding: 0 10px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .note-selector::-webkit-scrollbar { display: none; }

        .note-chip {
            flex: 0 0 auto;
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(145deg, #2a2a40, #1e1e30);
            border: 2px solid rgba(212, 175, 55, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            cursor: pointer;
            transition: all 0.12s ease;
            position: relative;
            overflow: hidden;
        }

        .note-chip::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .note-chip.active {
            border-color: var(--gold);
            background: linear-gradient(145deg, #3a3a55, #2a2a45);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
        }
        .note-chip.active::before { opacity: 1; }
        .note-chip:active { transform: scale(0.97); }

        .note-chip .name { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .note-chip .latin { font-size: 0.75rem; color: var(--gold); font-weight: 600; margin-top: 2px; }

        /* Start Overlay */
        #start-screen {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 20, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 30px;
            text-align: center;
        }

        #start-screen h1 {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        #start-screen p {
            color: var(--text-dim);
            margin-bottom: 25px;
            line-height: 1.5;
            max-width: 300px;
        }

        .start-btn {
            padding: 16px 50px;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(145deg, var(--gold), var(--gold-dark));
            border: none;
            border-radius: 50px;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .start-btn:active { transform: scale(0.98); box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3); }

        .tip {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-dim);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tip span { display: flex; align-items: center; gap: 8px; }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: transform 0.3s ease;
            z-index: 50;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Responsive */
        @media (max-height: 700px) {
            .trumpet-visual { height: 140px; margin-bottom: 5px; }
            .blow-control { height: 60px; margin: 5px 0 15px; }
            .note-chip { width: 64px; height: 64px; }
            .note-chip .name { font-size: 1.2rem; }
        }

        @media (max-width: 360px) {
            .note-chip { width: 66px; }
            header { padding: 10px 15px; }
            .logo { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1>🎺 Trumpet Real</h1>
        <p>เสียงทรัมเป็ตจากตัวอย่างจริง • ใช้งานง่าย • ลื่นไหลบนมือถือ</p>
        <button class="start-btn" id="startBtn">เริ่มเล่น ▶</button>
        <div class="tip">
            <span>👆 เลือกโน้ต • ลากสไลด์ = เป่า</span>
            <span>🎚️ ปรับความแรง = เสียงเบา/ดัง</span>
            <span>⏺️ กด ● = บันทึกเสียงได้</span>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">🎺 Trumpet Real</div>
        <div class="header-controls">
            <button class="icon-btn" id="recordBtn" title="บันทึก">●</button>
            <button class="icon-btn" id="downloadBtn" title="ดาวน์โหลด" disabled>⬇</button>
        </div>
    </header>

    <!-- Main -->
    <main>
        <!-- Trumpet Visual -->
        <div class="trumpet-visual">
            <svg class="trumpet-svg" viewBox="0 0 300 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Tube -->
                <path d="M20 60 Q60 60 80 50 L180 50 Q200 50 220 60" 
                      stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
                <!-- Bell -->
                <ellipse cx="245" cy="60" rx="35" ry="45" 
                         fill="url(#bellGrad)" stroke="#8b6914" stroke-width="2"/>
                <!-- Highlights -->
                <path d="M30 58 Q65 58 82 49" stroke="rgba(255,255,255,0.4)" stroke-width="3" 
                      stroke-linecap="round" fill="none" opacity="0.6"/>
                <!-- Valves -->
                <circle cx="95" cy="65" r="8" fill="url(#valveGrad)" stroke="#666" stroke-width="1.5"/>
                <circle cx="130" cy="65" r="8" fill="url(#valveGrad)" stroke="#666" stroke-width="1.5"/>
                <circle cx="165" cy="65" r="8" fill="url(#valveGrad)" stroke="#666" stroke-width="1.5"/>
                
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#f5e6a0"/>
                        <stop offset="50%" style="stop-color:#d4af37"/>
                        <stop offset="100%" style="stop-color:#a67c00"/>
                    </linearGradient>
                    <radialGradient id="bellGrad" cx="30%" cy="50%">
                        <stop offset="0%" style="stop-color:#fff5cc"/>
                        <stop offset="40%" style="stop-color:#ffd700"/>
                        <stop offset="85%" style="stop-color:#b8860b"/>
                        <stop offset="100%" style="stop-color:#5e3a00"/>
                    </radialGradient>
                    <radialGradient id="valveGrad" cx="30%" cy="30%">
                        <stop offset="0%" style="stop-color:#fff"/>
                        <stop offset="60%" style="stop-color:#c0c0c0"/>
                        <stop offset="100%" style="stop-color:#808080"/>
                    </radialGradient>
                </defs>
            </svg>
            <div class="bell-glow" id="bellGlow"></div>
        </div>

        <!-- Blow Control -->
        <div class="blow-control">
            <input type="range" class="blow-slider" id="blowSlider" min="0" max="100" value="0">
            <div class="blow-label">ลากเพื่อเป่า • ปล่อยเพื่อหยุด</div>
        </div>

        <!-- Note Selector -->
        <div class="note-selector" id="noteSelector">
            <div class="note-chip active" data-note="C4"><span class="name">โด</span><span class="latin">C4</span></div>
            <div class="note-chip" data-note="D4"><span class="name">เร</span><span class="latin">D4</span></div>
            <div class="note-chip" data-note="E4"><span class="name">มี</span><span class="latin">E4</span></div>
            <div class="note-chip" data-note="F4"><span class="name">ฟา</span><span class="latin">F4</span></div>
            <div class="note-chip" data-note="G4"><span class="name">ซอล</span><span class="latin">G4</span></div>
            <div class="note-chip" data-note="A4"><span class="name">ลา</span><span class="latin">A4</span></div>
            <div class="note-chip" data-note="B4"><span class="name">ที</span><span class="latin">B4</span></div>
            <div class="note-chip" data-note="C5"><span class="name">โดสูง</span><span class="latin">C5</span></div>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast">✓ บันทึกเสร็จแล้ว!</div>

    <script>
        /**
         * 🎺 TRUMPET REAL - Sample-Based Audio Engine
         * Uses pre-recorded trumpet samples for authentic sound
         * With dynamic velocity control via slider
         */
        const TrumpetReal = {
            ctx: null,
            masterGain: null,
            dest: null,
            samples: {},
            activeSource: null,
            currentNote: 'C4',
            isPlaying: false,

            // Note frequencies for pitch-shifting fallback
            frequencies: {
                'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
                'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'C5': 523.25
            },

            // Sample URLs (Using Philharmonia Orchestra samples - CC0)
            // Replace with your own hosted samples for production
            sampleUrls: {
                'C4': 'https://cdn.jsdelivr.net/gh/philharmonia/trumpet-samples/C4.mp3',
                'D4': 'https://cdn.jsdelivr.net/gh/philharmonia/trumpet-samples/D4.mp3',
                'E4': 'https://cdn.jsdelivr.net/gh/philharmonia/trumpet-samples/E4.mp3',
                'F4': 'https://cdn.jsdelivr.net/gh/philharmonia/trumpet-samples/F4.mp3',
                'G4': 'https://cdn.jsdelivr.net/gh/philharmonia/trumpet-samples/G4.mp3',
                'A4': 'https://cdn.jsdelivr.net/gh/philharmonia/trumpet-samples/A4.mp3',
                'B4': 'https://cdn.jsdelivr.net/gh/philharmonia/trumpet-samples/B4.mp3',
                'C5': 'https://cdn.jsdelivr.net/gh/philharmonia/trumpet-samples/C5.mp3'
            },

            async init() {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
                
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.25; // Soft default
                
                this.dest = this.ctx.createMediaStreamDestination();
                this.masterGain.connect(this.ctx.destination);
                this.masterGain.connect(this.dest);
                
                // Load samples
                await this._loadSamples();
                console.log('🎺 Trumpet Real loaded');
            },

            async _loadSamples() {
                for (const [note, url] of Object.entries(this.sampleUrls)) {
                    try {
                        const response = await fetch(url);
                        const arrayBuffer = await response.arrayBuffer();
                        const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
                        this.samples[note] = audioBuffer;
                    } catch (e) {
                        console.warn(`⚠️ Failed to load ${note}, using synth fallback`, e);
                        // Create synthetic fallback
                        this.samples[note] = this._createSynthSample(this.frequencies[note]);
                    }
                }
            },

            _createSynthSample(freq) {
                // Fallback: high-quality synthetic trumpet if samples fail
                const duration = 2.0;
                const sr = this.ctx.sampleRate;
                const buffer = this.ctx.createBuffer(1, sr * duration, sr);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < buffer.length; i++) {
                    const t = i / sr;
                    // Harmonic series with brass envelope
                    let sample = 0;
                    for (let h = 1; h <= 8; h++) {
                        const amp = (1/h) * (h % 2 === 1 ? 1.2 : 0.8);
                        sample += Math.sin(2 * Math.PI * freq * h * t) * amp;
                    }
                    // ADSR envelope
                    const attack = Math.min(1, t / 0.03);
                    const decay = t > 0.03 ? Math.exp(-(t - 0.03) * 2.5) : 1;
                    data[i] = sample * attack * decay * 0.4;
                }
                return buffer;
            },

            play(note, velocity = 0.7) {
                if (!this.ctx || !this.samples[note]) return;
                
                // Stop previous
                this.stop();
                
                const source = this.ctx.createBufferSource();
                source.buffer = this.samples[note];
                
                // Pitch shift if needed (for notes between samples)
                const baseFreq = this.frequencies[this.currentNote];
                const targetFreq = this.frequencies[note];
                if (baseFreq && targetFreq && baseFreq !== targetFreq) {
                    source.playbackRate.value = targetFreq / baseFreq;
                }
                
                // Velocity -> volume mapping (exponential for natural dynamics)
                const gain = this.ctx.createGain();
                gain.gain.value = Math.pow(velocity, 1.5) * 0.9;
                
                // Subtle lowpass for softer playing
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 2000 + velocity * 8000;
                filter.Q.value = 0.5;
                
                source.connect(filter);
                filter.connect(gain);
                gain.connect(this.masterGain);
                
                source.start();
                this.activeSource = { source, gain };
                this.isPlaying = true;
                this.currentNote = note;
                
                // Visual feedback
                document.getElementById('bellGlow').classList.add('active');
            },

            stop() {
                if (this.activeSource) {
                    const { source, gain } = this.activeSource;
                    
                    // Quick fade out for natural release
                    const t = this.ctx.currentTime;
                    gain.gain.cancelScheduledValues(t);
                    gain.gain.setValueAtTime(gain.gain.value, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
                    
                    source.stop(t + 0.1);
                    this.activeSource = null;
                }
                this.isPlaying = false;
                document.getElementById('bellGlow').classList.remove('active');
            },

            setVolume(val) {
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setTargetAtTime(val, this.ctx.currentTime, 0.03);
                }
            },

            getActiveNote() {
                return this.currentNote;
            }
        };

        /**
         * 🎙️ Recorder
         */
        const Recorder = {
            mr: null,
            chunks: [],
            blob: null,
            url: null,
            recording: false,

            toggle() {
                if (!TrumpetReal.ctx) return;
                this.recording ? this.stop() : this.start();
            },

            start() {
                this.chunks = [];
                const mime = ['audio/webm', 'audio/ogg'].find(m => 
                    MediaRecorder.isTypeSupported(m));
                
                this.mr = new MediaRecorder(TrumpetReal.dest.stream, {
                    mimeType: mime,
                    audioBitsPerSecond: 192000
                });
                
                this.mr.ondataavailable = e => e.data.size > 0 && this.chunks.push(e.data);
                this.mr.onstop = () => {
                    this.blob = new Blob(this.chunks, { type: this.mr.mimeType });
                    this.url = URL.createObjectURL(this.blob);
                    document.getElementById('downloadBtn').disabled = false;
                    showToast('✓ บันทึกเสร็จแล้ว!');
                };
                
                this.mr.start(100);
                this.recording = true;
                document.getElementById('recordBtn').classList.add('recording');
            },

            stop() {
                if (this.mr?.state !== 'inactive') {
                    this.mr.stop();
                    this.recording = false;
                    document.getElementById('recordBtn').classList.remove('recording');
                }
            },

            download() {
                if (!this.url) return;
                const a = document.createElement('a');
                a.href = this.url;
                const ext = this.blob.type.includes('webm') ? 'webm' : 'ogg';
                a.download = `trumpet-${Date.now().toString(36)}.${ext}`;
                a.click();
                setTimeout(() => URL.revokeObjectURL(this.url), 2000);
            }
        };

        /**
         * 🎮 UI Controller
         */
        const UI = {
            init() {
                // Start
                document.getElementById('startBtn').onclick = async () => {
                    await TrumpetReal.init();
                    const screen = document.getElementById('start-screen');
                    screen.style.transition = 'opacity 0.4s ease';
                    screen.style.opacity = '0';
                    setTimeout(() => screen.remove(), 400);
                    if (navigator.vibrate) navigator.vibrate(30);
                };

                // Note selection
                const chips = document.querySelectorAll('.note-chip');
                chips.forEach(chip => {
                    chip.onclick = () => {
                        chips.forEach(c => c.classList.remove('active'));
                        chip.classList.add('active');
                        TrumpetReal.currentNote = chip.dataset.note;
                        
                        // If currently playing, restart with new note
                        if (TrumpetReal.isPlaying) {
                            const velocity = document.getElementById('blowSlider').value / 100;
                            TrumpetReal.play(TrumpetReal.currentNote, velocity);
                        }
                        
                        // Haptic + scroll to center
                        if (navigator.vibrate) navigator.vibrate(10);
                        chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    };
                });

                // Blow slider - play control
                const slider = document.getElementById('blowSlider');
                let sliderActive = false;

                const onSliderStart = (e) => {
                    e?.preventDefault();
                    sliderActive = true;
                    const velocity = slider.value / 100;
                    if (velocity > 0.05) {
                        TrumpetReal.play(TrumpetReal.getActiveNote(), velocity);
                    }
                };

                const onSliderMove = (e) => {
                    if (!sliderActive) return;
                    e?.preventDefault();
                    const velocity = slider.value / 100;
                    if (TrumpetReal.isPlaying && velocity > 0.05) {
                        // Update gain in real-time for dynamic expression
                        if (TrumpetReal.activeSource?.gain) {
                            TrumpetReal.activeSource.gain.gain.setTargetAtTime(
                                Math.pow(velocity, 1.5) * 0.9, 
                                TrumpetReal.ctx.currentTime, 
                                0.02
                            );
                        }
                    } else if (velocity <= 0.05) {
                        TrumpetReal.stop();
                    }
                };

                const onSliderEnd = () => {
                    sliderActive = false;
                    TrumpetReal.stop();
                    slider.value = 0;
                };

                // Touch + Mouse events
                slider.addEventListener('touchstart', onSliderStart, { passive: false });
                slider.addEventListener('touchmove', onSliderMove, { passive: false });
                slider.addEventListener('touchend', onSliderEnd, { passive: false });
                slider.addEventListener('mousedown', onSliderStart);
                slider.addEventListener('mousemove', onSliderMove);
                slider.addEventListener('mouseup', onSliderEnd);
                slider.addEventListener('mouseleave', onSliderEnd);

                // Recorder
                const recordBtn = document.getElementById('recordBtn');
                recordBtn.onclick = () => Recorder.toggle();
                
                document.getElementById('downloadBtn').onclick = () => Recorder.download();

                // Keyboard support (desktop)
                document.addEventListener('keydown', (e) => {
                    if (e.repeat) return;
                    const keyMap = { 'a':'C4','s':'D4','d':'E4','f':'F4','j':'G4','k':'A4','l':'B4',';':'C5' };
                    if (keyMap[e.key.toLowerCase()]) {
                        document.querySelector(`[data-note="${keyMap[e.key.toLowerCase()]}"]`)?.click();
                    }
                    if (e.code === 'Space') {
                        e.preventDefault();
                        slider.value = 70;
                        onSliderStart(e);
                    }
                });
                document.addEventListener('keyup', (e) => {
                    if (e.code === 'Space') onSliderEnd();
                });
            }
        };

        // Toast helper
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            UI.init();
            
            // iOS audio unlock
            document.addEventListener('touchstart', () => {
                TrumpetReal.ctx?.state === 'suspended' && TrumpetReal.ctx?.resume();
            }, { once: true, passive: true });
        });
    </script>
</body>
</html>
