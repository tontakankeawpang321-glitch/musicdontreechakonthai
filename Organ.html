<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vertical Organ 61 Keys (Auto Fit)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --key-height: 20px; /* จะถูกคำนวณใหม่โดย JS */
        }

        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0f0f0f;
            font-family: 'Cinzel', serif;
        }

        .key {
            position: relative;
            cursor: pointer;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.2);
            transition: background-color 0.05s;
        }

        .white-key {
            background: linear-gradient(to right, #fdfbf7 0%, #e8e4d9 100%);
            width: 100%;
            height: var(--key-height);
            border-bottom: 1px solid #d1c7b7;
            border-right: 4px solid #bbb;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 5px;
            box-sizing: border-box;
            font-size: 8px; 
            overflow: hidden;
            white-space: nowrap;
        }
        
        /* ซ่อนตัวอักษรถ้าปุ่มเล็กเกินไป */
        .white-key.micro-text {
            color: transparent;
            text-shadow: none;
        }

        .white-key:active, .white-key.active {
            background: #d6d0c4;
            transform: scaleX(0.98);
            transform-origin: left;
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.3);
        }

        .black-key {
            background: linear-gradient(to right, #2a2a2a 0%, #000 100%);
            width: 60%; /* กว้างขึ้นเล็กน้อยเพื่อให้กดง่ายขึ้นในจอเล็ก */
            height: calc(var(--key-height) * 0.7); 
            position: absolute;
            right: 0;
            z-index: 10;
            border-top-left-radius: 2px;
            border-bottom-left-radius: 2px;
            box-shadow: -2px 2px 4px rgba(0,0,0,0.6);
            border: 1px solid #1a1a1a;
            border-right: none;
        }

        .black-key:active, .black-key.active {
            background: #111;
            transform: scaleX(0.95);
            transform-origin: right;
            box-shadow: -1px 1px 2px rgba(0,0,0,0.4);
        }

        .wood-texture {
            background-color: #3e2723;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 10px);
            border-bottom: 2px solid #271c19;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .gold-text { color: #d4af37; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .recording-pulse {
            animation: pulse-red 1.5s infinite;
            background-color: #dc2626 !important;
            color: white !important;
            border-color: #b91c1c !important;
        }
        
        .middle-c-marker {
            width: 4px; height: 4px;
            background-color: #d4af37;
            border-radius: 50%;
            margin-left: 2px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-black overflow-hidden">

    <!-- Header Panel -->
    <div class="w-full flex-none wood-texture p-2 flex flex-col gap-1 z-30 relative shadow-xl" id="header-panel">
        <div class="flex justify-between items-center px-1">
            <h1 class="text-xs font-bold gold-text tracking-widest">CHURCH 61</h1>
            
            <div class="flex gap-2 items-center">
                 <!-- Reverb Toggle -->
                <div class="flex items-center gap-1 cursor-pointer bg-[#2a1d1a] border border-[#5d4037] px-2 py-1 rounded" onclick="toggleReverb()">
                    <label class="text-[9px] uppercase font-bold text-amber-500/80 cursor-pointer">Verb</label>
                    <div id="reverb-led" class="w-2 h-2 rounded-full bg-[#111] border border-stone-600"></div>
                </div>

                <button id="record-btn" onclick="toggleRecord()" class="bg-stone-800 border border-stone-600 text-stone-300 px-3 py-1 rounded font-bold text-[9px] uppercase tracking-widest flex items-center gap-1 hover:bg-stone-700 transition-all active:scale-95">
                    <span id="rec-dot" class="w-1.5 h-1.5 rounded-full bg-red-600"></span>
                    <span id="rec-text">REC</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Keyboard Container (No Scroll) -->
    <div class="relative flex-grow bg-[#1a1a1a] overflow-hidden" id="keyboard-wrapper">
        <div id="keyboard-container" class="relative w-full h-full flex flex-col-reverse">
            <!-- Keys generated by JS -->
        </div>
    </div>

    <script>
        // --- Auto Fit Logic ---
        function fitKeys() {
            const header = document.getElementById('header-panel');
            const containerHeight = window.innerHeight - header.offsetHeight;
            
            // Standard 61-key organ has 36 white keys (C2 to C7)
            const whiteKeyCount = 36;
            
            // Calculate height per key
            const heightPerKey = containerHeight / whiteKeyCount;
            
            document.documentElement.style.setProperty('--key-height', `${heightPerKey}px`);
            
            // Toggle text visibility based on height
            const keys = document.querySelectorAll('.white-key');
            keys.forEach(k => {
                if (heightPerKey < 12) {
                    k.classList.add('micro-text');
                } else {
                    k.classList.remove('micro-text');
                }
            });
        }

        window.addEventListener('resize', fitKeys);
        window.addEventListener('load', fitKeys);

        // --- Audio Engine ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let masterGainNode;
        let reverbNode;
        let destRecording;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let isReverbOn = true;

        const activeOscillators = {};
        
        // Generate 61 Keys (C2 to C7)
        const notes = [];
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        // Keyboard map for middle range
        const keyboardMap = {
            'z': 48, 's': 49, 'x': 50, 'd': 51, 'c': 52, 'v': 53, 'g': 54, 'b': 55, 'h': 56, 'n': 57, 'j': 58, 'm': 59,
            'q': 60, '2': 61, 'w': 62, '3': 63, 'e': 64, 'r': 65, '5': 66, 't': 67, '6': 68, 'y': 69, '7': 70, 'u': 71, 'i': 72
        };

        for (let i = 36; i <= 96; i++) {
            const octave = Math.floor(i / 12) - 1;
            const noteName = noteNames[i % 12];
            const isBlack = noteName.includes('#');
            const freq = 440 * Math.pow(2, (i - 69) / 12);
            
            notes.push({
                midi: i,
                note: noteName + octave,
                freq: freq,
                type: isBlack ? 'black' : 'white',
                isMiddleC: i === 60
            });
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = 0.8;
                reverbNode = audioCtx.createConvolver();
                reverbNode.buffer = createReverbImpulse(2.5);
                updateReverbState();
                masterGainNode.connect(audioCtx.destination);
                updateReverbUI();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function createReverbImpulse(duration) {
            const rate = audioCtx.sampleRate;
            const length = rate * duration;
            const impulse = audioCtx.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                const decay = Math.pow(1 - i / length, 2.5);
                left[i] = (Math.random() * 2 - 1) * decay;
                right[i] = (Math.random() * 2 - 1) * decay;
            }
            return impulse;
        }

        function toggleReverb() {
            isReverbOn = !isReverbOn;
            updateReverbState();
            updateReverbUI();
        }

        function updateReverbState() {
            if (!audioCtx) return;
            try { masterGainNode.disconnect(reverbNode); } catch(e){}
            try { reverbNode.disconnect(); } catch(e){}
            if (isReverbOn) {
                masterGainNode.connect(reverbNode);
                reverbNode.connect(audioCtx.destination);
            }
        }

        function updateReverbUI() {
            const led = document.getElementById('reverb-led');
            if (isReverbOn) {
                led.style.backgroundColor = '#00ff00';
                led.style.boxShadow = '0 0 6px #00ff00';
            } else {
                led.style.backgroundColor = '#111';
                led.style.boxShadow = 'none';
            }
        }

        function toggleRecord() {
            initAudio();
            const btn = document.getElementById('record-btn');
            const recText = document.getElementById('rec-text');
            const recDot = document.getElementById('rec-dot');

            if (!isRecording) {
                audioChunks = [];
                destRecording = audioCtx.createMediaStreamDestination();
                masterGainNode.connect(destRecording);
                if (isReverbOn) reverbNode.connect(destRecording);

                let options = { mimeType: 'audio/webm' };
                if (!MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/mp4' };
                try { mediaRecorder = new MediaRecorder(destRecording.stream, options); } 
                catch (e) { mediaRecorder = new MediaRecorder(destRecording.stream); }

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `organ_autofit_${Date.now()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                };
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording-pulse');
                recText.textContent = "STOP";
                recDot.style.backgroundColor = "white";
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording-pulse');
                recText.textContent = "REC";
                recDot.style.backgroundColor = "#dc2626";
            }
        }

        function getWaveConfig() {
            // ตั้งค่าคงที่เป็น Grand Organ ตามที่ต้องการ
            return { type: 'triangle', harmonics: [1.0, 0.8, 0.6, 0.3], sub: true }; 
        }

        function playNote(freq, id) {
            initAudio();
            if (activeOscillators[id]) return; 

            const config = getWaveConfig();
            const noteGain = audioCtx.createGain();
            const vol = 0.8; 
            
            const now = audioCtx.currentTime;
            noteGain.gain.setValueAtTime(0, now);
            noteGain.gain.linearRampToValueAtTime(vol * 0.4, now + 0.08); 

            noteGain.connect(masterGainNode);

            const oscList = [];
            config.harmonics.forEach((hVal, index) => {
                const osc = audioCtx.createOscillator();
                osc.type = config.type === 'sine' && index > 0 ? 'triangle' : config.type; 
                osc.frequency.setValueAtTime(freq * (index + 1), now);
                if (config.detune) osc.detune.value = (Math.random() - 0.5) * config.detune;
                const harmGain = audioCtx.createGain();
                harmGain.gain.value = hVal;
                osc.connect(harmGain);
                harmGain.connect(noteGain);
                osc.start(now);
                oscList.push(osc);
            });

            if (config.sub) {
                const subOsc = audioCtx.createOscillator();
                subOsc.type = 'sine';
                subOsc.frequency.setValueAtTime(freq * 0.5, now);
                const subGain = audioCtx.createGain();
                subGain.gain.value = 0.5;
                subOsc.connect(subGain);
                subGain.connect(noteGain);
                subOsc.start(now);
                oscList.push(subOsc);
            }

            activeOscillators[id] = { oscList, noteGain };
            
            const el = document.getElementById(`key-${id}`);
            if (el) el.classList.add('active');
        }

        function stopNote(id) {
            if (!activeOscillators[id]) return;
            const { oscList, noteGain } = activeOscillators[id];
            const now = audioCtx.currentTime;
            const release = 0.15;
            noteGain.gain.cancelScheduledValues(now);
            noteGain.gain.setValueAtTime(noteGain.gain.value, now);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + release);
            oscList.forEach(osc => osc.stop(now + release + 0.1));
            delete activeOscillators[id];
            const el = document.getElementById(`key-${id}`);
            if (el) el.classList.remove('active');
        }

        // --- Vertical UI Generation ---
        const container = document.getElementById('keyboard-container');
        let whiteKeyIndex = 0;
        
        notes.forEach((note) => {
            if (note.type === 'white') {
                const key = document.createElement('div');
                key.className = 'key white-key';
                key.id = `key-${note.midi}`;
                if (note.note.startsWith('C')) {
                    key.innerHTML = `<span class="text-stone-500 font-sans font-bold">${note.note}</span>`;
                    if (note.isMiddleC) key.innerHTML += `<div class="middle-c-marker"></div>`;
                }
                addInteractions(key, note.freq, note.midi);
                container.appendChild(key);
                whiteKeyIndex++;
            } else {
                const key = document.createElement('div');
                key.className = 'key black-key';
                key.id = `key-${note.midi}`;
                // CSS calc for dynamic positioning based on variable key height
                key.style.bottom = `calc(${whiteKeyIndex} * var(--key-height) - (var(--key-height) * 0.7 / 2))`;
                
                addInteractions(key, note.freq, note.midi);
                container.appendChild(key);
            }
        });
        
        // Initial setup
        setTimeout(fitKeys, 100);

        function addInteractions(element, freq, id) {
            const start = (e) => { e.preventDefault(); playNote(freq, id); };
            const end = (e) => { e.preventDefault(); stopNote(id); };
            element.addEventListener('mousedown', start);
            element.addEventListener('mouseup', end);
            element.addEventListener('mouseleave', end);
            element.addEventListener('touchstart', start, {passive: false});
            element.addEventListener('touchend', end, {passive: false});
            element.addEventListener('touchcancel', end, {passive: false});
        }

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const midi = keyboardMap[e.key.toLowerCase()];
            if (midi) {
                const note = notes.find(n => n.midi === midi);
                if(note) playNote(note.freq, midi);
            }
        });

        window.addEventListener('keyup', (e) => {
            const midi = keyboardMap[e.key.toLowerCase()];
            if (midi) stopNote(midi);
        });

        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

    </script>
</body>
</html>
