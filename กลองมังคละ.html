<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>กลองมังคละเสมือนจริง (Virtual Mangkhala Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');

        body {
            font-family: 'Sarabun', sans-serif;
            touch-action: manipulation; /* ป้องกันการซูมเมื่อแตะรัวๆ */
            background-color: #1a1a1a;
            background-image: radial-gradient(circle at 50% 0%, #2a2a2a 0%, #0a0a0a 100%);
            /* เปลี่ยนจากการล็อกหน้าจอ เป็นให้ scroll ได้ถ้ายาวเกินจอ */
            overflow-x: hidden;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ เพื่อความสวยงาม */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* Drum Skin Effect */
        .drum-skin {
            background: radial-gradient(circle, #e6ccb2 0%, #d4a373 60%, #8b5e3c 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 10px 15px rgba(0,0,0,0.5);
            border: 8px solid #4E342E;
            transition: transform 0.05s ease-out, filter 0.05s;
        }
        .drum-skin:active, .drum-skin.active {
            transform: scale(0.92);
            filter: brightness(0.85);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 5px 5px rgba(0,0,0,0.5);
        }

        /* Gong Effect */
        .gong-metal {
            background: radial-gradient(circle, #ffd700 0%, #b8860b 40%, #5c3300 100%);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.7), 0 8px 12px rgba(0,0,0,0.5);
            border: 4px solid #3e2723;
            position: relative;
            transition: transform 0.05s ease-out;
        }
        .gong-metal::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 35%;
            height: 35%;
            background: radial-gradient(circle, #ffecb3 0%, #daa520 100%);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        .gong-metal:active, .gong-metal.active {
            transform: scale(0.92);
        }

        /* Cymbal Effect */
        .cymbal-metal {
            background: repeating-radial-gradient(#d3d3d3, #a9a9a9 10%, #d3d3d3 15%);
            border: 2px solid #555;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
            transition: transform 0.05s ease-out;
        }
        .cymbal-metal:active, .cymbal-metal.active {
            transform: rotate(8deg) scale(0.92);
        }

        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.6); }
            100% { box-shadow: 0 0 0 25px rgba(255, 215, 0, 0); }
        }
        .playing {
            animation: ripple 0.3s ease-out;
        }

        /* Floating Note Animation */
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
            80% { opacity: 1; transform: translate(-50%, -60px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(0.8); }
        }
        .floating-note {
            position: absolute;
            left: 50%;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255,215,0,0.5);
            z-index: 40;
            white-space: nowrap;
        }

        .control-btn { transition: all 0.2s; }
        .control-btn:active { transform: scale(0.95); }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); }

        /* Modal Overlay */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }
    </style>
</head>

    <script>
        // --- Web Audio API Variables ---
        let audioCtx;
        let masterGain;
        let reverbNode;
        let dest;
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;
        let isRecording = false;

        // UI Elements
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const floatingNotesContainer = document.getElementById('floating-notes-container');
        const recordingStatus = document.getElementById('recording-status');
        
        const settingsModal = document.getElementById('settings-modal');
        const masterVolInput = document.getElementById('master-vol');
        const reverbMixInput = document.getElementById('reverb-mix');

        // Playback tracking (เพื่อหยุดเพลง/การเล่นได้)
        let activeTimeouts = [];
        let isPlayingSequence = false;

        // --- Audio Initialization ---
        async function initAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext({ latencyHint: 'interactive' });
                
                // สร้าง Reverb (Hall จำลอง)
                const reverbDuration = 2.0; 
                const sampleRate = audioCtx.sampleRate;
                const length = sampleRate * reverbDuration;
                const impulse = audioCtx.createBuffer(2, length, sampleRate);
                const left = impulse.getChannelData(0);
                const right = impulse.getChannelData(1);

                for (let i = 0; i < length; i++) {
                    const n = i / length;
                    // สร้างหางเสียงสะท้อนแบบธรรมชาติ
                    const decay = Math.pow(1 - n, 3.0); 
                    left[i] = (Math.random() * 2 - 1) * decay;
                    right[i] = (Math.random() * 2 - 1) * decay;
                }

                reverbNode = audioCtx.createConvolver();
                reverbNode.buffer = impulse;

                // Routing
                window.reverbGain = audioCtx.createGain();
                window.reverbGain.gain.value = 0.4; // ค่าเริ่มต้น

                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.8; // ค่าเริ่มต้น
                
                // สัญญาณ: Source -> Master -> (ออกลำโพง & เข้า Reverb)
                masterGain.connect(audioCtx.destination);
                masterGain.connect(reverbNode);
                reverbNode.connect(window.reverbGain);
                window.reverbGain.connect(audioCtx.destination);

                // สำหรับอัดเสียง
                dest = audioCtx.createMediaStreamDestination();
                masterGain.connect(dest);
                window.reverbGain.connect(dest);

                if(audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                
                startOverlay.classList.add('opacity-0');
                setTimeout(() => startOverlay.classList.add('hidden'), 300);
            } catch(e) {
                alert("เบราว์เซอร์ของคุณไม่รองรับระบบเสียงนี้");
            }
        }

        startBtn.addEventListener('click', initAudio);

        // --- Synthesis Engine (ปรับสมจริงและเสถียรบนมือถือ) ---
        
        let noiseBuffer;
        function createNoiseBuffer() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 1.5; // 1.5 วินาทีก็พอสำหรับ noise
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            noiseBuffer = buffer;
        }

        // ฟังก์ชันกลอง (มีหนังกลอง) ป้องกันเสียงค้าง
        function playDrum(pitch, decay, type = 'sine', snap = 0, skinNoise = 0) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            
            // ป้องกัน decay เป็น 0 หรือค่าน้อยเกินจนทำให้ node ไม่จบ
            const safeDecay = Math.max(decay, 0.1); 

            // 1. Body (เนื้อเสียง)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(pitch, t);
            
            if(snap > 0) {
                osc.frequency.exponentialRampToValueAtTime(Math.max(pitch * 0.7, 20), t + 0.1);
            }

            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(1.2, t + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, t + safeDecay);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(t);
            osc.stop(t + safeDecay + 0.1); // บังคับหยุด ป้องกันค้าง

            // 2. Resonance (กังวาน)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(pitch * 1.8, t);
            gain2.gain.setValueAtTime(0.4, t);
            gain2.gain.exponentialRampToValueAtTime(0.001, t + (safeDecay * 0.6));
            osc2.connect(gain2);
            gain2.connect(masterGain);
            osc2.start(t);
            osc2.stop(t + safeDecay + 0.1);

            // 3. Skin Snap (เสียงตีหนังกลอง)
            if(skinNoise > 0) {
                if (!noiseBuffer) createNoiseBuffer();
                const noiseSrc = audioCtx.createBufferSource();
                noiseSrc.buffer = noiseBuffer;
                
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = 1000 + pitch;
                noiseFilter.Q.value = 0.5;

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(skinNoise, t);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);

                noiseSrc.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(masterGain);
                noiseSrc.start(t);
                noiseSrc.stop(t + 0.15);
            }
        }

        // ฟังก์ชันฆ้อง (โลหะ)
        function playGong(baseFreq, decay) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const safeDecay = Math.max(decay, 0.5);
            
            const partials = [1, 1.45, 2.3, 3.2]; 
            const gains = [1, 0.5, 0.3, 0.15]; 
            
            partials.forEach((ratio, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = index === 0 ? 'sine' : 'triangle';
                osc.frequency.value = baseFreq * ratio + (Math.random() * 2);

                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(gains[index], t + 0.01);
                
                const partialDecay = safeDecay / Math.pow(ratio, 0.6);
                gain.gain.exponentialRampToValueAtTime(0.001, t + partialDecay);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(t);
                osc.stop(t + partialDecay + 0.2);
            });

            // Impact
            if (!noiseBuffer) createNoiseBuffer();
            const clickSrc = audioCtx.createBufferSource();
            clickSrc.buffer = noiseBuffer;
            const clickFilter = audioCtx.createBiquadFilter();
            clickFilter.type = 'highpass';
            clickFilter.frequency.value = 2500;
            const clickGain = audioCtx.createGain();
            clickGain.gain.setValueAtTime(0.3, t);
            clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            
            clickSrc.connect(clickFilter);
            clickFilter.connect(clickGain);
            clickGain.connect(masterGain);
            clickSrc.start(t);
            clickSrc.stop(t + 0.1);
        }

        // ฉิ่ง ฉาบ
        function playCymbal(type) {
            if (!audioCtx) return;
            if (!noiseBuffer) createNoiseBuffer();
            const t = audioCtx.currentTime;
            
            const source = audioCtx.createBufferSource();
            source.buffer = noiseBuffer;
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();

            if (type === 'ching') {
                // ฉิ่ง (ใส กังวานยาว)
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2800, t);
                const oscGain = audioCtx.createGain();
                oscGain.gain.setValueAtTime(0.5, t);
                oscGain.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
                osc.connect(oscGain);
                oscGain.connect(masterGain);
                osc.start(t);
                osc.stop(t+2.2);
                
                filter.type = 'highpass';
                filter.frequency.value = 6000;
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);

            } else { 
                // ฉาบ (สาดกระจาย)
                filter.type = 'highpass';
                filter.frequency.value = 1200;
                gain.gain.setValueAtTime(1.0, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
                
                const ring = audioCtx.createOscillator();
                ring.type = 'square';
                ring.frequency.value = 350;
                const ringGain = audioCtx.createGain();
                ringGain.gain.value = 0.1;
                ringGain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                ring.connect(ringGain);
                ringGain.connect(masterGain);
                ring.start(t);
                ring.stop(t+0.6);
            }

            source.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            source.start(t);
            source.stop(t + 2.0);
        }

        // แสดงโน้ตลอยหน้าจอ
        function createFloatingNote(noteText, colorClass = 'text-yellow-400') {
            const noteEl = document.createElement('div');
            noteEl.className = `floating-note text-2xl md:text-3xl font-bold ${colorClass}`;
            noteEl.textContent = noteText;
            
            // Randomize position slightly for visual effect
            const offset = (Math.random() - 0.5) * 40; 
            noteEl.style.marginLeft = `${offset}px`;

            floatingNotesContainer.appendChild(noteEl);

            // ลบเมื่ออนิเมชันจบ
            setTimeout(() => {
                if (floatingNotesContainer.contains(noteEl)) {
                    floatingNotesContainer.removeChild(noteEl);
                }
            }, 1000);
        }

        // ตัวกลางสั่งเล่นเสียงและแสง
        function triggerSound(soundType, noteName, isAuto = false) {
            if (!audioCtx) return;
            
            // Visual Floating Note
            let color = 'text-yellow-400';
            if(soundType.includes('mang')) color = 'text-amber-500';
            else if(soundType === 'mong') color = 'text-purple-400';
            else if(soundType === 'nui') color = 'text-orange-400';
            else if(soundType.includes('gong')) color = 'text-yellow-200';
            else color = 'text-gray-300'; // cymbal/ching
            
            createFloatingNote(noteName, color);

            // หา Element เพื่อกระพริบ (ถ้าไม่ได้เล่นออโต้)
            if(!isAuto) {
                const el = document.querySelector(`[data-sound="${soundType}"]`);
                if(el) {
                    el.classList.add('active', 'playing');
                    setTimeout(() => el.classList.remove('active', 'playing'), 100);
                }
            }

            switch(soundType) {
                case 'mang-low': playDrum(85, 0.7, 'sine', 1, 0.15); break;
                case 'mang-high': playDrum(190, 0.3, 'sine', 0, 1.0); break;
                case 'mong': 
                    playDrum(50, 2.0, 'sine', 1, 0); 
                    playDrum(100, 1.2, 'triangle', 0, 0); 
                    break;
                case 'nui': playDrum(165, 0.4, 'sine', 1, 0.5); break;
                case 'gong-low': playGong(210, 3.5); break;
                case 'gong-high': playGong(420, 2.5); break;
                case 'ching': playCymbal('ching'); break;
                case 'cymbal': playCymbal('cymbal'); break;
                case 'pause': break; // ไม่เกิดเสียง
            }
        }

        // แนบ Event Listener ให้เครื่องดนตรีทั้งหมด
        const instruments = document.querySelectorAll('.instrument');
        instruments.forEach(inst => {
            const handleInput = (e) => {
                e.preventDefault(); 
                e.stopPropagation(); // กัน event ทะลุ (เช่น กดกลางมังคละ ไม่ให้โดนขอบ)
                const sound = inst.dataset.sound;
                const note = inst.dataset.note;
                if(sound && note) triggerSound(sound, note);
            };
            inst.addEventListener('touchstart', handleInput, {passive: false});
            inst.addEventListener('mousedown', handleInput);
        });

        // --- Demo Songs System ---
        const DEMO_BPM = 110;
        const msPerBeat = 60000 / DEMO_BPM; // ~545ms
        const qBeat = msPerBeat / 2; // ~272ms

        const demoSongs = [
            // 0: Basic
            [
                {s:'mong', n:'โหม่ง', d:msPerBeat}, {s:'ching', n:'ฉิ่ง', d:msPerBeat},
                {s:'nui', n:'หนุ่ย', d:qBeat}, {s:'nui', n:'หนุ่ย', d:qBeat}, {s:'cymbal', n:'ฉาบ', d:msPerBeat},
                {s:'mang-low', n:'มังคละ', d:msPerBeat}, {s:'ching', n:'ฉิ่ง', d:msPerBeat}
            ],
            // 1: Upbeat โจ๊ะๆ
            [
                {s:'mang-low', n:'มังคละ', d:qBeat}, {s:'mang-high', n:'ขอบ', d:qBeat}, {s:'ching', n:'ฉิ่ง', d:qBeat}, {s:'nui', n:'หนุ่ย', d:qBeat},
                {s:'mong', n:'โหม่ง', d:qBeat}, {s:'mang-high', n:'ขอบ', d:qBeat}, {s:'cymbal', n:'ฉาบ', d:msPerBeat},
                {s:'mang-low', n:'มังคละ', d:qBeat}, {s:'mang-low', n:'มังคละ', d:qBeat}, {s:'gong-high', n:'ฆ้อง', d:msPerBeat}
            ],
            // 2: Traditional (มังคละรำ)
            [
                {s:'gong-low', n:'ฆ้องใหญ่', d:msPerBeat}, {s:'pause', n:'---', d:qBeat}, {s:'ching', n:'ฉิ่ง', d:qBeat},
                {s:'mang-low', n:'ตุม', d:qBeat}, {s:'mang-low', n:'ตุม', d:qBeat}, {s:'nui', n:'ต๊ะ', d:qBeat}, {s:'mang-high', n:'ติง', d:qBeat},
                {s:'mong', n:'โหม่ง', d:msPerBeat}, {s:'cymbal', n:'ฉาบ', d:msPerBeat}
            ]
        ];

        const stopDemoBtn = document.getElementById('stop-demo-btn');
        const demoBtns = document.querySelectorAll('.demo-btn');

        function stopPlayback() {
            // ล้าง timeout ทั้งหมด
            activeTimeouts.forEach(id => clearTimeout(id));
            activeTimeouts = [];
            isPlayingSequence = false;
            
            // คืนค่า UI
            stopDemoBtn.classList.add('hidden');
            demoBtns.forEach(b => b.disabled = false);
            document.getElementById('comp-play-btn').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg> เล่น`;
        }

        function playSequence(sequenceArray, loop = false) {
            stopPlayback(); // หยุดของเก่าก่อน
            isPlayingSequence = true;
            stopDemoBtn.classList.remove('hidden');
            demoBtns.forEach(b => b.disabled = true);

            let timeOffset = 0;

            function scheduleNote(idx) {
                if(!isPlayingSequence) return;
                if(idx >= sequenceArray.length) {
                    if(loop) {
                        scheduleNote(0); // วนลูป (สำหรับเพลงสาธิตถ้าต้องการ แต่ตอนนี้ตั้งให้จบเพลงแล้วปิด)
                    } else {
                        stopPlayback();
                        createFloatingNote("จบเพลง", "text-green-400");
                    }
                    return;
                }

                const item = sequenceArray[idx];
                triggerSound(item.s, item.n, true);

                // กระพริบปุ่มนิดหน่อย
                const el = document.querySelector(`[data-sound="${item.s}"]`);
                if(el) {
                    el.classList.add('scale-95', 'brightness-125');
                    setTimeout(() => el.classList.remove('scale-95', 'brightness-125'), 150);
                }

                const tid = setTimeout(() => {
                    scheduleNote(idx + 1);
                }, item.d || 400); // ดีฟอลต์ 400ms

                activeTimeouts.push(tid);
            }

            // เริ่มเล่นตัวแรก
            scheduleNote(0);
        }

        window.playDemo = function(idx) {
            if(!audioCtx) initAudio();
            // เล่นเพลงซ้ำ 2 รอบต่อการกด 1 ครั้งให้ดูเป็นเพลง
            let song = [...demoSongs[idx], ...demoSongs[idx]];
            playSequence(song, false); 
        }

        stopDemoBtn.addEventListener('click', stopPlayback);


        // --- Composer System ---
        let composition = [];
        const composeTrack = document.getElementById('compose-track');
        const composeEmpty = document.getElementById('compose-empty');

        document.getElementById('open-composer-btn').addEventListener('click', () => {
            document.getElementById('composer-modal').classList.remove('hidden');
            document.getElementById('composer-modal').classList.add('flex');
        });

        document.getElementById('close-composer-btn').addEventListener('click', () => {
            document.getElementById('composer-modal').classList.add('hidden');
            document.getElementById('composer-modal').classList.remove('flex');
            stopPlayback(); // ปิดหน้าต่างก็หยุดเล่น
        });

        function updateComposerUI() {
            composeTrack.innerHTML = '';
            if(composition.length === 0) {
                composeEmpty.style.display = 'block';
            } else {
                composeEmpty.style.display = 'none';
                composition.forEach((item, i) => {
                    const span = document.createElement('span');
                    span.className = `px-2 py-1 rounded text-xs font-bold ${item.color} text-white whitespace-nowrap`;
                    span.innerText = item.n;
                    composeTrack.appendChild(span);
                    
                    // ลูกศรเชื่อม
                    if(i < composition.length - 1) {
                        const arrow = document.createElement('span');
                        arrow.className = "text-gray-600 text-xs flex items-center";
                        arrow.innerText = "▶";
                        composeTrack.appendChild(arrow);
                    }
                });
                // เลื่อน scroll ไปขวาสุด
                composeTrack.parentElement.scrollTop = composeTrack.parentElement.scrollHeight;
            }
        }

        window.addNote = function(sound, name, colorClass) {
            composition.push({ s: sound, n: name, d: 400, color: colorClass }); // Fix speed at 400ms per note
            updateComposerUI();
            triggerSound(sound, name); // เสียงพรีวิว
        }

        document.getElementById('comp-undo-btn').addEventListener('click', () => {
            composition.pop();
            updateComposerUI();
        });

        document.getElementById('comp-clear-btn').addEventListener('click', () => {
            composition = [];
            updateComposerUI();
            stopPlayback();
        });

        document.getElementById('comp-play-btn').addEventListener('click', function() {
            if(isPlayingSequence) {
                stopPlayback();
                this.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg> เล่น`;
            } else {
                if(composition.length === 0) return alert("กรุณาเพิ่มโน้ตก่อน");
                this.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM10 14a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" /></svg> หยุดเล่น`;
                playSequence(composition, false);
                
                // ตรวจสอบว่าจบตอนไหนเพื่อคืนปุ่ม
                const checkInterval = setInterval(() => {
                    if(!isPlayingSequence) {
                        this.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" /></svg> เล่น`;
                        clearInterval(checkInterval);
                    }
                }, 500);
            }
        });


        // --- Settings Modal ---
        document.getElementById('open-settings-btn').addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
        });
        document.getElementById('close-settings-btn').addEventListener('click', () => {
            settingsModal.classList.add('hidden');
            settingsModal.classList.remove('flex');
        });

        masterVolInput.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('vol-val').innerText = val + '%';
            if(masterGain) masterGain.gain.value = val / 100;
        });

        reverbMixInput.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('rev-val').innerText = val + '%';
            if(window.reverbGain) window.reverbGain.gain.value = val / 100;
        });


        // --- Recording Logic ---
        const recordBtn = document.getElementById('record-btn');
        const stopRecBtn = document.getElementById('stop-rec-btn');
        const downloadBtn = document.getElementById('download-btn');
        const audioPlayer = document.getElementById('audio-player');

        recordBtn.addEventListener('click', () => {
            if (!audioCtx) initAudio();
            audioChunks = [];
            
            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
                ? 'audio/webm;codecs=opus' : 'audio/ogg;codecs=opus';

            try {
                mediaRecorder = new MediaRecorder(dest.stream, { mimeType });
            } catch(e) {
                alert("เบราว์เซอร์ไม่รองรับการอัดเสียง");
                return;
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                audioBlob = new Blob(audioChunks, { type: mimeType });
                const audioUrl = URL.createObjectURL(audioBlob);
                audioPlayer.src = audioUrl;
                downloadBtn.disabled = false;
                downloadBtn.classList.replace('text-green-400', 'text-white');
                downloadBtn.classList.add('bg-green-600', 'animate-pulse');
                setTimeout(() => downloadBtn.classList.remove('animate-pulse'), 3000);
                recordingStatus.classList.add('hidden');
                recordingStatus.classList.remove('flex');
            };

            mediaRecorder.start();
            isRecording = true;
            
            // UI
            recordBtn.disabled = true;
            stopRecBtn.classList.remove('hidden');
            downloadBtn.disabled = true;
            recordingStatus.classList.remove('hidden');
            recordingStatus.classList.add('flex');
            createFloatingNote("เริ่มบันทึกเสียง...", "text-red-400");
        });

        stopRecBtn.addEventListener('click', () => {
            if (isRecording && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                isRecording = false;
                
                recordBtn.disabled = false;
                stopRecBtn.classList.add('hidden');
                createFloatingNote("บันทึกเสร็จสิ้น", "text-green-400");
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!audioBlob) return;
            const url = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `mangkhala-pro-${new Date().getTime()}.webm`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            createFloatingNote("ดาวน์โหลดแล้ว", "text-blue-400");
        });

    </script>
</body>
