<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harpsichord Mobile (Fit Screen)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Base Settings */
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            background-color: #2c1e12;
            overflow: hidden; /* ห้ามเลื่อนทั้งหน้า */
            font-family: 'Sarabun', sans-serif;
            height: 100vh; /* บังคับเต็มจอ */
            width: 100vw;
        }

        /* Wood Texture */
        .wood-texture {
            background: #5c3a21;
            background-image: 
                repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 4px),
                linear-gradient(to right, #3e2613, #5c3a21, #3e2613);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Container - Flex Column เพื่อเฉลี่ยความสูงปุ่ม */
        .keyboard-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden; /* ตัด Scrollbar ออก */
            position: relative;
            background: #000;
            padding: 0; 
        }

        /* White Keys (Flexible Height) */
        .key-white {
            width: 100%;
            flex-grow: 1; /* ยืดให้เต็มพื้นที่เท่าๆ กัน */
            /* ไม่กำหนด height ตายตัว */
            background: linear-gradient(to right, #e8dcb9 0%, #fdf6e3 100%);
            border-bottom: 1px solid #8b7d6b;
            position: relative;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.1);
            transition: background 0.05s, transform 0.05s;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
        }
        
        .key-white.pressed {
             background: #c0b090;
             border-right: 8px solid #a09070;
             transform: translateX(-2px);
        }

        /* Black Keys (Overlay) */
        .key-black {
            position: absolute;
            top: 0;
            left: 0;
            width: 60%; /* กว้างขึ้นอีกนิดเพื่อให้กดง่าย */
            height: 40px; /* ความสูงคงที่เพื่อให้ดูสวยงาม หรือปรับเป็น % ก็ได้ถ้าต้องการ */
            background: linear-gradient(to right, #1a120b 0%, #3d2b1f 100%);
            border: 1px solid #000;
            border-left: none;
            border-radius: 0 4px 4px 0;
            z-index: 10;
            transform: translateY(-50%); /* จัดกึ่งกลางเส้นแบ่ง */
            box-shadow: 3px 3px 5px rgba(0,0,0,0.5), inset 2px 2px 5px rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }
        .key-black.active {
            background: #000;
            width: 58%;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
        }

        /* Labels */
        .note-label {
            font-size: 14px;
            font-weight: bold;
            color: #5c3a21;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .key-black .note-label {
            color: #e8dcb9;
            font-size: 12px;
        }
        .show-notes .note-label {
            opacity: 1;
        }

        /* LEDs */
        .led {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: #444; box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        .led.on { background-color: #ff3333; box-shadow: 0 0 5px #ff3333; }
        .led.play { background-color: #33ff33; box-shadow: 0 0 5px #33ff33; }

        /* Controls */
        .control-panel {
            background: #2c1e12;
            border-top: 2px solid #3e2613;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 30;
        }
        .btn {
            @apply px-3 py-2 rounded shadow bg-[#3e2613] text-[#e8dcb9] border border-[#5c3a21] active:scale-95 transition-all text-xs flex flex-col items-center justify-center gap-1;
            min-width: 50px;
        }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn.active { background: #e8dcb9; color: #3e2613; }

    </style>
</head>
<body class="h-screen w-screen flex flex-col wood-texture overflow-hidden">

    <!-- Header -->
    <div class="h-12 flex-none flex items-center justify-center relative shadow-lg z-20 bg-[#2c1e12]">
        <div class="absolute bottom-0 w-full h-[2px] bg-gradient-to-r from-[#b8860b] via-[#ffd700] to-[#b8860b]"></div>
        <h1 class="text-[#e8dcb9] font-serif tracking-[0.2em] text-lg drop-shadow-md">HARPSICHORD V</h1>
    </div>

    <!-- Main Keyboard Area (Fit Screen) -->
    <div class="flex-grow relative overflow-hidden flex flex-col">
        <!-- Shadow Overlays for depth -->
        <div class="absolute top-0 left-0 w-full h-4 bg-gradient-to-b from-black/60 to-transparent z-10 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-full h-4 bg-gradient-to-t from-black/60 to-transparent z-10 pointer-events-none"></div>

        <div id="keyboard-container" class="keyboard-container">
            <!-- Keys generated here -->
        </div>
    </div>

    <!-- Controls Footer -->
    <div class="control-panel flex-none p-2 pb-6 safe-area-bottom">
        <div class="flex justify-between items-center max-w-md mx-auto">
            
            <button id="btn-toggle-notes" class="btn">
                <i class="fa-solid fa-music"></i>
                <span>โน้ต</span>
            </button>

            <div class="h-8 w-[1px] bg-[#5c3a21]"></div>

            <button id="btn-record" class="btn text-red-300">
                <div id="led-rec" class="led"></div>
                <span>อัด</span>
            </button>
            
            <button id="btn-stop" class="btn" disabled>
                <i class="fa-solid fa-stop"></i>
                <span>หยุด</span>
            </button>
            
            <button id="btn-play" class="btn text-green-300" disabled>
                <div id="led-play" class="led"></div>
                <span>เล่น</span>
            </button>

            <div class="h-8 w-[1px] bg-[#5c3a21]"></div>

            <button id="btn-download" class="btn text-blue-200" disabled>
                <i class="fa-solid fa-download"></i>
                <span>โหลด</span>
            </button>

            <button id="btn-clear" class="btn text-red-200">
                 <i class="fa-solid fa-trash"></i>
                 <span>ลบ</span>
            </button>
        </div>
    </div>
    <a id="download-link" class="hidden"></a>

    <!-- Overlay -->
    <div id="start-overlay" class="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="text-center animate-pulse cursor-pointer p-8 border-2 border-[#b8860b] rounded-full bg-[#2c1e12]">
            <i class="fa-solid fa-fingerprint text-4xl text-[#e8dcb9] mb-2"></i>
            <p class="text-[#e8dcb9] font-serif">แตะเพื่อเริ่ม</p>
        </div>
    </div>

    <script>
        // --- Configuration ---
        // ปรับเหลือ 2 Octaves เพื่อให้พอดีจอโดยไม่ต้องเลื่อนและปุ่มไม่เล็กเกินไป
        const OCTAVES = 2; 
        const START_OCTAVE = 3; // C3 to B4 (ช่วงเสียงกลางๆ)
        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        
        // --- Audio Engine ---
        let audioCtx;
        let recordingDest;
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let audioUrl = null;
        const activeOscillators = {};

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!recordingDest) recordingDest = audioCtx.createMediaStreamDestination();
        }

        function getFrequency(note, octave) {
            const notesFreq = {'C': 16.35, 'C#': 17.32, 'D': 18.35, 'D#': 19.45, 'E': 20.60, 'F': 21.83, 'F#': 23.12, 'G': 24.50, 'G#': 25.96, 'A': 27.50, 'A#': 29.14, 'B': 30.87};
            let base = notesFreq[note.replace('#','')];
            if(note.includes('#')) base = notesFreq[note];
            return base * Math.pow(2, octave);
        }

        function playTone(freq, noteId) {
            if (!audioCtx) initAudio();
            if (activeOscillators[noteId]) stopTone(noteId);

            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, t);
            
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(3000, t);
            
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.4, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.1, t + 0.5);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            if (recordingDest) gain.connect(recordingDest);

            osc.start(t);
            activeOscillators[noteId] = { osc, gain };
        }

        function stopTone(noteId) {
            if (!activeOscillators[noteId]) return;
            const { osc, gain } = activeOscillators[noteId];
            const t = audioCtx.currentTime;
            
            try {
                gain.gain.cancelScheduledValues(t);
                gain.gain.setValueAtTime(gain.gain.value, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.stop(t + 0.1);
            } catch(e) {}
            
            delete activeOscillators[noteId];
        }

        // --- Keyboard Generation (High to Low) ---
        function createKeyboard() {
            const container = document.getElementById('keyboard-container');
            let html = '';
            
            // Loop from Highest Octave down to Lowest
            for (let oct = START_OCTAVE + OCTAVES - 1; oct >= START_OCTAVE; oct--) {
                // Loop notes High (B) to Low (C)
                for (let i = NOTE_NAMES.length - 1; i >= 0; i--) {
                    const note = NOTE_NAMES[i];
                    
                    if (!note.includes('#')) {
                        // It's a white key
                        const fullNote = `${note}${oct}`;
                        const freq = getFrequency(note, oct);
                        
                        let blackKeyHtml = '';
                        
                        // Check for Sharp above this note
                        const nextIndex = i + 1;
                        if (nextIndex < NOTE_NAMES.length) {
                            const possibleSharp = NOTE_NAMES[nextIndex];
                            if (possibleSharp.includes('#')) {
                                const sharpNote = `${possibleSharp}${oct}`;
                                const sharpFreq = getFrequency(possibleSharp, oct);
                                blackKeyHtml = `
                                    <div class="key-black" data-note="${sharpNote}" data-freq="${sharpFreq}">
                                        <span class="note-label">${possibleSharp}${oct}</span>
                                    </div>
                                `;
                            }
                        }
                        
                        html += `
                            <div class="key-white" data-note="${fullNote}" data-freq="${freq}">
                                ${blackKeyHtml}
                                <span class="note-label">${note}${oct}</span>
                            </div>
                        `;
                    }
                }
            }
            container.innerHTML = html;
        }

        // --- Interaction ---
        let isRecording = false;
        let isPlaying = false;
        let recordedEvents = [];
        let startTime = 0;
        let playbackTimeouts = [];

        function handleInput(e, type) {
            let target = e.target;
            while(target && !target.classList.contains('key-white') && !target.classList.contains('key-black')) {
                target = target.parentElement;
            }
            if (!target) return;

            if (target.classList.contains('key-black')) {
                e.stopPropagation();
            }

            const note = target.dataset.note;
            const freq = parseFloat(target.dataset.freq);

            if (type === 'on') {
                if (target.classList.contains('pressed') || target.classList.contains('active')) return;
                target.classList.add(target.classList.contains('key-white') ? 'pressed' : 'active');
                playTone(freq, note);
                
                if (isRecording) {
                    recordedEvents.push({ type: 'on', note, freq, time: Date.now() - startTime });
                }
            } else {
                target.classList.remove('pressed', 'active');
                stopTone(note);
                
                if (isRecording) {
                    recordedEvents.push({ type: 'off', note, time: Date.now() - startTime });
                }
            }
        }

        function setupEvents() {
            const container = document.getElementById('keyboard-container');
            
            container.addEventListener('mousedown', e => handleInput(e, 'on'));
            container.addEventListener('mouseup', e => {
                document.querySelectorAll('.pressed, .active').forEach(el => {
                    el.classList.remove('pressed', 'active');
                    stopTone(el.dataset.note);
                    if(isRecording) recordedEvents.push({type:'off', note:el.dataset.note, time: Date.now()-startTime});
                });
            });

            container.addEventListener('touchstart', e => {
                // ป้องกัน Default เพื่อไม่ให้ Browser พยายามเลื่อนหน้าจอ
                e.preventDefault(); 
                handleInput(e, 'on'); 
            }, {passive: false});
            
            container.addEventListener('touchend', e => {
                e.preventDefault();
                let target = e.target;
                // หา Target ที่แท้จริง (กรณีจิ้มโดน label)
                while(target && !target.dataset.note && target.parentElement) target = target.parentElement;
                
                if(target && target.dataset.note) {
                     target.classList.remove('pressed', 'active');
                     stopTone(target.dataset.note);
                     if(isRecording) recordedEvents.push({type:'off', note:target.dataset.note, time: Date.now()-startTime});
                }
            }, {passive: false});
        }

        // --- Recorder & UI ---
        const btnRecord = document.getElementById('btn-record');
        const btnStop = document.getElementById('btn-stop');
        const btnPlay = document.getElementById('btn-play');
        const btnDownload = document.getElementById('btn-download');
        const btnClear = document.getElementById('btn-clear');
        const btnToggle = document.getElementById('btn-toggle-notes');

        btnToggle.addEventListener('click', () => {
            document.getElementById('keyboard-container').classList.toggle('show-notes');
            btnToggle.classList.toggle('active');
        });

        btnRecord.addEventListener('click', () => {
            initAudio();
            audioChunks = [];
            recordedEvents = [];
            
            const stream = recordingDest.stream;
            let mime = 'audio/webm';
            if (MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
            
            mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
            
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                audioBlob = new Blob(audioChunks, { type: mime });
                audioUrl = URL.createObjectURL(audioBlob);
                btnDownload.disabled = false;
            };

            mediaRecorder.start();
            isRecording = true;
            startTime = Date.now();
            
            btnRecord.classList.add('active');
            document.getElementById('led-rec').classList.add('on');
            btnStop.disabled = false;
            btnPlay.disabled = true;
            btnDownload.disabled = true;
        });

        btnStop.addEventListener('click', () => {
            if (isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                btnRecord.classList.remove('active');
                document.getElementById('led-rec').classList.remove('on');
            }
            if (isPlaying) {
                stopPlayback();
            }
            btnStop.disabled = true;
            btnPlay.disabled = false;
        });

        btnPlay.addEventListener('click', () => {
            if (recordedEvents.length === 0) return;
            isPlaying = true;
            btnPlay.classList.add('active');
            document.getElementById('led-play').classList.add('play');
            btnStop.disabled = false;
            
            recordedEvents.forEach(ev => {
                const t = setTimeout(() => {
                    if (!isPlaying) return;
                    const key = document.querySelector(`[data-note="${ev.note}"]`);
                    if (key) {
                        if (ev.type === 'on') {
                            key.classList.add(key.classList.contains('key-white') ? 'pressed' : 'active');
                            playTone(ev.freq, ev.note);
                        } else {
                            key.classList.remove('pressed', 'active');
                            stopTone(ev.note);
                        }
                    }
                }, ev.time);
                playbackTimeouts.push(t);
            });

            const lastTime = recordedEvents[recordedEvents.length-1].time;
            playbackTimeouts.push(setTimeout(stopPlayback, lastTime + 500));
        });

        function stopPlayback() {
            isPlaying = false;
            playbackTimeouts.forEach(clearTimeout);
            playbackTimeouts = [];
            document.querySelectorAll('.pressed, .active').forEach(el => {
                el.classList.remove('pressed', 'active');
                stopTone(el.dataset.note);
            });
            btnPlay.classList.remove('active');
            document.getElementById('led-play').classList.remove('play');
            btnStop.disabled = true;
        }

        btnDownload.addEventListener('click', () => {
            if (!audioUrl) return;
            const link = document.getElementById('download-link');
            link.href = audioUrl;
            link.download = `harpsichord_v_${Date.now()}.webm`;
            link.click();
        });

        btnClear.addEventListener('click', () => {
            stopPlayback();
            recordedEvents = [];
            audioChunks = [];
            audioUrl = null;
            btnPlay.disabled = true;
            btnDownload.disabled = true;
            alert('ลบข้อมูลแล้ว');
        });

        createKeyboard();
        setupEvents();

        document.getElementById('start-overlay').addEventListener('click', function() {
            initAudio();
            this.style.opacity = '0';
            setTimeout(() => this.remove(), 500);
        });

    </script>
</body>
</html>
