<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bass Trombone Premium Synthesizer</title>
<!-- Tailwind CSS for modern responsive layout styling -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Typography and FontAwesome for quality icons -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  :root {
    --gold: #e8c84a;
    --gold-dark: #9a7a1a;
    --bg: #0d0d11;
    --surface: #161620;
    --surface2: #222230;
    --red: #f05252;
    --blue: #3b82f6;
    --text: #f3f4f6;
  }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  /* Customized Scrollbar for safe scroll container on short screens */
  .custom-scrollbar::-webkit-scrollbar {
    width: 4px;
    height: 4px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 10px;
  }
  
  /* Slide zones and slider styles */
  .zone {
    position: absolute;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    cursor: pointer;
    transition: background 0.1s;
  }
  .zone-line {
    flex: 1;
    height: 1.5px;
    background: rgba(232, 200, 74, 0.08);
    transition: background 0.15s, box-shadow 0.15s;
  }
  .zone.active .zone-line {
    background: var(--gold);
    box-shadow: 0 0 15px rgba(232, 200, 74, 0.6);
  }
  .zone-label {
    position: absolute;
    right: 18px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: rgba(232, 200, 74, 0.3);
    pointer-events: none;
    transform: translateY(-50%);
    top: 50%;
    transition: color 0.15s, transform 0.15s;
  }
  .zone.active .zone-label {
    color: var(--gold);
    transform: translateY(-50%) scale(1.15);
  }
  .zone-pos {
    position: absolute;
    left: 18px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: rgba(232, 200, 74, 0.18);
    pointer-events: none;
    transform: translateY(-50%);
    top: 50%;
    transition: color 0.15s;
  }
  .zone.active .zone-pos {
    color: rgba(232, 200, 74, 0.75);
  }

  /* Handle/Slide Controller thumb */
  #thumb {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffdf0, #e8c84a 50%, #9a7a1a 90%);
    border: 3.5px solid #b5891e;
    box-shadow: 0 6px 24px rgba(0,0,0,0.8), 0 0 0 8px rgba(232, 200, 74, 0.1);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    will-change: transform, top;
    z-index: 10;
  }
  #thumb.show {
    opacity: 1;
  }
  #thumb::after {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.45), transparent 75%);
  }

  /* Audio spectrum and ambient glow glow */
  #glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, rgba(232, 200, 74, 0.08), transparent 70%);
    opacity: 0;
    transition: opacity 0.25s;
  }
  #glow.on {
    opacity: 1;
  }

  /* Floating Notes animations */
  .floating-note {
    position: absolute;
    font-size: 1.4rem;
    color: var(--gold);
    pointer-events: none;
    animation: floatUp 1.8s forwards ease-out;
    z-index: 50;
    text-shadow: 0 0 8px rgba(232, 200, 74, 0.6);
  }
  @keyframes floatUp {
    0% {
      transform: translate(-50%, -50%) translateY(0) scale(0.6) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translate(-50%, -50%) translateY(-180px) scale(1.3) rotate(20deg);
      opacity: 0;
    }
  }

  /* Pulse red dot for record */
  .pulse-rec {
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.2); opacity: 0.3; }
  }
  
  /* Range Sliders Premium Styling */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: #111;
    border-radius: 8px;
    height: 6px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    border: 2px solid #000;
  }
</style>
</head>

<script>
// ── REGISTER / HARMONIC NOTE CONFIGURATIONS ───────────────────────────
// Standard trombone positions are modeled across three main ranges
const HARMONICS = {
  low: [
    {pos:1, note:"Bb1", freq:58.27}, {pos:2, note:"A1", freq:55.00},
    {pos:3, note:"Ab1", freq:51.91}, {pos:4, note:"G1", freq:49.00},
    {pos:5, note:"Gb1", freq:46.25}, {pos:6, note:"F1", freq:43.65},
    {pos:7, note:"E1",  freq:41.20}
  ],
  mid: [
    {pos:1, note:"Bb2", freq:116.54}, {pos:2, note:"A2", freq:110.00},
    {pos:3, note:"Ab2", freq:103.83}, {pos:4, note:"G2", freq:98.00},
    {pos:5, note:"Gb2", freq:92.50},  {pos:6, note:"F2", freq:87.31},
    {pos:7, note:"E2",  freq:82.41}
  ],
  high: [
    {pos:1, note:"Bb3", freq:233.08}, {pos:2, note:"A3", freq:220.00},
    {pos:3, note:"Ab3", freq:207.65}, {pos:4, note:"G3", freq:196.00},
    {pos:5, note:"Gb3", freq:185.00}, {pos:6, note:"F3", freq:174.61},
    {pos:7, note:"E3",  freq:164.81}
  ]
};
let reg = 'mid'; // Selected playing register

// ── THREE CLASSICAL DEMO SONGS SEQUENCES ──────────────────────────────
const DEMO_SONGS = {
  valkyries: [
    { reg: "low", note: "B1", dur: 320, slide: 7 },
    { reg: "mid", note: "E2", dur: 160, slide: 7 },
    { reg: "mid", note: "G2", dur: 160, slide: 4 },
    { reg: "mid", note: "B2", dur: 480, slide: 1 },
    { reg: "high", note: "E3", dur: 800, slide: 7 },
    { reg: "high", note: "E3", dur: 200, slide: 7 },
    { reg: "high", note: "G3", dur: 180, slide: 4 },
    { reg: "high", note: "B3", dur: 400, slide: 1 },
    { reg: "high", note: "E3", dur: 900, slide: 7 }
  ],
  imperial: [
    { reg: "mid", note: "G2", dur: 450, slide: 4 },
    { reg: "mid", note: "G2", dur: 450, slide: 4 },
    { reg: "mid", note: "G2", dur: 450, slide: 4 },
    { reg: "mid", note: "Eb2", dur: 320, slide: 7 },
    { reg: "mid", note: "Bb2", dur: 140, slide: 1 },
    { reg: "mid", note: "G2", dur: 450, slide: 4 },
    { reg: "mid", note: "Eb2", dur: 320, slide: 7 },
    { reg: "mid", note: "Bb2", dur: 140, slide: 1 },
    { reg: "mid", note: "G2", dur: 800, slide: 4 },
    { reg: "high", note: "D3", dur: 450, slide: 7 },
    { reg: "high", note: "D3", dur: 450, slide: 7 },
    { reg: "high", note: "D3", dur: 450, slide: 7 },
    { reg: "high", note: "Eb3", dur: 320, slide: 5 },
    { reg: "mid", note: "Bb2", dur: 140, slide: 1 },
    { reg: "mid", note: "Gb2", dur: 450, slide: 5 },
    { reg: "mid", note: "Eb2", dur: 320, slide: 7 },
    { reg: "mid", note: "Bb2", dur: 140, slide: 1 },
    { reg: "mid", note: "G2", dur: 800, slide: 4 }
  ],
  danny: [
    { reg: "mid", note: "E2", dur: 250, slide: 7 },
    { reg: "mid", note: "F2", dur: 250, slide: 6 },
    { reg: "mid", note: "G2", dur: 500, slide: 4 },
    { reg: "mid", note: "F2", dur: 250, slide: 6 },
    { reg: "mid", note: "E2", dur: 250, slide: 7 },
    { reg: "mid", note: "F2", dur: 500, slide: 6 },
    { reg: "mid", note: "A2", dur: 250, slide: 2 },
    { reg: "mid", note: "G2", dur: 250, slide: 4 },
    { reg: "mid", note: "E2", dur: 500, slide: 7 },
    { reg: "mid", note: "A2", dur: 250, slide: 2 },
    { reg: "mid", note: "F2", dur: 250, slide: 6 },
    { reg: "mid", note: "Bb2", dur: 1000, slide: 1 }
  ]
};

// ── AUDIO ROUTING & SYNTHESIS GRAPHS ──────────────────────────────────
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, masterOut, recDest;
let oscNodes = [];
let envNode = null;
let lfoOsc = null, lfoGain = null;
let shaperNode = null;
let eq3Node = null;
let delayWetNode = null;

let isOn = false;
let vibon = true;
let muteon = false;
let currentFreq = 110;
let mrec, mchunks = [], murl;

// Synthesis parameters configurable via Advanced panel
let config = {
  bite: 2.5,
  cutoff: 3500,
  lfoRate: 4.8,
  reverb: 0.15,
  attack: 0.05
};

// Trombone physical spectrum amplitudes: heavy f1 & f2, rapid rollout of higher harmonics
const H_AMPS = [1.00, 0.78, 0.48, 0.28, 0.16, 0.09, 0.04, 0.01];

function buildGraph() {
  if (ctx) return;
  ctx = new AC();

  // Primary VCA Envelope Node
  envNode = ctx.createGain();
  envNode.gain.value = 0;

  // Brass saturation using a Chebyshev wave shaper
  shaperNode = ctx.createWaveShaper();
  applyShaperCurve(config.bite);
  shaperNode.oversample = '2x';

  // Subharmonic hum cut highpass
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; 
  hp.frequency.value = 40; 
  hp.Q.value = 0.7;

  // Heavy fundamental/body peaking equalizer at 150Hz
  const eq1 = ctx.createBiquadFilter();
  eq1.type = 'peaking'; 
  eq1.frequency.value = 150; 
  eq1.Q.value = 0.9; 
  eq1.gain.value = 7;

  // Medium brass presence peaking EQ at 600Hz
  const eq2 = ctx.createBiquadFilter();
  eq2.type = 'peaking'; 
  eq2.frequency.value = 600; 
  eq2.Q.value = 2.0; 
  eq2.gain.value = 4;

  // Instrument lowpass filter (representing mouthpiece & body acoustics)
  eq3Node = ctx.createBiquadFilter();
  eq3Node.type = 'lowpass'; 
  eq3Node.frequency.value = config.cutoff; 
  eq3Node.Q.value = 0.55;

  // Compression limiter block
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; 
  comp.ratio.value = 4;
  comp.attack.value = 0.003; 
  comp.release.value = 0.25;

  // Ambient delay reflections (stereo depth simulation)
  const dly1 = ctx.createDelay(0.12); 
  dly1.delayTime.value = 0.022;
  const dly2 = ctx.createDelay(0.18); 
  dly2.delayTime.value = 0.045;
  const fb1 = ctx.createGain(); fb1.gain.value = 0.16;
  const fb2 = ctx.createGain(); fb2.gain.value = 0.12;
  
  delayWetNode = ctx.createGain(); 
  delayWetNode.gain.value = config.reverb;
  const dry = ctx.createGain(); 
  dry.gain.value = 1.0;

  masterOut = ctx.createGain(); 
  masterOut.gain.value = 0.90;

  // Routing Graph configuration
  envNode.connect(shaperNode);
  shaperNode.connect(hp); 
  hp.connect(eq1); 
  eq1.connect(eq2); 
  eq2.connect(eq3Node);
  
  eq3Node.connect(dry);  
  dry.connect(comp);
  
  eq3Node.connect(dly1); 
  dly1.connect(fb1); 
  fb1.connect(dly1); 
  dly1.connect(delayWetNode);
  
  eq3Node.connect(dly2); 
  dly2.connect(fb2); 
  fb2.connect(dly2); 
  dly2.connect(delayWetNode);
  
  delayWetNode.connect(comp);
  comp.connect(masterOut);
  masterOut.connect(ctx.destination);

  // Connection nodes for Recorder module
  recDest = ctx.createMediaStreamDestination();
  masterOut.connect(recDest);

  // Low Frequency Oscillator (LFO) for warm vibrato
  lfoOsc = ctx.createOscillator();
  lfoOsc.type = 'sine'; 
  lfoOsc.frequency.value = config.lfoRate;
  
  lfoGain = ctx.createGain(); 
  lfoGain.gain.value = 0;
  lfoOsc.connect(lfoGain); 
  lfoOsc.start();

  // Array of harmonic oscillators forming rich synthesizer voice
  oscNodes = H_AMPS.map((amp, i) => {
    const h = i + 1;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = currentFreq * h;
    const g = ctx.createGain();
    g.gain.value = 0;
    lfoGain.connect(osc.frequency);
    osc.connect(g);
    g.connect(envNode);
    osc.start();
    return { osc, gain: g, harmonic: h, baseAmp: amp };
  });
}

// Applies responsive soft saturation/tanh curve to the synthesizer output
function applyShaperCurve(biteAmount) {
  if (!shaperNode) return;
  const n = 512, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2 / n) - 1;
    curve[i] = Math.tanh(biteAmount * x) / Math.tanh(biteAmount);
  }
  shaperNode.curve = curve;
}

// Dynamic frequency modification matching slide slide interactions
function setOscFreqs(freq, tau) {
  if (!ctx) return;
  const t = ctx.currentTime;
  const sm = tau ?? 0.04;
  oscNodes.forEach(({ osc, harmonic }) => {
    osc.frequency.setTargetAtTime(freq * harmonic, t, sm);
  });
}

// Adjust oscillator volume on/off sweeps
function setOscGains(on) {
  if (!ctx) return;
  const t = ctx.currentTime;
  const vol = muteon ? 0.35 : 0.85;
  oscNodes.forEach(({ gain, baseAmp }) => {
    gain.gain.setTargetAtTime(on ? baseAmp * vol * 0.18 : 0, t, 0.02);
  });
}

// Synthesizer trigger on function
function play(freq) {
  buildGraph();
  if (ctx.state === 'suspended') ctx.resume();
  currentFreq = freq;
  setOscFreqs(freq, config.attack);

  if (!isOn) {
    setOscGains(true);
    const t = ctx.currentTime;
    envNode.gain.cancelScheduledValues(t);
    envNode.gain.setValueAtTime(0, t);
    envNode.gain.linearRampToValueAtTime(1.1, t + config.attack);
    envNode.gain.setTargetAtTime(1.0, t + config.attack, 0.06);

    // Warm delay start for vibrato to settle on hold notes
    if (vibon) {
      lfoGain.gain.setValueAtTime(0, t);
      lfoGain.gain.setTargetAtTime(freq * 0.005, t + 0.28, 0.12);
    }

    isOn = true;
    document.getElementById('glow').classList.add('on');
    document.getElementById('note-display').classList.add('on');
    document.getElementById('hint').style.opacity = '0.04';
  }
}

// Slides frequency transition (smooth legato glide)
function pitch(freq) {
  if (!isOn) return;
  currentFreq = freq;
  setOscFreqs(freq, 0.035);
  if (vibon) {
    lfoGain.gain.setTargetAtTime(freq * 0.005, ctx.currentTime, 0.06);
  }
}

// Synthesizer release trigger
function stop() {
  if (!isOn) return;
  const t = ctx.currentTime;
  envNode.gain.cancelScheduledValues(t);
  envNode.gain.setValueAtTime(envNode.gain.value, t);
  envNode.gain.linearRampToValueAtTime(0, t + 0.28);
  lfoGain.gain.setTargetAtTime(0, t, 0.03);
  
  setOscGains(false);
  isOn = false;
  document.getElementById('glow').classList.remove('on');
  document.getElementById('note-display').classList.remove('on');
  document.getElementById('note-display').textContent = '——';
  document.getElementById('big-pos').textContent = '—';
  document.getElementById('big-pos').classList.remove('text-[#e8c84a]/20');
  clearZones();
}

// ── INTERACTIVE SLIDE ZONES CALCULATION ──────────────────────────────────
let zones = [];
function buildZones() {
  const area = document.getElementById('play-area');
  
  // Clean past zones elements
  area.querySelectorAll('.zone').forEach(z => z.remove());
  
  const H = area.clientHeight;
  const pos = HARMONICS[reg];
  const n = pos.length;
  zones = [];
  
  pos.forEach((p, i) => {
    const yPct = 8 + (i / (n-1)) * 82; // Calculate height boundaries with margins
    const yPx  = H * yPct / 100;
    const half = H * (82 / (n-1)) / 100 / 2;
    
    const z = document.createElement('div'); 
    z.className = 'zone';
    z.style.top = (yPx - half) + 'px'; 
    z.style.height = (half * 2) + 'px';
    
    const line = document.createElement('div'); 
    line.className = 'zone-line';
    
    const lbl  = document.createElement('div'); 
    lbl.className  = 'zone-label'; 
    lbl.textContent = p.note;
    
    const num  = document.createElement('div'); 
    num.className  = 'zone-pos';   
    num.textContent = p.pos;
    
    z.appendChild(line); 
    z.appendChild(lbl); 
    z.appendChild(num);
    
    area.insertBefore(z, document.getElementById('thumb'));
    zones.push({ el: z, y: yPx, ...p });
  });
}

function clearZones() { 
  zones.forEach(z => z.el.classList.remove('active')); 
}

// Spawns floating interactive music notes symbols matching play heights
function spawnFloatingNote(yPos) {
  if (!isOn) return;
  const area = document.getElementById('play-area');
  const symbols = ['♩', '♪', '♫', '♬'];
  const symbol = symbols[Math.floor(Math.random() * symbols.length)];
  
  const noteEl = document.createElement('div');
  noteEl.className = 'floating-note font-mono';
  noteEl.textContent = symbol;
  
  // Position notes right at the virtual slide column
  noteEl.style.top = `${yPos}px`;
  noteEl.style.left = `${50 + (Math.random() * 20 - 10)}%`;
  
  area.appendChild(noteEl);
  
  // Garbage collection
  setTimeout(() => {
    noteEl.remove();
  }, 1800);
}

// Particle emitter loop
let particlesInterval = null;
function startNotesParticles(clientY) {
  if (particlesInterval) clearInterval(particlesInterval);
  particlesInterval = setInterval(() => {
    const rect = playArea.getBoundingClientRect();
    const clampY = Math.max(0, Math.min(rect.height, clientY - rect.top));
    spawnFloatingNote(clampY);
  }, 300);
}
function stopNotesParticles() {
  if (particlesInterval) {
    clearInterval(particlesInterval);
    particlesInterval = null;
  }
}

// ── INTERACTIVE TOUCH & SLIDE DETECTORS ──────────────────────────────────
const playArea = document.getElementById('play-area');
const thumb    = document.getElementById('thumb');
let touching = false;

function handle(e, isStart) {
  e.preventDefault();
  if (isDemoPlaying) return; // Prevent user input from interrupting active demo song
  
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const rect    = playArea.getBoundingClientRect();
  const H       = rect.height;
  const clampY  = Math.max(0, Math.min(H, clientY - rect.top));

  thumb.style.top = clampY + 'px';
  thumb.classList.add('show');

  // Binary locate optimal snapping line zone
  let best = null, bestD = Infinity;
  zones.forEach(z => { 
    const d = Math.abs(clampY - z.y); 
    if (d < bestD) { 
      bestD = d; 
      best = z; 
    } 
  });

  const pos  = HARMONICS[reg];
  const lnH  = Math.log(pos[0].freq);
  const lnL  = Math.log(pos[pos.length-1].freq);
  const minY = H * 0.08, maxY = H * 0.90;
  const ratio = (clampY - minY) / (maxY - minY);
  const freq  = Math.exp(lnH - Math.max(0, Math.min(1, ratio)) * (lnH - lnL));

  clearZones();
  if (best) {
    best.el.classList.add('active');
    document.getElementById('note-display').textContent = best.note;
    
    const bigPos = document.getElementById('big-pos');
    bigPos.textContent = best.pos;
    bigPos.classList.add('text-[#e8c84a]/20');
  }
  
  if (isStart) {
    play(freq); 
    startNotesParticles(clientY);
  } else {
    pitch(freq);
  }
}

// Touch listeners
playArea.addEventListener('touchstart',  e => { touching = true; buildZones(); handle(e, true);  }, {passive:false});
playArea.addEventListener('touchmove',   e => { if (touching) handle(e, false); },                  {passive:false});
playArea.addEventListener('touchend',    e => { e.preventDefault(); touching = false; thumb.classList.remove('show'); stop(); stopNotesParticles(); }, {passive:false});
playArea.addEventListener('touchcancel', e => { e.preventDefault(); touching = false; thumb.classList.remove('show'); stop(); stopNotesParticles(); }, {passive:false});

// Mouse fallback listeners
playArea.addEventListener('mousedown',   e => { touching = true; buildZones(); handle(e, true); });
document.addEventListener('mousemove',   e => { if (touching) handle(e, false); });
document.addEventListener('mouseup',     e => { if (touching) { touching = false; thumb.classList.remove('show'); stop(); stopNotesParticles(); } });

// ── REGISTER/OCTAVE SELECTION TRIGGERS ─────────────────────────────────
function updateRegisterActiveUI() {
  document.querySelectorAll('.register-btn').forEach(b => {
    if (b.dataset.reg === reg) {
      b.classList.add('bg-[#e8c84a]/15', 'text-[#e8c84a]', 'font-bold');
      b.classList.remove('text-gray-500');
    } else {
      b.classList.remove('bg-[#e8c84a]/15', 'text-[#e8c84a]', 'font-bold');
      b.classList.add('text-gray-500');
    }
  });
}

document.querySelectorAll('.register-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    reg = btn.dataset.reg;
    updateRegisterActiveUI();
    buildZones();
  });
});

// Quick FX selectors
document.getElementById('btn-vib').addEventListener('click', () => {
  vibon = !vibon;
  document.getElementById('btn-vib').classList.toggle('bg-[#e8c84a]/15', vibon);
  document.getElementById('btn-vib').classList.toggle('text-[#e8c84a]', vibon);
  if (ctx && lfoGain) {
    lfoGain.gain.setTargetAtTime((isOn && vibon) ? currentFreq * 0.005 : 0, ctx.currentTime, 0.1);
  }
});

document.getElementById('btn-mute').addEventListener('click', () => {
  muteon = !muteon;
  document.getElementById('btn-mute').classList.toggle('bg-[#e8c84a]/15', muteon);
  document.getElementById('btn-mute').classList.toggle('text-[#e8c84a]', muteon);
  if (isOn) setOscGains(true);
});

// Advanced synth panels accordion expander
document.getElementById('btn-adv').addEventListener('click', () => {
  const panel = document.getElementById('adv-panel');
  panel.classList.toggle('hidden');
  panel.classList.toggle('flex');
});

// Synchronize real-time updates from panel sliders to internal synth values
document.getElementById('param-bite').addEventListener('input', (e) => {
  config.bite = parseFloat(e.target.value);
  document.getElementById('lbl-bite').textContent = config.bite.toFixed(1);
  if (shaperNode) applyShaperCurve(config.bite);
});

document.getElementById('param-cutoff').addEventListener('input', (e) => {
  config.cutoff = parseInt(e.target.value);
  document.getElementById('lbl-cutoff').textContent = config.cutoff + "Hz";
  if (eq3Node) eq3Node.frequency.setTargetAtTime(config.cutoff, ctx?.currentTime || 0, 0.05);
});

document.getElementById('param-lfo').addEventListener('input', (e) => {
  config.lfoRate = parseFloat(e.target.value);
  document.getElementById('lbl-lfo').textContent = config.lfoRate.toFixed(1) + " Hz";
  if (lfoOsc) lfoOsc.frequency.setTargetAtTime(config.lfoRate, ctx?.currentTime || 0, 0.05);
});

document.getElementById('param-reverb').addEventListener('input', (e) => {
  const pct = parseInt(e.target.value);
  config.reverb = pct / 100;
  document.getElementById('lbl-reverb').textContent = pct + "%";
  if (delayWetNode) delayWetNode.gain.setTargetAtTime(config.reverb, ctx?.currentTime || 0, 0.05);
});

document.getElementById('param-attack').addEventListener('input', (e) => {
  config.attack = parseFloat(e.target.value);
  document.getElementById('lbl-attack').textContent = config.attack.toFixed(2) + "s";
});

// ── RECORDER & EXPORT AGENT ──────────────────────────────────────────
const bRec  = document.getElementById('btn-rec');
const bStop = document.getElementById('btn-stop');
const bDl   = document.getElementById('btn-dl');

bRec.addEventListener('click', () => {
  buildGraph();
  if (ctx.state === 'suspended') ctx.resume();
  mchunks = [];
  mrec = new MediaRecorder(recDest.stream);
  mrec.ondataavailable = e => mchunks.push(e.data);
  mrec.onstop = () => {
    murl = URL.createObjectURL(new Blob(mchunks, {type: 'audio/ogg; codecs=opus'}));
    bDl.disabled = false;
  };
  mrec.start();
  bRec.classList.add('hidden');
  bStop.classList.remove('hidden');
});

bStop.addEventListener('click', () => {
  if (mrec && mrec.state === 'recording') mrec.stop();
  bStop.classList.add('hidden');
  bRec.classList.remove('hidden');
});

bDl.addEventListener('click', () => {
  if (!murl) return;
  const a = document.createElement('a'); 
  a.href = murl;
  a.download = 'bass_trombone_performance_' + Date.now() + '.ogg';
  document.body.appendChild(a); 
  a.click();
  setTimeout(() => document.body.removeChild(a), 100);
});

// ── DEMO AUTO-PLAYER ENGINE ──────────────────────────────────────────
let isDemoPlaying = false;
let activeTimers = [];

function triggerStopSong() {
  if (!isDemoPlaying) return;
  
  // Clear any scheduled future notes
  activeTimers.forEach(clearTimeout);
  activeTimers = [];
  
  // Stop sounds and particles
  stop();
  stopNotesParticles();
  
  // Hide visual elements
  thumb.classList.remove('show');
  document.getElementById('btn-stop-song').classList.add('hidden');
  
  isDemoPlaying = false;
  
  // Re-enable song select buttons styling
  document.querySelectorAll('.song-btn').forEach(b => {
    b.classList.remove('border-yellow-500', 'bg-[#e8c84a]/20', 'text-yellow-300');
  });
}

document.getElementById('btn-stop-song').addEventListener('click', triggerStopSong);

function playDemoSong(songKey) {
  // If a song is already playing, clear it first
  triggerStopSong();
  
  buildGraph();
  buildZones();
  
  const notes = DEMO_SONGS[songKey];
  if (!notes) return;
  
  isDemoPlaying = true;
  document.getElementById('btn-stop-song').classList.remove('hidden');
  
  // Highlight active song button visually
  const clickedBtn = document.querySelector(`[data-song="${songKey}"]`);
  if (clickedBtn) {
    clickedBtn.classList.add('border-yellow-500', 'bg-[#e8c84a]/20', 'text-yellow-300');
  }

  let accumTime = 0;
  
  notes.forEach((n, idx) => {
    // Timer to prepare the pitch trigger
    const playTimer = setTimeout(() => {
      if (!isDemoPlaying) return;
      
      // Select appropriate register on the fly
      reg = n.reg;
      updateRegisterActiveUI();
      buildZones();
      
      // Calculate active vertical pixel slide index positions
      const zoneIdx = n.slide - 1;
      const targetZone = zones[zoneIdx];
      const areaH = playArea.clientHeight;
      
      if (targetZone) {
        const targetY = targetZone.y;
        
        // Move slide handle visually
        thumb.style.top = targetY + 'px';
        thumb.classList.add('show');
        
        // Play synthesizer note sound
        play(targetZone.freq);
        
        // Highlights active zone lines
        clearZones();
        targetZone.el.classList.add('active');
        document.getElementById('note-display').textContent = targetZone.note;
        
        const bigPos = document.getElementById('big-pos');
        bigPos.textContent = targetZone.pos;
        bigPos.classList.add('text-[#e8c84a]/20');
        
        // Float notes animation
        spawnFloatingNote(targetY);
      }
    }, accumTime);
    
    activeTimers.push(playTimer);
    
    // Add gap space to play separate notes beautifully (legato/staccato gaps)
    accumTime += n.dur;
    
    // Timer to release/stop sound between notes
    const stopTimer = setTimeout(() => {
      if (!isDemoPlaying) return;
      stop();
    }, accumTime - 35);
    
    activeTimers.push(stopTimer);
  });
  
  // End of song clean up trigger
  const endTimer = setTimeout(() => {
    if (!isDemoPlaying) return;
    triggerStopSong();
  }, accumTime + 500);
  
  activeTimers.push(endTimer);
}

document.querySelectorAll('.song-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const songName = btn.dataset.song;
    playDemoSong(songName);
  });
});

// ── INIT ──────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  updateRegisterActiveUI();
  buildZones();
});
window.addEventListener('resize', buildZones);
setTimeout(buildZones, 200);

</script>
