<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ปี่มอญ Pro (14 Keys Synth)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');

        :root {
            --wood-dark: #3e2723;
            --wood-light: #8d6e63;
            --gold: #ffd700;
            --gold-dark: #b8860b;
            --bg: #121212;
            --accent: #ffb300;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #2c2c2c 0%, #000000 100%);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh; /* บังคับความสูงเท่าหน้าจอ */
            width: 100vw;
            overflow: hidden; /* ห้ามมี Scrollbar */
            touch-action: none;
            user-select: none;
        }

        /* Header - ปรับให้เล็กลง */
        header {
            flex: 0 0 auto;
            padding: 5px;
            text-align: center;
            z-index: 10;
            width: 100%;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid #333;
            height: 50px; /* ความสูงคงที่ */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 { margin: 0; color: var(--gold); font-size: 1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .status { font-size: 0.65rem; color: #aaa; margin-top: 2px; }

        /* Instrument Area - ปรับให้ยืดหยุ่น */
        .instrument-area {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 5px 0;
        }

        /* Pi Mon Body Visual */
        .pi-mon-body {
            position: absolute;
            width: 100px; /* ลดความกว้างตัวปี่ */
            height: 98%;
            background: linear-gradient(90deg, var(--wood-dark), var(--wood-light), var(--wood-dark));
            border-radius: 15px 15px 50px 50px;
            border: 3px solid var(--gold-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1;
        }
        
        .ring {
            position: absolute; width: 100%; height: 5px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
            z-index: 2;
            opacity: 0.7;
        }

        /* Keys Layout (Grid 2 Columns) - ปรับขนาดและระยะห่าง */
        .keys-wrapper {
            z-index: 5;
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* ใช้ vh (viewport height) เพื่อให้ระยะห่างปรับตามความสูงหน้าจอ */
            gap: 1vh 25px; 
            width: auto;
            height: 100%;
            align-content: center;
            justify-items: center;
            padding: 5px 0;
        }

        .note-btn {
            /* ปรับขนาดปุ่มให้เล็กลงและสัมพันธ์กับหน้าจอ */
            width: 42px; 
            height: 42px;
            max-width: 11vw; /* ไม่ให้ใหญ่เกินไปบนจอกว้าง */
            max-height: 11vw;
            
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #444, #111);
            border: 2px solid var(--gold);
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6);
            transition: all 0.05s;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* ปรับขนาดปุ่มสำหรับหน้าจอที่สูงหน่อย */
        @media (min-height: 700px) {
            .note-btn { width: 50px; height: 50px; font-size: 0.9rem; }
            .keys-wrapper { gap: 1.5vh 30px; }
        }

        /* Active State */
        .note-btn:active, .note-btn.active {
            transform: scale(0.92);
            background: radial-gradient(circle at 30% 30%, var(--gold), var(--gold-dark));
            color: black;
            box-shadow: 0 0 10px var(--gold);
            border-color: white;
        }

        /* Controls - ทำให้เล็กกะทัดรัด */
        .controls {
            flex: 0 0 auto;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            padding: 8px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            border-top: 1px solid var(--gold-dark);
            z-index: 20;
            height: 60px; /* ความสูงคงที่ */
            box-sizing: border-box;
        }

        .btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 0 15px;
            height: 36px;
            border-radius: 18px;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            min-width: 70px;
            justify-content: center;
        }

        .btn.record { border-color: #ff5252; color: #ff5252; }
        .btn.record.recording { background: #ff5252; color: white; animation: pulse 1s infinite; }
        .btn.library { border-color: var(--accent); color: var(--accent); }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* Overlay */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; text-align: center; color: white;
        }
        #start-btn {
            margin-top: 20px; padding: 12px 30px;
            background: var(--gold); border: none;
            border-radius: 25px; font-size: 1rem; font-weight: bold;
            cursor: pointer; color: black;
        }

        /* Library Modal */
        #library-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 50;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: #222; width: 85%; max-width: 350px; max-height: 70vh;
            border-radius: 10px; border: 1px solid var(--gold);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header {
            padding: 10px 15px; background: #333; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #444;
        }
        .modal-body {
            padding: 10px; overflow-y: auto; flex: 1;
        }
        .record-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #333; padding: 8px; margin-bottom: 6px; border-radius: 5px;
        }
        .record-info { display: flex; flex-direction: column; gap: 2px; }
        .record-name { font-weight: bold; color: var(--gold); font-size: 0.8rem; }
        .record-date { font-size: 0.65rem; color: #aaa; }
        .record-actions { display: flex; gap: 5px; }
        .action-btn {
            background: none; border: 1px solid #666; color: white;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;
        }
        .action-btn.play { background: #2e7d32; border-color: #2e7d32; }
        .action-btn.delete { background: #c62828; border-color: #c62828; }
        .empty-msg { text-align: center; color: #666; padding: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="font-size: 1.5rem; margin-bottom: 10px;">ปี่มอญ Pro</h1>
        <p style="color: #ccc; font-size: 0.9rem;">เสียงสังเคราะห์ 14 คีย์ | บันทึกเสียงในตัว</p>
        <button id="start-btn">เริ่มเล่นดนตรี</button>
    </div>

    <header>
        <h1>ปี่มอญ (Virtual Pi Mon)</h1>
        <div class="status" id="status">พร้อมใช้งาน</div>
    </header>

    <div class="instrument-area">
        <div class="pi-mon-body">
            <!-- Decorative Rings -->
            <div class="ring" style="top: 10%"></div>
            <div class="ring" style="top: 30%"></div>
            <div class="ring" style="top: 50%"></div>
            <div class="ring" style="top: 70%"></div>
            <div class="ring" style="bottom: 10%"></div>
        </div>

        <div class="keys-wrapper">
            <!-- High Notes -->
            <div class="note-btn" data-freq="1396.91">ฟํ</div> <!-- F6 -->
            <div class="note-btn" data-freq="1318.51">มํ</div> <!-- E6 -->
            <div class="note-btn" data-freq="1174.66">รํ</div> <!-- D6 -->
            <div class="note-btn" data-freq="1046.50">ดํ</div> <!-- C6 -->
            
            <div class="note-btn" data-freq="987.77">ท</div>  <!-- B5 -->
            <div class="note-btn" data-freq="880.00">ล</div>  <!-- A5 -->
            <div class="note-btn" data-freq="783.99">ซ</div>  <!-- G5 -->
            <div class="note-btn" data-freq="698.46">ฟ</div>  <!-- F5 -->
            
            <div class="note-btn" data-freq="659.25">ม</div>  <!-- E5 -->
            <div class="note-btn" data-freq="587.33">ร</div>  <!-- D5 -->
            <div class="note-btn" data-freq="523.25">ด</div>  <!-- C5 -->
            <div class="note-btn" data-freq="493.88">ทฺ</div> <!-- B4 -->

            <div class="note-btn" data-freq="440.00">ลฺ</div> <!-- A4 -->
            <div class="note-btn" data-freq="392.00">ซฺ</div> <!-- G4 -->
        </div>
    </div>

    <div class="controls">
        <button class="btn library" id="library-btn">📁 คลังเสียง</button>
        <button class="btn record" id="rec-btn">● อัด</button>
        <button class="btn" id="stop-save-btn" style="display:none; background:#2e7d32; border-color:#2e7d32;">✔ บันทึก</button>
    </div>

    <!-- Library Modal -->
    <div id="library-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span style="color:white; font-weight:bold; font-size:0.9rem;">รายการเสียงที่บันทึกไว้</span>
                <span id="close-library" style="cursor:pointer; font-size:1.2rem; color:#aaa;">&times;</span>
            </div>
            <div class="modal-body" id="library-list">
                <div class="empty-msg">ไม่มีเสียงที่บันทึกไว้</div>
            </div>
        </div>
    </div>

    <script>
        // --- Audio Engine (Synthesizer) ---
        let audioCtx;
        let masterGain;
        let dest; // For Recording
        let activeOscillators = {};

        // IndexedDB Configuration
        const DB_NAME = 'PiMonDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'recordings';
        let db;

        // UI Elements
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const recBtn = document.getElementById('rec-btn');
        const stopSaveBtn = document.getElementById('stop-save-btn');
        const libraryBtn = document.getElementById('library-btn');
        const libraryModal = document.getElementById('library-modal');
        const closeLibrary = document.getElementById('close-library');
        const libraryList = document.getElementById('library-list');

        // --- Initialization ---
        startBtn.addEventListener('click', async () => {
            initAudio();
            initDB();
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
        });

        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.5;
            
            // Create Destination for Recorder
            dest = audioCtx.createMediaStreamDestination();
            masterGain.connect(audioCtx.destination);
            masterGain.connect(dest);
        }

        // --- Database (IndexedDB) ---
        function initDB() {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                }
            };
            
            request.onsuccess = (e) => {
                db = e.target.result;
                console.log("DB Opened");
            };
            
            request.onerror = (e) => console.error("DB Error", e);
        }

        function saveRecordingToDB(blob) {
            if (!db) return;
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            
            const record = {
                blob: blob,
                name: `เสียงปี่มอญ ${new Date().toLocaleString('th-TH')}`,
                date: new Date()
            };

            const request = store.add(record);
            request.onsuccess = () => {
                statusEl.innerText = "บันทึกลงเครื่องเรียบร้อย";
                loadLibrary(); // Refresh list if open
            };
            request.onerror = () => alert("ไม่สามารถบันทึกได้ (พื้นที่เต็ม?)");
        }

        function loadLibrary() {
            if (!db) return;
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();

            request.onsuccess = () => {
                const records = request.result;
                renderLibrary(records);
            };
        }

        function deleteRecording(id) {
            if(confirm('ต้องการลบเสียงนี้หรือไม่?')) {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                store.delete(id);
                transaction.oncomplete = () => loadLibrary();
            }
        }

        function renderLibrary(records) {
            libraryList.innerHTML = '';
            if (records.length === 0) {
                libraryList.innerHTML = '<div class="empty-msg">ไม่มีเสียงที่บันทึกไว้</div>';
                return;
            }

            records.reverse().forEach(rec => { // Show newest first
                const item = document.createElement('div');
                item.className = 'record-item';
                
                // Create URL for playback/download
                const url = URL.createObjectURL(rec.blob);

                item.innerHTML = `
                    <div class="record-info">
                        <span class="record-name">${rec.name}</span>
                        <span class="record-date">${rec.date.toLocaleTimeString()}</span>
                    </div>
                    <div class="record-actions">
                        <button class="action-btn play" onclick="playBlob('${url}')">▶</button>
                        <a href="${url}" download="${rec.name}.webm" class="action-btn" style="text-decoration:none; display:flex; align-items:center;">⬇</a>
                        <button class="action-btn delete" onclick="deleteRecording(${rec.id})">🗑</button>
                    </div>
                `;
                libraryList.appendChild(item);
            });
        }

        window.playBlob = (url) => {
            const audio = new Audio(url);
            audio.play();
        };

        window.deleteRecording = deleteRecording; // Make global for onclick

        // --- Synth Logic (Realistic Pi Mon) ---
        function playNote(freq) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const gain = audioCtx.createGain();
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();

            const t = audioCtx.currentTime;

            // 1. Tone Generation (Sawtooth for Reed)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, t);

            // 2. Vibrato (LFO) - Key characteristic
            lfo.frequency.value = 5.5; // Hz
            lfoGain.gain.value = 6.0; // Vibrato Depth
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            lfo.start(t);

            // 3. Timbre shaping (Lowpass)
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1800, t); // Cutoff high fizz
            filter.Q.value = 1.5; // Resonance

            // 4. Envelope (Breath attack)
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.3, t + 0.05); // Attack
            gain.gain.setValueAtTime(0.3, t + 0.1); // Sustain level

            // Connections
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            osc.start(t);

            return { osc, gain, lfo };
        }

        function stopNote(nodeObj) {
            if (!nodeObj) return;
            const { osc, gain, lfo } = nodeObj;
            const t = audioCtx.currentTime;

            // Release
            gain.gain.cancelScheduledValues(t);
            gain.gain.setValueAtTime(gain.gain.value, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.1);

            osc.stop(t + 0.15);
            lfo.stop(t + 0.15);
        }

        // --- Touch/Mouse Handling ---
        const noteBtns = document.querySelectorAll('.note-btn');
        noteBtns.forEach(btn => {
            const freq = parseFloat(btn.dataset.freq);
            let activeNode = null;

            const start = (e) => {
                e.preventDefault();
                if(activeNode) return; // Prevent double trigger
                btn.classList.add('active');
                activeNode = playNote(freq);
            };

            const end = (e) => {
                e.preventDefault();
                btn.classList.remove('active');
                if(activeNode) {
                    stopNote(activeNode);
                    activeNode = null;
                }
            };

            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end);
            btn.addEventListener('touchcancel', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        });

        // --- Recording Logic ---
        let mediaRecorder;
        let chunks = [];
        let isRecording = false;

        recBtn.addEventListener('click', () => {
            if (!isRecording) {
                // Start Recording
                chunks = [];
                const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                mediaRecorder = new MediaRecorder(dest.stream, { mimeType });
                
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: mimeType });
                    saveRecordingToDB(blob); // Auto save to library
                };

                mediaRecorder.start();
                isRecording = true;
                
                // Toggle UI
                recBtn.style.display = 'none';
                stopSaveBtn.style.display = 'flex';
                libraryBtn.disabled = true;
                statusEl.innerText = "กำลังอัดเสียง... (กดปุ่มเขียวเพื่อบันทึก)";
            }
        });

        stopSaveBtn.addEventListener('click', () => {
            if (isRecording && mediaRecorder) {
                mediaRecorder.stop();
                isRecording = false;
                
                // Toggle UI
                recBtn.style.display = 'flex';
                stopSaveBtn.style.display = 'none';
                libraryBtn.disabled = false;
                statusEl.innerText = "บันทึกเรียบร้อย! ดูได้ในคลังเสียง";
                
                // Open library automatically
                setTimeout(() => {
                    loadLibrary();
                    libraryModal.style.display = 'flex';
                }, 500);
            }
        });

        // --- Library UI Control ---
        libraryBtn.addEventListener('click', () => {
            loadLibrary();
            libraryModal.style.display = 'flex';
        });

        closeLibrary.addEventListener('click', () => {
            libraryModal.style.display = 'none';
        });

        window.onclick = (e) => {
            if (e.target == libraryModal) libraryModal.style.display = 'none';
        }

    </script>
</body>
</html>
