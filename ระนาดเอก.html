<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ระนาดเอก Pro (Thai Ranat Ek)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');

        :root {
            --wood-dark: #3e2723;
            --wood-light: #8d6e63;
            --gold: #ffd700;
            --string-color: #f5f5f5;
            --bg-color: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            touch-action: none; /* ป้องกันการซูมและเลื่อนบนมือถือ สำคัญมากสำหรับการลากตี */
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            font-family: 'Sarabun', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at center, #2c1e1e 0%, #000000 100%);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Control Panel */
        #controls {
            height: 50px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--gold);
            z-index: 100;
            gap: 8px;
            padding: 0 10px;
            flex-shrink: 0;
        }

        .demo-controls-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            background: linear-gradient(145deg, #5d4037, #3e2723);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.95);
            background: #3e2723;
        }

        .btn.recording {
            background: #b71c1c;
            color: white;
            animation: pulse 1.5s infinite;
        }

        select.btn {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 24px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' fill='%23ffd700'><polygon points='0,0 10,0 5,5'/></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            outline: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        /* Stage area for Ranat */
        #stage {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0;
            perspective: 1000px;
            overflow: hidden;
        }

        /* The Instrument Body (Rang Ranat) */
        #ranat-container {
            width: 98%;
            max-width: none;
            height: 65%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        /* The Base/Boat shape simulation */
        .rang-base {
            position: absolute;
            bottom: -20px;
            width: 100%;
            height: 70px; 
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0iZ3JhZCIgeDE9IjAlIiB5MT0iMCUiIHgyPSIwJSIgeTI9IjEwMCUiPjxzdG9wIG9mZnNldD0iMCUiIHN0eWxlPSJzdG9wLWNvbG9yOiM1ZDQwMzc7c3RvcC1vcGFjaXR5OjEiIC8+PHN0b3Agb2Zmc2V0PSIxMDAlIiBzdHlsZT0ic3RvcC1jb2xvcjojM2UyNzIzO3N0b3Atb3BhY2l0eToxIiAvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InVybCgjZ3JhZCkiIC8+PC9zdmc+');
            background-size: cover;
            border-bottom-left-radius: 50% 100%;
            border-bottom-right-radius: 50% 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 2px solid var(--gold);
            z-index: 1;
        }

        /* Keys Container */
        #keys-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 99%;
            height: 140%; 
            z-index: 10;
            padding-bottom: 15px;
            position: relative;
            cursor: pointer;
        }

        /* String (Roi Chueak) */
        .string-line {
            position: absolute;
            bottom: 42%;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--string-color);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 2px 2px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        /* Individual Key (Luk Ranat) */
        .key {
            position: relative;
            background: linear-gradient(90deg, #5d4037 0%, #a1887f 20%, #8d6e63 50%, #a1887f 80%, #5d4037 100%);
            border-radius: 4px; 
            box-shadow: 2px 4px 6px rgba(0,0,0,0.4);
            transition: transform 0.05s, background 0.05s;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.9);
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 1px 1px 2px black;
            border-top: 1px solid rgba(255,255,255,0.3);
            border-bottom: 1px solid rgba(0,0,0,0.6);
            flex: 1; 
            margin: 0 1px;
            height: 100%; 
        }

        .key::after {
            content: '';
            position: absolute;
            top: 25%;
            width: 70%;
            height: 50%;
            background: radial-gradient(rgba(255,255,255,0.15), transparent);
            border-radius: 50%;
            pointer-events: none; /* เพื่อให้ elementFromPoint มองทะลุไปหาตัว key */
        }

        .key.active {
            transform: translateY(6px) scale(0.95);
            background: linear-gradient(90deg, #4e342e 0%, #8d6e63 50%, #4e342e 100%);
        }

        .note-label {
            position: absolute;
            bottom: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-size: 1.1em;
        }

        .show-notes .note-label {
            opacity: 1;
        }

        .hit-effect {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(255,215,0,0.8) 0%, rgba(255,215,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: hitFade 0.2s ease-out forwards;
            z-index: 20;
        }

        @keyframes hitFade {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* --- โน้ตรอยลอยละล่อง (Aesthetic Floating Note System) --- */
        .floating-note {
            position: absolute;
            bottom: 80px; /* เริ่มลอยอยู่เหนือป้ายชื่อโน้ต */
            left: 50%;
            transform: translateX(-50%);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: 'Sarabun', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            pointer-events: none;
            z-index: 99;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            border: 2px solid #ffffff;
            animation: floatUpAndSway 2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes floatUpAndSway {
            0% {
                transform: translate(-50%, 0) scale(0.6) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translate(calc(-50% + 20px), -150px) scale(1.1) rotate(15deg);
                opacity: 0.9;
            }
            100% {
                transform: translate(calc(-50% - 25px), -350px) scale(0.7) rotate(-25deg);
                opacity: 0;
            }
        }

        /* Status Text */
        #status-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            display: none;
            z-index: 200;
            font-size: 1.2rem;
            white-space: nowrap;
        }

        @media (orientation: portrait) {
            #stage {
                position: absolute;
                top: calc((100dvh - 75px - env(safe-area-inset-bottom)) / 2);
                left: 50%;
                width: calc(100dvh - 75px - env(safe-area-inset-bottom)); 
                height: 100dvw; 
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #ranat-container {
                height: 75%; 
                width: 96%;
                margin-bottom: 0;
            }
            #keys-wrapper {
                height: 130%;
            }
            #controls {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: auto;
                min-height: 65px;
                z-index: 101;
                border-top: 1px solid var(--gold);
                border-bottom: none;
                padding: 8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
                background: rgba(10, 10, 10, 0.95);
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 5px;
            }
            .btn {
                padding: 5px 8px;
                font-size: 0.75rem;
                gap: 2px;
                border-radius: 5px;
            }
            .demo-controls-wrapper {
                gap: 4px;
            }
            select.btn {
                max-width: 120px;
                text-overflow: ellipsis;
                padding-right: 20px;
                background-position: right 6px center;
            }
        }
    </style>
</head>

            { note: 8, dur: 0.5 }, { note: 7, dur: 0.5 }, { note: 5, dur: 1.5 },

            { note: 10, dur: 0.5 }, { note: 11, dur: 0.5 }, { note: 12, dur: 0.5 }, { note: 14, dur: 1.0 },
            { note: 15, dur: 0.5 }, { note: 17, dur: 0.5 }, { note: 14, dur: 1.5 }
        ];

        // 10. พระราชนิพนธ์ สายฝน (Sai Fon)
        const saifonData = [
            { note: 12, dur: 0.5 }, { note: 14, dur: 0.5 }, { note: 15, dur: 0.75 }, { note: 14, dur: 0.25 },
            { note: 12, dur: 0.5 }, { note: 10, dur: 1.0 },
            { note: 10, dur: 0.5 }, { note: 12, dur: 0.5 }, { note: 14, dur: 0.75 }, { note: 12, dur: 0.25 },
            { note: 10, dur: 0.5 }, { note: 8, dur: 1.0 },

            { note: 8, dur: 0.5 }, { note: 10, dur: 0.5 }, { note: 12, dur: 0.75 }, { note: 10, dur: 0.25 },
            { note: 8, dur: 0.5 }, { note: 7, dur: 1.0 }, { note: 5, dur: 1.5 }
        ];

        // --- Initialization ---
        function init() {
            const keysWrapper = document.getElementById('keys-wrapper');
            
            for (let i = 0; i < totalKeys; i++) {
                const key = document.createElement('div');
                key.className = 'key';
                key.dataset.index = i;
                
                // Calculate Thai Frequency
                const freq = baseFreq * Math.pow(2, i / 7);
                key.dataset.freq = freq;

                // Label
                const noteName = thaiNotes[i % 7];
                const label = document.createElement('span');
                label.className = 'note-label';
                label.innerText = noteName;
                key.appendChild(label);

                // Visual Styling
                const heightPercent = 100 - (i * 2.5); 
                key.style.height = `${Math.max(45, heightPercent)}%`; 
                
                keysWrapper.appendChild(key);
            }

            // Init Recorder Destination
            audioDest = audioCtx.createMediaStreamDestination();

            // --- ติดตั้งระบบสัมผัสขั้นสูง (Multitouch + Drag/Slide) ---
            setupInputHandlers(keysWrapper);
        }

        function setupInputHandlers(container) {
            // Touch Events (สำหรับมือถือ - รองรับหลายนิ้ว + ลาก)
            container.addEventListener('touchstart', handleTouch, { passive: false });
            container.addEventListener('touchmove', handleTouch, { passive: false });
            container.addEventListener('touchend', handleTouchEnd);
            container.addEventListener('touchcancel', handleTouchEnd);

            // Mouse Events (สำหรับ PC - รองรับคลิก + ลาก)
            container.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                handleMouse(e);
            });
            // ใช้ window event สำหรับ mousemove/up เพื่อให้ลากหลุดขอบแล้วยังทำงานต่อได้
            window.addEventListener('mousemove', (e) => {
                if(isMouseDown) handleMouse(e);
            });
            window.addEventListener('mouseup', () => {
                isMouseDown = false;
                lastMouseKeyIndex = -1;
            });
        }

        function handleTouch(e) {
            e.preventDefault(); // ป้องกันการเลื่อนหน้าจอ

            // เมื่อเริ่มตีระนาดเอง ให้ปิดหรือหยุดการเล่นอัตโนมัติทันที
            if (demoPlaying) {
                stopDemoSong();
            }
            
            // วนลูปตรวจสอบทุกนิ้วที่แตะหรือขยับ
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                // หา element ที่ตำแหน่งนิ้วนั้นๆ
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                const key = target ? target.closest('.key') : null;

                if (key) {
                    const index = key.dataset.index;
                    // เงื่อนไขการเล่นเสียง:
                    // 1. ถ้านี่คือการแตะครั้งแรก (touchstart) -> เล่นเลย
                    // 2. หรือ ถ้านี่คือการลาก (touchmove) และนิ้วย้ายไปปุ่มใหม่ (ไม่ซ้ำปุ่มเดิม) -> เล่น
                    if (e.type === 'touchstart' || activeTouches.get(touch.identifier) !== index) {
                        playNote(parseFloat(key.dataset.freq), key);
                        activeTouches.set(touch.identifier, index); // จำว่านิ้วนี้เล่นปุ่มนี้ไปแล้ว
                    }
                }
            }
        }

        function handleTouchEnd(e) {
            // เมื่อยกนิ้วออก ให้ลบข้อมูลนิ้วนั้นออกจากระบบ
            for (let i = 0; i < e.changedTouches.length; i++) {
                activeTouches.delete(e.changedTouches[i].identifier);
            }
        }

        function handleMouse(e) {
            // เมื่อคลิกตีระนาดเอง ให้ปิดหรือหยุดการเล่นอัตโนมัติทันที
            if (demoPlaying) {
                stopDemoSong();
            }

            // ระบบเมาส์ (จุดเดียว)
            const target = document.elementFromPoint(e.clientX, e.clientY);
            const key = target ? target.closest('.key') : null;
            
            if (key) {
                const index = key.dataset.index;
                // ถ้าเมาส์ย้ายไปปุ่มใหม่ ให้เล่นเสียง
                if (lastMouseKeyIndex !== index) {
                    playNote(parseFloat(key.dataset.freq), key);
                    lastMouseKeyIndex = index;
                }
            }
        }

        // --- Audio Engine ---
        function playNote(freq, element) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const t = audioCtx.currentTime;

            // 1. Oscillator (Sine Wave เพื่อเสียงที่กลมมน คล้ายระนาด)
            const osc = audioCtx.createOscillator();
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(freq, t);

            // 2. Gain Node (Envelope การควบคุมเสียงเคาะแบบระนาด)
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.8, t + 0.01); // Attack
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4); // Decay

            // Connect
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.connect(audioDest);

            // Start/Stop
            osc.start(t);
            osc.stop(t + 0.5);

            // Visual Feedback
            element.classList.remove('active');
            void element.offsetWidth; // Trigger Reflow
            element.classList.add('active');
            
            createHitEffect(element);
            createFloatingNote(element); // สร้างตัวโน้ตให้ลอยขึ้น
            
            setTimeout(() => {
                element.classList.remove('active');
            }, 150);
        }

        function createHitEffect(element) {
            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            element.appendChild(effect); 
            effect.style.left = '50%';
            effect.style.top = '50%';
            effect.style.transform = 'translate(-50%, -50%)';
            
            setTimeout(() => effect.remove(), 200);
        }

        // --- ระบบสร้างโน้ตรอยลอยขึ้นฟ้า (Aesthetic Floating Note System) ---
        function createFloatingNote(element) {
            const index = parseInt(element.dataset.index, 10);
            const noteName = thaiNotes[index % 7];

            const floatNode = document.createElement('div');
            floatNode.className = 'floating-note';
            floatNode.innerText = noteName;

            // กำหนดโทนสีพาสเทลสลับกันไปตามลำดับตัวโน้ต เพื่อความสวยงามพรีเมียมสไตล์ไหมไทย
            const colors = [
                '#ffd700', // ซ - ทองสว่าง
                '#ff7043', // ล - แสดนุ่มนวล
                '#ec407a', // ท - ชมพูสดใส
                '#26a69a', // ด - เขียวศิลาดล
                '#29b6f6', // ร - ฟ้าน้ำไหล
                '#ab47bc', // ม - ม่วงคราม
                '#ffee58'  // ฟ - เหลืองดอกฝ้าย
            ];
            const activeColor = colors[index % colors.length];

            floatNode.style.background = `radial-gradient(circle, ${activeColor} 0%, #3e2723 100%)`;
            floatNode.style.boxShadow = `0 0 15px ${activeColor}, inset 0 0 8px rgba(255,255,255,0.9)`;
            floatNode.style.borderColor = activeColor;

            element.appendChild(floatNode);

            // ลบโดมทิ้งเมื่องานอนิเมชั่นสิ้นสุดลง
            setTimeout(() => {
                floatNode.remove();
            }, 2000);
        }

        function toggleNotes() {
            showNotes = !showNotes;
            const wrapper = document.getElementById('keys-wrapper');
            const btnText = document.getElementById('note-btn-text');
            
            if (showNotes) {
                wrapper.classList.add('show-notes');
                btnText.innerText = "👁️ ซ่อน";
            } else {
                wrapper.classList.remove('show-notes');
                btnText.innerText = "👁️ โน้ต";
            }
        }

        // --- Auto Play Demo Songs Logic with Play / Pause / Resume ---
        function playDemoSong(songId) {
            stopDemoSong(); // เคลียร์ของเก่าก่อนเสมอ
            if (!songId) return;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            demoPlaying = true;
            isDemoPaused = false;

            // แสดงปุ่มช่วยเหลือเพื่อกดหยุดชั่วคราวและหยุดเล่น
            document.getElementById('demoPlayPauseBtn').style.display = 'inline-flex';
            document.getElementById('demoStopBtn').style.display = 'inline-flex';
            document.getElementById('demoPlayPauseBtn').innerText = "⏸️ หยุดค้าง";

            showStatus("กำลังตีระนาดอัตโนมัติ...");

            let songData = [];
            let speedFactor = 1.0;

            switch(songId) {
                case 'kangkhao':
                    songData = kangkhaoData;
                    speedFactor = 1.0;
                    break;
                case 'laoduangduan':
                    songData = laoduangduanData;
                    speedFactor = 1.25;
                    break;
                case 'toeykhong':
                    songData = toeykhongData;
                    speedFactor = 1.0;
                    break;
                case 'laokrathobmai':
                    songData = laokrathobmaiData;
                    speedFactor = 1.1;
                    break;
                case 'khamensaiyok':
                    songData = khamensaiyokData;
                    speedFactor = 1.15;
                    break;
                case 'kluenkrathobfang':
                    songData = kluenkrathobfangData;
                    speedFactor = 1.0;
                    break;
                case 'laosiangtian':
                    songData = laosiangtianData;
                    speedFactor = 1.2;
                    break;
                case 'saenkhamnueng':
                    songData = saenkhamnuengData;
                    speedFactor = 1.1;
                    break;
                case 'bupphesannivas':
                    songData = bupphesannivasData;
                    speedFactor = 1.1;
                    break;
                case 'saifon':
                    songData = saifonData;
                    speedFactor = 1.15;
                    break;
            }

            // คำนวณเวลาเริ่มต้นที่แน่นอนของแต่ละตัวโน้ตเป็นหน่วยมิลลิวินาที (Absolute Miliseconds)
            let accumulatedTime = 0;
            demoNotes = songData.map((noteObj) => {
                let noteItem = {
                    note: noteObj.note,
                    delay: accumulatedTime,
                    dur: noteObj.dur
                };
                accumulatedTime += noteObj.dur * speedFactor * 1000;
                return noteItem;
            });

            demoPlaybackIndex = 0;
            demoPlayOffset = 0;
            lastUpdate = Date.now();

            // รัน Timer ทรงประสิทธิภาพระดับฮาร์ดแวร์เฟรมเรต
            demoLoop();
        }

        // หัวใจการประมวลผลเสียงตามเวลาจริง: สามารถจัดลำดับการค้างโน้ตและนับต่อจุดเดิมได้ล้านเปอร์เซ็นต์
        function demoLoop() {
            if (!demoPlaying || isDemoPaused) return;

            let now = Date.now();
            let elapsed = now - lastUpdate;
            lastUpdate = now;
            demoPlayOffset += elapsed;

            const keys = document.querySelectorAll('.key');

            while (demoPlaybackIndex < demoNotes.length) {
                let currentNote = demoNotes[demoPlaybackIndex];
                if (demoPlayOffset >= currentNote.delay) {
                    const keyElement = keys[currentNote.note];
                    if (keyElement) {
                        playNote(parseFloat(keyElement.dataset.freq), keyElement);
                    }
                    demoPlaybackIndex++;
                } else {
                    break;
                }
            }

            // ถ้าบรรเลงหมดเพลงแล้ว
            if (demoPlaybackIndex >= demoNotes.length) {
                setTimeout(() => {
                    if (demoPlaying && !isDemoPaused) {
                        stopDemoSong();
                        showStatus("จบการเล่นเพลงสาธิต");
                    }
                }, 1000);
                return;
            }

            demoTimer = requestAnimationFrame(demoLoop);
        }

        // ระบบสั่งหยุดชั่วคราวและกลับมาเล่นต่อ (Pause / Resume Toggle)
        function toggleDemoPause() {
            if (!demoPlaying) return;

            const pauseBtn = document.getElementById('demoPlayPauseBtn');
            if (isDemoPaused) {
                // เล่นต่อ (Resume)
                isDemoPaused = false;
                lastUpdate = Date.now(); // รีเซ็ตตัวตั้งระยะเวลากระโดดเพี้ยน
                pauseBtn.innerText = "⏸️ หยุดค้าง";
                showStatus("บรรเลงต่อ...");
                demoLoop();
            } else {
                // หยุดชั่วคราว (Pause)
                isDemoPaused = true;
                pauseBtn.innerText = "▶️ เล่นต่อ";
                showStatus("หยุดชั่วคราว");
            }
        }

        function stopDemoSong() {
            if (demoTimer) {
                cancelAnimationFrame(demoTimer);
                demoTimer = null;
            }
            demoPlaying = false;
            isDemoPaused = false;
            demoPlaybackIndex = 0;
            demoPlayOffset = 0;

            document.getElementById('demoSelect').value = "";
            document.getElementById('demoPlayPauseBtn').style.display = 'none';
            document.getElementById('demoStopBtn').style.display = 'none';
        }

        // --- Recording Logic ---
        function toggleRecord() {
            const btn = document.getElementById('recordBtn');
            const playBtn = document.getElementById('playBtn');
            const dlBtn = document.getElementById('dlBtn');

            if (!isRecording) {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(audioDest.stream);
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const audioURL = URL.createObjectURL(recordedBlob);
                    recordedAudio.src = audioURL;
                    playBtn.disabled = false;
                    dlBtn.disabled = false;
                    showStatus("บันทึกเสร็จสิ้น");
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
                btn.innerHTML = "⏹️ หยุด";
                playBtn.disabled = true;
                dlBtn.disabled = true;
                
                if (audioCtx.state === 'suspended') audioCtx.resume();
                showStatus("กำลังบันทึก...");

            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
                btn.innerHTML = "⏺️ อัด";
            }
        }

        function playRecording() {
            if (!recordedAudio.src) return;
            recordedAudio.play();
            showStatus("กำลังเล่นเสียงที่อัดไว้...");
        }

        function downloadRecording() {
            if (!recordedBlob) return;
            const url = URL.createObjectURL(recordedBlob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'ranat_sound_' + new Date().getTime() + '.webm';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            showStatus("ดาวน์โหลดเรียบร้อย");
        }

        function showStatus(msg) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 2000);
        }

        window.onload = init;

    </script>
