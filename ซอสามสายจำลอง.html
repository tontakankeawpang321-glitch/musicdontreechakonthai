<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ซอสามสายจำลอง Pro (Virtual Saw Sam Sai)</title>
    <style>
        /* Reset & Base Variables */
        :root {
            --bg-dark: #1a0f0a;
            --gold: #d4af37;
            --gold-light: #ffe680;
            --gold-dark: #aa8c2c;
            --wood-dark: #2e1e15;
            --wood-light: #5d4037;
            --danger: #ff4444;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            font-family: 'Sarabun', Tahoma, sans-serif;
            overflow: hidden; /* Main container hidden, manage internally */
            display: flex;
            flex-direction: column;
            color: white;
        }

        /* --- Layout: Split Screen --- */
        #top-bar {
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            border-bottom: 2px solid var(--gold);
            z-index: 100;
        }

        #play-area {
            height: 50vh; /* Takes half screen */
            position: relative;
            background: radial-gradient(circle, var(--wood-dark) 0%, #0d0603 100%);
            display: flex;
            justify-content: center;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on instrument */
        }

        #controls-scroll-area {
            height: calc(50vh - 60px); /* Remaining space */
            overflow-y: auto; /* Scrollable panels */
            overflow-x: hidden;
            padding: 15px;
            background: #111;
            padding-bottom: 50px;
        }

        /* --- UI Elements --- */
        .title {
            font-size: 16px;
            font-weight: bold;
            color: var(--gold-light);
        }

        .btn {
            background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
            border: 1px solid var(--gold-light);
            color: var(--wood-dark);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s;
            text-align: center;
            outline: none;
        }

        .btn:active { transform: scale(0.95); }
        .btn:disabled { filter: grayscale(1); opacity: 0.5; pointer-events: none; }
        
        .btn-danger { background: linear-gradient(180deg, #cc0000 0%, #880000 100%); color: white; border-color: #ff6666;}
        .btn-play { background: linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%); color: white; border-color: #81C784;}

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .panel-title {
            color: var(--gold);
            font-size: 14px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .flex-row { display: flex; gap: 8px; flex-wrap: wrap; }

        /* --- Composer & Settings --- */
        textarea.composer-input {
            width: 100%;
            height: 60px;
            background: #222;
            color: var(--gold-light);
            border: 1px solid #444;
            border-radius: 5px;
            padding: 8px;
            font-size: 14px;
            resize: none;
            margin-bottom: 8px;
            font-family: inherit;
        }

        .slider-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .slider-group input[type="range"] { flex: 1; margin-left: 10px; }

        /* --- Instrument Body --- */
        #neck {
            width: 100%;
            max-width: 300px;
            height: 100%;
            background: linear-gradient(90deg, #2a1a14 0%, var(--wood-light) 50%, #2a1a14 100%);
            border-left: 4px solid #111;
            border-right: 4px solid #111;
            display: flex;
            justify-content: space-evenly;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .string-lane {
            width: 30%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .string {
            width: 3px;
            height: 100%;
            background: linear-gradient(90deg, #ccc, #fff, #999);
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            position: absolute;
            pointer-events: none;
        }

        .string.vibrating { animation: vibrate 0.05s infinite; }

        @keyframes vibrate {
            0% { transform: translateX(0); }
            25% { transform: translateX(1.5px); }
            75% { transform: translateX(-1.5px); }
            100% { transform: translateX(0); }
        }

        /* --- Visual Feedback --- */
        .fret-marker {
            position: absolute;
            width: 100%;
            text-align: center;
            color: rgba(255, 215, 0, 0.4);
            font-size: 14px;
            pointer-events: none;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .fret-marker.show { opacity: 1; }

        .finger-glow {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.5) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 20;
        }

        /* --- Floating Notes --- */
        #floating-notes-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 30;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .floating-note {
            position: absolute;
            bottom: 20%;
            font-size: 32px;
            font-weight: bold;
            color: var(--gold-light);
            text-shadow: 0 0 10px var(--gold), 0 2px 5px #000;
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Toast Message */
        #toast {
            position: fixed;
            top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white;
            padding: 8px 16px; border-radius: 20px; font-size: 13px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            z-index: 1000; border: 1px solid var(--gold);
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div id="top-bar">
        <div class="title">ซอสามสาย Pro</div>
        <div>
            <button class="btn" id="stop-all-btn" onclick="stopAllAndReset()" style="padding: 5px 10px;">⏹️ หยุดเสียงทั้งหมด</button>
        </div>
    </div>

    <!-- Play Area (Top Half) -->
    <div id="play-area">
        <div id="floating-notes-container"></div>
        <div id="neck">
            <!-- สายทุ้ม (ซ) -->
            <div class="string-lane" data-string="0"><div class="string"></div></div>
            <!-- สายกลาง (ด) -->
            <div class="string-lane" data-string="1"><div class="string"></div></div>
            <!-- สายเอก (ซ สูง) -->
            <div class="string-lane" data-string="2"><div class="string"></div></div>
            <div id="glow-pool" class="finger-glow"></div>
        </div>
    </div>

    <!-- Toast Message -->
    <div id="toast">ข้อความ</div>

    <!-- Controls Area (Bottom Half - Scrollable) -->
    <div id="controls-scroll-area">
        
        <!-- Panel: Demo Songs -->
        <div class="panel">
            <div class="panel-title">🎶 เพลงสาธิต (Demo Songs)
                <span id="demo-status" style="color:#aaa; font-size: 12px;"></span>
            </div>
            <div class="flex-row">
                <button class="btn btn-play" onclick="playDemo('khmen')">เขมรไทรโยค</button>
                <button class="btn btn-play" onclick="playDemo('lao')">ลาวดวงเดือน</button>
                <button class="btn btn-play" onclick="playDemo('kang')">ค้างคาวกินกล้วย</button>
                <button class="btn btn-danger" onclick="stopSequence()">หยุดเล่น</button>
            </div>
        </div>

        <!-- Panel: Composer -->
        <div class="panel">
            <div class="panel-title">✍️ ระบบแต่งเพลง (Composer)
                <button class="btn" onclick="toggleNotesUI()" style="font-size:10px; padding:2px 8px;">ตาข่ายโน้ตบนสาย</button>
            </div>
            <textarea id="composer-text" class="composer-input" placeholder="พิมพ์โน้ต (ซ ล ท ด ร ม ฟ) เว้นวรรคคือพักจังหวะ ตัวอย่าง: ด ร ม ฟ ซ"></textarea>
            <div class="flex-row">
                <button class="btn btn-play" onclick="playComposed()">▶️ เล่นโน้ตที่แต่ง</button>
                <button class="btn" onclick="clearComposer()">ล้างข้อมูล</button>
                <button class="btn" onclick="document.getElementById('composer-text').value = 'ซ ด ร ม ร ด ท ล ซ ล ท ด ท ล ซ'">ตัวอย่าง</button>
            </div>
        </div>

        <!-- Panel: Advanced Audio Settings -->
        <div class="panel">
            <div class="panel-title">🎛️ ปรับแต่งเสียงขั้นสูง (Advanced Audio)</div>
            
            <div class="slider-group">
                <label>เสียงก้อง (Reverb)</label>
                <input type="range" id="reverb-slider" min="0" max="100" value="60" oninput="updateSettings()">
            </div>
            
            <div class="slider-group">
                <label>การสั่นนิ้ว (Vibrato)</label>
                <input type="range" id="vibrato-slider" min="0" max="100" value="30" oninput="updateSettings()">
            </div>
            
            <div class="slider-group">
                <label>ความใส (Tone)</label>
                <input type="range" id="tone-slider" min="500" max="4000" value="1500" oninput="updateSettings()">
            </div>
            
            <div class="slider-group">
                <label>ระดับเสียง (Volume)</label>
                <input type="range" id="vol-slider" min="0" max="100" value="70" oninput="updateSettings()">
            </div>
        </div>

        <!-- Panel: Recording -->
        <div class="panel">
            <div class="panel-title">🎙️ บันทึกเสียง</div>
            <div class="flex-row">
                <button id="rec-btn" class="btn" onclick="toggleRecord()">อัดเสียง</button>
                <button id="play-rec-btn" class="btn" onclick="playRecording()" disabled>ฟัง</button>
                <button id="dl-rec-btn" class="btn" onclick="downloadRecording()" disabled>โหลด</button>
            </div>
        </div>
    </div>

    <script>
        // --- System State ---
        let isUIReady = false;
        let showNotesOnNeck = false;
        let isPlayingSequence = false;
        let sequenceTimeouts = [];

        // --- Audio Engine Variables ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let ctx, masterGain, convolver, reverbGain, dryGain;
        let activeVoices = {}; // Tracks manual touches
        let autoVoices = [];   // Tracks sequencer notes
        let settings = { reverb: 0.6, vibrato: 0.3, tone: 1500, volume: 0.7 };

        // Thai 7-TET System Setup
        // Base notes approximate mapping
        const baseFreqs = [196.00, 261.63, 392.00]; // สายทุ้ม(G3), สายกลาง(C4), สายเอก(G4)
        const noteLabels = ["ซ", "ล", "ท", "ด", "ร", "ม", "ฟ"];
        const stringStartNoteIndex = [0, 3, 0]; 

        // Map note text to 7-TET frequency based on G3 (ซ) = 196Hz
        // Formula: Freq = Base * 2^(steps/7)
        function getFreqFromText(noteText) {
            const map = {'ซ':0, 'ล':1, 'ท':2, 'ด':3, 'ร':4, 'ม':5, 'ฟ':6, 
                         'ซซ':7, 'ลล':8, 'ทท':9, 'ดด':10}; // Support higher octave via double letters
            const step = map[noteText.replace(/\s/g, '')];
            if (step === undefined) return null;
            return 196.00 * Math.pow(2, step / 7);
        }

        // --- Init Audio Context & Reverb ---
        function initAudio() {
            if (ctx) return;
            ctx = new AudioContext();
            
            // Nodes
            masterGain = ctx.createGain();
            dryGain = ctx.createGain();
            reverbGain = ctx.createGain();
            convolver = ctx.createConvolver();

            // Generate simple Impulse Response for Reverb (saves loading external files)
            const sampleRate = ctx.sampleRate;
            const length = sampleRate * 1.5; // 1.5 seconds tail
            const impulse = ctx.createBuffer(2, length, sampleRate);
            for (let i = 0; i < 2; i++) {
                const channel = impulse.getChannelData(i);
                for (let j = 0; j < length; j++) {
                    channel[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / length, 3); // Exponential decay
                }
            }
            convolver.buffer = impulse;

            // Routing
            dryGain.connect(masterGain);
            convolver.connect(reverbGain);
            reverbGain.connect(masterGain);
            masterGain.connect(ctx.destination);

            updateSettings();
            setupRecorder();
        }

        function updateSettings() {
            if (!ctx) return;
            settings.reverb = document.getElementById('reverb-slider').value / 100;
            settings.vibrato = document.getElementById('vibrato-slider').value / 100;
            settings.tone = document.getElementById('tone-slider').value;
            settings.volume = document.getElementById('vol-slider').value / 100;

            masterGain.gain.value = settings.volume;
            reverbGain.gain.value = settings.reverb;
            dryGain.gain.value = 1 - (settings.reverb * 0.5); // Balance wet/dry
        }

        // --- Synthesizer Voice (Saw Sam Sai) ---
        function createVoice(freq, isAuto = false) {
            initAudio();

            const osc = ctx.createOscillator();
            const subOsc = ctx.createOscillator(); // Body resonance
            const lfo = ctx.createOscillator(); // Vibrato
            const lfoGain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            const voiceGain = ctx.createGain();

            // Timbre Setup
            osc.type = 'sawtooth'; // Bow friction
            subOsc.type = 'triangle'; // Wood resonance
            
            osc.frequency.value = freq;
            subOsc.frequency.value = freq / 2; // Sub-octave for warmth

            // Vibrato Setup
            lfo.type = 'sine';
            lfo.frequency.value = 5.5; // 5.5 Hz vibrato rate
            lfoGain.gain.value = freq * 0.015 * settings.vibrato; // Pitch variation
            
            if(settings.vibrato > 0) {
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfoGain.connect(subOsc.frequency);
                lfo.start();
            }

            // Filter (Wood body characteristic)
            filter.type = 'lowpass';
            filter.frequency.value = settings.tone;
            filter.Q.value = 2;

            // ADSR Envelope (Bowing characteristic)
            const now = ctx.currentTime;
            voiceGain.gain.setValueAtTime(0, now);
            voiceGain.gain.linearRampToValueAtTime(0.5, now + 0.1); // Attack
            voiceGain.gain.linearRampToValueAtTime(0.3, now + 0.3); // Decay

            // Routing
            osc.connect(filter);
            subOsc.connect(filter);
            filter.connect(voiceGain);
            
            // Connect to master mix
            voiceGain.connect(dryGain);
            voiceGain.connect(convolver);

            osc.start();
            subOsc.start();

            const voice = { osc, subOsc, lfo, voiceGain, filter };
            if(isAuto) autoVoices.push(voice);
            return voice;
        }

        function releaseVoice(voice) {
            if (!voice || !voice.voiceGain) return;
            const now = ctx.currentTime;
            const releaseTime = 0.3; // Natural string ring out
            
            voice.voiceGain.gain.cancelScheduledValues(now);
            voice.voiceGain.gain.setValueAtTime(voice.voiceGain.gain.value, now);
            voice.voiceGain.gain.exponentialRampToValueAtTime(0.001, now + releaseTime);
            
            setTimeout(() => {
                try {
                    voice.osc.stop();
                    voice.subOsc.stop();
                    if(voice.lfo) voice.lfo.stop();
                    voice.osc.disconnect();
                } catch(e){}
            }, releaseTime * 1000 + 100);
        }

        function stopAllAndReset() {
            // Panic button / Reset
            stopSequence();
            
            // Kill manual touches
            for(let id in activeVoices) {
                releaseVoice(activeVoices[id]);
                delete activeVoices[id];
            }
            
            // Kill auto voices
            autoVoices.forEach(v => releaseVoice(v));
            autoVoices = [];
            
            document.querySelectorAll('.string').forEach(s => s.classList.remove('vibrating'));
            hideTouchVisual();
            showToast("หยุดเสียงทั้งหมด");
        }

        // --- Touch Interaction on Neck ---
        function getFrequencyFromPos(stringIdx, yRatio) {
            // Map 0-1 to approx 1 Octave (7 steps)
            let steps = yRatio * 7; 
            return baseFreqs[stringIdx] * Math.pow(2, steps / 7);
        }

        function handleInteractStart(e, isTouch) {
            if(isPlayingSequence) stopSequence(); // Interrupt sequence if manual play
            e.preventDefault();
            
            const clientY = isTouch ? e.changedTouches[0].clientY : e.clientY;
            const clientX = isTouch ? e.changedTouches[0].clientX : e.clientX;
            const rect = e.currentTarget.getBoundingClientRect();
            const stringIdx = parseInt(e.currentTarget.dataset.string);
            const id = isTouch ? e.changedTouches[0].identifier : 'mouse';

            let y = (clientY - rect.top) / rect.height;
            if (y < 0.05) y = 0; // Open string buffer

            const freq = getFrequencyFromPos(stringIdx, y);
            activeVoices[id] = createVoice(freq, false);
            
            visualizeTouch(clientY, clientX);
            e.currentTarget.querySelector('.string').classList.add('vibrating');
        }

        function handleInteractMove(e, isTouch) {
            e.preventDefault();
            const clientY = isTouch ? e.changedTouches[0].clientY : e.clientY;
            const clientX = isTouch ? e.changedTouches[0].clientX : e.clientX;
            const rect = e.currentTarget.getBoundingClientRect();
            const stringIdx = parseInt(e.currentTarget.dataset.string);
            const id = isTouch ? e.changedTouches[0].identifier : 'mouse';

            if (activeVoices[id]) {
                let y = (clientY - rect.top) / rect.height;
                if (y < 0.05) y = 0;
                const freq = getFrequencyFromPos(stringIdx, y);
                
                // Glide pitch (Portamento)
                activeVoices[id].osc.frequency.setTargetAtTime(freq, ctx.currentTime, 0.05);
                activeVoices[id].subOsc.frequency.setTargetAtTime(freq/2, ctx.currentTime, 0.05);
                visualizeTouch(clientY, clientX);
            }
        }

        function handleInteractEnd(e, isTouch) {
            e.preventDefault();
            const id = isTouch ? e.changedTouches[0].identifier : 'mouse';
            if (activeVoices[id]) {
                releaseVoice(activeVoices[id]);
                delete activeVoices[id];
            }
            e.currentTarget.querySelector('.string').classList.remove('vibrating');
            hideTouchVisual();
        }

        // Attach Listeners
        document.querySelectorAll('.string-lane').forEach(lane => {
            // Touch
            lane.addEventListener('touchstart', (e) => handleInteractStart(e, true), {passive: false});
            lane.addEventListener('touchmove', (e) => handleInteractMove(e, true), {passive: false});
            lane.addEventListener('touchend', (e) => handleInteractEnd(e, true), {passive: false});
            lane.addEventListener('touchcancel', (e) => handleInteractEnd(e, true), {passive: false});
            // Mouse
            lane.addEventListener('mousedown', (e) => handleInteractStart(e, false));
        });

        // Global mouse/touch fail-safes
        window.addEventListener('mouseup', () => stopAllAndReset());
        window.addEventListener('visibilitychange', () => { if(document.hidden) stopAllAndReset(); });

        const glow = document.getElementById('glow-pool');
        function visualizeTouch(y, x) {
            glow.style.display = 'block';
            glow.style.top = y + 'px';
            glow.style.left = x + 'px';
        }
        function hideTouchVisual() { glow.style.display = 'none'; }

        // --- Sequencer & Demos ---
        const DEMOS = {
            'khmen': "ด ร ม ฟ ซ - ล ซ ฟ ม ร - ด ร ม - ร ด ท - ล ซ",
            'lao': "ซ ล ด ร ม - - ร ด ล ด - - ร ม ซ ม ร - ด ล ซ",
            'kang': "ด ด ด ด ท ล ซ ฟ ม ร ด - - - ซ ซ ซ ซ ฟ ม ร ด ท ล ซ"
        };

        function spawnFloatingNote(text) {
            const container = document.getElementById('floating-notes-container');
            const el = document.createElement('div');
            el.className = 'floating-note';
            el.innerText = text;
            
            // Random horizontal position near center
            const randomX = (Math.random() * 40) - 20; 
            el.style.left = `calc(50% + ${randomX}px)`;
            
            container.appendChild(el);
            setTimeout(() => el.remove(), 1500); // Remove after animation
        }

        async function playSequenceArray(notesArray, speedMs = 300) {
            isPlayingSequence = true;
            document.getElementById('demo-status').innerText = "(กำลังเล่น...)";

            for(let i=0; i<notesArray.length; i++) {
                if(!isPlayingSequence) break; // User cancelled
                
                const note = notesArray[i];
                if(note && note !== '-') {
                    const freq = getFreqFromText(note);
                    if(freq) {
                        const voice = createVoice(freq, true);
                        spawnFloatingNote(note);
                        
                        // Visually vibrate all strings slightly for effect
                        document.querySelectorAll('.string').forEach(s => s.classList.add('vibrating'));
                        
                        // Stop note after its duration
                        const tid = setTimeout(() => {
                            releaseVoice(voice);
                            document.querySelectorAll('.string').forEach(s => s.classList.remove('vibrating'));
                        }, speedMs * 0.8);
                        sequenceTimeouts.push(tid);
                    }
                }

                // Wait for next beat
                await new Promise(r => {
                    const id = setTimeout(r, speedMs);
                    sequenceTimeouts.push(id);
                });
            }
            
            if(isPlayingSequence) stopSequence(); // Clean up if finished naturally
        }

        function playDemo(key) {
            stopSequence(); // Stop current if playing
            initAudio();
            const arr = DEMOS[key].split(' ');
            playSequenceArray(arr, 350);
        }

        function playComposed() {
            stopSequence();
            initAudio();
            const text = document.getElementById('composer-text').value;
            if(!text.trim()) {
                showToast("โปรดพิมพ์ตัวโน้ตก่อนเล่น");
                return;
            }
            const arr = text.split(/\s+/);
            playSequenceArray(arr, 400);
        }

        function stopSequence() {
            isPlayingSequence = false;
            sequenceTimeouts.forEach(clearTimeout);
            sequenceTimeouts = [];
            autoVoices.forEach(v => releaseVoice(v));
            autoVoices = [];
            document.getElementById('demo-status').innerText = "";
            document.querySelectorAll('.string').forEach(s => s.classList.remove('vibrating'));
        }

        function clearComposer() {
            document.getElementById('composer-text').value = '';
        }

        // --- Recording Logic ---
        let recorder, destNode, recordingChunks = [], audioBlob = null, isRecording = false;

        function setupRecorder() {
            if(!destNode && ctx) {
                destNode = ctx.createMediaStreamDestination();
                masterGain.connect(destNode);
            }
        }

        function toggleRecord() {
            const btn = document.getElementById('rec-btn');
            if(!ctx) initAudio();
            
            if(!isRecording) {
                recordingChunks = [];
                try {
                    recorder = new MediaRecorder(destNode.stream);
                    recorder.ondataavailable = e => recordingChunks.push(e.data);
                    recorder.onstop = () => {
                        audioBlob = new Blob(recordingChunks, { type: 'audio/webm' });
                        document.getElementById('play-rec-btn').disabled = false;
                        document.getElementById('dl-rec-btn').disabled = false;
                        showToast("บันทึกเสียงสำเร็จ");
                    };
                    recorder.start();
                    isRecording = true;
                    btn.textContent = "⏹️ หยุดอัด";
                    btn.classList.add('btn-danger');
                    showToast("เริ่มอัดเสียง...");
                } catch(e) { showToast("เบราว์เซอร์ไม่รองรับการอัดเสียง"); }
            } else {
                recorder.stop();
                isRecording = false;
                btn.textContent = "อัดเสียง";
                btn.classList.remove('btn-danger');
            }
        }

        function playRecording() {
            if(audioBlob) {
                const url = URL.createObjectURL(audioBlob);
                new Audio(url).play();
                showToast("กำลังเล่นเสียงที่บันทึก...");
            }
        }

        function downloadRecording() {
            if(audioBlob) {
                const url = URL.createObjectURL(audioBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sawsamsai_record.webm';
                a.click();
                URL.revokeObjectURL(url);
            }
        }

        // --- Utils ---
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 2000);
        }

        function generateFretVisuals() {
            const lanes = document.querySelectorAll('.string-lane');
            lanes.forEach((lane, idx) => {
                const startIdx = stringStartNoteIndex[idx];
                for (let i = 0; i < 7; i++) {
                    const note = noteLabels[(startIdx + i) % 7];
                    const marker = document.createElement('div');
                    marker.className = 'fret-marker';
                    marker.style.top = (10 + i * 12) + '%';
                    marker.innerText = note;
                    lane.appendChild(marker);
                }
            });
        }

        function toggleNotesUI() {
            showNotesOnNeck = !showNotesOnNeck;
            document.querySelectorAll('.fret-marker').forEach(m => {
                showNotesOnNeck ? m.classList.add('show') : m.classList.remove('show');
            });
        }

        // Init
        generateFretVisuals();
        
    </script>
</body>
</html>
