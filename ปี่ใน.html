<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ปี่ใน (Full Screen)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');

        /* ป้องกันการเด้งของหน้าจอ */
        * { box-sizing: border-box; }

        body {
            font-family: 'Sarabun', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0f0f0f;
            overflow: hidden; /* ห้ามเลื่อน */
            overscroll-behavior: none;
            height: 100dvh; /* ใช้ dynamic viewport height */
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        /* พื้นหลังลายไม้ */
        .wood-texture {
            background: linear-gradient(90deg, #2d1a0e 0%, #5c3a1e 30%, #855e35 50%, #5c3a1e 70%, #2d1a0e 100%);
            box-shadow: inset 0 0 50px #000, 5px 0 20px rgba(0,0,0,0.5);
            border-radius: 20px 20px 0 0; /* โค้งแค่ด้านบน */
            position: absolute;
            top: 0; bottom: 0;
            width: 100%;
            max-width: 320px; /* ลดความกว้างสูงสุดลงเล็กน้อย */
            z-index: 0;
            border-left: 4px solid #1a1a1a;
            border-right: 4px solid #1a1a1a;
        }

        /* เส้นแบ่งกลาง */
        .wood-texture::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 2px;
            background: rgba(0,0,0,0.3);
            border-left: 1px solid rgba(255,255,255,0.05);
        }

        /* Grid Container - หัวใจสำคัญของการจัดเรียง */
        #hole-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 แถวแนวตั้ง */
            grid-template-rows: repeat(7, 1fr); /* 7 ช่องเท่าๆ กันเต็มพื้นที่ */
            gap: 2px 6vw; /* ลดช่องว่างแนวตั้งให้ชิดกันมากขึ้น */
            padding: 1vh 4vw; /* ลด padding บนล่าง */
            justify-items: center;
            align-items: center;
            height: 100%;
            width: 100%;
            max-width: 340px;
            z-index: 10;
        }

        /* รูนิ้วกด */
        .hole {
            width: 100%;
            height: 100%;
            max-width: 55px; /* ลดขนาดสูงสุดลงจาก 70px เหลือ 55px เพื่อให้พอดีจอเล็ก */
            max-height: 55px;
            aspect-ratio: 1/1; /* วงกลมเสมอ */
            border-radius: 50%;
            border: 3px solid #6b4423;
            /* เงาปกติทำให้ดูนูนขึ้นมา */
            box-shadow: 
                0 3px 5px rgba(0,0,0,0.5), 
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -2px 4px rgba(0,0,0,0.5);
            transition: all 0.08s cubic-bezier(0.4, 0, 0.2, 1); /* Animation เร็วและนุ่ม */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.7);
            font-size: 1rem; /* ลดขนาดฟอนต์ */
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* สีปุ่มปกติ (ซ้าย) */
        .hole.normal-pitch {
            background: radial-gradient(circle at 30% 30%, #555, #222);
        }

        /* สีปุ่มเสียงสูง (ขวา) */
        .hole.high-pitch {
            background: radial-gradient(circle at 30% 30%, #a07e26, #463212);
            border-color: #d4af37;
        }

        /* Active State: เอฟเฟกต์กดยุบ */
        .hole.active {
            transform: scale(0.9) translateY(1px); /* ย่อลงและขยับลงล่างนิดหน่อย */
            /* เปลี่ยนเงาให้ดูเหมือนจมลงไป */
            box-shadow: 
                0 0 0 rgba(0,0,0,0), 
                inset 0 3px 6px rgba(0,0,0,0.8),
                0 0 10px rgba(255, 215, 0, 0.4); /* แสงเรืองรอง */
            color: #fff;
            font-weight: bold;
            border-width: 2px;
        }

        .hole.normal-pitch.active {
            background: radial-gradient(circle at 50% 50%, #888, #333);
            border-color: #fff;
        }

        .hole.high-pitch.active {
            background: radial-gradient(circle at 50% 50%, #ffe066, #b8860b);
            border-color: #fff;
        }

        .vibrating { animation: pulse-glow 0.15s infinite; }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Header (Compact) - กินพื้นที่น้อยที่สุด -->
    <div class="flex-none w-full px-4 pt-2 pb-1 z-20 bg-gray-900 border-b border-gray-800">
        <div class="flex justify-between items-center mb-1">
            <h1 class="text-base font-bold text-yellow-500 leading-none">ปี่ใน (Full Screen)</h1>
            <div id="status" class="text-[9px] text-gray-400">พร้อมใช้งาน</div>
        </div>

        <!-- Controls Row -->
        <div class="flex gap-2 h-7 mb-1">
            <button id="recordBtn" class="flex-1 bg-gray-800 rounded flex justify-center items-center gap-2 active:scale-95 transition-transform">
                <i class="fas fa-microphone text-[10px] text-gray-400"></i>
                <span class="text-[9px]">อัดเสียง</span>
            </button>
            <button id="playBtn" disabled class="flex-1 bg-gray-800 rounded flex justify-center items-center gap-2 opacity-50">
                <i class="fas fa-play text-[10px] text-green-500"></i>
                <span class="text-[9px]">เล่น</span>
            </button>
            <button id="downloadBtn" disabled class="flex-1 bg-gray-800 rounded flex justify-center items-center gap-2 opacity-50">
                <i class="fas fa-download text-[10px] text-blue-500"></i>
                <span class="text-[9px]">โหลด</span>
            </button>
        </div>
        
        <!-- Labels -->
        <div class="flex justify-between px-10 text-[9px] font-bold text-gray-500 uppercase tracking-widest">
            <span>ปกติ</span>
            <span class="text-yellow-600">สูง</span>
        </div>
    </div>

    <!-- Instrument Body (Flexible Area) -->
    <!-- ใช้ flex-grow เพื่อยืดให้เต็มพื้นที่ที่เหลือ -->
    <div class="flex-grow relative w-full flex justify-center overflow-hidden bg-black/20">
        <div id="instrument-body" class="wood-texture"></div>
        
        <!-- Grid ปุ่มกด -->
        <div id="hole-container">
            <!-- Buttons Generated by JS -->
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-8 text-center backdrop-blur-sm">
        <div class="w-14 h-14 bg-yellow-600/20 rounded-full flex items-center justify-center mb-4 ring-2 ring-yellow-600">
            <i class="fas fa-music text-2xl text-yellow-500"></i>
        </div>
        <h2 class="text-lg font-bold mb-2 text-white">พร้อมเล่น</h2>
        <p class="text-gray-400 text-xs mb-6">
            ปรับขนาดปุ่มเล็กพิเศษ<br>
            กดปุ่มเพื่อเล่น (ใส่ลิงก์เสียงในโค้ด)
        </p>
        <button id="start-btn" class="bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-3 px-8 text-sm rounded-full shadow-lg active:scale-90 transition-transform">
            เริ่มเล่น
        </button>
    </div>

    <script>
        // ==========================================
        // 1. ใส่ลิงก์เสียงที่นี่ (14 ช่อง)
        // ==========================================
        const soundLinks = {
            // ซ้าย: ปกติ (บนลงล่าง)
            "L1": "pee/do.wav", "L2": "pee/re.wav", "L3": "pee/mee.wav", "L4": "pee/fa.wav", "L5": "pee/so.wav", "L6": "pee/la.wav", "L7": "pee/Tee.wav",
            // ขวา: สูง (บนลงล่าง)
            "H1": "pee/dosod.wav", "H2": "pee/reso.wav", "H3": "pee/meeso.wav", "H4": "pee/faso.wav", "H5": "pee/sonso.wav", "H6": "pee/laso.wav", "H7": "pee/Tso.wav"
        };

        const labels = ["ด", "ร", "ม", "ฟ", "ซ", "ล", "ท"];

        // ==========================================
        // 2. Audio Engine
        // ==========================================
        let audioCtx;
        let masterGain;
        let audioBuffers = {};
        let activeSources = {}; 
        
        let mediaDest, mediaRecorder;
        let audioChunks = [], recordedAudioUrl = null, isRecording = false;

        const holeContainer = document.getElementById('hole-container');
        const instrumentBody = document.getElementById('instrument-body');
        const statusEl = document.getElementById('status');

        // สร้างปุ่ม 14 ปุ่ม (7 แถว)
        for (let i = 0; i < 7; i++) {
            createHole(`L${i+1}`, labels[i], 'normal-pitch');
            createHole(`H${i+1}`, labels[i] + "ํ", 'high-pitch');
        }

        function createHole(id, text, typeClass) {
            const btn = document.createElement('div');
            btn.className = `hole ${typeClass}`;
            btn.innerHTML = `<span class="pointer-events-none">${text}</span>`;
            btn.dataset.id = id;

            // Event Listeners สำหรับการกด
            const startPlay = (e) => {
                if (e.cancelable) e.preventDefault();
                playSound(id, btn);
            };
            const stopPlay = (e) => {
                if (e.cancelable) e.preventDefault();
                stopSound(id, btn);
            };

            btn.addEventListener('touchstart', startPlay, { passive: false });
            btn.addEventListener('touchend', stopPlay);
            btn.addEventListener('mousedown', startPlay);
            btn.addEventListener('mouseup', stopPlay);
            btn.addEventListener('mouseleave', stopPlay);

            holeContainer.appendChild(btn);
        }

        // เริ่มระบบเสียง
        document.getElementById('start-btn').addEventListener('click', async () => {
            initAudio();
            document.getElementById('overlay').classList.add('hidden');
            await loadSounds();
        });

        function initAudio() {
            const AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.8;
            
            mediaDest = audioCtx.createMediaStreamDestination();
            masterGain.connect(audioCtx.destination);
            masterGain.connect(mediaDest);
        }

        async function loadSounds() {
            statusEl.innerText = "กำลังโหลด...";
            const keys = Object.keys(soundLinks);
            
            await Promise.all(keys.map(async (key) => {
                const url = soundLinks[key];
                if (url) {
                    try {
                        const res = await fetch(url);
                        const buff = await res.arrayBuffer();
                        audioBuffers[key] = await audioCtx.decodeAudioData(buff);
                    } catch (e) { console.warn("Error:", key); }
                }
            }));
            statusEl.innerText = "พร้อมใช้งาน";
        }

        function playSound(id, btn) {
            if (!audioCtx || !audioBuffers[id]) return;

            if (activeSources[id]) {
                try { activeSources[id].source.stop(); } catch(e){}
            }

            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers[id];
            source.loop = true;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05);

            source.connect(gain);
            gain.connect(masterGain);
            source.start(0);

            activeSources[id] = { source, gain };

            // Visual Feedback (เพิ่ม Class active)
            btn.classList.add('active');
            instrumentBody.classList.add('vibrating');
        }

        function stopSound(id, btn) {
            const item = activeSources[id];
            if (item) {
                const { source, gain } = item;
                const t = audioCtx.currentTime;
                
                gain.gain.cancelScheduledValues(t);
                gain.gain.setValueAtTime(gain.gain.value, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.1);
                
                setTimeout(() => { try { source.stop(); } catch(e){} }, 100);
                delete activeSources[id];
            }

            // Remove Active Class
            btn.classList.remove('active');
            if (Object.keys(activeSources).length === 0) {
                instrumentBody.classList.remove('vibrating');
            }
        }

        // ==========================================
        // 3. ระบบอัดเสียง (Recording)
        // ==========================================
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        recordBtn.addEventListener('click', () => isRecording ? stopRec() : startRec());

        function startRec() {
            if (!audioCtx) initAudio();
            audioChunks = [];
            const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
            mediaRecorder = new MediaRecorder(mediaDest.stream, { mimeType: mime });
            
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: mime });
                recordedAudioUrl = URL.createObjectURL(blob);
                playBtn.disabled = false;
                downloadBtn.disabled = false;
                playBtn.classList.remove('opacity-50');
                downloadBtn.classList.remove('opacity-50');
                statusEl.innerText = "บันทึกแล้ว";
            };

            mediaRecorder.start();
            isRecording = true;
            
            recordBtn.classList.replace('bg-gray-800', 'bg-red-900');
            recordBtn.innerHTML = `<i class="fas fa-stop text-red-500"></i><span class="text-[10px] text-red-400">หยุด</span>`;
        }

        function stopRec() {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.classList.replace('bg-red-900', 'bg-gray-800');
            recordBtn.innerHTML = `<i class="fas fa-microphone text-[10px] text-gray-400"></i><span class="text-[9px]">อัดเสียง</span>`;
        }

        playBtn.addEventListener('click', () => {
            if (recordedAudioUrl) {
                const audio = new Audio(recordedAudioUrl);
                audio.play();
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (recordedAudioUrl) {
                const a = document.createElement('a');
                a.href = recordedAudioUrl;
                a.download = `Pi_Nai_${Date.now()}.webm`;
                a.click();
            }
        });

    </script>
</body>
</html>
