<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>โหวดจำลอง (Virtual Isan Wot)</title>
    <!-- Tailwind CSS for layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght=400;600&display=swap');

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3e5ab; /* สีพื้นหลังโทนเหลืองนวล */
            background-image: radial-gradient(#e0cda7 10%, transparent 10%),
            radial-gradient(#e0cda7 10%, transparent 10%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* ป้องกันการเลื่อนหน้าจอ */
        }

        /* Wot Pipe Styling - Bamboo Effect */
        .wot-pipe {
            position: absolute;
            background: linear-gradient(90deg, #5c3a21 0%, #d4a76a 20%, #e6cc96 50%, #d4a76a 80%, #5c3a21 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.4), inset 0px 2px 4px rgba(255,255,255,0.3);
            cursor: pointer;
            transition: transform 0.1s, filter 0.1s;
            border: 2px solid #3e2723;
            overflow: hidden;
        }

        .wot-pipe::after {
            /* รูตรงกลางท่อ */
            content: '';
            width: 60%;
            height: 60%;
            background: radial-gradient(circle at 30% 30%, #2a1b12, #000);
            border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(255,255,255,0.1);
        }

        .wot-pipe.active {
            transform: scale(0.92);
            filter: brightness(1.2);
            box-shadow: 0 0 25px #ffcc00;
            border-color: #ffb300;
        }

        .pipe-label {
            position: absolute;
            bottom: -25px;
            color: #3e2723;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
            pointer-events: none;
            background: rgba(255,255,255,0.7);
            padding: 2px 6px;
            border-radius: 10px;
            transition: opacity 0.3s;
        }

        .hide-labels .pipe-label {
            opacity: 0;
        }

        /* ตัวโหวด (แกนกลาง) */
        .wot-body {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #4a3020, #2a1b12);
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 20; /* ปรับระดับ z-index ให้อยู่ด้านบนท่อ เพื่อให้ตรวจจับการรูดตรงกลางได้เสถียร */
            border: 4px solid #8d6e63;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        
        /* เพิ่มเอฟเฟกต์เรืองแสงเมื่อกำลังรูดแกนกลาง */
        .wot-body.active {
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.6);
            border-color: #ffb300;
        }
        
        .rope-binding {
            position: absolute;
            border: 2px dashed #d7ccc8;
            border-radius: 50%;
            opacity: 0.6;
            width: 90%;
            height: 90%;
            top: 5%;
            left: 5%;
            pointer-events: none;
        }

        #visualizer {
            width: 100%;
            height: 60px;
            background: rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .control-btn {
            transition: all 0.2s;
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        
        #pipes-container {
            touch-action: none;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between overflow-hidden">

    <!-- Header / Info -->
    <header class="w-full p-4 flex flex-col sm:flex-row gap-3 justify-between items-center bg-yellow-900/10 backdrop-blur-sm z-20">
        <div class="text-center sm:text-left">
            <h1 class="text-2xl font-bold text-yellow-900 drop-shadow-sm">โหวดอีสาน (Wot)</h1>
            <p class="text-xs text-yellow-800">กดท่อค้าง • รูดตรงกลางเพื่อเสียงต่อเนื่อง • เลือกเพลงเพื่อเล่นตัวโน้ตอัตโนมัติ</p>
        </div>
        <div class="flex flex-wrap justify-center items-center gap-2">
            <!-- ปุ่มโน้ตซ่อนไว้ (hidden) เพื่อไม่ให้แสดงตามคำสั่งของผู้ใช้ แต่คง Element ไว้เพื่อป้องกันสคริปต์พัง -->
            <button id="toggle-notes-btn" class="hidden bg-white/80 text-yellow-900 p-2 rounded-full shadow-md hover:bg-white transition flex items-center justify-center w-10 h-10 border border-yellow-200" title="แสดง/ซ่อนโน้ต">
                <i class="ph-fill ph-text-t"></i>
            </button>

            <!-- กล่องเลือกเพลงฝึกเล่น -->
            <div class="relative inline-block">
                <select id="song-select" class="bg-yellow-800 text-white text-xs md:text-sm pl-3 pr-8 py-2 rounded-full shadow-md hover:bg-yellow-900 transition outline-none cursor-pointer border border-yellow-600 appearance-none">
                    <option value="" disabled selected>🎵 เลือกเพลงเล่นอัตโนมัติ</option>
                    <option value="toei-khong">ลายเต้ยโขง</option>
                    <option value="pong-lang">ลายโปงลาง</option>
                    <option value="sutsanaen">ลายสุดสะแนน</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-white">
                    <i class="ph ph-caret-down text-xs"></i>
                </div>
            </div>

            <!-- ปุ่มหยุดเพลงเล่นอัตโนมัติ -->
            <button id="btn-stop-song" class="hidden bg-red-600 hover:bg-red-700 text-white p-2 rounded-full shadow-md transition flex items-center justify-center w-10 h-10 border border-red-500" title="หยุดเพลง">
                <i class="ph-fill ph-stop-circle text-lg animate-pulse"></i>
            </button>

            <button id="start-audio-btn" class="bg-yellow-700 text-white px-4 py-2 rounded-full shadow-lg text-sm hover:bg-yellow-800 transition animate-pulse">
                🔊 เปิดเสียง
            </button>
        </div>
    </header>

    <!-- Main Instrument Area -->
    <main class="flex-grow w-full relative flex items-center justify-center" id="instrument-container">
        <!-- Visualizer Canvas -->
        <div class="absolute top-4 left-0 w-full px-4 z-0 opacity-50">
            <canvas id="visualizer"></canvas>
        </div>

        <!-- The Wot Instrument -->
        <div class="relative w-[320px] h-[320px] md:w-[400px] md:h-[400px]" id="wot-wrapper">
            <!-- Center Body (แกนกลางรองรับระบบรูด) -->
            <div id="wot-center" class="wot-body w-32 h-32 md:w-40 md:h-40 cursor-pointer touch-none">
                <div class="rope-binding"></div>
                <div class="absolute inset-0 flex items-center justify-center text-yellow-100/50 text-4xl pointer-events-none">
                    <i class="ph-fill ph-music-note"></i>
                </div>
            </div>
            
            <!-- Pipes will be injected here by JS -->
            <div id="pipes-container" class="absolute inset-0 z-10"></div>
        </div>
    </main>

    <!-- Control Panel -->
    <footer class="w-full bg-white/90 backdrop-blur-md border-t border-yellow-200 p-4 pb-8 rounded-t-3xl shadow-[0_-5px_20px_rgba(0,0,0,0.1)] z-20">
        
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <!-- Record Button -->
            <div class="flex flex-col items-center gap-1">
                <button id="btn-record" class="control-btn w-14 h-14 rounded-full bg-red-100 text-red-600 border-2 border-red-200 flex items-center justify-center text-2xl shadow-sm hover:bg-red-200">
                    <i class="ph-fill ph-microphone"></i>
                </button>
                <span class="text-xs font-semibold text-gray-600">บันทึก</span>
            </div>

            <!-- Stop Button -->
            <div class="flex flex-col items-center gap-1">
                <button id="btn-stop" class="control-btn w-14 h-14 rounded-full bg-gray-100 text-gray-600 border-2 border-gray-300 flex items-center justify-center text-2xl shadow-sm hover:bg-gray-200" disabled>
                    <i class="ph-fill ph-stop"></i>
                </button>
                <span class="text-xs font-semibold text-gray-600">หยุด</span>
            </div>

            <!-- Play Button -->
            <div class="flex flex-col items-center gap-1">
                <button id="btn-play" class="control-btn w-14 h-14 rounded-full bg-green-100 text-green-600 border-2 border-green-200 flex items-center justify-center text-2xl shadow-sm hover:bg-green-200" disabled>
                    <i class="ph-fill ph-play"></i>
                </button>
                <span class="text-xs font-semibold text-gray-600">เล่น</span>
            </div>

            <!-- Download Button -->
            <div class="flex flex-col items-center gap-1">
                <button id="btn-download" class="control-btn w-14 h-14 rounded-full bg-blue-100 text-blue-600 border-2 border-blue-200 flex items-center justify-center text-2xl shadow-sm hover:bg-blue-200" disabled>
                    <i class="ph-fill ph-download-simple"></i>
                </button>
                <span class="text-xs font-semibold text-gray-600">โหลด</span>
            </div>
        </div>
        
        <div id="status-text" class="text-center text-xs text-gray-400 mt-2 h-4">พร้อมใช้งาน</div>
    </footer>

    <script>
        // --- Configuration ---
        const notes = [
            { note: "G4", label: "ซ", freq: 392.00, size: 70 }, // Sol
            { note: "A4", label: "ล", freq: 440.00, size: 68 }, // La
            { note: "C5", label: "ด", freq: 523.25, size: 64 }, // Do
            { note: "D5", label: "ร", freq: 587.33, size: 60 }, // Re
            { note: "E5", label: "ม", freq: 659.25, size: 56 }, // Mi
            { note: "G5", label: "ซํ", freq: 783.99, size: 52 }, // Sol High
            { note: "A5", label: "ลํ", freq: 880.00, size: 48 }  // La High
        ];

        // --- เพลงสำหรับเล่นอัตโนมัติ (Song Library) ---
        const songs = {
            "toei-khong": [
                { index: 2, dur: 350 }, { index: 2, dur: 350 }, { index: 3, dur: 350 }, { index: 4, dur: 350 },
                { index: 5, dur: 350 }, { index: 4, dur: 350 }, { index: 3, dur: 350 }, { index: 2, dur: 700 },
                { index: 1, dur: 350 }, { index: 2, dur: 350 }, { index: 3, dur: 350 }, { index: 2, dur: 350 },
                { index: 1, dur: 350 }, { index: 0, dur: 700 },
                { index: 1, dur: 350 }, { index: 2, dur: 350 }, { index: 1, dur: 350 }, { index: 0, dur: 350 },
                { index: 4, dur: 350 }, { index: 0, dur: 700 },
                { index: 1, dur: 350 }, { index: 2, dur: 350 }, { index: 3, dur: 350 }, { index: 4, dur: 350 },
                { index: 3, dur: 350 }, { index: 2, dur: 350 }, { index: 1, dur: 350 }, { index: 2, dur: 700 }
            ],
            "pong-lang": [
                { index: 0, dur: 280 }, { index: 1, dur: 280 }, { index: 2, dur: 280 }, { index: 3, dur: 280 }, { index: 4, dur: 560 },
                { index: 0, dur: 280 }, { index: 1, dur: 280 }, { index: 2, dur: 280 }, { index: 3, dur: 280 }, { index: 4, dur: 560 },
                { index: 5, dur: 280 }, { index: 4, dur: 280 }, { index: 3, dur: 280 }, { index: 2, dur: 280 },
                { index: 1, dur: 280 }, { index: 0, dur: 280 }, { index: 1, dur: 280 }, { index: 2, dur: 280 },
                { index: 3, dur: 280 }, { index: 4, dur: 560 },
                { index: 5, dur: 280 }, { index: 6, dur: 280 }, { index: 5, dur: 280 }, { index: 4, dur: 280 },
                { index: 3, dur: 280 }, { index: 4, dur: 280 }, { index: 5, dur: 560 }
            ],
            "sutsanaen": [
                { index: 1, dur: 450 }, { index: 2, dur: 450 }, { index: 3, dur: 450 }, { index: 4, dur: 900 },
                { index: 3, dur: 450 }, { index: 2, dur: 450 }, { index: 1, dur: 450 }, { index: 0, dur: 900 },
                { index: 1, dur: 450 }, { index: 2, dur: 450 }, { index: 1, dur: 450 }, { index: 0, dur: 450 },
                { index: 4, dur: 450 }, { index: 0, dur: 900 },
                { index: 1, dur: 450 }, { index: 2, dur: 450 }, { index: 3, dur: 450 }, { index: 4, dur: 900 }
            ]
        };

        // --- Audio Context & Variables ---
        let audioCtx;
        let masterGain;
        let compressor;
        let reverbNode;
        let reverbGain;
        let analyser;
        let mediaRecorder;
        let recordedChunks = [];
        let audioURL = null;
        let destNode; 
        
        // Track active notes for sustain capability
        // key: pipeIndex, value: { stop: function, oscs: [] }
        const activeNotes = {};

        // Track active touches for multi-touch/glissando on outer pipes
        // key: touchIdentifier, value: pipeIndex
        const activeTouches = new Map();

        // Autoplay state tracking
        let isSongPlaying = false;
        let songTimeoutId = null;
        let activeSongNotes = [];
        let songNotePointer = 0;

        const statusText = document.getElementById('status-text');

        // --- Reverb Generation ---
        function createReverbBuffer(ctx) {
            // Create a simple impulse response for reverb
            const length = ctx.sampleRate * 1.5; // 1.5 seconds tail
            const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                // Exponential decay
                const decay = Math.pow(1 - i / length, 3);
                left[i] = (Math.random() * 2 - 1) * decay;
                right[i] = (Math.random() * 2 - 1) * decay;
            }
            return impulse;
        }

        // --- STREAMING_CHUNK:Creating and setting up the audio context and routing... ---
        async function initAudio() {
            if (audioCtx) return;
            
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                // Compressor to handle multiple notes (Polyphony) without clipping
                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-20, audioCtx.currentTime);
                compressor.knee.setValueAtTime(30, audioCtx.currentTime);
                compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
                compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
                compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

                // Reverb Setup (ความกังวาล)
                reverbNode = audioCtx.createConvolver();
                reverbNode.buffer = createReverbBuffer(audioCtx);
                
                reverbGain = audioCtx.createGain();
                reverbGain.gain.value = 0.5; // ระดับความกังวาล (0.0 - 1.0)

                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.7; 
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                
                destNode = audioCtx.createMediaStreamDestination();

                // Routing: 
                // Notes -> MasterGain -> Compressor
                masterGain.connect(compressor);
                
                // Dry Path (เสียงตรง)
                compressor.connect(analyser);
                
                // Wet Path (เสียงก้อง)
                compressor.connect(reverbNode);
                reverbNode.connect(reverbGain);
                reverbGain.connect(analyser);

                // Output
                analyser.connect(destNode);
                analyser.connect(audioCtx.destination);

                document.getElementById('start-audio-btn').classList.add('hidden');
                statusText.innerText = "ระบบเสียงทำงานแล้ว";
                drawVisualizer();
            } catch (e) {
                statusText.innerText = "ไม่สามารถเชื่อมระบบเสียงได้ในเบราว์เซอร์นี้";
            }
        }

        document.getElementById('start-audio-btn').addEventListener('click', () => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        });

        // --- Toggle Notes Button Logic (Still present in background but hidden) ---
        const toggleBtn = document.getElementById('toggle-notes-btn');
        const pipesContainer = document.getElementById('pipes-container');
        let areNotesVisible = true;

        toggleBtn.addEventListener('click', () => {
            areNotesVisible = !areNotesVisible;
            if (areNotesVisible) {
                pipesContainer.classList.remove('hide-labels');
                toggleBtn.classList.add('bg-white/80');
                toggleBtn.classList.remove('bg-gray-300');
            } else {
                pipesContainer.classList.add('hide-labels');
                toggleBtn.classList.remove('bg-white/80');
                toggleBtn.classList.add('bg-gray-300');
            }
        });

        // --- STREAMING_CHUNK:Defining the audio synthesis engine and note triggers... ---
        function startNote(freq, index) {
            if (!audioCtx) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            // If already playing this note, return
            if (activeNotes[index]) return;

            const t = audioCtx.currentTime;

            // 1. Oscillators
            // Tone 1: Triangle (เนื้อเสียงหลัก) - ผ่าน Filter ให้นุ่มขึ้น
            const osc = audioCtx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t);

            const toneFilter = audioCtx.createBiquadFilter();
            toneFilter.type = 'lowpass';
            toneFilter.frequency.value = 1200; // ตัดเสียงแหลมออกให้นุ่ม

            // Tone 2: Sine (ความทุ้มลึก)
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(freq, t);

            // 2. Breath Noise (เสียงลมเป่า)
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;
            
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.value = 800; // ลดเสียงซ่าให้เหมือนลมหายใจ

            // 3. Gain Envelopes
            const envMain = audioCtx.createGain();
            const env2 = audioCtx.createGain();
            const envNoise = audioCtx.createGain();

            // Connections
            osc.connect(toneFilter);
            toneFilter.connect(envMain);
            
            osc2.connect(env2);
            
            noise.connect(noiseFilter);
            noiseFilter.connect(envNoise);

            // Connect all to Master
            envMain.connect(masterGain);
            env2.connect(masterGain);
            envNoise.connect(masterGain);

            // ADSR - Attack Phase (ปรับให้นุ่มนวลขึ้น Attack ช้าลงนิดหน่อย)
            const attack = 0.08; // นุ่มขึ้น
            const sustainVol = 0.45;

            // Main Tone Attack (Triangle)
            envMain.gain.setValueAtTime(0, t);
            envMain.gain.linearRampToValueAtTime(sustainVol, t + attack);

            // Sine Tone Attack
            env2.gain.setValueAtTime(0, t);
            env2.gain.linearRampToValueAtTime(0.5, t + attack);

            // Noise Attack (ลมเข้าก่อนเสียงเล็กน้อย)
            envNoise.gain.setValueAtTime(0, t);
            envNoise.gain.linearRampToValueAtTime(0.1, t + 0.04);
            envNoise.gain.exponentialRampToValueAtTime(0.02, t + 0.15); 

            osc.start(t);
            osc2.start(t);
            noise.start(t);

            // Store stop function
            activeNotes[index] = {
                stop: () => {
                    if (!audioCtx) return;
                    const now = audioCtx.currentTime;
                    const release = 0.25; // หางเสียงยาวขึ้นตอนปล่อยนิ้ว

                    // Cancel sustain loop
                    try {
                        envMain.gain.cancelScheduledValues(now);
                        env2.gain.cancelScheduledValues(now);
                        envNoise.gain.cancelScheduledValues(now);

                        // Release Ramp
                        envMain.gain.setValueAtTime(envMain.gain.value, now);
                        envMain.gain.exponentialRampToValueAtTime(0.001, now + release);

                        env2.gain.setValueAtTime(env2.gain.value, now);
                        env2.gain.exponentialRampToValueAtTime(0.001, now + release);

                        envNoise.gain.setValueAtTime(envNoise.gain.value, now);
                        envNoise.gain.exponentialRampToValueAtTime(0.001, now + release);

                        // Stop Oscillators after release
                        osc.stop(now + release + 0.1);
                        osc2.stop(now + release + 0.1);
                        noise.stop(now + release + 0.1);

                        // Disconnect cleanup
                        setTimeout(() => {
                            osc.disconnect();
                            osc2.disconnect();
                            noise.disconnect();
                            envMain.disconnect();
                            env2.disconnect();
                            envNoise.disconnect();
                            toneFilter.disconnect(); // Don't forget filters
                        }, (release + 0.2) * 1000);
                    } catch(e) { console.log(e); }
                }
            };
        }

        function stopNote(index) {
            if (activeNotes[index]) {
                activeNotes[index].stop();
                delete activeNotes[index];
            }
        }

        // --- STREAMING_CHUNK:Developing the song player engine and song profiles... ---
        // ระบบเล่นเพลงแบบอัตโนมัติพร้อมการไฮไลต์แผ่นเสียงโน้ตอย่างสอดคล้อง
        function playAutoSongCycle() {
            if (!isSongPlaying) return;

            // ตรวจสอบเมื่อเล่นจบลิสต์โน้ตเพลง
            if (songNotePointer >= activeSongNotes.length) {
                stopAutoSong();
                return;
            }

            const currentNote = activeSongNotes[songNotePointer];
            const pipeIdx = currentNote.index;
            const stepDuration = currentNote.dur;

            // กดและแสดงสถานะเรืองแสงอัตโนมัติที่ท่อโหวดใบนั้น ๆ
            if (pipeIdx >= 0 && pipeIdx < notes.length) {
                const pipeElement = document.querySelector(`.wot-pipe[data-index="${pipeIdx}"]`);
                if (pipeElement) pipeElement.classList.add('active');
                
                // สั่งประมวลผลเสียงโน้ตโหวด
                startNote(notes[pipeIdx].freq, pipeIdx);

                // ตั้งการปิดตัวเสียงโน้ตก่อนถึงจังหวะถัดไปเพื่อมิติเสียงแยกกันชัดเจนขึ้น
                setTimeout(() => {
                    stopNote(pipeIdx);
                    if (pipeElement) pipeElement.classList.remove('active');
                }, stepDuration - 60);
            }

            songNotePointer++;
            songTimeoutId = setTimeout(playAutoSongCycle, stepDuration);
        }

        function startAutoSong(songName) {
            // หยุดเพลงก่อนหน้าหากกำลังเล่นอยู่
            stopAutoSong();

            if (!audioCtx) initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            activeSongNotes = songs[songName];
            if (!activeSongNotes) return;

            songNotePointer = 0;
            isSongPlaying = true;

            // ปรับเปลี่ยนสถานะปุ่มและแสดงปุ่มหยุดชั่วคราว
            document.getElementById('btn-stop-song').classList.remove('hidden');
            statusText.innerText = "กำลังเล่นเพลงและแสดงตำแหน่งโน้ตอัตโนมัติ...";

            playAutoSongCycle();
        }

        function stopAutoSong() {
            isSongPlaying = false;
            if (songTimeoutId) {
                clearTimeout(songTimeoutId);
                songTimeoutId = null;
            }

            // ลบสถานะแอกทีฟและปิดเสียงโหวดทั้งหมดชั่วขณะ
            document.querySelectorAll('.wot-pipe').forEach((pipe, i) => {
                pipe.classList.remove('active');
                stopNote(i);
            });

            document.getElementById('btn-stop-song').classList.add('hidden');
            document.getElementById('song-select').value = ""; // รีเซ็ตค่าเลือกเพลง
            statusText.innerText = "พร้อมใช้งาน";
        }

        // คอยขัดจังหวะการเล่นเพลงอัตโนมัติ เมื่อผู้ใช้ต้องการควบคุมหรือเล่นด้วยมือตัวเอง
        function interruptAutoplay() {
            if (isSongPlaying) {
                stopAutoSong();
                statusText.innerText = "ขัดจังหวะเพื่อเล่นดนตรีเอง";
            }
        }

        // เชื่อมโยง Event ของปุ่มเลือกเพลง
        document.getElementById('song-select').addEventListener('change', (e) => {
            const selectedVal = e.target.value;
            if (selectedVal) {
                startAutoSong(selectedVal);
            }
        });

        document.getElementById('btn-stop-song').addEventListener('click', () => {
            stopAutoSong();
        });


        // --- STREAMING_CHUNK:Building the circular virtual wot pipes... ---
        const container = document.getElementById('pipes-container');
        const radius = 130; 
        const totalPipes = notes.length;
        const angleStep = (2 * Math.PI) / totalPipes;
        const startAngle = -Math.PI / 2 - (angleStep * (totalPipes-1)) / 2; 

        notes.forEach((n, index) => {
            const angle = startAngle + (index * angleStep);
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            const pipe = document.createElement('div');
            pipe.className = 'wot-pipe select-none';
            pipe.setAttribute('data-index', index); // Add index for hit testing
            pipe.style.width = `${n.size}px`;
            pipe.style.height = `${n.size}px`;
            pipe.style.left = `calc(50% + ${x}px - ${n.size/2}px)`;
            pipe.style.top = `calc(50% + ${y}px - ${n.size/2}px)`;

            pipe.innerHTML = `<span class="pipe-label">${n.label}</span>`;
            
            // Mouse Interaction (Desktop Fallback)
            const handleMouseStart = (e) => {
                // Ignore if touch is active (prevent double firing)
                if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
                interruptAutoplay();
                pipe.classList.add('active');
                startNote(n.freq, index);
            };
            const handleMouseEnd = (e) => {
                if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
                pipe.classList.remove('active');
                stopNote(index);
            };

            pipe.addEventListener('mousedown', handleMouseStart);
            pipe.addEventListener('mouseup', handleMouseEnd);
            pipe.addEventListener('mouseleave', handleMouseEnd);

            container.appendChild(pipe);
        });

        // --- STREAMING_CHUNK:Binding event handlers and multi-touch gestures... ---
        // This handles "Playing Together" and "Sliding" (Glissando) on the outer pipes
        function handleTouch(e) {
            e.preventDefault(); // Prevent scroll/zoom
            interruptAutoplay();
            
            const touches = e.changedTouches;
            
            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const touchId = touch.identifier;
                
                // Find element under this specific finger
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                const pipe = element?.closest('.wot-pipe');
                
                if (pipe) {
                    const newIndex = parseInt(pipe.dataset.index);
                    
                    const oldIndex = activeTouches.get(touchId);

                    if (oldIndex !== undefined && oldIndex !== newIndex) {
                        // Glissando: Finger moved from one pipe to another
                        stopNote(oldIndex);
                        const oldPipe = document.querySelector(`.wot-pipe[data-index="${oldIndex}"]`);
                        if(oldPipe) oldPipe.classList.remove('active');
                    }

                    if (oldIndex !== newIndex) {
                        // New note attack
                        activeTouches.set(touchId, newIndex);
                        pipe.classList.add('active');
                        startNote(notes[newIndex].freq, newIndex);
                    }
                } else {
                    // Finger moved off any pipe
                    const oldIndex = activeTouches.get(touchId);
                    if (oldIndex !== undefined) {
                        stopNote(oldIndex);
                        const oldPipe = document.querySelector(`.wot-pipe[data-index="${oldIndex}"]`);
                        if(oldPipe) oldPipe.classList.remove('active');
                        activeTouches.delete(touchId);
                    }
                }
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            const touches = e.changedTouches;
            for (let i = 0; i < touches.length; i++) {
                const touchId = touches[i].identifier;
                const index = activeTouches.get(touchId);
                
                if (index !== undefined) {
                    stopNote(index);
                    const pipe = document.querySelector(`.wot-pipe[data-index="${index}"]`);
                    if(pipe) pipe.classList.remove('active');
                    activeTouches.delete(touchId);
                }
            }
        }

        // Attach listeners to container to catch all moves
        container.addEventListener('touchstart', handleTouch, {passive: false});
        container.addEventListener('touchmove', handleTouch, {passive: false});
        container.addEventListener('touchend', handleTouchEnd, {passive: false});
        container.addEventListener('touchcancel', handleTouchEnd, {passive: false});


        // ระบบรูดตรงแผ่นไม้แกนกลาง (wot-center) เพื่อเปลี่ยนเสียงต่อเนื่องเป็นจังหวะตามมุมองศา
        const wotCenter = document.getElementById('wot-center');
        let centerActiveIndex = null;
        let isCenterInteracting = false;

        function handleCenterInteraction(clientX, clientY) {
            interruptAutoplay();
            const rect = wotCenter.getBoundingClientRect();
            // ค้นหาตำแหน่งจุดศูนย์กลางของแกนกลางโหวด
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // คำนวณหาเวกเตอร์มุมพิกัด (Angle) จากจุดศูนย์กลางไปยังจุดสัมผัส
            const dx = clientX - centerX;
            const dy = clientY - centerY;
            const theta = Math.atan2(dy, dx); // ค่าช่วงระหว่าง -PI ถึง PI

            // ค้นหาท่อโหวดที่มีมุมใกล้เคียงกับมุมสัมผัสในปัจจุบันมากที่สุด
            let bestIndex = 0;
            let minDiff = Infinity;

            notes.forEach((n, index) => {
                const pipeAngle = startAngle + (index * angleStep);
                // คำนวณหาผลต่างมุม (เกลี่ยช่วงคาบคาบคลื่น 2 * PI)
                let diff = Math.abs(theta - pipeAngle);
                diff = diff % (2 * Math.PI);
                if (diff > Math.PI) {
                    diff = 2 * Math.PI - diff;
                }
                if (diff < minDiff) {
                    minDiff = diff;
                    bestIndex = index;
                }
            });

            // ตรวจสอบและสลับเสียงเมื่อเปลี่ยนไปยังโซนมุมของท่อใหม่
            if (centerActiveIndex !== bestIndex) {
                // หยุดเสียงและเอฟเฟกต์ท่อก่อนหน้า
                if (centerActiveIndex !== null) {
                    stopNote(centerActiveIndex);
                    const prevPipe = document.querySelector(`.wot-pipe[data-index="${centerActiveIndex}"]`);
                    if (prevPipe) prevPipe.classList.remove('active');
                }

                // สั่งเล่นเสียงท่อใหม่พร้อมสร้างเอฟเฟกต์เรืองแสงบนหน้าจอ
                centerActiveIndex = bestIndex;
                const newPipe = document.querySelector(`.wot-pipe[data-index="${centerActiveIndex}"]`);
                if (newPipe) newPipe.classList.add('active');
                startNote(notes[centerActiveIndex].freq, centerActiveIndex);
            }
        }

        // ตัวหยุดการส่งสัญญาณการรูดแกนกลาง
        const endCenterInteraction = () => {
            if (isCenterInteracting) {
                isCenterInteracting = false;
                wotCenter.classList.remove('active');
                if (centerActiveIndex !== null) {
                    stopNote(centerActiveIndex);
                    const pipe = document.querySelector(`.wot-pipe[data-index="${centerActiveIndex}"]`);
                    if (pipe) pipe.classList.remove('active');
                    centerActiveIndex = null;
                }
            }
        };

        // สัมผัสผ่านอุปกรณ์พกพา (Touch Screens)
        wotCenter.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                isCenterInteracting = true;
                wotCenter.classList.add('active');
                handleCenterInteraction(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        wotCenter.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isCenterInteracting && e.touches.length > 0) {
                handleCenterInteraction(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        wotCenter.addEventListener('touchend', endCenterInteraction, { passive: false });
        wotCenter.addEventListener('touchcancel', endCenterInteraction, { passive: false });

        // สัมผัสผ่านเมาส์คอมพิวเตอร์ (Desktop Mouse Controls)
        wotCenter.addEventListener('mousedown', (e) => {
            if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
            isCenterInteracting = true;
            wotCenter.classList.add('active');
            handleCenterInteraction(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            if (isCenterInteracting) {
                handleCenterInteraction(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mouseup', endCenterInteraction);


        // --- Spectrum Visualizer ---
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        
        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if(!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 2;
                canvasCtx.fillStyle = `rgba(139, 69, 19, ${barHeight/100})`; // Brown tint
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        // --- STREAMING_CHUNK:Implementing recording controls and file exporters... ---
        const btnRecord = document.getElementById('btn-record');
        const btnStop = document.getElementById('btn-stop');
        const btnPlay = document.getElementById('btn-play');
        const btnDownload = document.getElementById('btn-download');
        let audioPlayer = new Audio();

        btnRecord.addEventListener('click', () => {
            if (!audioCtx) initAudio();
            
            recordedChunks = [];
            const options = { mimeType: 'audio/webm' };
            
            try {
                mediaRecorder = new MediaRecorder(destNode.stream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(destNode.stream); 
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                audioURL = URL.createObjectURL(blob);
                audioPlayer.src = audioURL;
                
                btnPlay.disabled = false;
                btnDownload.disabled = false;
                statusText.innerText = "บันทึกเสร็จสิ้น พร้อมฟัง";
            };

            mediaRecorder.start();
            btnRecord.disabled = true;
            btnStop.disabled = false;
            btnPlay.disabled = true;
            btnDownload.disabled = true;
            btnRecord.classList.add('animate-pulse');
            statusText.innerText = "กำลังบันทึก...";
        });

        btnStop.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                btnRecord.disabled = false;
                btnStop.disabled = true;
                btnRecord.classList.remove('animate-pulse');
            } else if (!audioPlayer.paused) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
                btnPlay.innerHTML = '<i class="ph-fill ph-play"></i>';
                btnStop.disabled = true;
            }
        });

        btnPlay.addEventListener('click', () => {
            if (audioURL) {
                audioPlayer.play();
                btnPlay.innerHTML = '<i class="ph-fill ph-pause"></i>';
                statusText.innerText = "กำลังเล่น...";
                btnStop.disabled = false;
                
                audioPlayer.onended = () => {
                    btnPlay.innerHTML = '<i class="ph-fill ph-play"></i>';
                    statusText.innerText = "เล่นจบแล้ว";
                    btnStop.disabled = true;
                };
            }
        });

        btnDownload.addEventListener('click', () => {
            if (audioURL) {
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = audioURL;
                a.download = `wot-recording-${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                }, 100);
            }
        });

    </script>
