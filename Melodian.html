<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เมโลเดียนจำลองระดับโปร (คีย์บอร์ดแนวตั้ง)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #0b0f19;
            touch-action: none; /* Block all native zooming & scrolling */
            overflow: hidden;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Standard custom scrollbar for advanced panel */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* Key Layout Base */
        .keyboard-container {
            flex: 1 1 auto;
            position: relative;
            background: #11141e;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse; /* F3 (low) bottom -> C6 (high) top */
            padding: 4px 0;
            border-top: 2px solid #232b3f;
        }

        /* White Keys styling with beautiful physical depth and blue activation bands */
        .key-white {
            flex-grow: 1;
            width: 100%;
            background: linear-gradient(to right, #eceef5 0%, #ffffff 8%, #ffffff 92%, #d2d6e6 100%);
            border-top: 1px solid #c2c6d6;
            border-bottom: 1px solid #eef1f6;
            position: relative;
            box-sizing: border-box;
            transition: background 0.04s, border-left-width 0.04s;
            cursor: pointer;
        }
        
        .key-white:active, .key-white.active {
            background: linear-gradient(to right, #b0c9f0 0%, #dbe8ff 100%);
            border-left: 8px solid #00d2ff;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.15);
        }

        .key-white .label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a5568;
            font-size: 11px;
            font-weight: 800;
            pointer-events: none;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Black Keys positioned elegantly with premium materials and neon indicators */
        .key-black {
            position: absolute;
            right: 0;
            width: 46%;
            background: linear-gradient(to right, #2a2e3d 0%, #151821 20%, #08090d 100%);
            border-top: 1px solid #3d4357;
            border-bottom: 1px solid #06070a;
            border-left: 3px solid #06070a;
            border-radius: 6px 0 0 6px;
            z-index: 10;
            box-shadow: -3px 3px 6px rgba(0,0,0,0.6);
            transition: width 0.04s, background 0.04s, border-left-color 0.04s;
            cursor: pointer;
        }

        .key-black:active, .key-black.active {
            background: linear-gradient(to right, #1b355e 0%, #0d1e38 100%);
            width: 44%;
            border-left: 3px solid #00f2fe;
            box-shadow: -1px 1px 3px rgba(0,0,0,0.4);
        }

        .key-black .label {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 10px;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* Record LED pulsing logic */
        .led {
            width: 8px;
            height: 8px;
            background: #4a5568;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .recording .led {
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            animation: pulse-blink 1s infinite;
        }
        @keyframes pulse-blink {
            50% { opacity: 0.4; }
        }

        /* Custom switch styling */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider-round {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2d3748;
            transition: .3s;
            border-radius: 34px;
        }
        .slider-round:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider-round {
            background-color: #3182ce;
        }
        input:checked + .slider-round:before {
            transform: translateX(22px);
        }
    </style>
</head>

    <!-- DRAWER FOR ADVANCED SOUND OPTIONS AND SYNTH PARAMETERS -->

    <!-- AUDIO ENGINE & SEQUENCER CONTROLLER -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const activeOscillators = {}; 
        
        // Master Synth Gains
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.35; // Default overall volume scaled nicely
        
        // Dest for MediaRecorder
        const dest = audioCtx.createMediaStreamDestination();
        masterGain.connect(audioCtx.destination);
        masterGain.connect(dest);

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        // Custom Toast System to comply with 'no-alert' rule
        function showToast(title, message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `p-3 rounded-xl shadow-2xl border flex flex-col gap-0.5 pointer-events-auto transition-all duration-300 transform translate-y-4 opacity-0 scale-95 ${
                type === 'error' ? 'bg-red-950 border-red-800 text-red-200' :
                type === 'success' ? 'bg-emerald-950 border-emerald-800 text-emerald-200' :
                'bg-slate-900 border-slate-700 text-slate-200'
            }`;
            toast.innerHTML = `
                <div class="text-xs font-extrabold flex items-center gap-1.5">
                    ${type === 'success' ? '✓' : type === 'error' ? '⚠' : 'ℹ'} ${title}
                </div>
                <div class="text-[10px] opacity-90">${message}</div>
            `;
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-4', 'scale-95');
            }, 10);

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2', 'scale-95');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // Notes Database configuration: F3 to C6
        const notes = [
            { note: 'F3', label: 'ฟ3', freq: 174.61, type: 'white' },
            { note: 'F#3', label: 'ฟ#3', freq: 185.00, type: 'black' },
            { note: 'G3', label: 'ซ3', freq: 196.00, type: 'white' },
            { note: 'G#3', label: 'ซ#3', freq: 207.65, type: 'black' },
            { note: 'A3', label: 'ล3', freq: 220.00, type: 'white' },
            { note: 'A#3', label: 'ล#3', freq: 233.08, type: 'black' },
            { note: 'B3', label: 'ท3', freq: 246.94, type: 'white' },
            { note: 'C4', label: 'ด4', freq: 261.63, type: 'white', isC: true }, 
            { note: 'C#4', label: 'ด#4', freq: 277.18, type: 'black' },
            { note: 'D4', label: 'ร4', freq: 293.66, type: 'white' },
            { note: 'D#4', label: 'ร#4', freq: 311.13, type: 'black' },
            { note: 'E4', label: 'ม4', freq: 329.63, type: 'white' },
            { note: 'F4', label: 'ฟ4', freq: 349.23, type: 'white' },
            { note: 'F#4', label: 'ฟ#4', freq: 369.99, type: 'black' },
            { note: 'G4', label: 'ซ4', freq: 392.00, type: 'white' },
            { note: 'G#4', label: 'ซ#4', freq: 415.30, type: 'black' },
            { note: 'A4', label: 'ล4', freq: 440.00, type: 'white' },
            { note: 'A#4', label: 'ล#4', freq: 466.16, type: 'black' },
            { note: 'B4', label: 'ท4', freq: 493.88, type: 'white' },
            { note: 'C5', label: 'ด5', freq: 523.25, type: 'white', isC: true },
            { note: 'C#5', label: 'ด#5', freq: 554.37, type: 'black' },
            { note: 'D5', label: 'ร5', freq: 587.33, type: 'white' },
            { note: 'D#5', label: 'ร#5', freq: 622.25, type: 'black' },
            { note: 'E5', label: 'ม5', freq: 659.25, type: 'white' },
            { note: 'F5', label: 'ฟ5', freq: 698.46, type: 'white' },
            { note: 'F#5', label: 'ฟ#5', freq: 739.99, type: 'black' },
            { note: 'G5', label: 'ซ5', freq: 783.99, type: 'white' },
            { note: 'G#5', label: 'ซ#5', freq: 830.61, type: 'black' },
            { note: 'A5', label: 'ล5', freq: 880.00, type: 'white' },
            { note: 'A#5', label: 'ล#5', freq: 932.33, type: 'black' },
            { note: 'B5', label: 'ท5', freq: 987.77, type: 'white' },
            { note: 'C6', label: 'ด6', freq: 1046.50, type: 'white', isC: true }
        ];

        // Advanced Panel Controls Setup
        const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const cutoffSlider = document.getElementById('cutoffSlider');
        const cutoffVal = document.getElementById('cutoffVal');
        const releaseSlider = document.getElementById('releaseSlider');
        const releaseVal = document.getElementById('releaseVal');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeVal = document.getElementById('volumeVal');
        const windSlider = document.getElementById('windSlider');
        const windVal = document.getElementById('windVal');
        const synthPreset = document.getElementById('synthPreset');
        const vibratoToggle = document.getElementById('vibratoToggle');

        // Toggle Settings Drawer
        toggleSettingsBtn.addEventListener('click', () => {
            if (settingsPanel.style.maxHeight === '0px' || !settingsPanel.style.maxHeight) {
                settingsPanel.style.maxHeight = '50vh';
                toggleSettingsBtn.classList.add('bg-slate-700', 'text-white');
            } else {
                settingsPanel.style.maxHeight = '0px';
                toggleSettingsBtn.classList.remove('bg-slate-700', 'text-white');
            }
        });

        // Sync Slider numerical feedbacks
        cutoffSlider.addEventListener('input', (e) => {
            cutoffVal.innerText = `${e.target.value} Hz`;
        });
        releaseSlider.addEventListener('input', (e) => {
            releaseVal.innerText = `${parseFloat(e.target.value).toFixed(2)}s`;
        });
        volumeSlider.addEventListener('input', (e) => {
            volumeVal.innerText = `${e.target.value}%`;
            masterGain.gain.setValueAtTime((e.target.value / 100) * 0.5, audioCtx.currentTime);
        });
        windSlider.addEventListener('input', (e) => {
            windVal.innerText = `${e.target.value}%`;
        });

        // Calculate dynamic dimensions for standard piano & melodica keys
        const keyboardEl = document.getElementById('keyboard');
        const whiteNotes = notes.filter(n => n.type === 'white');
        const totalWhiteKeys = whiteNotes.length;

        let whiteKeyIndex = 0;

        // Populate keys sequentially inside the vertical layout
        notes.forEach((n) => {
            const btn = document.createElement('div');
            btn.dataset.note = n.note;

            if (n.type === 'white') {
                btn.className = 'key-white';
                btn.innerHTML = `
                    <span class="label">
                        <span class="font-bold">${n.label}</span>
                        <span class="opacity-50 text-[9px] font-normal font-mono">${n.note}</span>
                    </span>
                `;
                if (n.isC) {
                    btn.classList.add('border-l-4', 'border-l-blue-400');
                    btn.style.background = "linear-gradient(to right, #f4f6fc 0%, #ffffff 80%, #e2e8f0 100%)";
                }
                keyboardEl.appendChild(btn);
                whiteKeyIndex++;
            } else {
                btn.className = 'key-black';
                btn.innerHTML = `
                    <span class="label">
                        <span class="font-bold">${n.label}</span>
                        <span class="opacity-40 text-[8px] font-mono">${n.note}</span>
                    </span>
                `;

                // Calculate vertical offsetting for black keys precisely so they lie center between white keys
                const pctPerKey = 100 / totalWhiteKeys;
                const bottomPos = (whiteKeyIndex * pctPerKey); 
                const heightVal = pctPerKey * 0.65; // Black key height ratio

                btn.style.height = `calc(${heightVal}% - 1px)`; 
                btn.style.bottom = `calc(${bottomPos}% - ${heightVal / 2}%)`;

                keyboardEl.appendChild(btn);
            }
        });

        // Synthesis generator mimicking acoustic reed air blowing (Melodion / Accordion)
        function playNote(note, freq) {
            if (activeOscillators[note]) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const cutoffFreq = parseInt(cutoffSlider.value);
            const windStrength = parseInt(windSlider.value) / 100;
            const selectedPreset = synthPreset.value;

            // Main synth chain
            const osc = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator(); // Extra harmonics
            const mainGainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            // Preset configuration
            if (selectedPreset === 'classic') {
                osc.type = 'sawtooth';
                osc2.type = 'triangle';
                osc2.detune.setValueAtTime(5, audioCtx.currentTime); // Subtle chorus Detune
            } else if (selectedPreset === 'bright') {
                osc.type = 'sawtooth';
                osc2.type = 'sawtooth';
                osc2.detune.setValueAtTime(12, audioCtx.currentTime); // Rich wide accordion vibe
            } else if (selectedPreset === 'soft') {
                osc.type = 'triangle';
                osc2.type = 'sine';
                osc2.detune.setValueAtTime(0, audioCtx.currentTime);
            } else { // Jazzy harmonica Reed
                osc.type = 'triangle';
                osc2.type = 'sawtooth';
                osc2.detune.setValueAtTime(-15, audioCtx.currentTime);
            }

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc2.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Optional Vibrato simulating real human breathing fluctuations
            let vibratoLfo = null;
            if (vibratoToggle.checked) {
                vibratoLfo = audioCtx.createOscillator();
                const vibratoGain = audioCtx.createGain();
                vibratoLfo.frequency.setValueAtTime(6.2, audioCtx.currentTime); // 6.2Hz breath speed
                vibratoGain.gain.setValueAtTime(freq * 0.007, audioCtx.currentTime); // Pitch fluctuation depth
                
                vibratoLfo.connect(vibratoGain);
                vibratoGain.connect(osc.frequency);
                vibratoGain.connect(osc2.frequency);
                vibratoLfo.start();
            }

            // Wind puff simulation (synthesized noise)
            let noiseSource = null;
            let noiseGain = null;
            if (windStrength > 0.01) {
                const bufferSize = audioCtx.sampleRate * 1; // 1s buffer
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                
                noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                noiseSource.loop = true;

                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(freq, audioCtx.currentTime); // Peak at fundamental frequency
                noiseFilter.Q.setValueAtTime(4.0, audioCtx.currentTime);

                noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0, audioCtx.currentTime);
                // Ramp puff volume up
                noiseGain.gain.linearRampToValueAtTime(windStrength * 0.08, audioCtx.currentTime + 0.04);

                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(masterGain);
                noiseSource.start();
            }

            // Low Pass dynamic sweep
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(cutoffFreq, audioCtx.currentTime);
            filter.Q.setValueAtTime(1.5, audioCtx.currentTime); // Slight bite at cutoff

            // Combine Oscillators
            osc.connect(filter);
            osc2.connect(filter);
            filter.connect(mainGainNode);
            mainGainNode.connect(masterGain);

            // Master blow attack curves
            mainGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            mainGainNode.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 0.04);

            osc.start();
            osc2.start();

            activeOscillators[note] = { 
                osc, 
                osc2, 
                mainGainNode, 
                vibratoLfo,
                noiseSource,
                noiseGain
            };

            // Update layout status text
            document.getElementById('lastPlayedNote').innerText = `NOTE: ${note}`;
        }

        // Clean synth trigger release sequence
        function stopNote(note) {
            const active = activeOscillators[note];
            if (!active) return;

            const releaseTime = parseFloat(releaseSlider.value);
            const now = audioCtx.currentTime;

            // Decay amplitude smoothly
            active.mainGainNode.gain.cancelScheduledValues(now);
            active.mainGainNode.gain.setValueAtTime(active.mainGainNode.gain.value, now);
            active.mainGainNode.gain.linearRampToValueAtTime(0, now + releaseTime);

            // Release breath noise
            if (active.noiseGain) {
                active.noiseGain.gain.cancelScheduledValues(now);
                active.noiseGain.gain.setValueAtTime(active.noiseGain.gain.value, now);
                active.noiseGain.gain.linearRampToValueAtTime(0, now + releaseTime);
            }

            // Kill audio components safely
            active.osc.stop(now + releaseTime);
            active.osc2.stop(now + releaseTime);
            if (active.vibratoLfo) {
                active.vibratoLfo.stop(now + releaseTime);
            }

            setTimeout(() => {
                active.osc.disconnect();
                active.osc2.disconnect();
                if (active.vibratoLfo) active.vibratoLfo.disconnect();
                if (active.noiseSource) {
                    active.noiseSource.stop();
                    active.noiseSource.disconnect();
                }
                delete activeOscillators[note];
            }, releaseTime * 1000 + 100);
        }

        // Advanced Slide tracking on Touchscreens for fluid playability (Swipes & Glides)
        const trackedTouches = {}; // Touch ID -> Note Key element

        function handleTouchChange(e) {
            e.preventDefault();
            const activeNow = {};

            // Determine what elements are being touched currently
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (!element) continue;

                const keyNode = element.closest('.key-white, .key-black');
                if (keyNode && keyNode.dataset.note) {
                    activeNow[touch.identifier] = keyNode;
                }
            }

            // Detect untouched/removed keys to silence
            for (const id in trackedTouches) {
                if (!activeNow[id]) {
                    const oldKey = trackedTouches[id];
                    const note = oldKey.dataset.note;
                    oldKey.classList.remove('active');
                    stopNote(note);
                    delete trackedTouches[id];
                }
            }

            // Activate new touch keys
            for (const id in activeNow) {
                const keyNode = activeNow[id];
                const note = keyNode.dataset.note;

                // If touch moved to a different key, handle transition
                if (!trackedTouches[id] || trackedTouches[id] !== keyNode) {
                    // Turn off the previous one for this touch ID if existed
                    if (trackedTouches[id]) {
                        trackedTouches[id].classList.remove('active');
                        stopNote(trackedTouches[id].dataset.note);
                    }

                    // Turn on new note
                    keyNode.classList.add('active');
                    const noteData = notes.find(n => n.note === note);
                    if (noteData) {
                        playNote(noteData.note, noteData.freq);
                    }
                    trackedTouches[id] = keyNode;
                }
            }
        }

        // Bind Multi-touch gestures to keyboard container
        keyboardEl.addEventListener('touchstart', handleTouchChange, { passive: false });
        keyboardEl.addEventListener('touchmove', handleTouchChange, { passive: false });
        keyboardEl.addEventListener('touchend', handleTouchChange, { passive: false });
        keyboardEl.addEventListener('touchcancel', handleTouchChange, { passive: false });

        // Backup Mouse handlers for computer browsers
        let isMouseDown = false;
        let lastHoveredKey = null;

        keyboardEl.addEventListener('mousedown', (e) => {
            const keyNode = e.target.closest('.key-white, .key-black');
            if (!keyNode) return;
            isMouseDown = true;
            lastHoveredKey = keyNode;
            keyNode.classList.add('active');
            const noteData = notes.find(n => n.note === keyNode.dataset.note);
            if (noteData) playNote(noteData.note, noteData.freq);
        });

        keyboardEl.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const keyNode = e.target.closest('.key-white, .key-black');
            if (!keyNode || keyNode === lastHoveredKey) return;

            if (lastHoveredKey) {
                lastHoveredKey.classList.remove('active');
                stopNote(lastHoveredKey.dataset.note);
            }

            lastHoveredKey = keyNode;
            keyNode.classList.add('active');
            const noteData = notes.find(n => n.note === keyNode.dataset.note);
            if (noteData) playNote(noteData.note, noteData.freq);
        });

        window.addEventListener('mouseup', () => {
            if (isMouseDown && lastHoveredKey) {
                lastHoveredKey.classList.remove('active');
                stopNote(lastHoveredKey.dataset.note);
            }
            isMouseDown = false;
            lastHoveredKey = null;
        });

        // THREE PRESET DEMO SONGS (Ends and turns off clean)
        const demoSongs = [
            // Song 1: Loy Krathong (เพลงลอยกระทง - Thai Classic)
            [
                { note: 'G4', duration: 400 }, { note: 'G4', duration: 400 }, { note: 'A4', duration: 400 }, { note: 'C5', duration: 600 },
                { note: 'C5', duration: 400 }, { note: 'A4', duration: 400 }, { note: 'G4', duration: 400 }, { note: 'A4', duration: 600 },
                { note: 'G4', duration: 400 }, { note: 'F4', duration: 400 }, { note: 'G4', duration: 400 }, { note: 'A4', duration: 600 },
                { note: 'G4', duration: 400 }, { note: 'F4', duration: 400 }, { note: 'D4', duration: 400 }, { note: 'F4', duration: 600 },
                { note: 'G4', duration: 400 }, { note: 'A4', duration: 400 }, { note: 'C5', duration: 400 }, { note: 'D5', duration: 600 },
                { note: 'D5', duration: 400 }, { note: 'C5', duration: 400 }, { note: 'D5', duration: 400 }, { note: 'C5', duration: 600 },
                { note: 'A4', duration: 400 }, { note: 'G4', duration: 400 }, { note: 'F4', duration: 400 }, { note: 'G4', duration: 800 }
            ],
            // Song 2: Happy Birthday
            [
                { note: 'C4', duration: 300 }, { note: 'C4', duration: 150 }, { note: 'D4', duration: 400 }, { note: 'C4', duration: 400 }, { note: 'F4', duration: 400 }, { note: 'E4', duration: 800 },
                { note: 'C4', duration: 300 }, { note: 'C4', duration: 150 }, { note: 'D4', duration: 400 }, { note: 'C4', duration: 400 }, { note: 'G4', duration: 400 }, { note: 'F4', duration: 800 },
                { note: 'C4', duration: 300 }, { note: 'C4', duration: 150 }, { note: 'C5', duration: 400 }, { note: 'A4', duration: 400 }, { note: 'F4', duration: 400 }, { note: 'E4', duration: 400 }, { note: 'D4', duration: 400 },
                { note: 'A#4', duration: 300 }, { note: 'A#4', duration: 150 }, { note: 'A4', duration: 400 }, { note: 'F4', duration: 400 }, { note: 'G4', duration: 400 }, { note: 'F4', duration: 800 }
            ],
            // Song 3: Jingle Bells
            [
                { note: 'E4', duration: 300 }, { note: 'E4', duration: 300 }, { note: 'E4', duration: 600 },
                { note: 'E4', duration: 300 }, { note: 'E4', duration: 300 }, { note: 'E4', duration: 600 },
                { note: 'E4', duration: 300 }, { note: 'G4', duration: 300 }, { note: 'C4', duration: 450 }, { note: 'D4', duration: 150 }, { note: 'E4', duration: 900 },
                { note: 'F4', duration: 300 }, { note: 'F4', duration: 300 }, { note: 'F4', duration: 450 }, { note: 'F4', duration: 150 },
                { note: 'F4', duration: 300 }, { note: 'E4', duration: 300 }, { note: 'E4', duration: 300 }, { note: 'E4', duration: 150 }, { note: 'E4', duration: 150 },
                { note: 'E4', duration: 300 }, { note: 'D4', duration: 300 }, { note: 'D4', duration: 300 }, { note: 'E4', duration: 300 }, { note: 'D4', duration: 600 }, { note: 'G4', duration: 600 }
            ]
        ];

        let demoTimeoutId = null;
        let demoActivePlaying = false;
        let demoCurrentNoteIndex = 0;
        let currentlyPlayingDemoSong = null;
        let activeDemoNote = null; // Store currently played note in demo mode

        const stopDemoBtn = document.getElementById('headerStopDemoBtn');

        function stopDemoTrack() {
            if (!demoActivePlaying) return;

            // Clear scheduling
            clearTimeout(demoTimeoutId);
            demoActivePlaying = false;
            demoTimeoutId = null;

            // Cleanly stop any active playing note
            if (activeDemoNote) {
                stopNote(activeDemoNote);
                const prevKey = document.querySelector(`[data-note="${activeDemoNote}"]`);
                if (prevKey) prevKey.classList.remove('active');
                activeDemoNote = null;
            }

            // Reset UI States
            document.querySelectorAll('.demo-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'border-blue-500', 'text-white');
                btn.classList.add('bg-slate-800', 'border-slate-700', 'text-slate-200');
            });
            stopDemoBtn.classList.add('hidden');
            document.getElementById('instructionText').innerText = "สัมผัสคีย์ด้านขวาหรือลากสไลด์เพื่อบรรเลงเสียง";
            
            showToast("จบการบรรเลง", "หยุดเล่นเพลงสาธิตและรีเซ็ตโน้ตเสร็จสิ้น", "info");
        }

        function playDemo(songIndex) {
            // Turn off any prior song sequences
            if (demoActivePlaying) {
                stopDemoTrack();
                // Wait briefly before starting next
                setTimeout(() => playDemo(songIndex), 300);
                return;
            }

            if (audioCtx.state === 'suspended') audioCtx.resume();

            demoActivePlaying = true;
            currentlyPlayingDemoSong = demoSongs[songIndex];
            demoCurrentNoteIndex = 0;
            
            const songName = songIndex === 0 ? "ลอยกระทง" : songIndex === 1 ? "Happy Birthday" : "Jingle Bells";
            showToast("เริ่มเล่นเพลงสาธิต", `กำลังบรรเลงเพลง: ${songName}`, "success");

            // Update UI selectors
            stopDemoBtn.classList.remove('hidden');
            const targetBtn = document.getElementById(`headerDemoBtn${songIndex + 1}`);
            if (targetBtn) {
                targetBtn.classList.remove('bg-slate-800', 'border-slate-700', 'text-slate-200');
                targetBtn.classList.add('bg-blue-600', 'border-blue-500', 'text-white');
            }

            document.getElementById('instructionText').innerText = `กำลังบรรเลงโน้ตเพลงสาธิตอัตโนมัติ...`;

            playNextDemoStep();
        }

        function playNextDemoStep() {
            if (!demoActivePlaying || !currentlyPlayingDemoSong) return;

            // If sequence is fully completed, turn off and exit
            if (demoCurrentNoteIndex >= currentlyPlayingDemoSong.length) {
                stopDemoTrack();
                return;
            }

            const step = currentlyPlayingDemoSong[demoCurrentNoteIndex];
            const noteData = notes.find(n => n.note === step.note);

            if (noteData) {
                // visual active
                const keyEl = document.querySelector(`[data-note="${step.note}"]`);
                if (keyEl) keyEl.classList.add('active');

                // audio play
                playNote(noteData.note, noteData.freq);
                activeDemoNote = step.note;

                // Stop this specific note right before launching next one
                demoTimeoutId = setTimeout(() => {
                    if (keyEl) keyEl.classList.remove('active');
                    stopNote(step.note);
                    activeDemoNote = null;

                    // Small pause between notes
                    demoCurrentNoteIndex++;
                    demoTimeoutId = setTimeout(playNextDemoStep, 80);
                }, step.duration);
            } else {
                // If it's a pause note, just wait
                demoCurrentNoteIndex++;
                demoTimeoutId = setTimeout(playNextDemoStep, step.duration);
            }
        }

        // Dynamic recording stream recorder logic
        const recordBtn = document.getElementById('recordBtn');
        const downloadLink = document.getElementById('downloadLink');

        recordBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!isRecording) {
                recordedChunks = [];
                let options = { mimeType: 'audio/webm' };
                if (!MediaRecorder.isTypeSupported('audio/webm')) {
                    options = { mimeType: 'audio/aac' };
                }

                try {
                    mediaRecorder = new MediaRecorder(dest.stream, options);
                } catch (e) {
                    showToast("เกิดข้อผิดพลาด", "เบราว์เซอร์นี้ไม่รองรับระบบการบันทึกเสียงแบบสตรีมมิ่ง", "error");
                    return;
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: options.mimeType });
                    const url = URL.createObjectURL(blob);
                    
                    downloadLink.href = url;
                    downloadLink.download = `melodion-pro-recording-${Date.now()}.webm`;
                    downloadLink.style.display = 'flex';
                    
                    showToast("บันทึกเสียงเสร็จสิ้น", "กดปุ่มเซฟไฟล์เพื่อดาวน์โหลดลงอุปกรณ์ของคุณ", "success");
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add('recording');
                document.getElementById('recordText').innerText = "หยุดบันทึก";
                downloadLink.style.display = 'none';
                
                showToast("เริ่มอัดเสียง", "เล่นเมโลเดียนเพื่อบันทึกทำนองเพลงของคุณได้เลย", "info");
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
                document.getElementById('recordText').innerText = "อัดเสียง";
            }
        });

        // Initialize engine once window loads
        window.onload = function() {
            showToast("พร้อมใช้งาน", "ยินดีต้อนรับสู่เมโลเดียนเวอร์ชันคีย์บอร์ดแนวตั้งระดับพรีเมียม!", "success");
        };
    </script>
