<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Harmonica Pro (เมาท์ออแกนมือถือ)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap');
        
        body {
            font-family: 'Sarabun', sans-serif;
            touch-action: none; /* ป้องกันการซูมและการเลื่อนหน้าจอทุกกรณี */
            background-color: #0f172a;
            color: white;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ดีไซน์ตัวเครื่องเมาท์ออแกนแนว Metallic มีมิติ */
        .harmonica-body {
            background: linear-gradient(180deg, #cbd5e1 0%, #64748b 15%, #f1f5f9 50%, #475569 85%, #94a3b8 100%);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.6);
            border: 3px solid #334155;
        }

        /* ช่องลมเป่า/ดูด */
        .hole {
            background: linear-gradient(to bottom, #1e293b, #020617);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.9);
            transition: transform 0.05s, background 0.05s;
            position: relative;
            overflow: hidden;
        }

        .hole::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(234, 179, 8, 0);
            transition: background 0.05s;
            pointer-events: none;
        }

        /* เมื่อกดใช้งานช่องนั้น ๆ */
        .hole.active {
            transform: scale(0.94);
        }
        
        .hole.active::after {
            background: rgba(234, 179, 8, 0.45); /* แสงสีทองสว่าง */
        }

        /* ช่องที่เป็นคิวถัดไปในโหมดฝึกฝน */
        .hole.guide-next::after {
            background: rgba(34, 197, 94, 0.3); /* แสงนำทางสีเขียวอ่อน */
            border: 2px solid #22c55e;
            box-sizing: border-box;
        }

        /* ปุ่มสลับโหมด */
        .mode-toggle {
            transition: all 0.2s ease;
        }
        .mode-blow {
            background-color: #10b981; /* เขียวมรกต */
            box-shadow: 0 4px 0 #047857;
        }
        .mode-draw {
            background-color: #3b82f6; /* น้ำเงินสว่าง */
            box-shadow: 0 4px 0 #1d4ed8;
        }
        .mode-active {
            transform: translateY(4px);
            box-shadow: none !important;
        }

        /* แถบคลื่นความถี่เสียง */
        canvas {
            width: 100%;
            height: 45px;
            background: #020617;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        /* ปุ่มอัดเสียงกระพริบ */
        .record-btn-active {
            background-color: #ef4444;
            animation: pulse-red 1.5s infinite;
        }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* ซ่อน Scrollbar ของรายชื่อเพลง */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-3 pb-safe-bottom">

                <button class="hole rounded flex flex-col items-center justify-between py-2 text-white" data-hole="4">

                <button class="hole rounded flex flex-col items-center justify-between py-2 text-white" data-hole="9">

    <!-- ส่วนควบคุมการใช้งาน (Controls Block) - ชิดขอบล่างของหน้าจอ -->
    <div class="w-full max-w-md mx-auto flex flex-col gap-2 flex-shrink-0">
        
        <!-- สวิตช์สลับ เป่า (Blow) / ดูด (Draw) ขนาดพอดีนิ้วโป้ง -->

        <!-- ระบบอัดเสียง (Recording & Playback) สไตล์โมเดิร์น -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 flex items-center justify-between gap-2 h-14">
            <!-- ปุ่มเริ่มบันทึกเสียง -->
            <button id="recordBtn" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg w-10 h-10 flex items-center justify-center transition flex-shrink-0">

            <!-- การอัปเดตสถานะและเวลาการบันทึกเสียง -->

    <!-- Custom Modal สวยงามแทนการใช้ alert() ของระบบเว็บบนเบราว์เซอร์ปกติ -->
    <div id="customModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-xs w-full text-center shadow-2xl">
            <div class="text-yellow-400 text-4xl mb-3">⚠️</div>
            <h3 class="text-base font-bold text-white mb-2" id="modalTitle">แจ้งเตือน</h3>
            <p class="text-xs text-slate-300 mb-5 leading-relaxed" id="modalMessage">ข้อความแจ้งรายละเอียดที่นี่...</p>
            <button id="closeModalBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-6 rounded-lg text-xs w-full transition">
                เข้าใจแล้ว
            </button>
        </div>
    </div>

    <!-- สคริปต์การทำเสียงและการโต้ตอบ (Audio Synthesis & Interaction) -->
    <script>
        // --- Web Audio API Context ---
        const context = new (window.AudioContext || window.webkitAudioContext)();
        let masterGain = context.createGain();
        masterGain.gain.value = 0.6; // ควบคุมระดับความดังเริ่มต้น
        masterGain.connect(context.destination);

        // ตั้งค่า Stream บันทึกเสียงภายในเครื่อง
        const destStream = context.createMediaStreamDestination();
        masterGain.connect(destStream);
        
        let mediaRecorder;
        let chunks = [];
        let isRecording = false;
        let recordingStartTime = 0;
        let recordingTimerInterval;

        // รายการความถี่เสียงแบบ Diatonic Harmonica ในคีย์ C (ช่อง 1 ถึง 10)
        const frequencies = {
            // Blow (เป่าลม): C4, E4, G4, C5, E5, G5, C6, E6, G6, C7
            blow: [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00],
            // Draw (ดูดลม): D4, G4, B4, D5, F5, A5, D6, F6, A6, D7
            draw: [293.66, 392.00, 493.88, 587.33, 698.46, 880.00, 1174.66, 1396.91, 1760.00, 2349.32]
        };

        const noteNames = {
            blow: ['C4', 'E4', 'G4', 'C5', 'E5', 'G5', 'C6', 'E6', 'G6', 'C7'],
            draw: ['D4', 'G4', 'B4', 'D5', 'F5', 'A5', 'D6', 'F6', 'A6', 'D7']
        };

        // สถานะปัจจุบันการทำงาน
        let currentMode = 'blow'; // 'blow' หรือ 'draw'
        let activeOscillators = {}; // ออสซิลเลเตอร์ที่กำลังทำงานอยู่ { holeIndex: {osc1, osc2, gainNode} }
        let isDemoPlaying = false;
        let demoSequenceTimeout = null;

        // ข้อมูลเพลงเดโม 4 เพลง (ช่องเป่า 0-9, โหมด blow/draw, ความเร็วระยะเวลา ms)
        const demoSongs = [
            {
                name: "⭐ Twinkle Twinkle Little Star",
                notes: [
                    { hole: 3, mode: 'blow', duration: 400 }, // C5
                    { hole: 3, mode: 'blow', duration: 400 }, // C5
                    { hole: 5, mode: 'blow', duration: 400 }, // G5
                    { hole: 5, mode: 'blow', duration: 400 }, // G5
                    { hole: 5, mode: 'draw', duration: 400 }, // A5
                    { hole: 5, mode: 'draw', duration: 400 }, // A5
                    { hole: 5, mode: 'blow', duration: 600 }, // G5
                    { hole: 4, mode: 'draw', duration: 400 }, // F5
                    { hole: 4, mode: 'draw', duration: 400 }, // F5
                    { hole: 4, mode: 'blow', duration: 400 }, // E5
                    { hole: 4, mode: 'blow', duration: 400 }, // E5
                    { hole: 3, mode: 'draw', duration: 400 }, // D5
                    { hole: 3, mode: 'draw', duration: 400 }, // D5
                    { hole: 3, mode: 'blow', duration: 600 }  // C5
                ]
            },
            {
                name: "🎼 Ode to Joy (Beethoven)",
                notes: [
                    { hole: 4, mode: 'blow', duration: 400 }, // E5
                    { hole: 4, mode: 'blow', duration: 400 }, // E5
                    { hole: 4, mode: 'draw', duration: 400 }, // F5
                    { hole: 5, mode: 'blow', duration: 400 }, // G5
                    { hole: 5, mode: 'blow', duration: 400 }, // G5
                    { hole: 4, mode: 'draw', duration: 400 }, // F5
                    { hole: 4, mode: 'blow', duration: 400 }, // E5
                    { hole: 3, mode: 'draw', duration: 400 }, // D5
                    { hole: 3, mode: 'blow', duration: 400 }, // C5
                    { hole: 3, mode: 'blow', duration: 400 }, // C5
                    { hole: 3, mode: 'draw', duration: 400 }, // D5
                    { hole: 4, mode: 'blow', duration: 400 }, // E5
                    { hole: 4, mode: 'blow', duration: 500 }, // E5
                    { hole: 3, mode: 'draw', duration: 250 }, // D5
                    { hole: 3, mode: 'draw', duration: 600 }  // D5
                ]
            },
            {
                name: "🔔 Jingle Bells",
                notes: [
                    { hole: 4, mode: 'blow', duration: 300 }, // E5
                    { hole: 4, mode: 'blow', duration: 300 }, // E5
                    { hole: 4, mode: 'blow', duration: 500 }, // E5
                    { hole: 4, mode: 'blow', duration: 300 }, // E5
                    { hole: 4, mode: 'blow', duration: 300 }, // E5
                    { hole: 4, mode: 'blow', duration: 500 }, // E5
                    { hole: 4, mode: 'blow', duration: 300 }, // E5
                    { hole: 5, mode: 'blow', duration: 300 }, // G5
                    { hole: 3, mode: 'blow', duration: 300 }, // C5
                    { hole: 3, mode: 'draw', duration: 300 }, // D5
                    { hole: 4, mode: 'blow', duration: 600 }  // E5
                ]
            },
            {
                name: "🚢 Titanic (My Heart Will Go On)",
                notes: [
                    { hole: 3, mode: 'blow', duration: 300 }, // C5
                    { hole: 3, mode: 'blow', duration: 300 }, // C5
                    { hole: 3, mode: 'blow', duration: 300 }, // C5
                    { hole: 3, mode: 'blow', duration: 200 }, // C5
                    { hole: 3, mode: 'draw', duration: 350 }, // B4
                    { hole: 3, mode: 'blow', duration: 350 }, // C5
                    { hole: 3, mode: 'blow', duration: 200 }, // C5
                    { hole: 3, mode: 'draw', duration: 350 }, // B4
                    { hole: 3, mode: 'blow', duration: 350 }, // C5
                    { hole: 3, mode: 'draw', duration: 400 }, // D5
                    { hole: 4, mode: 'blow', duration: 400 }, // E5
                    { hole: 4, mode: 'draw', duration: 600 }, // F5
                    { hole: 4, mode: 'blow', duration: 400 }, // E5
                    { hole: 3, mode: 'draw', duration: 600 }  // D5
                ]
            }
        ];

        // --- UI Elements ---
        const holeButtons = document.querySelectorAll('.hole');
        const modeBtn = document.getElementById('modeBtn');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const audioPlayback = document.getElementById('audioPlayback');
        const recordingStatus = document.getElementById('recordingStatus');
        const timerDisplay = document.getElementById('timer');
        const playbackContainer = document.getElementById('playbackContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const discardBtn = document.getElementById('discardBtn');
        
        // Modal elements
        const customModal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Demo Elements
        const songButtons = document.querySelectorAll('.song-btn');
        const demoControls = document.getElementById('demoControls');
        const activeSongName = document.getElementById('activeSongName');
        const activeNoteGuide = document.getElementById('activeNoteGuide');
        const stopDemoBtn = document.getElementById('stopDemoBtn');
        const demoPlayingStatus = document.getElementById('demoPlayingStatus');

        // ฟังก์ชันแสดงกล่องแจ้งเตือนสวยงามแทน alert
        function showAlert(title, message) {
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            customModal.classList.remove('hidden');
        }

        closeModalBtn.addEventListener('click', () => {
            customModal.classList.add('hidden');
        });

        // --- ระบบสร้างเสียงและเอฟเฟกต์เครื่องดนตรีคีย์บอร์ดลม ---
        function playTone(holeIndex) {
            if (context.state === 'suspended') context.resume();
            if (activeOscillators[holeIndex]) return; // ถ้าเล่นอยู่แล้วให้ข้าม

            const freq = frequencies[currentMode][holeIndex];
            const now = context.currentTime;

            // Oscillator 1: Sawtooth เพื่อเพิ่มความสว่างใสและแอมพลิจูดความร้อนของลิ้นเครื่องเป่าทองเหลือง (Reed)
            const osc1 = context.createOscillator();
            osc1.type = 'sawtooth';
            osc1.frequency.value = freq;

            // Oscillator 2: Square มอบความแน่น นุ่มนวล คล้ายลักษณะโพรงอากาศ (Chamber) ภายในเมาท์ออแกน
            const osc2 = context.createOscillator();
            osc2.type = 'square';
            osc2.frequency.value = freq; 

            // ตัวกรองความถี่ต่ำเพื่อขจัดคลื่นเสียงที่แหลมกระด้างเกินไป
            const filter = context.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2200, now);
            filter.Q.setValueAtTime(1.2, now);

            // ซองสัญญาณ Gain สำหรับความดัง (ADSR Style)
            const noteGain = context.createGain();
            noteGain.gain.setValueAtTime(0, now);
            noteGain.gain.linearRampToValueAtTime(0.45, now + 0.04); // เวลาในการไต่ความดัง (Attack)

            // เชื่อมวงจรสัญญาณ
            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(noteGain);
            noteGain.connect(masterGain);

            osc1.start(now);
            osc2.start(now);

            // บันทึกตำแหน่งออบเจ็กต์เสียง
            activeOscillators[holeIndex] = { osc1, osc2, noteGain };
            
            // แสดงผลการสัมผัสปุ่มช่อง
            holeButtons[holeIndex].classList.add('active');
        }

        function stopTone(holeIndex) {
            if (!activeOscillators[holeIndex]) return;

            const { osc1, osc2, noteGain } = activeOscillators[holeIndex];
            const now = context.currentTime;

            // ค่อย ๆ ปล่อยระดับเสียงเพื่อป้องกันเสียงขาดตอนฉับพลัน (Release)
            noteGain.gain.cancelScheduledValues(now);
            noteGain.gain.setValueAtTime(noteGain.gain.value, now);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

            osc1.stop(now + 0.12);
            osc2.stop(now + 0.12);

            // คืนค่าหน่วยความจำและเชื่อมต่อวงจรหลังจากปิดเสียง
            setTimeout(() => {
                try {
                    osc1.disconnect();
                    osc2.disconnect();
                    noteGain.disconnect();
                } catch(e){}
            }, 150);

            delete activeOscillators[holeIndex];
            
            // ยกเลิกแสดงผลสัมผัสปุ่มช่อง
            holeButtons[holeIndex].classList.remove('active');
        }

        // --- อัปเดตป้ายชื่อตัวโน้ตบนปุ่มกด ---
        function updateLabels() {
            holeButtons.forEach((btn, index) => {
                const note = noteNames[currentMode][index];
                btn.querySelector('.note-name').innerText = note;
                
                // ไฮไลต์สีตามสถานะ เป่า (สีเหลืองทอง) และ ดูด (สีฟ้าน้ำทะเล)
                if(currentMode === 'blow') {
                    btn.querySelector('.note-name').classList.remove('text-blue-300');
                    btn.querySelector('.note-name').classList.add('text-yellow-400');
                } else {
                    btn.querySelector('.note-name').classList.remove('text-yellow-400');
                    btn.querySelector('.note-name').classList.add('text-blue-300');
                }
            });
        }

        // --- ฟังก์ชันการสลับโหมดลมเป่า / ลมดูด ---
        function toggleMode() {
            // ดับโน้ตเสียงที่ยังเป่าค้างอยู่เมื่อมีการเปลี่ยนสลับช่องเป่า/ดูดกะทันหัน
            Object.keys(activeOscillators).forEach(key => stopTone(parseInt(key)));

            if (currentMode === 'blow') {
                currentMode = 'draw';
                modeBtn.innerText = "สถานะปัจจุบัน: ดูด (Draw)";
                modeBtn.classList.remove('mode-blow');
                modeBtn.classList.add('mode-draw');
            } else {
                currentMode = 'blow';
                modeBtn.innerText = "สถานะปัจจุบัน: เป่า (Blow)";
                modeBtn.classList.remove('mode-draw');
                modeBtn.classList.add('mode-blow');
            }
            updateLabels();
        }

        // กำหนดปุ่มกดสวิตช์ เป่า/ดูด สำหรับจอสัมผัสและเมาส์
        modeBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            toggleMode();
        });

        // --- ทริกเกอร์ระบบเสียงมัลติทัชบนโทรศัพท์มือถือ (Pointer Events) ---
        // ใช้ PointerDown และ PointerUp, PointerLeave เพื่อลดความล่าช้าของสัมผัสบนสมาร์ทโฟน
        holeButtons.forEach((btn, index) => {
            const handleStart = (e) => {
                e.preventDefault();
                // ถ้าแอปเปิดเพลงเดโมอยู่ แล้วผู้ใช้เล่นตาม ให้หยุดเพลงเดโมชั่วคราวเพื่อรับสัมผัส
                if (isDemoPlaying) {
                    stopDemoPlayback();
                }
                playTone(index);
            };

            const handleEnd = (e) => {
                e.preventDefault();
                stopTone(index);
            };

            // รองรับทั้งระบบทัชสกรีนและเมาส์ในอีเวนต์เดียว
            btn.addEventListener('pointerdown', handleStart);
            btn.addEventListener('pointerup', handleEnd);
            btn.addEventListener('pointerleave', handleEnd);
            btn.addEventListener('pointercancel', handleEnd);
        });

        // --- อัปเดตและควบคุมการเล่นเพลงสาธิต (Demo Songs Player) ---
        function playDemoSong(songIndex) {
            stopDemoPlayback(); // หยุดเพลงเดิมก่อนหน้าทุกครั้ง
            
            const song = demoSongs[songIndex];
            isDemoPlaying = true;
            activeSongName.innerText = `เพลง: ${song.name}`;
            demoControls.classList.remove('hidden');
            demoPlayingStatus.classList.remove('hidden');
            
            let currentNoteIndex = 0;
            
            function playNext() {
                if (!isDemoPlaying) return;
                
                if (currentNoteIndex >= song.notes.length) {
                    // เล่นเพลงจนจบการวนลูปใหม่ หรือหยุดเล่น
                    stopDemoPlayback();
                    showAlert("✨ เล่นสำเร็จ!", `เล่นเพลงสาธิต "${song.name}" จบแล้วครับ`);
                    return;
                }
                
                const noteInfo = song.notes[currentNoteIndex];
                
                // แจ้งเตือนโน้ตถัดไปที่ตัวควบคุม
                if (currentNoteIndex + 1 < song.notes.length) {
                    const nextNote = song.notes[currentNoteIndex + 1];
                    const direction = nextNote.mode === 'blow' ? 'เป่า' : 'ดูด';
                    activeNoteGuide.innerText = `โน้ตถัดไป: ช่อง ${nextNote.hole + 1} (${direction})`;
                } else {
                    activeNoteGuide.innerText = `จบเพลง`;
                }

                // 1. สลับโหมดเสียงให้ตรงกับเดโมโน้ตปัจจุบันโดยอัตโนมัติ
                if (currentMode !== noteInfo.mode) {
                    toggleMode();
                }
                
                // 2. สั่งเล่นตัวโน้ตนั้นๆ
                playTone(noteInfo.hole);
                
                // 3. ปรับสีความสว่างตัวนำทาง (Guide Next)
                holeButtons[noteInfo.hole].classList.add('guide-next');

                // รอระยะเวลาและปิดโน้ต เพื่อเล่นโน้ตถัดไป
                demoSequenceTimeout = setTimeout(() => {
                    stopTone(noteInfo.hole);
                    holeButtons[noteInfo.hole].classList.remove('guide-next');
                    currentNoteIndex++;
                    
                    // ปล่อยช่องว่างสั้น ๆ ระหว่างช่วงโน้ต
                    demoSequenceTimeout = setTimeout(playNext, 80);
                }, noteInfo.duration);
            }
            
            playNext();
        }

        function stopDemoPlayback() {
            isDemoPlaying = false;
            if (demoSequenceTimeout) {
                clearTimeout(demoSequenceTimeout);
            }
            
            // ปิดโน้ตทุกตัวและตัวนำทางบนช่องที่อาจจะเปิดค้างอยู่
            Object.keys(activeOscillators).forEach(key => stopTone(parseInt(key)));
            holeButtons.forEach(btn => btn.classList.remove('guide-next'));
            
            demoControls.classList.add('hidden');
            demoPlayingStatus.classList.add('hidden');
        }

        // จัดการคลิกเลือกเพลงจากรายการเลื่อน
        songButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const songIndex = parseInt(btn.getAttribute('data-song'));
                playDemoSong(songIndex);
            });
        });

        stopDemoBtn.addEventListener('click', stopDemoPlayback);


        // --- ระบบควบคุมสตรีมอัดเสียงภายในแอปพลิเคชัน (Internal Recorder) ---
        recordBtn.addEventListener('click', () => {
            if (context.state === 'suspended') context.resume();
            
            chunks = [];
            
            // ตรวจสอบโมดูลจัดเก็บไฟล์เสียงที่เข้ากันได้ดีที่สุดบนแพลตฟอร์มอุปกรณ์นั้น ๆ
            const types = [
                "audio/webm;codecs=opus",
                "audio/webm", 
                "audio/ogg;codecs=opus",
                "audio/mp4",
                "audio/aac"
            ];
            
            let options = undefined;
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    options = { mimeType: type };
                    break;
                }
            }

            try {
                if (options) {
                    mediaRecorder = new MediaRecorder(destStream.stream, options);
                } else {
                    mediaRecorder = new MediaRecorder(destStream.stream);
                }
            } catch (err) {
                showAlert("เกิดข้อผิดพลาด", "ระบบไม่รองรับโมดูลการบันทึกเสียง: " + err.message);
                return;
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    chunks.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { 'type' : mediaRecorder.mimeType || 'audio/webm' });
                const audioURL = window.URL.createObjectURL(blob);
                
                audioPlayback.src = audioURL;
                downloadBtn.href = audioURL;
                
                let ext = 'webm';
                if (mediaRecorder.mimeType.includes('mp4')) ext = 'mp4';
                else if (mediaRecorder.mimeType.includes('ogg')) ext = 'ogg';
                else if (mediaRecorder.mimeType.includes('wav')) ext = 'wav';
                else if (mediaRecorder.mimeType.includes('aac')) ext = 'aac';
                
                downloadBtn.download = `harmonica_solo_${new Date().getTime()}.${ext}`;

                // การปรับเปลี่ยน Interface หลังเสร็จสิ้นการอัดเสียง
                recordBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                recordingStatus.classList.add('hidden');
                playbackContainer.classList.remove('hidden');
                recordBtn.classList.remove('record-btn-active');
                
                clearInterval(recordingTimerInterval);
            };

            mediaRecorder.start();
            isRecording = true;
            recordingStartTime = Date.now();
            
            // แสดงสถานะระหว่างอัด
            recordBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            playbackContainer.classList.add('hidden');
            recordingStatus.classList.remove('hidden');
            recordBtn.classList.add('record-btn-active');

            // อัปเดตตัวเลขบอกเวลา (Timer)
            recordingTimerInterval = setInterval(() => {
                const diff = Math.floor((Date.now() - recordingStartTime) / 1000);
                const m = Math.floor(diff / 60).toString().padStart(2, '0');
                const s = (diff % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `${m}:${s}`;
            }, 1000);
        });

        stopBtn.addEventListener('click', () => {
            if(mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                isRecording = false;
            }
        });
        
        // ล้างไฟล์บันทึกเพื่อเริ่มเล่นหรืออัดเซสชันใหม่
        discardBtn.addEventListener('click', () => {
            playbackContainer.classList.add('hidden');
            recordBtn.classList.remove('hidden');
            audioPlayback.src = '';
            chunks = [];
        });


        // --- แถบแสดงคลื่นเสียง (FFT Analyzer Visualizer) ---
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const analyser = context.createAnalyser();
        masterGain.connect(analyser);
        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        // กำหนดสเกลความกว้างของแถบให้รับตามขนาดความละเอียดความกว้างหน้าจอจริง
        function resizeCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = 45;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);

            canvasCtx.fillStyle = '#020617';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2.2;
            let barHeight;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 4.8; // ปรับลดขนาดความสูงที่ล้นขอบ

                // การไล่โทนสีคลื่นความถี่จาก เสียงทุ้ม-ลึก (น้ำเงิน/เขียว) ไปยัง เสียงแหลม-สูง (เหลือง/ส้ม)
                const r = barHeight + 50 * (i/bufferLength);
                const g = 180 * (i/bufferLength);
                const b = 255 - (150 * (i/bufferLength));

                canvasCtx.fillStyle = `rgb(${r},${g},${b})`;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                x += barWidth + 1;
            }
        }
        drawVisualizer();

    </script>
</body>
