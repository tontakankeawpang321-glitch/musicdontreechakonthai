<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ปี่กลาง (Full Screen)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');

        /* ป้องกันการเด้งของหน้าจอ */
        * { box-sizing: border-box; }

        body {
            font-family: 'Sarabun', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background-color: #020202; /* พื้นหลังดำสนิท */
            overflow: hidden; 
            overscroll-behavior: none;
            height: 100dvh; 
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        /* พื้นหลังลายไม้ - ปรับให้ดำเข้ม ขลังขึ้น (ไม้ชิงชันดำ) */
        .wood-texture {
            background: linear-gradient(90deg, 
                #000000 0%, 
                #1a0f0a 20%, 
                #2d1a12 45%, 
                #3e2316 50%, 
                #2d1a12 55%, 
                #1a0f0a 80%, 
                #000000 100%);
            box-shadow: inset 0 0 50px #000, 0 0 30px rgba(0,0,0,0.9);
            border-radius: 20px 20px 0 0; 
            position: absolute;
            top: 0; bottom: 0;
            width: 100%;
            max-width: 340px;
            z-index: 0;
            border-left: 1px solid #111;
            border-right: 1px solid #111;
        }

        /* ลายเสี้ยนไม้ละเอียด */
        .wood-texture::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.07'/%3E%3C/svg%3E");
            opacity: 0.5;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* Grid Container - ปรับระยะห่างให้กระชับขึ้นสำหรับมือถือแนวตั้ง */
        #hole-container {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: repeat(7, 1fr); 
            gap: 1vh 12vw; /* ลดระยะห่างแนวตั้ง (1vh) เพิ่มแนวนอน (12vw) */
            padding: 1vh 4vw; /* ลด padding */
            justify-items: center;
            align-items: center;
            height: 100%;
            width: 100%;
            max-width: 360px;
            z-index: 10;
        }

        /* รูนิ้วกด - ปรับขนาดให้เล็กลงพอดีจอ */
        .hole {
            width: 100%;
            height: 100%;
            max-width: 55px; /* ลดจาก 65px */
            max-height: 55px; /* ลดจาก 65px */
            aspect-ratio: 1/1; 
            border-radius: 50%;
            
            /* พื้นหลังไล่สีให้ดูมีมิติ ลึกเข้าไป */
            background: radial-gradient(circle at 35% 35%, #3e2723 0%, #000 60%);
            
            /* ขอบรูสีอ่อน (เลียนแบบงาช้างหรือวงแหวนทองเหลือง) ตัดกับไม้ดำ */
            border: 2px solid #bcaaa4; /* ลดความหนาขอบเล็กน้อย */
            
            box-shadow: 
                inset 2px 2px 5px #000, 
                0 2px 5px rgba(0,0,0,0.5),
                0 0 0 1px rgba(0,0,0,0.8); /* ขอบนอกสุดตัดดำ */
            
            transition: all 0.08s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem; /* ลดขนาดตัวอักษรลงเล็กน้อย */
            font-weight: bold;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* ปุ่มเสียงสูง: ใช้ขอบทองแดง เพื่อแยกแยะ */
        .hole.high-pitch {
            border-color: #a1887f; 
            background: radial-gradient(circle at 35% 35%, #4e342e 0%, #000 60%);
        }

        /* Active State: กดแล้วบุ๋มลง + เปลี่ยนสี */
        .hole.active {
            transform: scale(0.92); 
            background: #0a0503; /* มืดลง */
            border-color: #ffb74d; /* ขอบเรืองแสงสีทองส้ม */
            box-shadow: 
                inset 0 0 15px #000,
                0 0 15px rgba(255, 183, 77, 0.4); /* Glow effect */
            color: #fff;
        }

        .vibrating { animation: shake 0.2s infinite; }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(0.5px); }
            75% { transform: translateX(-0.5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-black text-amber-50">

    <!-- Header -->
    <div class="flex-none w-full px-4 pt-3 pb-2 z-20 bg-gradient-to-b from-stone-900 to-black border-b border-stone-800 shadow-md">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-lg font-bold text-amber-500 leading-none tracking-wide flex items-center gap-2">
                <i class="fas fa-music text-amber-700"></i>
                <span style="text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);">ปี่กลาง</span>
            </h1>
            <div id="status" class="text-[10px] font-mono text-amber-200/60 bg-stone-900 px-3 py-1 rounded-full border border-stone-800 shadow-inner">
                <span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1 animate-pulse"></span>
                รอไฟล์เสียง
            </div>
        </div>

        <!-- Controls Row -->
        <div class="flex gap-3 h-10 mb-1">
            <!-- ปุ่ม Record สีแดงเลือดหมู -->
            <button id="recordBtn" class="flex-1 bg-gradient-to-b from-red-900 to-red-950 hover:from-red-800 hover:to-red-900 rounded-lg flex flex-col justify-center items-center gap-0.5 active:scale-95 transition-all border border-red-800/50 shadow-lg group">
                <i class="fas fa-microphone text-red-200 text-xs group-hover:text-white transition-colors"></i>
                <span class="text-[9px] font-medium text-red-100/80">อัดเสียง</span>
            </button>
            
            <!-- ปุ่ม Play สีเขียวขี้ม้าเข้ม -->
            <button id="playBtn" disabled class="flex-1 bg-gradient-to-b from-stone-800 to-stone-900 hover:from-stone-700 hover:to-stone-800 rounded-lg flex flex-col justify-center items-center gap-0.5 opacity-60 transition-all border border-stone-700/50 shadow-lg disabled:cursor-not-allowed group">
                <i class="fas fa-play text-emerald-500 text-xs group-hover:text-emerald-400 transition-colors"></i>
                <span class="text-[9px] font-medium text-emerald-100/60">เล่น</span>
            </button>
            
            <!-- ปุ่ม Download สีน้ำเงินเข้ม -->
            <button id="downloadBtn" disabled class="flex-1 bg-gradient-to-b from-stone-800 to-stone-900 hover:from-stone-700 hover:to-stone-800 rounded-lg flex flex-col justify-center items-center gap-0.5 opacity-60 transition-all border border-stone-700/50 shadow-lg disabled:cursor-not-allowed group">
                <i class="fas fa-download text-sky-500 text-xs group-hover:text-sky-400 transition-colors"></i>
                <span class="text-[9px] font-medium text-sky-100/60">โหลด</span>
            </button>
        </div>
        
        <!-- Labels -->
        <div class="flex justify-between px-10 text-[8px] font-bold text-stone-500 uppercase tracking-widest mt-1">
            <span class="text-stone-400">เสียงปกติ (ซ้าย)</span>
            <span class="text-amber-700">เสียงสูง (ขวา)</span>
        </div>
    </div>

    <!-- Instrument Body -->
    <div class="flex-grow relative w-full flex justify-center overflow-hidden bg-[#050505]">
        <!-- แสงเงาพื้นหลัง -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_30%,_#1a100c_0%,_#000_70%)] z-0 pointer-events-none"></div>
        
        <div id="instrument-body" class="wood-texture shadow-2xl"></div>
        
        <!-- Grid ปุ่มกด -->
        <div id="hole-container">
            <!-- Buttons Generated by JS -->
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-8 text-center backdrop-blur-md">
        <div class="w-24 h-24 bg-gradient-to-br from-amber-900 to-black rounded-full flex items-center justify-center mb-6 shadow-2xl shadow-amber-900/40 border-4 border-stone-800">
            <i class="fas fa-music text-4xl text-amber-500/80"></i>
        </div>
        <h2 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-700">ปี่กลางจำลอง</h2>
        <p class="text-stone-400 text-sm mb-10 leading-relaxed max-w-xs mx-auto">
            Simulator with 14 Tones<br>
            <span class="text-xs text-stone-600 mt-2 block"></span>
        </p>
        <button id="start-btn" class="bg-gradient-to-r from-amber-700 to-amber-900 hover:from-amber-600 hover:to-amber-800 text-white font-bold py-4 px-12 text-base rounded-full shadow-[0_0_20px_rgba(180,83,9,0.4)] active:scale-95 transition-all border border-amber-600/30">
            แตะเพื่อเริ่ม
        </button>
    </div>

    <script>
        // ==========================================
        // 1. ใส่ลิงก์เสียงที่นี่ (14 ช่อง)
        // ==========================================
        // แก้ไขลิงก์ตรงนี้ให้เป็นไฟล์เสียงของคุณ
        const soundLinks = {
            // ซ้าย: ปกติ (บนลงล่าง)
            "L1": "pee/do.wav", 
            "L2": "pee/re.wav", 
            "L3": "pee/mee.wav", 
            "L4": "pee/fa.wav", 
            "L5": "pee/so.wav", 
            "L6": "pee/la.wav", 
            "L7": "pee/Tee.wav",
            // ขวา: สูง (บนลงล่าง)
            "H1": "pee/dosod.wav", 
            "H2": "pee/reso.wav", 
            "H3": "pee/meeso.wav", 
            "H4": "pee/faso.wav", 
            "H5": "pee/sonso.wav", 
            "H6": "pee/laso.wav", 
            "H7": "pee/Tso.wav"
        };

        const labels = ["ด", "ร", "ม", "ฟ", "ซ", "ล", "ท"];

        // ==========================================
        // 2. Audio Engine
        // ==========================================
        let audioCtx;
        let masterGain;
        let audioBuffers = {};
        let activeSources = {}; 
        
        let mediaDest, mediaRecorder;
        let audioChunks = [], recordedAudioUrl = null, isRecording = false;

        const holeContainer = document.getElementById('hole-container');
        const instrumentBody = document.getElementById('instrument-body');
        const statusEl = document.getElementById('status');

        // สร้างปุ่ม 14 ปุ่ม (7 แถว)
        for (let i = 0; i < 7; i++) {
            createHole(`L${i+1}`, labels[i], 'normal-pitch');
            createHole(`H${i+1}`, labels[i] + "ํ", 'high-pitch');
        }

        function createHole(id, text, typeClass) {
            const btn = document.createElement('div');
            btn.className = `hole ${typeClass}`;
            btn.innerHTML = `<span class="pointer-events-none drop-shadow-md">${text}</span>`;
            btn.dataset.id = id;

            // Event Listeners สำหรับการกด
            const startPlay = (e) => {
                if (e.cancelable) e.preventDefault();
                playSound(id, btn);
            };
            const stopPlay = (e) => {
                if (e.cancelable) e.preventDefault();
                stopSound(id, btn);
            };

            btn.addEventListener('touchstart', startPlay, { passive: false });
            btn.addEventListener('touchend', stopPlay);
            btn.addEventListener('mousedown', startPlay);
            btn.addEventListener('mouseup', stopPlay);
            btn.addEventListener('mouseleave', stopPlay);

            holeContainer.appendChild(btn);
        }

        // เริ่มระบบเสียง
        document.getElementById('start-btn').addEventListener('click', async () => {
            initAudio();
            document.getElementById('overlay').classList.add('hidden');
            await loadSounds();
        });

        function initAudio() {
            const AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.8;
            
            mediaDest = audioCtx.createMediaStreamDestination();
            masterGain.connect(audioCtx.destination);
            masterGain.connect(mediaDest);
        }

        async function loadSounds() {
            statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-yellow-500 mr-1 animate-spin"></span> กำลังโหลด...';
            statusEl.classList.remove("text-amber-200/60");
            statusEl.classList.add("text-yellow-400");
            
            const keys = Object.keys(soundLinks);
            let loadedCount = 0;
            
            await Promise.all(keys.map(async (key) => {
                const url = soundLinks[key];
                if (url) {
                    try {
                        const res = await fetch(url);
                        if (!res.ok) throw new Error('Network error');
                        const buff = await res.arrayBuffer();
                        audioBuffers[key] = await audioCtx.decodeAudioData(buff);
                        loadedCount++;
                    } catch (e) { 
                        console.warn("ยังไม่พบไฟล์เสียง:", key); 
                    }
                }
            }));
            
            if(loadedCount === 0) {
                 statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1"></span> ไม่พบไฟล์เสียง';
                 statusEl.classList.remove("text-yellow-400");
                 statusEl.classList.add("text-red-400");
            } else {
                 statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1"></span> พร้อมใช้งาน';
                 statusEl.classList.remove("text-yellow-400");
                 statusEl.classList.add("text-green-400");
            }
        }

        function playSound(id, btn) {
            // ถ้าไม่มีไฟล์เสียง ให้แค่แสดง Visual Feedback
            if (!audioCtx) return;

            if (activeSources[id]) {
                try { activeSources[id].source.stop(); } catch(e){}
            }

            // Visual Feedback
            btn.classList.add('active');
            instrumentBody.classList.add('vibrating');

            if (audioBuffers[id]) {
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffers[id];
                source.loop = true;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05);

                source.connect(gain);
                gain.connect(masterGain);
                source.start(0);

                activeSources[id] = { source, gain };
            }
        }

        function stopSound(id, btn) {
            const item = activeSources[id];
            if (item) {
                const { source, gain } = item;
                const t = audioCtx.currentTime;
                
                gain.gain.cancelScheduledValues(t);
                gain.gain.setValueAtTime(gain.gain.value, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.1);
                
                setTimeout(() => { try { source.stop(); } catch(e){} }, 100);
                delete activeSources[id];
            }

            // Remove Active Class
            btn.classList.remove('active');
            if (Object.keys(activeSources).length === 0) {
                instrumentBody.classList.remove('vibrating');
            }
        }

        // ==========================================
        // 3. ระบบอัดเสียง (Recording)
        // ==========================================
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        recordBtn.addEventListener('click', () => isRecording ? stopRec() : startRec());

        function startRec() {
            if (!audioCtx) initAudio();
            audioChunks = [];
            
            // ตรวจสอบ Browser Support
            let mime = 'audio/webm';
            if (!MediaRecorder.isTypeSupported(mime)) {
                mime = 'audio/mp4'; 
            }
            
            try {
                mediaRecorder = new MediaRecorder(mediaDest.stream, { mimeType: mime });
            } catch(e) {
                mediaRecorder = new MediaRecorder(mediaDest.stream);
            }
            
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: mime });
                recordedAudioUrl = URL.createObjectURL(blob);
                playBtn.disabled = false;
                downloadBtn.disabled = false;
                playBtn.classList.remove('opacity-60', 'disabled:cursor-not-allowed');
                playBtn.classList.add('opacity-100', 'cursor-pointer', 'bg-gradient-to-b', 'from-emerald-800', 'to-emerald-900', 'border-emerald-600');
                downloadBtn.classList.remove('opacity-60', 'disabled:cursor-not-allowed');
                downloadBtn.classList.add('opacity-100', 'cursor-pointer', 'bg-gradient-to-b', 'from-sky-800', 'to-sky-900', 'border-sky-600');
                
                statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-blue-500 mr-1"></span> บันทึกแล้ว';
                statusEl.className = "text-[10px] font-mono text-blue-400 bg-stone-900 px-3 py-1 rounded-full border border-stone-800 shadow-inner";
            };

            mediaRecorder.start();
            isRecording = true;
            
            // เปลี่ยนหน้าตาปุ่ม Record เป็น "กำลังอัด"
            recordBtn.className = "flex-1 bg-gradient-to-b from-red-600 to-red-800 rounded-lg flex flex-col justify-center items-center gap-0.5 active:scale-95 transition-all border border-red-500 shadow-[0_0_15px_rgba(220,38,38,0.5)] animate-pulse group";
            recordBtn.innerHTML = `<i class="fas fa-stop text-white text-sm"></i><span class="text-[9px] font-medium text-white">หยุด</span>`;
        }

        function stopRec() {
            if(mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                // คืนค่าปุ่ม Record
                recordBtn.className = "flex-1 bg-gradient-to-b from-red-900 to-red-950 hover:from-red-800 hover:to-red-900 rounded-lg flex flex-col justify-center items-center gap-0.5 active:scale-95 transition-all border border-red-800/50 shadow-lg group";
                recordBtn.innerHTML = `<i class="fas fa-microphone text-red-200 text-xs group-hover:text-white transition-colors"></i><span class="text-[9px] font-medium text-red-100/80">อัดเสียง</span>`;
            }
        }

        playBtn.addEventListener('click', () => {
            if (recordedAudioUrl) {
                const audio = new Audio(recordedAudioUrl);
                audio.play();
                statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1 animate-pulse"></span> กำลังเล่น...';
                audio.onended = () => {
                    statusEl.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1"></span> พร้อมใช้งาน';
                };
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (recordedAudioUrl) {
                const a = document.createElement('a');
                a.href = recordedAudioUrl;
                a.download = `Pi_Klang_Recording_${Date.now()}.webm`;
                a.click();
            }
        });

    </script>
</body>
</html>
