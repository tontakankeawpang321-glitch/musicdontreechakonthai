<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ขลุ่ยนกกาเหว่า (Asian Koel Flute Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #030805;
            /* บรรยากาศป่าดิบชื้นยามเช้าตรู่สีเขียวมรกตเข้ม */
            background-image: 
                radial-gradient(circle at 50% 15%, #0d2617 0%, #030805 75%),
                radial-gradient(circle at 10% 85%, #05140a 0%, transparent 50%);
        }

        /* Ambient Glowing Forest Mist */
        .mist {
            position: absolute;
            width: 150%;
            height: 100%;
            background: radial-gradient(circle, rgba(16,185,129,0.03) 0%, transparent 60%);
            filter: blur(40px);
            animation: drift 25s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes drift {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.2); }
        }

        /* Bamboo Body: สมจริงและหรูหราขึ้น */
        .bamboo-body {
            background: linear-gradient(90deg, 
                #271911 0%, 
                #5a3a22 12%, 
                #a0784d 35%, 
                #d2b07e 50%, 
                #a0784d 65%, 
                #5a3a22 88%, 
                #271911 100%
            );
            box-shadow: 
                0 25px 50px -12px rgba(0,0,0,0.9), 
                inset 1px 0 3px rgba(255,255,255,0.25),
                inset -3px 0 10px rgba(0,0,0,0.7);
            border-radius: 24px;
            position: relative;
            background-blend-mode: multiply;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ข้อไม้ไผ่ธรรมชาติ */
        .joint {
            position: absolute;
            left: -4px; right: -4px;
            height: 8px;
            background: linear-gradient(180deg, #3d2414 0%, #5e3b23 40%, #201108 100%);
            border-top: 1px solid rgba(255, 230, 200, 0.3);
            border-bottom: 2px solid rgba(0,0,0,0.6);
            border-radius: 4px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            z-index: 5;
        }

        /* เชือกแดงมงคลถักแบบไทย */
        .rope-binding {
            position: absolute;
            left: -3px; right: -3px;
            height: 16px;
            background: repeating-linear-gradient(
                45deg,
                #b91c1c,
                #b91c1c 2px,
                #7f1d1d 3px,
                #7f1d1d 5px
            );
            border-radius: 3px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
            z-index: 6;
        }

        /* รูเสียง 3 มิติ สะท้อนแสงเงาเสมือนจริง */
        .hole-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #2a1810 5%, #050302 65%, #000 100%);
            box-shadow: 
                inset 4px 4px 8px rgba(0,0,0,0.95),
                inset -2px -2px 5px rgba(255,255,255,0.08),
                2px 2px 4px rgba(255,255,255,0.12); /* แสงขอบสะท้อน */
            border: 2.5px solid rgba(139, 92, 26, 0.55);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,243,219,0.35);
            font-size: 1.4rem;
            font-weight: 700;
            transition: all 0.12s cubic-bezier(0.165, 0.84, 0.44, 1);
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }

        /* รูขลุ่ยถูกกด/ปิดรูเสียง */
        .hole-btn.active, .hole-btn:active {
            transform: scale(0.92);
            border-color: #10b981;
            box-shadow: 
                0 0 25px rgba(16, 185, 129, 0.5), 
                inset 0 0 15px rgba(0,0,0,0.9);
            color: #10b981;
            text-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }

        /* ปากเป่าขลุ่ย */
        .mouthpiece {
            position: absolute;
            -top: 28px;
            width: 48px;
            height: 30px;
            background: linear-gradient(90deg, #1f110a, #3e2416, #1f110a);
            border-radius: 6px 6px 0 0;
            border-bottom: 2px solid rgba(0,0,0,0.5);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.1);
        }

        /* โน้ตเพลงลอยขึ้นฟ้า (Flying Notes) */
        .floating-note {
            position: absolute;
            pointer-events: none;
            color: #34d399;
            font-weight: bold;
            font-size: 1.5rem;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.8);
            z-index: 30;
            animation: floatUp 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.6) rotate(0deg);
            }
            15% {
                opacity: 1;
                transform: translateY(-20px) scale(1.1) rotate(-10deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-220px) scale(0.8) rotate(30deg);
            }
        }

        /* Custom Panel Glassmorphism */
        .glass-panel {
            background: rgba(13, 22, 18, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(16, 185, 129, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
        }

        /* Custom Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        /* Highlight animation for Auto Play */
        .pulsing-demo {
            animation: pulseDemo 1.8s infinite;
        }

        @keyframes pulseDemo {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 15px 4px rgba(16, 185, 129, 0.2); }
        }

        /* Custom alert replacement modal */
        #customAlert {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between py-4 text-white overflow-hidden relative">

    <!-- Ambient Forest Background -->
    <div class="mist"></div>

    <!-- Top Bar with Custom Toast notification instead of standard Alerts -->
    <header class="w-full max-w-md mx-auto px-4 flex flex-col items-center z-10 text-center">
        <div class="flex items-center justify-center gap-2 mb-1">
            <span class="text-emerald-400 text-xl"><i class="fa-solid fa-feather-pointed"></i></span>
            <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-amber-100 via-emerald-100 to-emerald-300 bg-clip-text text-transparent">
                ขลุ่ยนกกาเหว่า
            </h1>
        </div>
        <p class="text-emerald-500/50 text-xs tracking-widest font-mono uppercase">Deep Forest Koel Simulator v2.5</p>
    </header>

    <!-- Interactive Musical Area -->
    <main class="flex-grow flex items-center justify-center w-full px-4 relative z-10 my-1">
        
        <!-- Flute Body container -->
        <div class="bamboo-body w-28 sm:w-32 h-[50vh] max-h-[420px] flex flex-col items-center justify-evenly py-8 relative">
            
            <!-- Mouthpiece -->
            <div class="mouthpiece -top-[28px]"></div>

            <!-- Bamboo details: node joints -->
            <div class="joint" style="top: 25px;"></div>
            <div class="rope-binding" style="top: 45px;"></div>
            
            <div class="joint" style="top: 48%;"></div>
            
            <div class="rope-binding" style="bottom: 45px;"></div>
            <div class="joint" style="bottom: 25px;"></div>

            <!-- 3 Holes (HIGH, MID, LOW notes) -->
            <!-- Hole 3 (HIGH) -->
            <button id="btn-HIGH" class="hole-btn" 
                ontouchstart="handleTouchStart(event, 'HIGH')" ontouchend="handleTouchEnd(event, 'HIGH')"
                onmousedown="handleMouseDown('HIGH')" onmouseup="handleMouseUp('HIGH')" onmouseleave="handleMouseUp('HIGH')">
                <span>๓</span>
            </button>

            <!-- Hole 2 (MID) -->
            <button id="btn-MID" class="hole-btn" 
                ontouchstart="handleTouchStart(event, 'MID')" ontouchend="handleTouchEnd(event, 'MID')"
                onmousedown="handleMouseDown('MID')" onmouseup="handleMouseUp('MID')" onmouseleave="handleMouseUp('MID')">
                <span>๒</span>
            </button>

            <!-- Hole 1 (LOW) -->
            <button id="btn-LOW" class="hole-btn" 
                ontouchstart="handleTouchStart(event, 'LOW')" ontouchend="handleTouchEnd(event, 'LOW')"
                onmousedown="handleMouseDown('LOW')" onmouseup="handleMouseUp('LOW')" onmouseleave="handleMouseUp('LOW')">
                <span>๑</span>
            </button>

            <!-- Play Instructions Tag -->
            <div class="absolute -right-12 top-1/2 -translate-y-1/2 text-[9px] text-emerald-300/30 uppercase font-mono tracking-widest rotate-90 hidden sm:block">
                Koel Flute Scale
            </div>
        </div>

        <!-- Floating Particles Container -->
        <div id="particles-container" class="absolute inset-0 pointer-events-none z-20"></div>
    </main>

    <!-- Bottom Interactive Control Panels -->
    <footer class="w-full max-w-md mx-auto px-4 z-20 flex flex-col gap-2">
        
        <!-- Collapsible Advanced Tuning Drawer -->
        <div class="glass-panel rounded-2xl overflow-hidden transition-all duration-300">
            <!-- Header Clickable to Toggle Drawer -->
            <button onclick="toggleTuningPanel()" class="w-full px-4 py-2.5 flex items-center justify-between text-xs text-emerald-300 hover:bg-emerald-950/20 transition-colors">
                <span class="flex items-center gap-2 font-semibold">
                    <i class="fa-solid fa-sliders text-emerald-400"></i>
                    ระบบปรับเสียงนกกาเหว่าขั้นสูง (Tuning)
                </span>
                <i id="tuningArrow" class="fa-solid fa-chevron-down transition-transform duration-300"></i>
            </button>

            <!-- Sliders Content (Collapsed by default to fit vertical screens) -->
            <div id="tuningContent" class="hidden px-4 pb-3 pt-1 border-t border-emerald-900/20 grid grid-cols-2 gap-x-4 gap-y-2.5 text-[11px] text-emerald-100/70">
                <!-- Pitch Transpose -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between">
                        <span>คีย์เสียงหลัก (Pitch)</span>
                        <span id="lbl-pitch" class="text-emerald-400 font-mono">0</span>
                    </div>
                    <input type="range" id="param-pitch" min="-12" max="12" value="0" step="1" oninput="updateSoundParam('pitch', this.value)">
                </div>

                <!-- Blowing Air Level -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between">
                        <span>แรงลมเป่า (Air Flow)</span>
                        <span id="lbl-air" class="text-emerald-400 font-mono">35%</span>
                    </div>
                    <input type="range" id="param-air" min="0" max="100" value="35" step="1" oninput="updateSoundParam('air', this.value)">
                </div>

                <!-- Vibrato Speed -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between">
                        <span>ลูกคอสั่น (Vibrato Rate)</span>
                        <span id="lbl-vibrato" class="text-emerald-400 font-mono">6.5 Hz</span>
                    </div>
                    <input type="range" id="param-vibrato" min="30" max="120" value="65" step="5" oninput="updateSoundParam('vibrato', this.value)">
                </div>

                <!-- Echo Feedback -->
                <div class="flex flex-col gap-1">
                    <div class="flex justify-between">
                        <span>เสียงสะท้อนป่า (Echo/Reverb)</span>
                        <span id="lbl-echo" class="text-emerald-400 font-mono">50%</span>
                    </div>
                    <input type="range" id="param-echo" min="0" max="90" value="50" step="5" oninput="updateSoundParam('echo', this.value)">
                </div>
            </div>
        </div>

        <!-- Master Control Center Box -->
        <div class="glass-panel rounded-2xl p-3 flex flex-col gap-2.5">
            <!-- Dynamic Status / Helper Text -->
            <div class="flex items-center justify-between text-[11px] text-emerald-200/50 px-1 border-b border-emerald-950/30 pb-1.5 font-medium">
                <span id="statusText" class="truncate flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                    พร้อมบรรเลง: กดปุ่ม ๑ แล้ว ๓ เพื่อเกิดเสียง "กา-เหว่า"
                </span>
                <span id="timerDisplay" class="font-mono text-emerald-400 hidden">0:00</span>
            </div>

            <!-- Primary Buttons Grid -->
            <div class="grid grid-cols-12 gap-2">
                <!-- Auto Play (Demo Mode) -->
                <button id="demoBtn" onclick="toggleAutoDemo()" class="col-span-4 h-11 rounded-xl bg-gradient-to-r from-emerald-900 to-emerald-950 text-emerald-100 border border-emerald-500/20 flex items-center justify-center gap-1.5 text-xs font-semibold hover:brightness-110 active:scale-95 transition-all pulsing-demo">
                    <i id="demoIcon" class="fa-solid fa-play"></i>
                    <span id="demoLabel">สาธิตนก</span>
                </button>

                <!-- Recording Action Trigger -->
                <button id="recBtn" onclick="toggleRecording()" class="col-span-8 h-11 rounded-xl bg-neutral-900 border border-red-900/30 hover:bg-neutral-800 text-white flex items-center justify-center gap-2 text-xs font-semibold relative overflow-hidden active:scale-95 transition-all">
                    <span id="recDot" class="w-2.5 h-2.5 rounded-full bg-red-600 shadow-[0_0_8px_rgba(239,68,68,0.7)]"></span>
                    <span id="recLabel">อัดเสียงสังเคราะห์</span>
                </button>

                <!-- Custom Sound Playback Console (Hidden till record complete) -->
                <div id="playbackSuite" class="hidden col-span-8 flex gap-1.5">
                    <button onclick="playRecordedAudio()" class="flex-1 h-11 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white flex items-center justify-center gap-1 text-xs font-medium active:scale-95 transition-all">
                        <i class="fa-solid fa-volume-high"></i> ฟังเสียง
                    </button>
                    <button onclick="downloadRecordedAudio()" class="w-12 h-11 rounded-xl bg-sky-900 hover:bg-sky-800 text-sky-200 flex items-center justify-center text-sm active:scale-95 transition-all" title="บันทึกลงเครื่อง">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button onclick="resetRecordingSuite()" class="w-12 h-11 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-400 flex items-center justify-center text-sm active:scale-95 transition-all" title="ล้างไฟล์">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        </div>
    </footer>

    <!-- Soft Glass Notification Modal instead of Native Alerts -->
    <div id="customToast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-neutral-900/95 border border-emerald-500/30 text-emerald-200 text-xs py-2.5 px-4 rounded-xl shadow-2xl z-50 flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-2">
        <i class="fa-solid fa-circle-info text-emerald-400 text-sm"></i>
        <span id="toastMsg">บันทึกความต้องการเรียบร้อย</span>
    </div>

    <!-- Audio & Interaction Engine Code -->
    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let masterGain = null;
        let echoDelay = null;
        let echoFeedback = null;
        let audioDestination = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordedBlob = null;
        let recordedUrl = null;
        let playbackPlayer = new Audio();

        // Flute Synthesizer State Trackers
        const activeVoices = {};
        let isRecording = false;
        let recStartTime = 0;
        let recTimerInterval = null;

        // Auto Demo States
        let isDemoPlaying = false;
        let demoTimeouts = [];

        // Realistic Custom Instrument Parameters (Adjustable via Tuning Console)
        const soundParams = {
            pitch: 0,       // Semitones transpose
            air: 0.35,      // Sub-harmonic / blowing white noise level (0.0 to 1.0)
            vibrato: 6.5,   // Frequency of vibrato LFO in Hz
            echo: 0.5       // Feedback delay gain level (0.0 to 0.9)
        };

        // Asian Koel Tuned Base Scale (Frequencies correspond roughly to G5, B5, D6)
        const noteFrequencies = {
            'LOW': 784.00,  // G5 (Sounding as "Ko")
            'MID': 987.77,  // B5 (Transition middle frequency)
            'HIGH': 1174.66 // D6 (Sounding as "El" - high piercing call)
        };

        // Floating Note symbols to choose from
        const musicalSymbols = ['♩', '♪', '♫', '♬', '♭', '♮', '♯', '°'];

        // Custom Toast replacement for alert()
        function showToast(message) {
            const toast = document.getElementById('customToast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
            }, 3000);
        }

        // Toggle Expandable Tuning Panel
        function toggleTuningPanel() {
            const panel = document.getElementById('tuningContent');
            const arrow = document.getElementById('tuningArrow');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                panel.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        // Real-time parameter updates
        function updateSoundParam(param, value) {
            const valNum = parseFloat(value);
            if (param === 'pitch') {
                soundParams.pitch = valNum;
                document.getElementById('lbl-pitch').innerText = (valNum > 0 ? '+' : '') + valNum;
            } else if (param === 'air') {
                soundParams.air = valNum / 100;
                document.getElementById('lbl-air').innerText = value + '%';
            } else if (param === 'vibrato') {
                soundParams.vibrato = valNum / 10;
                document.getElementById('lbl-vibrato').innerText = (valNum / 10).toFixed(1) + ' Hz';
            } else if (param === 'echo') {
                soundParams.echo = valNum / 100;
                document.getElementById('lbl-echo').innerText = value + '%';
                if (echoFeedback) {
                    // Update active routing nodes directly if running
                    echoFeedback.gain.setTargetAtTime(soundParams.echo, audioCtx.currentTime, 0.1);
                }
            }
        }

        // Construct Audio Node Tree
        function initAudioEngine() {
            if (audioCtx) return;

            audioCtx = new AudioContext();

            // Setup compressor to prevent digital clipping
            const limiter = audioCtx.createDynamicsCompressor();
            limiter.threshold.setValueAtTime(-12, audioCtx.currentTime);
            limiter.knee.setValueAtTime(3, audioCtx.currentTime);
            limiter.ratio.setValueAtTime(16, audioCtx.currentTime);
            limiter.attack.setValueAtTime(0.005, audioCtx.currentTime);
            limiter.release.setValueAtTime(0.08, audioCtx.currentTime);

            // Create Master output gain
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

            // Establish Stereo Eco Echo Effect (Simulating vast rainforest acoustic depth)
            const echoDelayLeft = audioCtx.createDelay(1.0);
            const echoDelayRight = audioCtx.createDelay(1.0);
            echoFeedback = audioCtx.createGain();

            // Set natural delayed reflections
            echoDelayLeft.delayTime.setValueAtTime(0.38, audioCtx.currentTime); 
            echoDelayRight.delayTime.setValueAtTime(0.57, audioCtx.currentTime);
            echoFeedback.gain.setValueAtTime(soundParams.echo, audioCtx.currentTime);

            // Delay loop wiring
            echoDelayLeft.connect(echoDelayRight);
            echoDelayRight.connect(echoFeedback);
            echoFeedback.connect(echoDelayLeft); // Feedback route

            // Recorder hookup destination node
            audioDestination = audioCtx.createMediaStreamDestination();

            // Hook paths up
            limiter.connect(masterGain);
            
            // Reverb / Echo routing splits
            masterGain.connect(echoDelayLeft);
            
            // Connect dry and wet signals to speaker outputs and stream outputs
            masterGain.connect(audioCtx.destination);
            echoDelayLeft.connect(audioCtx.destination);
            echoDelayRight.connect(audioCtx.destination);

            // Route also to media recorder destination
            masterGain.connect(audioDestination);
            echoDelayLeft.connect(audioDestination);
            echoDelayRight.connect(audioDestination);
        }

        // Dynamic White Noise generation for simulating realistic blow air/chiff acoustics
        function getNoiseBuffer() {
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = sampleRate * 1.5; // Short localized noise burst
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            return noiseBuffer;
        }

        // Synthesizer voice trigger logic
        function triggerVoice(freq) {
            const time = audioCtx.currentTime;

            // Apply Key Transposition factor
            const finalFreq = freq * Math.pow(2, soundParams.pitch / 12);

            // Primary Whistling oscillator
            const oscFundamental = audioCtx.createOscillator();
            oscFundamental.type = 'sine';
            
            // Real birds have slight natural pitch glides on attack - simulated here for realism!
            // Starts slightly lower and scoops rapidly into pitch
            oscFundamental.frequency.setValueAtTime(finalFreq * 0.93, time);
            oscFundamental.frequency.exponentialRampToValueAtTime(finalFreq, time + 0.08);

            // Subtle second harmonic node to add organic avian throat depth
            const oscOvertones = audioCtx.createOscillator();
            oscOvertones.type = 'sine';
            oscOvertones.frequency.setValueAtTime(finalFreq * 2, time);
            const overtonesGain = audioCtx.createGain();
            overtonesGain.gain.setValueAtTime(0.06, time); // Extremely faint harmonic

            // Breath noise simulating wooden flutes and bird larynx physics
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = getNoiseBuffer();
            noiseSource.loop = true;

            // Filter white noise around whistle target to act as localized wind hiss
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.Q.setValueAtTime(10, time);
            noiseFilter.frequency.setValueAtTime(finalFreq, time);
            noiseFilter.frequency.exponentialRampToValueAtTime(finalFreq, time + 0.1);

            const windGain = audioCtx.createGain();
            windGain.gain.setValueAtTime(0, time);
            // Dynamic breath spike at attack, fading down into continuous gentle background stream
            windGain.gain.linearRampToValueAtTime(soundParams.air * 0.25, time + 0.03);
            windGain.gain.exponentialRampToValueAtTime(soundParams.air * 0.08, time + 0.2);

            // Smooth envelope nodes
            const voiceEnv = audioCtx.createGain();
            voiceEnv.gain.setValueAtTime(0, time);
            voiceEnv.gain.linearRampToValueAtTime(0.85, time + 0.07); // Swelling blow attack
            voiceEnv.gain.exponentialRampToValueAtTime(0.68, time + 0.4); // Sustain level

            // Tremulous Vocal Vibrato Setup (LFO)
            const lfoNode = audioCtx.createOscillator();
            const lfoModAmount = audioCtx.createGain();
            lfoNode.frequency.setValueAtTime(soundParams.vibrato, time);
            lfoModAmount.gain.setValueAtTime(0, time);
            // Vibrato starts dry, slowly developing into a beautiful organic avian trill
            lfoModAmount.gain.setTargetAtTime(finalFreq * 0.02, time + 0.12, 0.24);

            // Sound routing linkages
            lfoNode.connect(lfoModAmount);
            lfoModAmount.connect(oscFundamental.frequency); // Modulate base pitch

            oscFundamental.connect(voiceEnv);
            
            oscOvertones.connect(overtonesGain);
            overtonesGain.connect(voiceEnv);

            noiseSource.connect(noiseFilter);
            noiseFilter.connect(windGain);
            windGain.connect(voiceEnv);

            voiceEnv.connect(audioCtx.destination); // Direct monitors
            voiceEnv.connect(masterGain); // Outward effects chain

            // Initiate source schedules
            lfoNode.start(time);
            oscFundamental.start(time);
            oscOvertones.start(time);
            noiseSource.start(time);

            return {
                fundamental: oscFundamental,
                overtones: oscOvertones,
                lfo: lfoNode,
                noise: noiseSource,
                envelope: voiceEnv,
                baseFreq: finalFreq
            };
        }

        // Note playback trigger bindings
        function playNoteStart(noteKey) {
            initAudioEngine();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (activeVoices[noteKey]) return; // Stop redundant triggers

            // Activate voice and map to state tracker
            activeVoices[noteKey] = triggerVoice(noteFrequencies[noteKey]);
            
            // Highlight visual key
            const element = document.getElementById(`btn-${noteKey}`);
            if (element) element.classList.add('active');

            // Render magical music sparkles
            spawnVisualNotes(noteKey);
        }

        function playNoteEnd(noteKey) {
            const voice = activeVoices[noteKey];
            if (!voice) return;

            const time = audioCtx.currentTime;
            const releaseTime = 0.25; // Gradual air release mimicking a natural throat closure

            // Terminate trigger states cleanly using envelopes
            voice.envelope.gain.cancelScheduledValues(time);
            voice.envelope.gain.setValueAtTime(voice.envelope.gain.value, time);
            voice.envelope.gain.exponentialRampToValueAtTime(0.0001, time + releaseTime);

            // Cleanly stop nodes after silent release
            voice.fundamental.stop(time + releaseTime + 0.05);
            voice.overtones.stop(time + releaseTime + 0.05);
            voice.lfo.stop(time + releaseTime + 0.05);
            voice.noise.stop(time + releaseTime + 0.05);

            // Wipe tracking entries
            delete activeVoices[noteKey];

            const element = document.getElementById(`btn-${noteKey}`);
            if (element) element.classList.remove('active');
        }

        // Touch Input Adapters (Perfect for mobile)
        function handleTouchStart(event, noteKey) {
            event.preventDefault();
            playNoteStart(noteKey);
        }

        function handleTouchEnd(event, noteKey) {
            event.preventDefault();
            playNoteEnd(noteKey);
        }

        // Mouse Input Fallbacks (Desktop convenience)
        function handleMouseDown(noteKey) {
            playNoteStart(noteKey);
        }

        function handleMouseUp(noteKey) {
            playNoteEnd(noteKey);
        }

        // Generate flying dynamic visual music particles
        function spawnVisualNotes(noteKey) {
            const keyElement = document.getElementById(`btn-${noteKey}`);
            if (!keyElement) return;

            const rect = keyElement.getBoundingClientRect();
            const container = document.getElementById('particles-container');

            // Spawn 3 gorgeous glowing characters floating upwards
            for (let i = 0; i < 2; i++) {
                const particle = document.createElement('div');
                particle.className = 'floating-note';
                
                // Select randomized visual symbols
                particle.innerText = musicalSymbols[Math.floor(Math.random() * musicalSymbols.length)];
                
                // Determine layout coordinates
                const spawnOffsetLeft = (Math.random() * 50) - 25; // Scatter horizontally
                const topCoord = rect.top + window.scrollY;
                const leftCoord = rect.left + window.scrollX + (rect.width / 2) + spawnOffsetLeft;

                particle.style.top = `${topCoord}px`;
                particle.style.left = `${leftCoord}px`;

                container.appendChild(particle);

                // Housekeeping deletion
                setTimeout(() => {
                    particle.remove();
                }, 2200);
            }
        }

        // Audio synthesis record processing logic
        function toggleRecording() {
            initAudioEngine();
            
            if (!isRecording) {
                // Kickoff new capture session
                recordedChunks = [];
                const codecOptions = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : { mimeType: 'audio/mp4' };

                try {
                    mediaRecorder = new MediaRecorder(audioDestination.stream, codecOptions);
                } catch(err) {
                    showToast("เบราว์เซอร์ไม่สนับสนุนการบันทึกเสียงภายในรูปแบบนี้");
                    return;
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = compileRecordingData;

                mediaRecorder.start();
                isRecording = true;

                // Adjust elements
                document.getElementById('recBtn').classList.add('bg-red-950', 'border-red-500');
                document.getElementById('recLabel').innerText = "กำลังบันทึกเสียง... (แตะอีกครั้งเพื่อบันทึก)";
                document.getElementById('statusText').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-ping"></span> กำลังบันทึกการสังเคราะห์เสียงของคุณ...`;
                
                // Track elapsed time
                recStartTime = Date.now();
                const timerEl = document.getElementById('timerDisplay');
                timerEl.classList.remove('hidden');
                
                recTimerInterval = setInterval(() => {
                    const elapsedSecs = Math.floor((Date.now() - recStartTime) / 1000);
                    const mins = Math.floor(elapsedSecs / 60);
                    const secs = elapsedSecs % 60;
                    timerEl.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
                }, 1000);

            } else {
                // Stop capture run
                if (mediaRecorder) {
                    mediaRecorder.stop();
                }
                isRecording = false;
                clearInterval(recTimerInterval);
                document.getElementById('timerDisplay').classList.add('hidden');
                document.getElementById('recBtn').classList.remove('bg-red-950', 'border-red-500');
            }
        }

        // Compile and map generated recorded chunks
        function compileRecordingData() {
            recordedBlob = new Blob(recordedChunks, { type: 'audio/webm' });
            recordedUrl = URL.createObjectURL(recordedBlob);
            playbackPlayer.src = recordedUrl;

            // Switch layout controls dynamically
            document.getElementById('recBtn').classList.add('hidden');
            document.getElementById('playbackSuite').classList.remove('hidden');
            document.getElementById('statusText').innerText = "จัดเก็บเสียงลงหน่วยความจำชั่วคราวแล้ว!";
            showToast("อัดเสียงสำเร็จ! พร้อมให้เปิดฟังแล้ว");
        }

        function playRecordedAudio() {
            if (!recordedUrl) return;
            document.getElementById('statusText').innerText = "กำลังเล่นเสียงที่บันทึกไว้ในป่าธรรมชาติ...";
            playbackPlayer.play();
            playbackPlayer.onended = () => {
                document.getElementById('statusText').innerText = "สิ้นสุดการเล่นเสียง";
            };
        }

        function downloadRecordedAudio() {
            if (!recordedUrl) return;
            const link = document.createElement('a');
            link.href = recordedUrl;
            link.download = `KawaoFlutePro-${Date.now()}.webm`;
            link.click();
            showToast("ส่งออกไฟล์เสียงเรียบร้อย!");
        }

        function resetRecordingSuite() {
            recordedUrl = null;
            document.getElementById('playbackSuite').classList.add('hidden');
            document.getElementById('recBtn').classList.remove('hidden');
            document.getElementById('recLabel').innerText = "อัดเสียงสังเคราะห์";
            document.getElementById('statusText').innerText = "พร้อมบรรเลง: กดปุ่ม ๑ แล้ว ๓ เพื่อเกิดเสียง 'กา-เหว่า'";
            showToast("รีเซ็ตตัวอัดเสียงแล้ว");
        }

        // Auto-Play natural Asian Koel call algorithm with dynamic sweep intervals
        function toggleAutoDemo() {
            if (isDemoPlaying) {
                stopAutoDemo();
                return;
            }

            isDemoPlaying = true;
            document.getElementById('demoIcon').className = "fa-solid fa-square text-red-400";
            document.getElementById('demoLabel').innerText = "หยุดสาธิต";
            document.getElementById('statusText').innerText = "ระบบบอทเลียนเสียงนกกาเหว่ากำลังทำงาน...";
            document.getElementById('demoBtn').classList.remove('pulsing-demo');

            const timeline = [];
            
            // Asian Koel call starts slow and quiet, accelerating and rising in pitch step-by-step
            // "Ko-el... Ko-el... Ko-el... Koel! Koel!"
            let baseDelay = 100;
            const baseNotesList = [
                { note: 'LOW', duration: 420 },
                { note: 'HIGH', duration: 550 },
                { pause: 800 },
                
                { note: 'LOW', duration: 380 },
                { note: 'HIGH', duration: 520 },
                { pause: 600 },

                { note: 'LOW', duration: 320 },
                { note: 'HIGH', duration: 480 },
                { pause: 450 },

                { note: 'LOW', duration: 280 },
                { note: 'HIGH', duration: 420 },
                { pause: 300 },

                { note: 'LOW', duration: 250 },
                { note: 'HIGH', duration: 380 },
                { pause: 200 },

                { note: 'LOW', duration: 220 },
                { note: 'HIGH', duration: 350 }
            ];

            let cumulativeTime = 0;

            baseNotesList.forEach((step) => {
                if (step.pause) {
                    cumulativeTime += step.pause;
                } else {
                    const triggerOn = cumulativeTime;
                    const triggerOff = cumulativeTime + step.duration;

                    // Queue the start sound event
                    const startT = setTimeout(() => {
                        playNoteStart(step.note);
                    }, triggerOn);

                    // Queue the release sound event
                    const stopT = setTimeout(() => {
                        playNoteEnd(step.note);
                    }, triggerOff);

                    demoTimeouts.push(startT, stopT);
                    cumulativeTime += step.duration;
                }
            });

            // End of performance routine reset
            const endPerformanceT = setTimeout(() => {
                stopAutoDemo();
                showToast("สาธิตธรรมชาติเสร็จสิ้น!");
            }, cumulativeTime + 1000);

            demoTimeouts.push(endPerformanceT);
        }

        function stopAutoDemo() {
            isDemoPlaying = false;
            // Clear all pending setTimeout schedules
            demoTimeouts.forEach(timer => clearTimeout(timer));
            demoTimeouts = [];

            // Release any keys left pressed on stop
            ['LOW', 'MID', 'HIGH'].forEach(note => playNoteEnd(note));

            document.getElementById('demoIcon').className = "fa-solid fa-play";
            document.getElementById('demoLabel').innerText = "สาธิตนก";
            document.getElementById('statusText').innerText = "พร้อมบรรเลง: แตะขลุ่ยเพื่อเล่นต่อ";
            document.getElementById('demoBtn').classList.add('pulsing-demo');
        }

        // Clean out states contextually whenever user closes/leaves webpage focus
        window.addEventListener('blur', () => {
            stopAutoDemo();
            ['LOW', 'MID', 'HIGH'].forEach(note => playNoteEnd(note));
        });

        // Suppress unwanted mobile context menu triggers
        window.oncontextmenu = (event) => {
            event.preventDefault();
            return false;
        };
    </script>
