<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ปี่จุม 14 เสียง (Synthesizer)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #1a202c; /* Darker bg */
            touch-action: none;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Bamboo/Wood Texture Container */
        .instrument-container {
            background: repeating-linear-gradient(90deg, #8b5a2b, #8b5a2b 10px, #654321 20px);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 10px;
            position: relative;
        }

        /* The Keys (Holes) */
        .note-btn {
            background: radial-gradient(circle at 30% 30%, #5c4033, #2d1b0e);
            border: 2px solid #8b4513;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 2px 2px 5px rgba(255,255,255,0.1);
            color: #d2b48c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.05s, background 0.05s;
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        .note-btn.active {
            transform: scale(0.9);
            background: radial-gradient(circle at 30% 30%, #3e2723, #000);
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: inset 0 0 10px #ffd700;
        }

        /* Grid Layout for Notes */
        .notes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            height: 100%;
            width: 100%;
            padding: 10px;
        }

        /* Controls */
        .control-btn {
            transition: all 0.2s;
        }
        .control-btn:active { transform: scale(0.95); }
        .control-btn:disabled { opacity: 0.4; filter: grayscale(100%); }

        .pulse-record { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Scrollable Saved List */
        .saved-list {
            max-height: 120px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #4a5568 #2d3748;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-2 text-white overflow-hidden">

    <!-- Header & Controls -->
    <div class="flex-none w-full max-w-md mx-auto mb-2">
        <div class="flex justify-between items-end mb-2 px-2">
            <div>
                <h1 class="text-xl font-bold text-yellow-500 drop-shadow-md">ปี่จุม 14 เสียง</h1>
                <p class="text-[10px] text-gray-400">เสียงสังเคราะห์สมจริง</p>
            </div>
            <div id="status-indicator" class="flex items-center gap-1 text-[10px] text-gray-400">
                <div id="status-light" class="w-2 h-2 rounded-full bg-gray-500"></div>
                <span id="status-text">พร้อม</span>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="bg-gray-800 rounded-xl p-2 flex justify-between items-center shadow-lg border border-gray-700 gap-2">
            <button id="btn-record" class="control-btn flex-1 h-10 bg-gray-700 rounded-lg text-red-500 hover:bg-gray-600 flex items-center justify-center gap-1 border border-gray-600">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16z"/></svg>
                <span class="text-xs">อัด</span>
            </button>
            
            <button id="btn-stop" class="control-btn flex-1 h-10 bg-gray-700 rounded-lg text-gray-300 hover:bg-gray-600 flex items-center justify-center gap-1 border border-gray-600" disabled>
                <div class="w-3 h-3 bg-current rounded-sm"></div>
                <span class="text-xs">หยุด</span>
            </button>

            <button id="btn-play" class="control-btn flex-1 h-10 bg-gray-700 rounded-lg text-green-500 hover:bg-gray-600 flex items-center justify-center gap-1 border border-gray-600" disabled>
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"/></svg>
                <span class="text-xs">ฟัง</span>
            </button>
            
            <div class="w-[1px] h-8 bg-gray-600 mx-1"></div>

            <button id="btn-save-local" class="control-btn flex-1 h-10 bg-gray-700 rounded-lg text-yellow-400 hover:bg-gray-600 flex items-center justify-center gap-1 border border-gray-600" disabled>
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4zm-5 16H8v-6h4v6zm2-8H6V5h8v6z"/></svg>
                <span class="text-xs">เมม</span>
            </button>

            <button id="btn-download" class="control-btn flex-1 h-10 bg-gray-700 rounded-lg text-blue-400 hover:bg-gray-600 flex items-center justify-center gap-1 border border-gray-600" disabled>
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"/></svg>
                <span class="text-xs">โหลด</span>
            </button>
        </div>
        
        <!-- Saved Recordings List -->
        <div id="saved-area" class="mt-2 hidden">
            <div class="bg-gray-900 rounded-lg p-2 border border-gray-700">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs text-gray-400">เสียงที่บันทึกไว้ (Local Storage)</span>
                    <button id="btn-clear-storage" class="text-[10px] text-red-400 hover:text-red-300">ลบทั้งหมด</button>
                </div>
                <ul id="recording-list" class="saved-list space-y-1">
                    <!-- Items go here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Main Instrument Area -->
    <div class="flex-1 w-full max-w-md mx-auto instrument-container overflow-hidden">
        <!-- 14 Notes Grid: 2 Columns, 7 Rows -->
        <div class="notes-grid" id="notes-grid">
            <!-- Left Col (Low) -->
            <button class="note-btn" data-freq="261.63" data-note="C4">ด (ต่ำ)</button>
            <button class="note-btn" data-freq="523.25" data-note="C5">ด (กลาง)</button>
            
            <button class="note-btn" data-freq="293.66" data-note="D4">ร (ต่ำ)</button>
            <button class="note-btn" data-freq="587.33" data-note="D5">ร (กลาง)</button>
            
            <button class="note-btn" data-freq="329.63" data-note="E4">ม (ต่ำ)</button>
            <button class="note-btn" data-freq="659.25" data-note="E5">ม (กลาง)</button>
            
            <button class="note-btn" data-freq="349.23" data-note="F4">ฟ (ต่ำ)</button>
            <button class="note-btn" data-freq="698.46" data-note="F5">ฟ (กลาง)</button>
            
            <button class="note-btn" data-freq="392.00" data-note="G4">ซ (ต่ำ)</button>
            <button class="note-btn" data-freq="783.99" data-note="G5">ซ (กลาง)</button>
            
            <button class="note-btn" data-freq="440.00" data-note="A4">ล (ต่ำ)</button>
            <button class="note-btn" data-freq="880.00" data-note="A5">ล (สูง)</button>
            
            <button class="note-btn" data-freq="493.88" data-note="B4">ท (ต่ำ)</button>
            <button class="note-btn" data-freq="987.77" data-note="B5">ท (สูง)</button>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-50">
        <button id="btn-start" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-4 px-8 rounded-full text-xl shadow-[0_0_20px_rgba(255,215,0,0.5)] animate-pulse">
            แตะเพื่อเริ่มเป่าปี่
        </button>
        <p class="text-gray-400 mt-4 text-sm">ใส่หูฟังเพื่อเสียงที่ชัดเจนที่สุด</p>
    </div>

    <script>
        // --- Audio Engine (Synthesizer) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let masterGain;
        let compressor;
        let dest; // For recording
        
        const activeOscillators = {}; // Keep track of playing notes

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new AudioContext();
            
            // Master Gain
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.3; // Reduce volume for polyphony

            // Compressor (Prevent clipping)
            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.value = -10;
            compressor.ratio.value = 12;
            
            // Recording Destination
            dest = audioCtx.createMediaStreamDestination();

            // Connections
            masterGain.connect(compressor);
            compressor.connect(audioCtx.destination);
            compressor.connect(dest);
        }

        function playNote(freq, id) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (activeOscillators[id]) return; // Already playing

            const t = audioCtx.currentTime;

            // 1. Oscillator: Sawtooth (Reedy sound)
            const osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, t);

            // 2. Filter: Lowpass (Make it woody/mellow)
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, t); // Cutoff freq
            filter.Q.value = 1;

            // 3. Envelope (VCA)
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(1, t + 0.05); // Attack

            // Connect
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            osc.start(t);

            activeOscillators[id] = { osc, gain };
        }

        function stopNote(id) {
            if (!activeOscillators[id]) return;
            
            const { osc, gain } = activeOscillators[id];
            const t = audioCtx.currentTime;

            // Release envelope
            gain.gain.cancelScheduledValues(t);
            gain.gain.setValueAtTime(gain.gain.value, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);

            osc.stop(t + 0.1);
            
            delete activeOscillators[id];
        }

        // --- Interaction Handling (Touch/Mouse) ---
        const btns = document.querySelectorAll('.note-btn');
        const activeTouches = new Map(); // touchId -> elementId

        function handleNoteStart(el, id) {
            if(!el) return;
            const freq = parseFloat(el.dataset.freq);
            el.classList.add('active');
            playNote(freq, id);
        }

        function handleNoteEnd(el, id) {
            if(!el) return;
            el.classList.remove('active');
            stopNote(id);
        }

        // Touch
        const grid = document.getElementById('notes-grid');
        
        grid.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.classList.contains('note-btn')) {
                    // Use frequency + touchID as unique key to allow same note re-trigger if needed
                    // But here we use Element reference for simplicity
                    const id = target.dataset.freq; 
                    activeTouches.set(touch.identifier, { el: target, id: id });
                    handleNoteStart(target, id);
                }
            }
        }, { passive: false });

        grid.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const data = activeTouches.get(touch.identifier);
                if (data) {
                    handleNoteEnd(data.el, data.id);
                    activeTouches.delete(touch.identifier);
                }
            }
        });

        // Mouse (for testing)
        btns.forEach(btn => {
            const id = btn.dataset.freq;
            btn.addEventListener('mousedown', () => handleNoteStart(btn, id));
            btn.addEventListener('mouseup', () => handleNoteEnd(btn, id));
            btn.addEventListener('mouseleave', () => handleNoteEnd(btn, id));
        });

        // Start Overlay
        document.getElementById('btn-start').addEventListener('click', () => {
            initAudio();
            document.getElementById('start-overlay').style.display = 'none';
            renderSavedList(); // Show saved files if any
        });


        // --- Recording Logic ---
        let mediaRecorder;
        let recordedChunks = [];
        let currentBlob = null;
        let currentUrl = null;
        let currentAudio = new Audio();

        const btnRecord = document.getElementById('btn-record');
        const btnStop = document.getElementById('btn-stop');
        const btnPlay = document.getElementById('btn-play');
        const btnSaveLocal = document.getElementById('btn-save-local');
        const btnDownload = document.getElementById('btn-download');
        const statusLight = document.getElementById('status-light');
        const statusText = document.getElementById('status-text');

        btnRecord.addEventListener('click', () => {
            initAudio();
            recordedChunks = [];
            currentBlob = null;
            
            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
            mediaRecorder = new MediaRecorder(dest.stream, { mimeType });

            mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
            
            mediaRecorder.onstop = () => {
                currentBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                currentUrl = URL.createObjectURL(currentBlob);
                
                // Enable controls
                btnPlay.disabled = false;
                btnDownload.disabled = false;
                btnSaveLocal.disabled = false;
                
                statusText.innerText = "พร้อม (มีไฟล์)";
                statusLight.classList.replace('bg-red-500', 'bg-green-500');
                btnRecord.classList.remove('pulse-record', 'border-red-500');
                btnRecord.disabled = false;
                btnStop.disabled = true;
            };

            mediaRecorder.start();
            
            // UI Update
            statusText.innerText = "กำลังอัด...";
            statusLight.classList.replace('bg-gray-500', 'bg-red-500');
            statusLight.classList.replace('bg-green-500', 'bg-red-500');
            btnRecord.classList.add('pulse-record', 'border-red-500');
            btnRecord.disabled = true;
            btnStop.disabled = false;
            btnPlay.disabled = true;
            btnSaveLocal.disabled = true;
            btnDownload.disabled = true;
        });

        btnStop.addEventListener('click', () => {
            if(mediaRecorder?.state === 'recording') mediaRecorder.stop();
        });

        btnPlay.addEventListener('click', () => {
            if(currentUrl) {
                currentAudio.src = currentUrl;
                currentAudio.play();
            }
        });

        btnDownload.addEventListener('click', () => {
            if(currentUrl) {
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = currentUrl;
                a.download = `pijum_${new Date().getTime()}.webm`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 100);
            }
        });

        // --- Local Storage Logic ---
        
        btnSaveLocal.addEventListener('click', () => {
            if(!currentBlob) return;
            
            const reader = new FileReader();
            reader.readAsDataURL(currentBlob);
            reader.onloadend = () => {
                const base64data = reader.result;
                const timestamp = new Date().toLocaleString('th-TH');
                
                try {
                    const saved = JSON.parse(localStorage.getItem('pijum_recordings') || '[]');
                    saved.unshift({
                        id: Date.now(),
                        name: `บันทึกเมื่อ ${timestamp}`,
                        data: base64data
                    });
                    
                    // Limit storage (keep last 5 to prevent quota exceeded)
                    if(saved.length > 5) saved.pop();
                    
                    localStorage.setItem('pijum_recordings', JSON.stringify(saved));
                    renderSavedList();
                    alert('บันทึกลง Local Storage เรียบร้อย!');
                } catch(e) {
                    alert('บันทึกไม่สำเร็จ: พื้นที่จัดเก็บเต็ม หรือไฟล์ใหญ่เกินไป');
                    console.error(e);
                }
            };
        });

        function renderSavedList() {
            const listEl = document.getElementById('recording-list');
            const container = document.getElementById('saved-area');
            const saved = JSON.parse(localStorage.getItem('pijum_recordings') || '[]');
            
            listEl.innerHTML = '';
            
            if(saved.length > 0) {
                container.classList.remove('hidden');
                saved.forEach(item => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-gray-800 p-2 rounded text-xs border border-gray-700";
                    li.innerHTML = `
                        <span class="truncate w-32 text-gray-300">${item.name}</span>
                        <div class="flex gap-2">
                            <button class="text-green-400 hover:text-green-300" onclick="playSaved('${item.data}')">เล่น</button>
                            <button class="text-red-400 hover:text-red-300" onclick="deleteSaved(${item.id})">ลบ</button>
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            } else {
                container.classList.add('hidden');
            }
        }

        window.playSaved = (base64) => {
            const audio = new Audio(base64);
            audio.play();
        };

        window.deleteSaved = (id) => {
            if(!confirm('ลบไฟล์นี้?')) return;
            let saved = JSON.parse(localStorage.getItem('pijum_recordings') || '[]');
            saved = saved.filter(i => i.id !== id);
            localStorage.setItem('pijum_recordings', JSON.stringify(saved));
            renderSavedList();
        };

        document.getElementById('btn-clear-storage').addEventListener('click', () => {
            if(confirm('ลบไฟล์เสียงที่บันทึกไว้ทั้งหมด?')) {
                localStorage.removeItem('pijum_recordings');
                renderSavedList();
            }
        });

        // Initialize view
        renderSavedList();

    </script>
</body>
</html>
