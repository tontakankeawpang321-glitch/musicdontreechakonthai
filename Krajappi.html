<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>กระจับปี่ จำลอง Pro Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            touch-action: none;
            overflow: hidden;
            background-color: #0f0f0e;
            user-select: none;
            -webkit-user-select: none;
        }

        /* เอฟเฟกต์ลายไม้ระดับพรีเมียมบนคอเครื่องดนตรี */
        .wood-neck {
            background: #3e2723;
            background-image: 
                linear-gradient(90deg, rgba(255,255,255,.03) 50%, transparent 50%),
                linear-gradient(90deg, rgba(0,0,0,.15) 30%, transparent 70%),
                linear-gradient(0deg, rgba(0,0,0,0.4) 0%, transparent 10%),
                linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 15%);
            background-size: 18px 100%, 45px 100%, 100% 20px, 100% 40px;
        }

        /* เอฟเฟกต์แสงคลื่นเสียงและจุดสัมผัส */
        .fret-cell {
            position: relative;
            transition: background-color 0.1s ease;
        }
        
        .fret-cell.active-pluck::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 10%, transparent 70%);
            pointer-events: none;
            z-index: 2;
            animation: ripple 0.3s ease-out;
        }

        @keyframes ripple {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* ปุ่มสัมผัสแบ่งช่องเฟรตทองเหลือง */
        .fret-wire {
            height: 4px;
            background: linear-gradient(180deg, #ddd, #fff, #999);
            width: 100%;
            position: absolute;
            bottom: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.6);
            z-index: 5;
        }

        /* จุดฝังมุกอ้างอิงตำแหน่งคอ (Inlays) */
        .inlay {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #fff, #ccc);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.7;
            box-shadow: 0 0 4px rgba(255,255,255,0.5);
            z-index: 1;
        }

        /* จุดไกด์สำหรับโหมดฝึกสอนเล่นทีละโน้ต */
        .tutor-highlight {
            position: absolute;
            width: 28px;
            height: 28px;
            background-color: rgba(16, 185, 129, 0.85);
            border: 3px solid #ffffff;
            border-radius: 50%;
            z-index: 30;
            box-shadow: 0 0 15px #10b981, 0 0 25px #10b981;
            animation: pulse-green 1s infinite alternate;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pulse-green {
            0% { transform: scale(0.9); box-shadow: 0 0 8px #10b981; }
            100% { transform: scale(1.25); box-shadow: 0 0 20px #10b981, 0 0 30px #10b981; }
        }

        .control-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .control-btn:active {
            transform: scale(0.9);
        }
        
        .recording-pulse {
            animation: pulse-red 1.2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); background-color: rgba(220, 38, 38, 1); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); background-color: rgba(185, 28, 28, 1); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); background-color: rgba(220, 38, 38, 1); }
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-neutral-950 text-stone-100 flex items-center justify-center">

            พร้อมบรรเลง
        </div>

        <!-- หน้าต่างเปิดการใช้งาน Web Audio API -->
        <div id="startOverlay" class="fixed inset-0 bg-black/95 z-[100] flex flex-col items-center justify-center text-center p-6">

            <p class="text-stone-400 mb-6 text-xs max-w-xs leading-relaxed">พัฒนาขึ้นมาเพื่อเรียนรู้เครื่องดนตรีโบราณของไทย กรุณาเปิดระบบเสียงและปิดโหมดสั่น</p>
            <button id="initAudioBtn" class="px-10 py-3 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white rounded-full font-bold text-sm shadow-lg transition transform active:scale-95 border border-amber-500">

    <script>
        // --- ระบบบันทึกเสียงและสร้างโมเดลกระจับปี่โบราณ ---
        // ชุดคีย์เสียงหลักที่สอดรับกับกระจับปี่แบบต่างๆ
        const tuningPresets = {
            standard: [
                { note: 'G2', freq: 98.00 },
                { note: 'C3', freq: 130.81 },
                { note: 'E3', freq: 164.81 },
                { note: 'G3', freq: 196.00 }
            ],
            lanna: [
                { note: 'F2', freq: 87.31 },
                { note: 'C3', freq: 130.81 },
                { note: 'F3', freq: 174.61 },
                { note: 'C4', freq: 261.63 }
            ],
            pentatonic: [
                { note: 'G2', freq: 98.00 },
                { note: 'A2', freq: 110.00 },
                { note: 'C3', freq: 130.81 },
                { note: 'D3', freq: 146.83 }
            ]
        };

        let currentTuning = tuningPresets.standard;

        // ข้อมูลโน้ตตามลําดับสเกลไทยโบราณในช่องต่างๆ (สำหรับ Tutor Mode)
        const noteNamesMap = [
            ["ซอลต่ำ", "โด", "มี", "ซอล"], // เฟรต 0
            ["ลาต่ำ", "เร", "ฟาสูง", "ลา"], // เฟรต 1
            ["ทีต่ำ", "มี", "ซอลสูง", "ที"], // เฟรต 2
            ["โดกลาง", "ฟา", "ลา", "โดสูง"], // เฟรต 3
            ["เรกลาง", "ซอล", "ที", "เรสูง"], // ...
            ["มีกลาง", "ลา", "โดสูง", "มีสูง"],
            ["ฟากลาง", "ที", "เรสูง", "ฟาสูงพิเศษ"],
            ["ซอลกลาง", "โดสูง", "มีสูง", "ซอลสูงพิเศษ"]
        ];

        // คลังโน้ตเพลงสาธิต (3 เพลง)
        const demoSongs = [
            // เพลงที่ 1: ค้างคาวกินกล้วย
            [
                [3, 0, 180], [3, 3, 180], [3, 5, 180], [3, 3, 180], [3, 5, 180], [3, 7, 180], [3, 5, 360],
                [2, 3, 180], [2, 5, 180], [3, 0, 180], [2, 5, 180], [3, 0, 180], [3, 3, 180], [3, 0, 360],
                [3, 5, 180], [3, 3, 180], [3, 0, 180], [2, 5, 180], [2, 3, 180], [2, 0, 180], [1, 3, 360]
            ],
            // เพลงที่ 2: ลาวดวงเดือน
            [
                [2, 0, 350], [2, 4, 350], [2, 7, 350], [3, 0, 500], [2, 7, 180], [3, 0, 350], [3, 2, 350], [3, 0, 700],
                [3, 4, 350], [3, 2, 350], [3, 0, 350], [2, 7, 350], [2, 4, 350], [2, 7, 350], [2, 0, 700]
            ],
            // เพลงที่ 3: คลื่นกระทบฝั่ง
            [
                [1, 0, 250], [1, 3, 250], [1, 5, 250], [2, 0, 250], [1, 5, 250], [2, 0, 250], [2, 3, 500],
                [2, 5, 250], [2, 3, 250], [2, 0, 250], [1, 5, 250], [2, 0, 250], [1, 5, 250], [1, 3, 500]
            ]
        ];

        // ตัวแปร Audio API และพารามิเตอร์ของระบบสังเคราะห์เสียง
        let audioCtx;
        let masterGain;
        let compressor;
        let dest;
        let mediaRecorder;
        let recordedChunks = [];
        let audioUrl;
        let isRecording = false;
        let demoTimeoutSequence = [];
        let isDemoPlaying = false;

        // ตัวแปรสภาวะการฝึกสอน (Tutor Mode State)
        let isTutorMode = false;
        let tutorTrackIdx = 0;
        let tutorStepIndex = 0;

        let config = {
            decay: 1.6,
            filterMult: 4.5,
            clickVol: 0.08,
            oscType: 'triangle'
        };

        // --- ระบบสั่นไหวของสายดนตรี (Canvas Physics Simulation) ---
        const canvas = document.getElementById('stringCanvas');
        const ctx = canvas.getContext('2d');
        let stringYCoords = [0, 0, 0, 0]; // พิกัดแนวตั้งของสาย
        let vibrationAmplitudes = [0, 0, 0, 0]; // แอมพลิจูดปัจจุบัน
        let vibrationFrequencies = [0.15, 0.18, 0.22, 0.26]; // คลื่นความถี่ต่อสาย
        let vibrationPhases = [0, 0, 0, 0];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 300);

        // แอนิเมชันลูปการวาดและลดกำลังการสั่นของสายกระจับปี่
        function drawStrings() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const numStrings = 4;
            const w = canvas.width;
            const h = canvas.height;
            const colWidth = w / numStrings;

            for (let i = 0; i < numStrings; i++) {
                const baseLineX = (colWidth * i) + (colWidth / 2);
                
                // ค่อยๆ ลดทอนแรงสั่น (Damping)
                vibrationAmplitudes[i] *= 0.95;
                vibrationPhases[i] += vibrationFrequencies[i];

                ctx.beginPath();
                ctx.moveTo(baseLineX, 0);
                
                const amp = vibrationAmplitudes[i];
                const phase = vibrationPhases[i];
                
                if (amp > 0.05) {
                    // วาดสายสั่นไหวพริ้วรูปคลื่นแบบ Sine Wave
                    for (let y = 10; y < h; y += 10) {
                        const sineWave = Math.sin((y * 0.015) + phase) * Math.sin((y / h) * Math.PI);
                        const offsetX = sineWave * amp;
                        ctx.lineTo(baseLineX + offsetX, y);
                    }
                } else {
                    ctx.lineTo(baseLineX, h);
                }

                // สไตล์สายกระจับปี่: สาย 1-2 เป็นทองเหลือง, สาย 3-4 เป็นสายขาวเงิน
                if (i < 2) {
                    ctx.strokeStyle = i === 0 ? '#b8860b' : '#d4af37';
                    ctx.lineWidth = i === 0 ? 3.0 : 2.2;
                } else {
                    ctx.strokeStyle = '#e0e0e0';
                    ctx.lineWidth = i === 2 ? 1.6 : 1.2;
                }
                
                ctx.shadowColor = i < 2 ? 'rgba(184, 134, 11, 0.5)' : 'rgba(255, 255, 255, 0.3)';
                ctx.shadowBlur = amp > 0.1 ? 6 : 2;
                
                ctx.stroke();
            }
            
            requestAnimationFrame(drawStrings);
        }

        requestAnimationFrame(drawStrings);

        /**
         * ฟังก์ชันเปิดใช้งานระบบ Web Audio API และจัดเตรียม Node สำหรับคุมโทนเสียงและอัดเสียง
         */
        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // จัดตั้งคอมเพรสเซอร์คุมเกนสัญญาณกันเสียงพุ่งแตกโพลาไรซ์
            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
            compressor.knee.setValueAtTime(30, audioCtx.currentTime);
            compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
            compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
            compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.8;

            compressor.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            // เซ็ตโครงสร้างการดักอัดข้อมูลคลื่นเสียงเข้า MediaStream
            dest = audioCtx.createMediaStreamDestination();
            masterGain.connect(dest);

            document.getElementById('startOverlay').classList.add('hidden');
            showStatus("เชื่อมต่อระบบเสียงแล้ว พร้อมบรรเลง");
        }

        // ฟังก์ชันสร้างเสียงดีดที่คำนึงถึง Harmonics ของสายทางกายภาพ
        function playPluckAudio(frequency) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;

            // ผสมคลื่นเสียงหลักกับ Harmonics 2 ชั้นเพื่อเพิ่มโทนเสียงเนื้อไม้โบราณ
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const osc3 = audioCtx.createOscillator();

            osc1.type = config.oscType;
            osc2.type = 'sine';
            osc3.type = 'sine';

            osc1.frequency.setValueAtTime(frequency, t);
            osc2.frequency.setValueAtTime(frequency * 2, t); // Harmonic ที่สอง
            osc3.frequency.setValueAtTime(frequency * 3, t); // Harmonic ที่สาม

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.Q.value = 4;
            filter.frequency.setValueAtTime(frequency * config.filterMult, t);
            filter.frequency.exponentialRampToValueAtTime(frequency, t + 0.08);

            const g1 = audioCtx.createGain();
            const g2 = audioCtx.createGain();
            const g3 = audioCtx.createGain();
            const mixGain = audioCtx.createGain();

            // สัดส่วนน้ำหนักคลื่นหลักและคลื่นเสียงซ้อน
            g1.gain.setValueAtTime(0.7, t);
            g1.gain.exponentialRampToValueAtTime(0.001, t + config.decay);
            
            g2.gain.setValueAtTime(0.2, t);
            g2.gain.exponentialRampToValueAtTime(0.001, t + (config.decay * 0.5));

            g3.gain.setValueAtTime(0.1, t);
            g3.gain.exponentialRampToValueAtTime(0.001, t + (config.decay * 0.25));

            osc1.connect(g1);
            osc2.connect(g2);
            osc3.connect(g3);

            g1.connect(filter);
            g2.connect(filter);
            g3.connect(filter);

            filter.connect(mixGain);
            mixGain.connect(compressor);

            osc1.start(t);
            osc2.start(t);
            osc3.start(t);

            osc1.stop(t + config.decay + 0.1);
            osc2.stop(t + config.decay + 0.1);
            osc3.stop(t + config.decay + 0.1);

            // คลื่นเสียงกิ๊กเพื่อจำลองไม้ดีด (Attack Plucking Noise)
            if (config.clickVol > 0) {
                const clickOsc = audioCtx.createOscillator();
                const clickGain = audioCtx.createGain();
                clickOsc.type = 'sawtooth';
                clickOsc.frequency.setValueAtTime(160, t);
                
                clickGain.gain.setValueAtTime(config.clickVol, t);
                clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
                
                clickOsc.connect(clickGain);
                clickGain.connect(compressor);
                clickOsc.start(t);
                clickOsc.stop(t + 0.04);
            }
        }

        // ประมวลความสั่นไหวและเรียกใช้เสียงดีด
        function playSound(baseFreq, fretIndex, stringIdx) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            let frequency = baseFreq * Math.pow(2, fretIndex / 12);
            playPluckAudio(frequency);

            // ทริกเกอร์แรงสั่นสะเทือนใน Canvas ตามสายนั้นๆ
            vibrationAmplitudes[stringIdx] = 18 - (fretIndex * 1.2); // เฟรตสั้นลง การสั่นจะน้อยลง
        }

        // --- ระบบสร้างหน้าคอเครื่องดนตรี (Dynamic Fretboard Renderer) ---
        const fretboard = document.getElementById('fretboard');
        const numFrets = 7;

        function createFretboard() {
            fretboard.innerHTML = '';
            for (let f = 0; f <= numFrets; f++) {
                for (let s = 0; s < 4; s++) {
                    const cell = document.createElement('div');
                    
                    let borderClass = (f === 0) ? "border-b-[3px] border-amber-600 bg-stone-950/40" : "border-b border-stone-800";
                    if (f === numFrets) borderClass = "";
                    
                    cell.className = `fret-cell relative h-[10.5vh] flex justify-center items-center cursor-pointer ${borderClass}`;
                    cell.dataset.string = s;
                    cell.dataset.fret = f;

                    // วาดเส้นทองเหลืองแบ่งสเกล (Fret Wire)
                    if (f > 0) {
                        const fretWire = document.createElement('div');
                        fretWire.className = 'fret-wire';
                        cell.appendChild(fretWire);
                    }

                    // เม็ดฝังประดับมุก (Inlay Double Marker) ที่สากลนิยมฝัง
                    if ((f === 3 || f === 5 || f === 7) && s === 1) {
                        const inlay = document.createElement('div');
                        inlay.className = 'inlay';
                        inlay.style.right = "-7px";
                        inlay.style.left = "auto";
                        cell.appendChild(inlay);
                    }

                    // ป้ายบอกสถานะสายเปิด
                    if (f === 0) {
                        const label = document.createElement('span');
                        label.className = "text-[9px] text-amber-500/40 absolute top-1 pointer-events-none scale-75";
                        label.innerText = "เปิด";
                        cell.appendChild(label);
                    }

                    // สัมผัสดีดกระจับปี่
                    const handlePress = (e) => {
                        e.preventDefault();
                        
                        // ถ้าระหว่างออโต้เพลงสาธิตกำลังเล่น ให้ยกเลิกอัตโนมัติ
                        if (isDemoPlaying) stopDemo();

                        // แสดงแรงกระเพื่อมเมื่อสายโดนสัมผัส
                        cell.classList.add('active-pluck');
                        setTimeout(() => cell.classList.remove('active-pluck'), 300);

                        // เรียกเสียง
                        playSound(currentTuning[s].freq, f, s);

                        // ตรวจสอบกับกระบวนการทำงานของระบบโหมดฝึกเล่นแบบโต้ตอบ
                        if (isTutorMode) {
                            handleTutorCheck(s, f);
                        }
                    };

                    cell.addEventListener('touchstart', handlePress, {passive: false});
                    cell.addEventListener('mousedown', handlePress);

                    fretboard.appendChild(cell);
                }
            }
        }

        // --- ส่วนควบคุมโหมดฝึกซ้อมเล่นทีละโน้ต (Interactive Tutor Engine) ---
        function startTutor(trackIdx) {
            stopDemo();
            isTutorMode = true;
            tutorTrackIdx = trackIdx;
            tutorStepIndex = 0;
            
            document.getElementById('tutorControls').classList.remove('hidden');
            
            // อัปเดต UI ปุ่มฝึกสอน
            document.querySelectorAll('.tutor-track-btn').forEach((btn, idx) => {
                if (idx === trackIdx) {
                    btn.classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
                } else {
                    btn.classList.remove('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
                }
            });

            highlightNextTutorNote();
        }

        function highlightNextTutorNote() {
            if (!isTutorMode) return;

            const song = demoSongs[tutorTrackIdx];
            if (tutorStepIndex >= song.length) {
                // จบหลักสูตรเพลงฝึกหัด
                showStatus("🎉 ยอดเยี่ยม! คุณบรรเลงเพลงนี้สำเร็จ");
                stopTutor();
                return;
            }

            const [stringIdx, fretIdx] = song[tutorStepIndex];
            const targetCell = document.querySelector(`[data-string="${stringIdx}"][data-fret="${fretIdx}"]`);
            const indicator = document.getElementById('tutorIndicator');

            if (targetCell && indicator) {
                indicator.classList.remove('hidden');
                
                // คำนวณขยับตำแหน่งไกด์ป๊อปอัพมาทับบนเฟรตเซลล์เป้าหมาย
                const rect = targetCell.getBoundingClientRect();
                const parentRect = targetCell.offsetParent.getBoundingClientRect();
                
                indicator.style.top = `${rect.top - parentRect.top + (rect.height / 2) - 14}px`;
                indicator.style.left = `${rect.left - parentRect.left + (rect.width / 2) - 14}px`;

                // สลักชื่อโน้ตให้อ่านประกอบ
                const noteName = noteNamesMap[fretIdx][stringIdx];
                document.getElementById('tutorNextNoteName').innerText = `${noteName} (สาย ${stringIdx + 1} เฟรต ${fretIdx})`;
                document.getElementById('tutorProgress').innerText = `ความคืบหน้า: โน้ตที่ ${tutorStepIndex + 1}/${song.length}`;
            }
        }

        function handleTutorCheck(pressedString, pressedFret) {
            const song = demoSongs[tutorTrackIdx];
            const [targetString, targetFret] = song[tutorStepIndex];

            if (pressedString === targetString && pressedFret === targetFret) {
                // เล่นโน้ตถูกต้อง ไปยังขั้นถัดไป
                tutorStepIndex++;
                setTimeout(highlightNextTutorNote, 100);
            }
        }

        function stopTutor() {
            isTutorMode = false;
            document.getElementById('tutorIndicator').classList.add('hidden');
            document.getElementById('tutorControls').classList.add('hidden');
            document.getElementById('tutorProgress').innerText = "โปรดเลือกเพลงด้านล่าง";
            
            document.querySelectorAll('.tutor-track-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
            });
        }

        // --- ส่วนควบคุมเพลงสาธิตอัตโนมัติ (Autoplay Demo) ---
        function playDemo(trackIdx) {
            stopDemo();
            stopTutor();
            isDemoPlaying = true;
            document.getElementById('stopDemoBtn').classList.remove('hidden');
            showStatus("กำลังบรรเลงเพลงสาธิต...");

            // เปลี่ยนไอคอนสปีนเนอร์ที่ปุ่มที่กำลังรัน
            document.querySelectorAll('.demo-track-btn').forEach((btn, idx) => {
                const icon = btn.querySelector('i');
                if (idx === trackIdx) {
                    icon.className = 'fas fa-circle-notch fa-spin text-[10px] mr-1 text-amber-500';
                } else {
                    icon.className = 'fas fa-play text-[10px] mr-1 text-amber-500';
                }
            });

            const song = demoSongs[trackIdx];
            let accumTime = 0;

            song.forEach((noteData, index) => {
                const [stringIdx, fretIdx, duration] = noteData;
                const timeoutId = setTimeout(() => {
                    
                    // ทริกเกอร์เสียงและส่องแสงที่กระดานเฟรต
                    const cell = document.querySelector(`[data-string="${stringIdx}"][data-fret="${fretIdx}"]`);
                    if (cell) {
                        cell.classList.add('active-pluck');
                        setTimeout(() => cell.classList.remove('active-pluck'), 300);
                    }
                    
                    playSound(currentTuning[stringIdx].freq, fretIdx, stringIdx);

                    // เงื่อนไขปิดสเตจการรันอัตโนมัติเมื่อสิ้นสุดตัวโน้ตตัวสุดท้ายของเพลง
                    if (index === song.length - 1) {
                        setTimeout(() => {
                            stopDemo();
                            showStatus("จบเพลงสาธิตแล้ว");
                        }, duration);
                    }

                }, accumTime);

                demoTimeoutSequence.push(timeoutId);
                accumTime += duration;
            });
        }

        function stopDemo() {
            isDemoPlaying = false;
            demoTimeoutSequence.forEach(id => clearTimeout(id));
            demoTimeoutSequence = [];
            document.getElementById('stopDemoBtn').classList.add('hidden');

            document.querySelectorAll('.demo-track-btn').forEach(btn => {
                const icon = btn.querySelector('i');
                if (icon) icon.className = 'fas fa-play text-[10px] mr-1 text-amber-500';
            });
        }

        // --- การผูกความสัมพันธ์ Event Listeners ของปุ่มควบคุมการบันทึกเสียง ---
        const advancedPanel = document.getElementById('advancedPanel');
        const demoPanel = document.getElementById('demoPanel');
        const tutorPanel = document.getElementById('tutorPanel');
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('statusText');
        let audioPlayer = new Audio();

        function showStatus(text) {
            statusText.innerText = text;
            statusText.style.opacity = 1;
            clearTimeout(statusText.timeout);
            statusText.timeout = setTimeout(() => statusText.style.opacity = 0, 2000);
        }

        // เปิด/ปิดแผงการตั้งค่าเสียง
        document.getElementById('advancedBtn').addEventListener('click', () => {
            advancedPanel.classList.toggle('hidden');
            demoPanel.classList.add('hidden');
            tutorPanel.classList.add('hidden');
        });

        // เปิด/ปิดแผงเพลงสาธิต
        document.getElementById('demoPanelBtn').addEventListener('click', () => {
            demoPanel.classList.toggle('hidden');
            advancedPanel.classList.add('hidden');
            tutorPanel.classList.add('hidden');
        });

        // เปิด/ปิดแผงติวเตอร์ฝึกหัดเรียนรู้ทีละขั้นตอน
        document.getElementById('tutorBtn').addEventListener('click', () => {
            tutorPanel.classList.toggle('hidden');
            advancedPanel.classList.add('hidden');
            demoPanel.classList.add('hidden');
        });

        // ระบบควบคุมสไลเดอร์เสียง
        document.getElementById('decaySlider').addEventListener('input', (e) => {
            config.decay = parseFloat(e.target.value);
            document.getElementById('decayVal').innerText = e.target.value + 's';
        });
        document.getElementById('filterSlider').addEventListener('input', (e) => {
            config.filterMult = parseFloat(e.target.value);
            document.getElementById('filterVal').innerText = e.target.value + 'x';
        });
        document.getElementById('clickSlider').addEventListener('input', (e) => {
            config.clickVol = parseFloat(e.target.value);
            document.getElementById('clickVal').innerText = e.target.value;
        });

        // ระบบเลือกคีย์เสียงตั้งสาย (Tuning Preset Changer)
        document.getElementById('tuningSelect').addEventListener('change', (e) => {
            const key = e.target.value;
            currentTuning = tuningPresets[key];
            
            // อัปเดตเลเบลตัวอักษรกำกับที่ฟุตเตอร์ท้ายสุด
            for (let i = 0; i < 4; i++) {
                document.getElementById(`stringTuningLabel${i}`).innerText = currentTuning[i].note;
            }
            
            // เจนคอบอร์ดใหม่เพื่อเคลียร์เสียง
            createFretboard();
            if (isTutorMode) highlightNextTutorNote();
            showStatus(`เปลี่ยนคีย์เสียงแบบ: ${e.target.options[e.target.selectedIndex].text}`);
        });

        // เชื่อมโยงปุ่มฝึกซ้อม
        document.querySelectorAll('.tutor-track-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const trackIdx = parseInt(this.getAttribute('data-track'));
                startTutor(trackIdx);
            });
        });

        document.getElementById('quitTutorBtn').addEventListener('click', () => {
            stopTutor();
            showStatus("ออกจากโหมดฝึกแล้ว");
        });

        // เชื่อมโยงปุ่มเล่นเพลงสาธิต
        document.querySelectorAll('.demo-track-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const trackIdx = parseInt(this.getAttribute('data-track'));
                playDemo(trackIdx);
            });
        });

        document.getElementById('stopDemoBtn').addEventListener('click', () => {
            stopDemo();
            showStatus("หยุดบรรเลง");
        });

        // --- ระบบอัดเสียงประสิทธิภาพสูง ---
        recordBtn.addEventListener('click', () => {
            if (!audioCtx) return;

            if (!isRecording) {
                recordedChunks = [];
                let options = { mimeType: 'audio/webm' };
                if (!MediaRecorder.isTypeSupported('audio/webm')) {
                    options = { mimeType: 'audio/mp4' };
                    if (!MediaRecorder.isTypeSupported('audio/mp4')) options = {};
                }

                try {
                    mediaRecorder = new MediaRecorder(dest.stream, options);
                } catch (err) {
                    showStatus("การบันทึกเสียงไม่พร้อมทำงานบนบราวเซอร์นี้");
                    return;
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: options.mimeType || 'audio/webm' });
                    audioUrl = URL.createObjectURL(blob);
                    audioPlayer.src = audioUrl;
                    playBtn.disabled = false;
                    downloadBtn.disabled = false;
                    showStatus("บันทึกเสร็จสิ้นแล้ว");
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerHTML = '<i class="fas fa-stop"></i>';
                recordBtn.classList.add('recording-pulse', 'text-white');
                showStatus("กำลังอัดเสียงบรรเลงของคุณ...");
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerHTML = '<i class="fas fa-microphone"></i>';
                recordBtn.classList.remove('recording-pulse', 'text-white');
            }
        });

        playBtn.addEventListener('click', () => {
            if (audioUrl) {
                if (audioPlayer.paused) {
                    audioPlayer.play();
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    audioPlayer.onended = () => {
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    };
                } else {
                    audioPlayer.pause();
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                }
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (audioUrl) {
                const a = document.createElement('a');
                a.href = audioUrl;
                a.download = `krajappi_pro_track_${new Date().getTime()}.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showStatus("กําลังเริ่มดาวน์โหลดไฟล์เสียง...");
            }
        });

        // สตาร์ตระบบเบื้องแรก
        createFretboard();
        document.getElementById('initAudioBtn').addEventListener('click', initAudio);
    </script>
</body>
