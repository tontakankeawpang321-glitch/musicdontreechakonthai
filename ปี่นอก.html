<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ปี่นอก (Full Screen)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');

        /* ป้องกันการเด้งของหน้าจอ */
        * { box-sizing: border-box; }

        body {
            font-family: 'Sarabun', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background-color: #050505;
            overflow: hidden; /* ห้ามเลื่อน */
            overscroll-behavior: none;
            height: 100dvh; /* ใช้ dynamic viewport height */
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }

        /* พื้นหลังลายไม้ - ปรับสีให้เหมือนไม้ชิงชัน/พะยูง (เข้มอมแดง) */
        .wood-texture {
            background: linear-gradient(90deg, 
                #1a0b05 0%, 
                #3e2723 15%, 
                #5d4037 45%, 
                #4e342e 50%, 
                #5d4037 55%, 
                #3e2723 85%, 
                #1a0b05 100%);
            box-shadow: inset 0 0 60px #000, 5px 0 25px rgba(0,0,0,0.6);
            border-radius: 20px 20px 0 0; 
            position: absolute;
            top: 0; bottom: 0;
            width: 100%;
            max-width: 320px;
            z-index: 0;
            border-left: 2px solid #000;
            border-right: 2px solid #000;
        }

        /* ลายเสี้ยนไม้บางๆ */
        .wood-texture::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            opacity: 0.3;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* Grid Container */
        #hole-container {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: repeat(7, 1fr); 
            gap: 2px 8vw; /* ขยับห่างนิดหน่อยเพื่อให้รูดูเด่น */
            padding: 2vh 5vw; 
            justify-items: center;
            align-items: center;
            height: 100%;
            width: 100%;
            max-width: 340px;
            z-index: 10;
        }

        /* รูนิ้วกด - ดีไซน์ใหม่ให้เหมือนรูเจาะไม้ */
        .hole {
            width: 100%;
            height: 100%;
            max-width: 58px; 
            max-height: 58px;
            aspect-ratio: 1/1; 
            border-radius: 50%;
            
            /* พื้นหลังเป็นรูมืดๆ เหมือนเจาะลงไป */
            background: radial-gradient(circle at 70% 70%, #2a1b15 0%, #000 60%);
            
            /* ขอบรูนูนขึ้นมานิดหน่อย */
            border: 2px solid #4e342e; 
            box-shadow: 
                inset 3px 3px 6px #000, /* เงาด้านในเพื่อให้ดูลึก */
                inset -1px -1px 2px rgba(255,255,255,0.1), /* แสงจับขอบรูด้านใน */
                0 1px 2px rgba(255,255,255,0.05); /* แสงจับขอบนูนด้านนอก */
            
            transition: transform 0.05s ease-out;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* ปรับสีขอบเล็กน้อยสำหรับเสียงสูงเพื่อให้แยกแยะง่ายขึ้น แต่ยังคงความสมจริง */
        .hole.high-pitch {
            border-color: #6d4c41; /* ขอบสีอ่อนกว่านิดหน่อย */
        }

        /* Active State: นิ้วปิดรูสนิท */
        .hole.active {
            transform: scale(0.96); 
            background: #000; /* มืดสนิท */
            border-color: #8d6e63; /* ขอบสว่างขึ้นเหมือนโดนกด */
            box-shadow: 
                inset 0 0 15px #000,
                0 0 8px rgba(255, 167, 38, 0.3); /* เรืองแสงสีส้มจางๆ */
            color: rgba(255,255,255,0.9);
        }

        .vibrating { animation: shake 0.2s infinite; }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(0.5px); }
            75% { transform: translateX(-0.5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Header -->
    <div class="flex-none w-full px-4 pt-3 pb-2 z-20 bg-gray-900/90 backdrop-blur-sm border-b border-gray-800">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-lg font-bold text-amber-500 leading-none" style="text-shadow: 0 0 5px rgba(245, 158, 11, 0.3);">ปี่นอกจำลอง</h1>
            <div id="status" class="text-[10px] text-gray-400 bg-gray-800 px-2 py-0.5 rounded-full">พร้อมใช้งาน</div>
        </div>

        <!-- Controls Row -->
        <div class="flex gap-3 h-8 mb-1">
            <button id="recordBtn" class="flex-1 bg-gray-800 hover:bg-gray-700 rounded-lg flex justify-center items-center gap-2 active:scale-95 transition-all border border-gray-700">
                <i class="fas fa-microphone text-xs text-gray-400"></i>
                <span class="text-xs font-medium">อัดเสียง</span>
            </button>
            <button id="playBtn" disabled class="flex-1 bg-gray-800 hover:bg-gray-700 rounded-lg flex justify-center items-center gap-2 opacity-50 transition-all border border-gray-700">
                <i class="fas fa-play text-xs text-green-500"></i>
                <span class="text-xs font-medium">เล่น</span>
            </button>
            <button id="downloadBtn" disabled class="flex-1 bg-gray-800 hover:bg-gray-700 rounded-lg flex justify-center items-center gap-2 opacity-50 transition-all border border-gray-700">
                <i class="fas fa-download text-xs text-blue-500"></i>
                <span class="text-xs font-medium">โหลด</span>
            </button>
        </div>
        
        <!-- Labels -->
        <div class="flex justify-between px-12 text-[9px] font-bold text-gray-600 uppercase tracking-widest mt-1">
            <span>เสียงปกติ</span>
            <span class="text-amber-700">เสียงสูง</span>
        </div>
    </div>

    <!-- Instrument Body -->
    <div class="flex-grow relative w-full flex justify-center overflow-hidden bg-black">
        <!-- พื้นหลังสีดำจางๆ ด้านข้าง -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_transparent_0%,_#000_100%)] z-10 pointer-events-none"></div>
        
        <div id="instrument-body" class="wood-texture"></div>
        
        <!-- Grid ปุ่มกด -->
        <div id="hole-container">
            <!-- Buttons Generated by JS -->
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-8 text-center backdrop-blur-md">
        <div class="w-16 h-16 bg-gradient-to-br from-amber-700 to-amber-900 rounded-full flex items-center justify-center mb-6 shadow-lg shadow-amber-900/20 border border-amber-800">
            <i class="fas fa-music text-2xl text-amber-100"></i>
        </div>
        <h2 class="text-xl font-bold mb-3 text-white">ปี่นอกจำลอง</h2>
        <p class="text-gray-400 text-sm mb-8 leading-relaxed">
            ดีไซน์ไม้และรูเจาะเสมือนจริง<br>
            <span class="text-xs text-gray-500">(กรุณาใส่ลิงก์ไฟล์เสียงในโค้ดเพื่อเริ่มเล่น)</span>
        </p>
        <button id="start-btn" class="bg-amber-700 hover:bg-amber-600 text-white font-bold py-3 px-10 text-sm rounded-full shadow-lg shadow-amber-900/50 active:scale-95 transition-all">
            เริ่มใช้งาน
        </button>
    </div>

    <script>
        // ==========================================
        // 1. ใส่ลิงก์เสียงที่นี่ (14 ช่อง)
        // ==========================================
        const soundLinks = {
            // ซ้าย: ปกติ (บนลงล่าง)
            "L1": "pee/do.wav", "L2": "pee/re.wav", "L3": "pee/mee.wav", "L4": "pee/fa.wav", "L5": "pee/so.wav", "L6": "pee/la.wav", "L7": "pee/Tee.wav",
            // ขวา: สูง (บนลงล่าง)
            "H1": "pee/dosod.wav", "H2": "pee/reso.wav", "H3": "pee/meeso.wav", "H4": "pee/faso.wav", "H5": "pee/sonso.wav", "H6": "pee/laso.wav", "H7": "pee/Tso.wav"
        };

        const labels = ["ด", "ร", "ม", "ฟ", "ซ", "ล", "ท"];

        // ==========================================
        // 2. Audio Engine
        // ==========================================
        let audioCtx;
        let masterGain;
        let audioBuffers = {};
        let activeSources = {}; 
        
        let mediaDest, mediaRecorder;
        let audioChunks = [], recordedAudioUrl = null, isRecording = false;

        const holeContainer = document.getElementById('hole-container');
        const instrumentBody = document.getElementById('instrument-body');
        const statusEl = document.getElementById('status');

        // สร้างปุ่ม 14 ปุ่ม (7 แถว)
        for (let i = 0; i < 7; i++) {
            createHole(`L${i+1}`, labels[i], 'normal-pitch');
            createHole(`H${i+1}`, labels[i] + "ํ", 'high-pitch');
        }

        function createHole(id, text, typeClass) {
            const btn = document.createElement('div');
            btn.className = `hole ${typeClass}`;
            btn.innerHTML = `<span class="pointer-events-none">${text}</span>`;
            btn.dataset.id = id;

            // Event Listeners สำหรับการกด
            const startPlay = (e) => {
                if (e.cancelable) e.preventDefault();
                playSound(id, btn);
            };
            const stopPlay = (e) => {
                if (e.cancelable) e.preventDefault();
                stopSound(id, btn);
            };

            btn.addEventListener('touchstart', startPlay, { passive: false });
            btn.addEventListener('touchend', stopPlay);
            btn.addEventListener('mousedown', startPlay);
            btn.addEventListener('mouseup', stopPlay);
            btn.addEventListener('mouseleave', stopPlay);

            holeContainer.appendChild(btn);
        }

        // เริ่มระบบเสียง
        document.getElementById('start-btn').addEventListener('click', async () => {
            initAudio();
            document.getElementById('overlay').classList.add('hidden');
            await loadSounds();
        });

        function initAudio() {
            const AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.8;
            
            mediaDest = audioCtx.createMediaStreamDestination();
            masterGain.connect(audioCtx.destination);
            masterGain.connect(mediaDest);
        }

        async function loadSounds() {
            statusEl.innerText = "กำลังโหลด...";
            const keys = Object.keys(soundLinks);
            
            await Promise.all(keys.map(async (key) => {
                const url = soundLinks[key];
                if (url) {
                    try {
                        const res = await fetch(url);
                        const buff = await res.arrayBuffer();
                        audioBuffers[key] = await audioCtx.decodeAudioData(buff);
                    } catch (e) { console.warn("Error loading sound:", key); }
                }
            }));
            statusEl.innerText = "พร้อมใช้งาน";
        }

        function playSound(id, btn) {
            if (!audioCtx || !audioBuffers[id]) return;

            if (activeSources[id]) {
                try { activeSources[id].source.stop(); } catch(e){}
            }

            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers[id];
            source.loop = true;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05);

            source.connect(gain);
            gain.connect(masterGain);
            source.start(0);

            activeSources[id] = { source, gain };

            // Visual Feedback
            btn.classList.add('active');
            instrumentBody.classList.add('vibrating');
        }

        function stopSound(id, btn) {
            const item = activeSources[id];
            if (item) {
                const { source, gain } = item;
                const t = audioCtx.currentTime;
                
                gain.gain.cancelScheduledValues(t);
                gain.gain.setValueAtTime(gain.gain.value, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.1);
                
                setTimeout(() => { try { source.stop(); } catch(e){} }, 100);
                delete activeSources[id];
            }

            // Remove Active Class
            btn.classList.remove('active');
            if (Object.keys(activeSources).length === 0) {
                instrumentBody.classList.remove('vibrating');
            }
        }

        // ==========================================
        // 3. ระบบอัดเสียง (Recording)
        // ==========================================
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        recordBtn.addEventListener('click', () => isRecording ? stopRec() : startRec());

        function startRec() {
            if (!audioCtx) initAudio();
            audioChunks = [];
            const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
            mediaRecorder = new MediaRecorder(mediaDest.stream, { mimeType: mime });
            
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: mime });
                recordedAudioUrl = URL.createObjectURL(blob);
                playBtn.disabled = false;
                downloadBtn.disabled = false;
                playBtn.classList.remove('opacity-50');
                downloadBtn.classList.remove('opacity-50');
                statusEl.innerText = "บันทึกแล้ว";
            };

            mediaRecorder.start();
            isRecording = true;
            
            recordBtn.classList.replace('bg-gray-800', 'bg-red-900');
            recordBtn.classList.replace('border-gray-700', 'border-red-900');
            recordBtn.innerHTML = `<i class="fas fa-stop text-red-500 text-xs"></i><span class="text-xs font-medium text-red-400">หยุด</span>`;
        }

        function stopRec() {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.classList.replace('bg-red-900', 'bg-gray-800');
            recordBtn.classList.replace('border-red-900', 'border-gray-700');
            recordBtn.innerHTML = `<i class="fas fa-microphone text-xs text-gray-400"></i><span class="text-xs font-medium">อัดเสียง</span>`;
        }

        playBtn.addEventListener('click', () => {
            if (recordedAudioUrl) {
                const audio = new Audio(recordedAudioUrl);
                audio.play();
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (recordedAudioUrl) {
                const a = document.createElement('a');
                a.href = recordedAudioUrl;
                a.download = `Pi_Nok_${Date.now()}.webm`;
                a.click();
            }
        });

    </script>
</body>
</html>
