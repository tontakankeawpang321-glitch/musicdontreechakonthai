<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Electone Mobile Pro (61 Keys Vertical)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevent selection and scrolling behaviors for game-like feel */
        body {
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Sarabun', sans-serif;
            background-color: #1a1a1a;
        }

        /* Key Styles - Vertical Layout Adjustment */
        .key {
            position: relative;
            cursor: pointer;
            transition: all 0.05s; /* Faster response for many keys */
            /* Border for vertical stack separation */
            border-bottom: 1px solid #aaa; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .white-key {
            /* Horizontal gradient for vertical keys */
            background: linear-gradient(to right, #ffffff 0%, #eeeeee 100%);
            z-index: 1;
            width: 100%; /* Full width */
        }

        .white-key:active, .white-key.active {
            background: #d4d4d4;
            transform: translateX(-2px); /* Press effect moves left slightly */
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.2);
        }

        .black-key {
            /* Vertical key style: shorter width, aligned right */
            background: linear-gradient(to right, #444 0%, #000 100%);
            z-index: 2;
            position: absolute;
            right: 0; /* Stick to right edge */
            width: 60%; /* Short key */
            height: 60%; /* Height relative to white key, will straddle */
            top: -30%; /* Shift up to straddle the boundary */
            border-radius: 4px 0 0 4px;
            box-shadow: -1px 1px 2px rgba(0,0,0,0.6);
            border-bottom: 1px solid #222;
        }

        .black-key:active, .black-key.active {
            background: #222;
            width: 58%; /* Visual press effect */
            box-shadow: inset -2px 0 5px rgba(255,255,255,0.1);
        }

        /* Note Labels - Make smaller for 61 keys */
        .note-label {
            position: absolute;
            left: 4px; /* Align text to left */
            top: 50%;
            transform: translateY(-50%);
            text-align: left;
            font-size: 0.6rem; /* Smaller font */
            color: #888;
            pointer-events: none;
            font-weight: bold;
            opacity: 0.8;
        }
        .black-key .note-label {
            color: #ccc;
            left: 4px;
            font-size: 0.55rem;
        }

        /* C notes highlight */
        .note-c-highlight {
            color: #eab308 !important; /* Yellow-500 */
        }

        /* Controls Panel */
        .control-btn {
            transition: all 0.2s;
            transform: scale(1);
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #444;
            display: inline-block;
            margin-right: 6px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        .led.on {
            background-color: #ff3333;
            box-shadow: 0 0 5px #ff3333, inset 0 1px 2px rgba(255,255,255,0.5);
        }
        .led.play-on {
            background-color: #33ff33;
            box-shadow: 0 0 5px #33ff33, inset 0 1px 2px rgba(255,255,255,0.5);
        }

        /* Top decorative bar */
        .wood-grain {
            background: #3e2723;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 10px);
            border-bottom: 4px solid #1a1a1a;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden text-white">

    <!-- Top Bar / Controls -->
    <div class="wood-grain p-1 flex-none shadow-lg z-10">
        <div class="flex justify-between items-center max-w-4xl mx-auto px-1">
            <h1 class="text-sm font-bold text-yellow-500 tracking-wider drop-shadow-md">ELECTONE <span class="text-[10px] text-gray-300 font-normal">61Keys</span></h1>
            
            <div class="flex gap-2">
                <button id="toggleNotes" class="control-btn bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-[10px] font-bold border-b-2 border-gray-900">
                    แสดงโน้ต
                </button>
            </div>
        </div>

        <!-- Recording Controls - Compact for vertical space -->
        <div class="flex justify-center gap-1 mt-1 max-w-4xl mx-auto bg-black/30 p-1 rounded-lg flex-wrap">
            <button id="recordBtn" class="control-btn flex items-center bg-gray-800 px-2 py-1 rounded text-[10px] border border-gray-600 min-w-[60px] justify-center">
                <span id="recLed" class="led" style="width:6px;height:6px;margin-right:4px;"></span> อัด
            </button>
            
            <button id="playBtn" class="control-btn flex items-center bg-gray-800 px-2 py-1 rounded text-[10px] border border-gray-600 min-w-[60px] justify-center disabled:opacity-50">
                <span id="playLed" class="led" style="width:6px;height:6px;margin-right:4px;"></span> ฟัง
            </button>

            <a id="downloadBtn" class="control-btn flex items-center bg-gray-700 opacity-50 pointer-events-none px-2 py-1 rounded text-[10px] border border-gray-600 min-w-[60px] justify-center text-white no-underline">
                ⬇️ โหลด
            </a>
            
            <button id="clearBtn" class="control-btn bg-red-900/50 text-red-300 px-2 py-1 rounded text-[10px] border border-red-900">
                ลบ
            </button>
        </div>
    </div>

    <!-- Keyboard Container -->
    <div class="flex-grow bg-black relative w-full h-full overflow-hidden">
        <!-- 
           flex-col-reverse: Places the first element (Lowest Note) at the BOTTOM 
           h-full: Fills the remaining vertical space
        -->
        <div id="keyboard" class="relative w-full h-full flex flex-col-reverse justify-center mx-auto">
            <!-- Keys will be generated here by JS -->
        </div>
    </div>

    <!-- Volume Warning Overlay -->
    <div id="startOverlay" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center flex-col p-6 text-center">
        <div class="text-4xl mb-4">🎹</div>
        <h2 class="text-2xl font-bold text-white mb-2">พร้อมเล่น Electone</h2>
        <p class="text-gray-400 mb-6">61 คีย์ (C2-C7)</p>
        <button id="startBtn" class="bg-yellow-600 text-white font-bold py-3 px-8 rounded-full text-lg shadow-lg hover:bg-yellow-500 transition transform hover:scale-105">
            เริ่มใช้งาน
        </button>
    </div>

    <script>
        // --- Audio Engine ---
        let audioCtx;
        let mainGain;
        let compressor;
        const activeOscillators = {}; 
        
        // Media Recorder Variables
        let mediaRecorder;
        let audioChunks = [];
        let audioDest;

        // Generate 61 Keys (C2 to C7)
        const notes = [];
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const startOctave = 2; // Start at C2
        const totalKeys = 61; // Standard 61 key layout

        let currentOctave = startOctave;
        let noteIndex = 0; // 0 is C
        
        for (let i = 0; i < totalKeys; i++) {
            const noteName = noteNames[noteIndex];
            
            // Calculate Frequency: A4 = 440Hz. A4 is at MIDI note 69.
            // MIDI note number = (octave + 1) * 12 + noteIndex
            const midiNote = (currentOctave + 1) * 12 + noteIndex;
            const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            
            const type = noteName.includes('#') ? 'black' : 'white';

            notes.push({
                note: noteName,
                oct: currentOctave,
                freq: freq,
                type: type
            });

            noteIndex++;
            if (noteIndex >= 12) {
                noteIndex = 0;
                currentOctave++;
            }
        }

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            mainGain = audioCtx.createGain();
            mainGain.gain.value = 0.4; // Slightly lower volume for many keys

            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.value = -20;
            compressor.knee.value = 40;
            compressor.ratio.value = 12;
            compressor.attack.value = 0;
            compressor.release.value = 0.25;

            mainGain.connect(compressor);
            compressor.connect(audioCtx.destination); // For listening

            // --- Setup Media Recorder (Audio Export) ---
            try {
                audioDest = audioCtx.createMediaStreamDestination();
                compressor.connect(audioDest); // Connect output to recorder too

                // Check support
                let options = { mimeType: 'audio/webm' };
                if (!MediaRecorder.isTypeSupported('audio/webm')) {
                    if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
                    else options = undefined; // Let browser decide
                }
                
                mediaRecorder = new MediaRecorder(audioDest.stream, options);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    const downloadBtn = document.getElementById('downloadBtn');
                    downloadBtn.href = url;
                    
                    // Set extension
                    let ext = 'webm';
                    if (mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4')) ext = 'mp4';
                    
                    // Current date string for filename
                    const d = new Date();
                    const dateStr = `${d.getHours()}${d.getMinutes()}${d.getSeconds()}`;
                    downloadBtn.download = `electone_rec_${dateStr}.${ext}`;
                    
                    // Enable button
                    downloadBtn.classList.remove('opacity-50', 'pointer-events-none', 'bg-gray-700');
                    downloadBtn.classList.add('bg-green-600', 'hover:bg-green-500', 'animate-pulse');
                    setTimeout(() => downloadBtn.classList.remove('animate-pulse'), 1000);
                };

            } catch (err) {
                console.error("Recording setup failed", err);
            }
        }

        function playNote(index) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (activeOscillators[index]) return; 

            const freq = notes[index].freq;
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sawtooth';
            osc1.frequency.value = freq;

            const osc2 = audioCtx.createOscillator();
            osc2.type = 'triangle';
            osc2.frequency.value = freq;
            osc2.detune.value = 5; 

            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 2000; 
            filter.Q.value = 1;

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(mainGain);

            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(1, now + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.7, now + 0.2); 

            osc1.start(now);
            osc2.start(now);

            activeOscillators[index] = { osc1, osc2, gainNode };

            const keyElement = document.querySelector(`[data-index="${index}"]`);
            if (keyElement) keyElement.classList.add('active');

            if (isRecording) {
                recordedEvents.push({ type: 'on', index: index, time: Date.now() - recordingStartTime });
            }
        }

        function stopNote(index) {
            const active = activeOscillators[index];
            if (!active) return;

            const now = audioCtx.currentTime;
            const release = 0.15; 

            active.gainNode.gain.cancelScheduledValues(now);
            active.gainNode.gain.setValueAtTime(active.gainNode.gain.value, now);
            active.gainNode.gain.exponentialRampToValueAtTime(0.001, now + release);

            active.osc1.stop(now + release);
            active.osc2.stop(now + release);

            delete activeOscillators[index];

            const keyElement = document.querySelector(`[data-index="${index}"]`);
            if (keyElement) keyElement.classList.remove('active');

            if (isRecording) {
                recordedEvents.push({ type: 'off', index: index, time: Date.now() - recordingStartTime });
            }
        }

        // --- UI & Controls ---
        const keyboardEl = document.getElementById('keyboard');
        let showNotes = true;

        function renderKeyboard() {
            keyboardEl.innerHTML = '';
            
            // Filter white keys
            const whiteKeys = notes.map((n, i) => ({...n, originalIndex: i})).filter(n => n.type === 'white');
            
            // Vertical Layout: Height is distributed among white keys
            // With 61 keys (approx 36 white keys), percentage is small
            const heightPercent = 100 / whiteKeys.length;

            whiteKeys.forEach((noteData) => {
                const key = document.createElement('div');
                key.className = 'key white-key';
                // Vertical layout: Width is full, Height is calculated
                key.style.height = `${heightPercent}%`;
                key.style.width = '100%';
                key.dataset.index = noteData.originalIndex;
                
                const label = document.createElement('div');
                label.className = `note-label ${noteData.note === 'C' ? 'note-c-highlight' : ''}`;
                // Only show oct number on C notes to reduce clutter
                const labelText = noteData.note + (noteData.note === 'C' ? noteData.oct : '');
                label.innerText = showNotes ? labelText : '';
                key.appendChild(label);
                keyboardEl.appendChild(key);

                const nextNoteIndex = noteData.originalIndex + 1;
                if (nextNoteIndex < notes.length && notes[nextNoteIndex].type === 'black') {
                    const blackKey = document.createElement('div');
                    blackKey.className = 'key black-key';
                    blackKey.dataset.index = nextNoteIndex;
                    
                    const bLabel = document.createElement('div');
                    bLabel.className = 'note-label';
                    bLabel.innerText = showNotes ? notes[nextNoteIndex].note : '';
                    blackKey.appendChild(bLabel);
                    
                    // Positioning logic relative to white key
                    // This puts it between the white keys.
                    key.appendChild(blackKey);
                }
            });
        }

        function setupInputs() {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                key.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    playNote(parseInt(key.dataset.index));
                });
                key.addEventListener('mouseup', () => stopNote(parseInt(key.dataset.index)));
                key.addEventListener('mouseleave', (e) => { if(e.buttons === 1) stopNote(parseInt(key.dataset.index)); });
            });
            keyboardEl.addEventListener('touchstart', handleTouch, { passive: false });
            keyboardEl.addEventListener('touchmove', handleTouch, { passive: false });
            keyboardEl.addEventListener('touchend', handleTouchEnd, { passive: false });
        }

        let activeTouches = {};
        function handleTouch(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.classList.contains('key')) {
                    const noteIndex = parseInt(target.dataset.index);
                    if (activeTouches[touch.identifier] !== undefined && activeTouches[touch.identifier] !== noteIndex) {
                        stopNote(activeTouches[touch.identifier]);
                    }
                    if (activeTouches[touch.identifier] !== noteIndex) {
                        playNote(noteIndex);
                        activeTouches[touch.identifier] = noteIndex;
                    }
                }
            }
        }
        function handleTouchEnd(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const noteIndex = activeTouches[touch.identifier];
                if (noteIndex !== undefined) {
                    stopNote(noteIndex);
                    delete activeTouches[touch.identifier];
                }
            }
        }

        // --- Logic: Recording & Download ---
        let isRecording = false;
        let recordingStartTime = 0;
        let recordedEvents = [];
        let playbackTimeouts = [];

        const recordBtn = document.getElementById('recordBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const playBtn = document.getElementById('playBtn');
        const clearBtn = document.getElementById('clearBtn');
        const recLed = document.getElementById('recLed');
        const playLed = document.getElementById('playLed');

        recordBtn.addEventListener('click', () => {
            if (!audioCtx) initAudio(); // Ensure context is ready
            
            if (isRecording) {
                // STOP RECORDING
                isRecording = false;
                recordBtn.innerHTML = '<span id="recLed" class="led" style="width:6px;height:6px;margin-right:4px;"></span> อัด';
                recLed.classList.remove('on');
                
                // Stop Media Recorder
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
            } else {
                // START RECORDING
                isRecording = true;
                recordedEvents = [];
                audioChunks = []; // Reset audio buffer
                recordingStartTime = Date.now();
                
                recordBtn.innerHTML = '<span id="recLed" class="led on" style="width:6px;height:6px;margin-right:4px;"></span> หยุด';
                
                // Disable download until finished
                downloadBtn.classList.add('opacity-50', 'pointer-events-none', 'bg-gray-700');
                downloadBtn.classList.remove('bg-green-600', 'hover:bg-green-500');
                downloadBtn.removeAttribute('href');
                downloadBtn.removeAttribute('download');

                stopPlayback(); // Stop internal playback if running

                // Start Media Recorder
                if (mediaRecorder && mediaRecorder.state === 'inactive') {
                    mediaRecorder.start();
                }
            }
        });

        // Internal Playback Logic (Optional Preview)
        playBtn.addEventListener('click', () => {
            if (playbackTimeouts.length > 0) {
                stopPlayback();
                return;
            }
            if (recordedEvents.length === 0) return;

            playBtn.innerHTML = '<span id="playLed" class="led play-on" style="width:6px;height:6px;margin-right:4px;"></span> หยุด';
            playLed.classList.add('play-on');
            
            recordedEvents.forEach(event => {
                const t = setTimeout(() => {
                    if (event.type === 'on') playNote(event.index);
                    else stopNote(event.index);
                }, event.time);
                playbackTimeouts.push(t);
            });

            const lastEventTime = recordedEvents[recordedEvents.length - 1].time;
            const endT = setTimeout(() => stopPlayback(), lastEventTime + 500);
            playbackTimeouts.push(endT);
        });

        function stopPlayback() {
            playbackTimeouts.forEach(t => clearTimeout(t));
            playbackTimeouts = [];
            Object.keys(activeOscillators).forEach(key => stopNote(key));
            playBtn.innerHTML = '<span id="playLed" class="led" style="width:6px;height:6px;margin-right:4px;"></span> ฟัง';
        }

        clearBtn.addEventListener('click', () => {
            stopPlayback();
            recordedEvents = [];
            audioChunks = [];
            downloadBtn.classList.add('opacity-50', 'pointer-events-none', 'bg-gray-700');
            downloadBtn.classList.remove('bg-green-600');
            downloadBtn.removeAttribute('href');
            alert('ลบข้อมูลทั้งหมดแล้ว');
        });

        document.getElementById('toggleNotes').addEventListener('click', () => {
            showNotes = !showNotes;
            renderKeyboard(); // Re-render to update labels correctly
            setupInputs(); // Re-attach listeners
        });

        renderKeyboard();
        setupInputs();

        document.getElementById('startBtn').addEventListener('click', () => {
            initAudio();
            document.getElementById('startOverlay').style.display = 'none';
        });

    </script>
</body>
</html>
