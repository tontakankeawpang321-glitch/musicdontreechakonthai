<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thai Mobile Clavichord (Vertical)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ตั้งค่าพื้นฐานสำหรับมือถือ */
        body {
            touch-action: none; /* ปิด Gestures ของ Browser */
            user-select: none;
            -webkit-user-select: none;
            background-color: #2c1a0e;
            overflow: hidden;
            font-family: 'Sarabun', sans-serif;
        }

        .wood-texture {
            background: #5d4037;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 10px);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ส่วนควบคุม */
        .controls-area {
            flex: 0 0 auto;
            padding: 8px 12px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            z-index: 50;
        }

        /* คอนเทนเนอร์คีย์บอร์ดแบบแนวตั้ง */
        .keyboard-container {
            flex: 1 1 auto;
            position: relative;
            display: flex;
            flex-direction: column-reverse; /* เรียงจากล่างขึ้นบน */
            background: #1a1a1a;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            padding: 0;
            overflow: hidden;
        }

        /* คีย์ขาว (แนวนอนเต็มจอ) */
        .key-white {
            flex: 1; /* ยืดความสูงให้เท่าๆ กัน */
            width: 100%;
            background: linear-gradient(to right, #ccc 0%, #eee 10%, #fff 50%, #eee 90%, #ccc 100%);
            border-top: 1px solid #999;
            border-bottom: 1px solid #888;
            position: relative;
            z-index: 1;
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            padding-left: 15px;
            box-sizing: border-box;
        }
        .key-white.active {
            background: #ddd;
            transform: scale(0.98);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            border-color: #666;
        }

        /* คีย์ดำ (อยู่ด้านขวา) */
        .key-black {
            position: absolute;
            right: 0;
            width: 60%; /* ความยาวของคีย์ดำ */
            /* height และ bottom จะถูกคำนวณโดย JS */
            background: linear-gradient(to right, #111 0%, #333 10%, #000 100%);
            border: 1px solid #000;
            border-left: 4px solid #000;
            border-radius: 4px 0 0 4px;
            z-index: 10;
            box-shadow: -3px 3px 6px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
        }
        .key-black.active {
            background: #222;
            border-left: 2px solid #000;
            transform: translateX(2px) scale(0.98);
            box-shadow: -1px 1px 3px rgba(0,0,0,0.6);
        }

        /* ป้ายชื่อโน้ต */
        .note-label {
            font-size: 0.9rem;
            color: #666;
            font-weight: bold;
            pointer-events: none;
        }
        .key-black .note-label {
            color: #ccc;
            font-size: 0.8rem;
        }

        /* Buttons & Controls */
        .btn-custom {
            background: linear-gradient(to bottom, #8d6e63, #5d4037);
            border: 1px solid #3e2723;
        }
        .btn-custom:active { transform: translateY(1px); }

        .recording-dot {
            width: 8px; height: 8px; background-color: #555; border-radius: 50%;
            display: inline-block; margin-right: 6px;
        }
        .recording-dot.active {
            background-color: #ff3b30; box-shadow: 0 0 8px #ff3b30; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        /* Volume Slider Customization */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px; border-radius: 50%; background: #fbbf24; margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; background: #888; border-radius: 2px;
        }
    </style>
</head>
<body class="wood-texture h-screen w-screen overflow-hidden">

    <div class="main-container">
        <!-- Control Bar -->
        <div class="controls-area">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-3">
                    <h1 class="text-xl font-serif italic text-amber-200">Clavichord</h1>
                    <span class="text-[10px] text-amber-100/40 uppercase tracking-widest border border-amber-100/20 px-1 rounded">Vertical</span>
                </div>
                <button onclick="stopAllSounds(true)" class="text-[10px] bg-red-900/60 text-red-100 border border-red-800 px-2 py-1 rounded hover:bg-red-800">
                    รีเซ็ตเสียง
                </button>
            </div>

            <div class="flex justify-between items-center gap-2">
                <!-- Record Controls -->
                <div class="flex gap-2">
                    <button id="recordBtn" class="btn-custom px-3 py-1 rounded text-xs font-bold text-white flex items-center shadow-md">
                        <span class="recording-dot" id="recDot"></span> REC
                    </button>
                    <button id="stopRecBtn" class="btn-custom px-3 py-1 rounded text-xs font-bold text-white hidden bg-red-800 shadow-md">
                        STOP
                    </button>
                </div>

                <!-- Volume -->
                <div class="flex items-center gap-2 flex-1 justify-end max-w-[120px]">
                    <span class="text-[10px] text-amber-100/60">VOL</span>
                    <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="0.7" class="w-full">
                </div>
            </div>

            <!-- Audio Player (Pop up when needed) -->
            <div id="audioPlayerContainer" class="hidden w-full mt-2 bg-black/50 p-2 rounded">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] text-gray-300">Recorded Audio</span>
                    <a id="downloadLink" class="text-[10px] text-amber-300 underline">Save</a>
                </div>
                <audio id="audioPlayback" controls class="w-full h-6"></audio>
            </div>
        </div>

        <!-- Keyboard Area -->
        <div class="keyboard-container" id="keyboard">
            <!-- Keys generated by JS -->
        </div>
    </div>

    <script>
        // --- Audio Engine (Enhanced Stability) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let masterGain, limiter, dest, mediaRecorder;
        let audioChunks = [];
        const activeOscillators = {};

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext({ latencyHint: 'interactive' });
                
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.7;

                limiter = audioCtx.createDynamicsCompressor();
                limiter.threshold.value = -8;
                limiter.knee.value = 30;
                limiter.ratio.value = 12;
                limiter.attack.value = 0.002;
                limiter.release.value = 0.25;

                masterGain.connect(limiter);
                limiter.connect(audioCtx.destination);
                
                dest = audioCtx.createMediaStreamDestination();
                limiter.connect(dest);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(noteFreq, keyId) {
            if (!audioCtx) initAudio();
            const now = audioCtx.currentTime;

            if (activeOscillators[keyId]) stopSound(keyId, true);

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            // Clavichord Timbre
            osc1.type = 'sawtooth';
            osc1.frequency.value = noteFreq;
            
            osc2.type = 'triangle';
            osc2.frequency.value = noteFreq;
            osc2.detune.value = 5;

            filter.type = 'lowpass';
            filter.frequency.value = 2800; // Brightness
            filter.Q.value = 0.6;

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(masterGain);

            // Envelope
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.5, now + 0.01); 
            gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.15); 

            osc1.start(now);
            osc2.start(now);

            activeOscillators[keyId] = { osc1, osc2, gainNode };
        }

        function stopSound(keyId, immediate = false) {
            if (!audioCtx || !activeOscillators[keyId]) return;
            const { osc1, osc2, gainNode } = activeOscillators[keyId];
            const now = audioCtx.currentTime;
            
            const release = immediate ? 0.02 : 0.1;
            
            try {
                gainNode.gain.cancelScheduledValues(now);
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(0, now + release);
                osc1.stop(now + release + 0.05);
                osc2.stop(now + release + 0.05);
            } catch(e) {}

            delete activeOscillators[keyId];
        }

        function stopAllSounds(force = false) {
            Object.keys(activeOscillators).forEach(k => stopSound(k, force));
            if(force && audioCtx) {
                audioCtx.close().then(() => { audioCtx = null; initAudio(); });
            }
        }

        // --- Keyboard Layout (Vertical) ---
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const startOctave = 3;
        const endOctave = 4;
        const keyboardEl = document.getElementById('keyboard');

        function getFrequency(note, octave) {
            const noteIndex = notes.indexOf(note);
            let semitonesFromA4 = (noteIndex - 9) + ((octave - 4) * 12);
            return 440 * Math.pow(2, semitonesFromA4 / 12);
        }

        function renderKeyboard() {
            // Count total White keys
            let totalWhiteKeys = 0;
            for (let oct = startOctave; oct <= endOctave; oct++) {
                notes.forEach(note => { if (!note.includes('#')) totalWhiteKeys++; });
            }

            const whiteKeyHeightPercent = 100 / totalWhiteKeys;
            const blackKeyHeightPercent = whiteKeyHeightPercent * 0.7; 

            let whiteKeyIndex = 0; // Starts from 0 (Bottom)

            for (let oct = startOctave; oct <= endOctave; oct++) {
                notes.forEach((note) => {
                    const isSharp = note.includes('#');
                    const freq = getFrequency(note, oct);
                    const keyId = `key-${note}-${oct}`;

                    if (!isSharp) {
                        const key = document.createElement('div');
                        key.className = 'key-white';
                        key.id = keyId;
                        key.innerHTML = `<span class="note-label">${note}${oct}</span>`;
                        // Flex handles layout automatically for white keys in column mode
                        keyboardEl.appendChild(key);
                        addInteraction(key, freq, keyId);
                        whiteKeyIndex++;
                    } else {
                        const key = document.createElement('div');
                        key.className = 'key-black';
                        key.id = keyId;
                        key.innerHTML = `<span class="note-label">${note}</span>`;
                        
                        // Vertical Positioning Logic (Bottom Up)
                        // Black key sits between current white key (already index++) and previous
                        // Wait, in the loop: C (White) -> C# (Black) -> D (White)
                        // At C#, whiteKeyIndex is 1 (meaning 1 white key is below it)
                        // So bottom of black key should be at: (whiteKeyIndex * whiteHeight) - (blackHeight/2)
                        
                        const bottomPos = (whiteKeyIndex * whiteKeyHeightPercent) - (blackKeyHeightPercent / 2);
                        
                        key.style.height = `${blackKeyHeightPercent}%`;
                        key.style.bottom = `${bottomPos}%`;
                        
                        keyboardEl.appendChild(key); // Append to container (absolute pos works relative to container)
                        addInteraction(key, freq, keyId);
                    }
                });
            }
        }

        // --- Interaction (Pointer Events) ---
        function addInteraction(element, freq, keyId) {
            const start = (e) => {
                e.preventDefault();
                element.setPointerCapture(e.pointerId);
                if (!element.classList.contains('active')) {
                    element.classList.add('active');
                    playSound(freq, keyId);
                }
            };
            const end = (e) => {
                e.preventDefault();
                element.releasePointerCapture(e.pointerId);
                element.classList.remove('active');
                stopSound(keyId);
            };

            element.addEventListener('pointerdown', start);
            element.addEventListener('pointerup', end);
            element.addEventListener('pointercancel', end);
            element.addEventListener('pointerleave', end);
            element.addEventListener('contextmenu', e => e.preventDefault());
        }

        // --- Recording & Controls ---
        document.getElementById('recordBtn').addEventListener('click', () => {
            initAudio();
            audioChunks = [];
            const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
            try {
                mediaRecorder = new MediaRecorder(dest.stream, { mimeType: mime });
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: mime });
                    const url = URL.createObjectURL(blob);
                    document.getElementById('audioPlayback').src = url;
                    const dl = document.getElementById('downloadLink');
                    dl.href = url;
                    dl.download = `clavichord-${Date.now()}.webm`;
                    document.getElementById('audioPlayerContainer').classList.remove('hidden');
                };
                mediaRecorder.start();
                document.getElementById('recordBtn').classList.add('hidden');
                document.getElementById('stopRecBtn').classList.remove('hidden');
                document.getElementById('recDot').classList.add('active');
            } catch(e) { alert("Recording error: " + e); }
        });

        document.getElementById('stopRecBtn').addEventListener('click', () => {
            if(mediaRecorder?.state !== 'inactive') mediaRecorder.stop();
            document.getElementById('stopRecBtn').classList.add('hidden');
            document.getElementById('recordBtn').classList.remove('hidden');
            document.getElementById('recDot').classList.remove('active');
        });

        document.getElementById('volumeControl').addEventListener('input', e => {
            if(masterGain) masterGain.gain.value = parseFloat(e.target.value);
        });

        // Start
        renderKeyboard();
        document.body.addEventListener('pointerdown', () => {
            if(audioCtx?.state === 'suspended') audioCtx.resume();
        }, { once: true });

    </script>
</body>
</html>
