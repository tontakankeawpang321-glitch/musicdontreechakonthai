<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>เครื่องเล่นไวโอล่าเสมือนจริง Pro (Virtual Viola)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --wood-dark: #3e2723;
            --wood-light: #5d4037;
            --fingerboard: #1a1a1a;
            --string-c: #a8a8a8;
            --string-g: #b0b0b0;
            --string-d: #c0c0c0;
            --string-a: #e0e0e0;
            --highlight: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Sarabun', sans-serif;
            color: white;
            /* แก้ให้รองรับ scroll แนวตั้งในมือถือ */
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: pan-y; /* อนุญาตให้เลื่อนจอขึ้นลงได้ */
        }

        .viola-neck {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 60vh; /* ให้คอไวโอล่ามีความสูงอิงตามหน้าจอ */
            min-height: 400px;
            margin: 20px auto;
            background: linear-gradient(to bottom, #1a1a1a 0%, #2c2c2c 100%);
            border-radius: 10px 10px 40px 40px;
            border: 4px solid #3e2723;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
            overflow: hidden;
            touch-action: none; /* ห้ามเลื่อนจอเมื่อถูบนคอไวโอล่า */
        }

        .guide-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .string-container {
            position: relative;
            width: 20%;
            height: 100%;
            cursor: pointer;
            z-index: 2;
        }

        .string {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(to right, #888, #fff, #888);
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: box-shadow 0.1s;
        }

        .string-c .string { width: 6px; background: linear-gradient(to right, #666, #aaa, #666); }
        .string-g .string { width: 5px; }
        .string-d .string { width: 4px; }
        .string-a .string { width: 3px; background: linear-gradient(to right, #999, #eee, #999); }

        .string-active {
            animation: vibrate 0.1s infinite;
            box-shadow: 0 0 15px var(--highlight) !important;
            background: #fff !important;
        }

        .finger-marker {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            box-shadow: 0 0 10px gold;
        }

        @keyframes vibrate {
            0% { transform: translateX(-50%) translateX(-1px); }
            50% { transform: translateX(-50%) translateX(1px); }
            100% { transform: translateX(-50%) translateX(-1px); }
        }

        .floating-note {
            position: absolute;
            color: #ffd700;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 2px 2px 4px black;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 1.5s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -100px) scale(1.5); }
        }

        /* Modals and UI Elements */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-bg.active { display: flex; }

        .custom-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #deb887;
            cursor: pointer;
        }
    </style>
</head>
<body class="pb-10">

    <header class="bg-black/50 p-4 w-full sticky top-0 z-40 flex flex-col items-center gap-3 backdrop-blur-md border-b border-neutral-800">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-[#deb887] m-0"><i class="fas fa-guitar"></i> Viola Pro</h1>
            <p class="text-xs text-gray-400 m-0">Simulator & Composer</p>
        </div>
        
        <div class="flex flex-wrap justify-center gap-2 w-full max-w-md">
            <button id="start-btn" class="bg-[#deb887] text-[#3e2723] px-4 py-2 rounded-full font-bold shadow-lg hover:scale-105 transition">
                <i class="fas fa-power-off mr-1"></i> เริ่มระบบเสียง
            </button>
            <button id="btn-settings" class="bg-neutral-800 text-white px-3 py-2 rounded-full border border-neutral-600 hidden hover:bg-neutral-700">
                <i class="fas fa-sliders-h"></i>
            </button>
            <button id="btn-demo" class="bg-indigo-600 text-white px-4 py-2 rounded-full shadow-lg hidden hover:bg-indigo-500">

            </button>
            <button id="btn-composer" class="bg-emerald-600 text-white px-4 py-2 rounded-full shadow-lg hidden hover:bg-emerald-500">
                <i class="fas fa-pen mr-1"></i> แต่งเพลง
            </button>
            <button id="btn-stop-demo" class="bg-red-600 text-white px-4 py-2 rounded-full shadow-lg hidden animate-pulse">

            </button>
        </div>

    <div class="viola-neck" id="neck">
        <div class="guide-line" style="top: 15%"></div>
        <div class="guide-line" style="top: 28%"></div>
        <div class="guide-line" style="top: 40%"></div>
        <div class="guide-line" style="top: 50%"></div>

        <!-- Strings -->
        <div class="string-container string-c" data-string="0" data-base-freq="130.81">
            <div class="string"></div><div class="finger-marker"></div>
        </div>
        <div class="string-container string-g" data-string="1" data-base-freq="196.00">
            <div class="string"></div><div class="finger-marker"></div>
        </div>
        <div class="string-container string-d" data-string="2" data-base-freq="293.66">
            <div class="string"></div><div class="finger-marker"></div>
        </div>
        <div class="string-container string-a" data-string="3" data-base-freq="440.00">
            <div class="string"></div><div class="finger-marker"></div>
        </div>
    </div>

    <!-- Keyboard Hints -->
    <div class="flex justify-around w-full max-w-[400px] mx-auto text-xs text-gray-500 mt-2">
        <div class="text-center w-1/4">Z..M<br>(C3)</div>
        <div class="text-center w-1/4">A..K<br>(G3)</div>
        <div class="text-center w-1/4">Q..I<br>(D4)</div>
        <div class="text-center w-1/4">1..8<br>(A4)</div>
    </div>

    <!-- Settings Modal -->
    <div id="modal-settings" class="modal-bg">
        <div class="bg-neutral-900 border border-neutral-700 p-6 rounded-2xl w-11/12 max-w-sm relative">
            <button class="close-modal absolute top-3 right-4 text-gray-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
            <h2 class="text-xl mb-4 text-[#deb887]"><i class="fas fa-sliders-h mr-2"></i>ปรับแต่งเสียง</h2>
            
            <label class="block mb-2 text-sm">ความดังรวม (Master Volume)</label>
            <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.7" class="w-full custom-range mb-4 bg-neutral-700 h-2 rounded-lg outline-none">
            
            <label class="block mb-2 text-sm">ความกว้างการสั่นนิ้ว (Vibrato Depth)</label>
            <input type="range" id="vib-slider" min="0" max="10" step="1" value="3" class="w-full custom-range mb-4 bg-neutral-700 h-2 rounded-lg outline-none">
            
            <button class="close-modal w-full bg-[#deb887] text-neutral-900 py-2 rounded-lg font-bold mt-2">ตกลง</button>
        </div>
    </div>

    <!-- Demo Modal -->
    <div id="modal-demo" class="modal-bg">
        <div class="bg-neutral-900 border border-neutral-700 p-6 rounded-2xl w-11/12 max-w-sm relative">
            <button class="close-modal absolute top-3 right-4 text-gray-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
            <h2 class="text-xl mb-4 text-indigo-400"><i class="fas fa-music mr-2"></i>เพลงสาธิต</h2>
            <div class="flex flex-col gap-3">
                <button class="demo-song-btn bg-neutral-800 p-3 rounded-lg hover:bg-neutral-700 text-left border border-neutral-700" data-song="twinkle">
                    <span class="font-bold">Twinkle Twinkle Little Star</span><br><span class="text-xs text-gray-400">ระดับ: ง่าย</span>
                </button>
                <button class="demo-song-btn bg-neutral-800 p-3 rounded-lg hover:bg-neutral-700 text-left border border-neutral-700" data-song="joy">
                    <span class="font-bold">Ode to Joy (Beethoven)</span><br><span class="text-xs text-gray-400">ระดับ: ปานกลาง</span>
                </button>
                <button class="demo-song-btn bg-neutral-800 p-3 rounded-lg hover:bg-neutral-700 text-left border border-neutral-700" data-song="birthday">
                    <span class="font-bold">Happy Birthday</span><br><span class="text-xs text-gray-400">ระดับ: ง่าย</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Composer Modal -->
    <div id="modal-composer" class="modal-bg">
        <div class="bg-neutral-900 border border-neutral-700 p-6 rounded-2xl w-11/12 max-w-md relative flex flex-col">
            <button class="close-modal absolute top-3 right-4 text-gray-400 hover:text-white text-xl"><i class="fas fa-times"></i></button>
            <h2 class="text-xl mb-2 text-emerald-400"><i class="fas fa-pen mr-2"></i>ระบบแต่งเพลง</h2>
            <p class="text-xs text-gray-400 mb-3">พิมพ์โน้ตและเว้นวรรค (เช่น C3 D3 E3 F3 G3). ใช้ '-' เพื่อพักเสียงยาวขึ้น</p>
            
            <textarea id="composer-text" class="w-full h-32 bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 resize-none font-mono text-sm" placeholder="ลองพิมพ์: C3 C3 G3 G3 A3 A3 G3 - F3 F3 E3 E3 D3 D3 C3"></textarea>
            
            <div class="flex gap-2 mt-4">
                <button id="btn-play-compose" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg font-bold hover:bg-emerald-500"><i class="fas fa-play mr-1"></i> เล่นเพลงนี้</button>
                <button id="btn-clear-compose" class="bg-neutral-700 text-white px-4 py-2 rounded-lg hover:bg-neutral-600"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    </div>

    <script>
        // --- State & Variables ---
        let audioCtx;
        let masterGain;
        let globalVolume = 0.7;
        let vibratoDepth = 3;
        
        let activeSounds = []; // เก็บ Array เพื่อให้ไล่ปิดง่ายขึ้น
        let isAutoPlaying = false; // ป้องกันการซ้อนทับของเพลงสาธิต

        const neckEl = document.getElementById('neck');
        const strings = document.querySelectorAll('.string-container');

        // Note to Freq Map (อิงจากไวโอล่า)
        const NoteFreqs = {
            'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00,
            'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
            'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99,
            'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
            'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25, 'F5': 698.46, 'F#5': 739.99,
            'G5': 783.99
        };

        // --- Init Audio ---
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                masterGain = audioCtx.createGain();
                masterGain.gain.value = globalVolume;
                masterGain.connect(audioCtx.destination);
                
                // Show UI
                document.getElementById('start-btn').classList.add('hidden');
                document.getElementById('btn-settings').classList.remove('hidden');
                document.getElementById('btn-demo').classList.remove('hidden');
                document.getElementById('btn-composer').classList.remove('hidden');
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- Audio Synthesis Engine ---
        function playTone(frequency) {
            if (!audioCtx) return null;

            const now = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator(); 
            
            osc.type = 'sawtooth';
            osc2.type = 'sawtooth';

            osc.frequency.setValueAtTime(frequency, now);
            osc2.frequency.setValueAtTime(frequency, now);
            osc2.detune.value = 5; // Detune เล็กน้อย

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 2500;
            filter.Q.value = 1;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.5, now + 0.1); // Attack
            gainNode.gain.exponentialRampToValueAtTime(0.3, now + 0.4); // Decay
            
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 5.5; 
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = vibratoDepth; // อิงจาก Settings
            
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            lfoGain.connect(osc2.frequency);

            osc.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(masterGain);
            
            osc.start(now);
            osc2.start(now);
            lfo.start(now);

            const soundObj = {
                osc, osc2, lfo, gainNode, filter,
                stop: () => {
                    if(soundObj.isStopped) return;
                    soundObj.isStopped = true;
                    const stopNow = audioCtx.currentTime;
                    gainNode.gain.cancelScheduledValues(stopNow);
                    gainNode.gain.setValueAtTime(gainNode.gain.value, stopNow);
                    gainNode.gain.linearRampToValueAtTime(0.001, stopNow + 0.15); // Release
                    
                    osc.stop(stopNow + 0.2);
                    osc2.stop(stopNow + 0.2);
                    lfo.stop(stopNow + 0.2);
                    
                    setTimeout(() => {
                        try {
                            osc.disconnect(); osc2.disconnect(); filter.disconnect(); gainNode.disconnect(); lfo.disconnect(); lfoGain.disconnect();
                        } catch(e){}
                    }, 250);
                }
            };
            
            activeSounds.push(soundObj);
            return soundObj;
        }

        // --- Math / Logic ---
        function calculateFrequency(baseFreq, percentageY) {
            const maxSemitones = 12; // จำลองว่าคอยาว 1 Octave
            const semitones = (percentageY / 100) * maxSemitones; 
            return baseFreq * Math.pow(2, semitones / 12);
        }

        function freqToPos(targetFreq) {
            // หาว่าควรเล่นสายไหน (ค้นหาสายที่ความถี่พื้นฐานต่ำกว่าแต่ใกล้เคียงที่สุด)
            let bestString = 0;
            let bases = [130.81, 196.00, 293.66, 440.00]; // C, G, D, A
            
            for(let i=3; i>=0; i--) {
                if(targetFreq >= bases[i] - 1) { // -1 เผื่อทศนิยม
                    bestString = i;
                    break;
                }
            }
            
            // คำนวณเปอร์เซ็นต์
            const baseFreq = bases[bestString];
            const semitones = 12 * Math.log2(targetFreq / baseFreq);
            let percent = (semitones / 12) * 100;
            if(percent > 100) percent = 100; // ล็อกไว้ไม่ให้เกินคอ
            
            return { strIndex: bestString, pos: percent };
        }

        // --- Floating Note UI ---
        function spawnFloatingNote(text, x, y) {
            const noteEl = document.createElement('div');
            noteEl.className = 'floating-note';
            noteEl.textContent = text;
            noteEl.style.left = x + 'px';
            noteEl.style.top = y + 'px';
            document.body.appendChild(noteEl);
            
            setTimeout(() => {
                if(noteEl.parentNode) noteEl.parentNode.removeChild(noteEl);
            }, 1500);
        }

        function spawnNoteAtString(text, strIndex, posYPercent) {
            const strEl = strings[strIndex];
            const rect = strEl.getBoundingClientRect();
            const y = rect.top + (rect.height * (posYPercent/100));
            const x = rect.left + (rect.width / 2);
            spawnFloatingNote(text, x, y);
        }

        // --- Global Interaction Methods ---
        function stopAllSounds() {
            activeSounds.forEach(s => s.stop());
            activeSounds = []; // clear array
            
            strings.forEach(str => {
                str.querySelector('.string').classList.remove('string-active');
                str.querySelector('.finger-marker').style.display = 'none';
            });
        }

        // ป้องกันเสียงค้างตอนลากนิ้วออก
        document.addEventListener('mouseup', () => { if(!isAutoPlaying) stopAllSounds(); });
        document.addEventListener('touchend', () => { if(!isAutoPlaying) stopAllSounds(); });
        document.addEventListener('touchcancel', () => { if(!isAutoPlaying) stopAllSounds(); });

        // --- Instrument Interaction (Mouse/Touch) ---
        strings.forEach((strContainer, index) => {
            let currentStrSound = null;
            const stringVisual = strContainer.querySelector('.string');
            const marker = strContainer.querySelector('.finger-marker');
            const baseFreq = parseFloat(strContainer.dataset.baseFreq);

            const playAtPosition = (y, rectHeight) => {
                if(isAutoPlaying) return; // ไม่ให้ผู้ใช้กวนตอนเล่นออโต้

                let relativeY = y / rectHeight;
                if (relativeY < 0) relativeY = 0;
                if (relativeY > 1) relativeY = 1;

                marker.style.display = 'block';
                marker.style.top = (relativeY * 100) + '%';
                marker.style.left = '50%';
                stringVisual.classList.add('string-active');

                const freq = calculateFrequency(baseFreq, relativeY * 100);

                if (currentStrSound) {
                    currentStrSound.osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
                    currentStrSound.osc2.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
                } else {
                    currentStrSound = playTone(freq);
                }
            };

            const endPlay = () => {
                if(isAutoPlaying) return;
                if (currentStrSound) {
                    currentStrSound.stop();
                    currentStrSound = null;
                }
                stringVisual.classList.remove('string-active');
                marker.style.display = 'none';
            };

            strContainer.addEventListener('mousedown', (e) => {
                if(!audioCtx) return;
                playAtPosition(e.offsetY, strContainer.clientHeight);
            });
            strContainer.addEventListener('mousemove', (e) => {
                if (e.buttons === 1 && currentStrSound) {
                    playAtPosition(e.offsetY, strContainer.clientHeight);
                }
            });
            strContainer.addEventListener('mouseleave', endPlay);

            strContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if(!audioCtx) return;
                const touch = e.touches[0];
                const rect = strContainer.getBoundingClientRect();
                playAtPosition(touch.clientY - rect.top, rect.height);
            }, {passive: false});
            strContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if(!currentStrSound) return;
                const touch = e.touches[0];
                const rect = strContainer.getBoundingClientRect();
                if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                    touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                    playAtPosition(touch.clientY - rect.top, rect.height);
                }
            }, {passive: false});
            strContainer.addEventListener('touchend', endPlay);
        });

        // --- Demo & Autoplay Logic ---
        const delay = ms => new Promise(res => setTimeout(res, ms));

        // เพลงสาธิตพื้นฐาน (Note Name, Duration ms)
        const Demos = {
            twinkle: [
                {n:'C3', d:400}, {n:'C3', d:400}, {n:'G3', d:400}, {n:'G3', d:400}, {n:'A3', d:400}, {n:'A3', d:400}, {n:'G3', d:800},
                {n:'F3', d:400}, {n:'F3', d:400}, {n:'E3', d:400}, {n:'E3', d:400}, {n:'D3', d:400}, {n:'D3', d:400}, {n:'C3', d:800}
            ],
            joy: [
                {n:'E4', d:400}, {n:'E4', d:400}, {n:'F4', d:400}, {n:'G4', d:400}, {n:'G4', d:400}, {n:'F4', d:400}, {n:'E4', d:400}, {n:'D4', d:400},
                {n:'C4', d:400}, {n:'C4', d:400}, {n:'D4', d:400}, {n:'E4', d:400}, {n:'E4', d:600}, {n:'D4', d:200}, {n:'D4', d:800}
            ],
            birthday: [
                {n:'G3', d:300}, {n:'G3', d:100}, {n:'A3', d:400}, {n:'G3', d:400}, {n:'C4', d:400}, {n:'B3', d:800},
                {n:'G3', d:300}, {n:'G3', d:100}, {n:'A3', d:400}, {n:'G3', d:400}, {n:'D4', d:400}, {n:'C4', d:800}
            ]
        };

        async function playSequence(notesArray) {
            isAutoPlaying = true;
            stopAllSounds(); // Clear existing
            
            document.getElementById('btn-stop-demo').classList.remove('hidden');
            
            for(let note of notesArray) {
                if(!isAutoPlaying) break; // กรณีโดนกด stop

                if(note.n === '-') {
                    // Rest (พักเสียง)
                    await delay(note.d);
                    continue;
                }

                let freq = NoteFreqs[note.n];
                if(freq) {
                    let posData = freqToPos(freq);
                    let strIndex = posData.strIndex;
                    let posY = posData.pos;

                    // Visual Setup
                    let strContainer = strings[strIndex];
                    let stringVisual = strContainer.querySelector('.string');
                    let marker = strContainer.querySelector('.finger-marker');
                    
                    marker.style.display = 'block';
                    marker.style.top = posY + '%';
                    marker.style.left = '50%';
                    stringVisual.classList.add('string-active');
                    
                    spawnNoteAtString(note.n, strIndex, posY);
                    
                    // Play Sound
                    let s = playTone(freq);
                    
                    await delay(note.d - 50); // เล่นเกือบเต็มเวลา หักออกนิดนึงให้มีช่องว่าง
                    
                    // Stop Sound
                    if(s) s.stop();
                    stringVisual.classList.remove('string-active');
                    marker.style.display = 'none';
                    
                    await delay(50); // ช่องว่างก่อนตัวถัดไป
                } else {
                    // หากพิมพ์โน้ตผิดข้ามไป
                    await delay(note.d);
                }
            }
            
            isAutoPlaying = false;
            document.getElementById('btn-stop-demo').classList.add('hidden');
            stopAllSounds(); // Cleanup
        }

        // --- UI Events Binding ---
        document.getElementById('start-btn').addEventListener('click', initAudio);

        // Modal Handlers
        const modals = {
            settings: document.getElementById('modal-settings'),
            demo: document.getElementById('modal-demo'),
            composer: document.getElementById('modal-composer')
        };

        document.getElementById('btn-settings').addEventListener('click', () => modals.settings.classList.add('active'));
        document.getElementById('btn-demo').addEventListener('click', () => modals.demo.classList.add('active'));
        document.getElementById('btn-composer').addEventListener('click', () => modals.composer.classList.add('active'));

        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.target.closest('.modal-bg').classList.remove('active');
            });
        });

        // Settings Logic
        document.getElementById('vol-slider').addEventListener('input', (e) => {
            globalVolume = parseFloat(e.target.value);
            if(masterGain) masterGain.gain.value = globalVolume;
        });
        document.getElementById('vib-slider').addEventListener('input', (e) => {
            vibratoDepth = parseFloat(e.target.value);
        });

        // Demo Logic
        document.querySelectorAll('.demo-song-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                let songKey = btn.dataset.song;
                modals.demo.classList.remove('active');
                playSequence(Demos[songKey]);
            });
        });

        document.getElementById('btn-stop-demo').addEventListener('click', () => {
            isAutoPlaying = false; // Flag จะทำให้ loop ของ playSequence หยุดในรอบถัดไป
            stopAllSounds();
            document.getElementById('btn-stop-demo').classList.add('hidden');
        });

        // Composer Logic
        document.getElementById('btn-play-compose').addEventListener('click', () => {
            const text = document.getElementById('composer-text').value.trim().toUpperCase();
            if(!text) return;
            
            // แปลง Text เป็น Array อิงจากวรรค
            let tokens = text.split(/\s+/);
            let sequence = [];
            
            tokens.forEach(t => {
                if(t === '-') sequence.push({ n: '-', d: 400 });
                else sequence.push({ n: t, d: 400 }); // Fix speed at 400ms per note for simplicity
            });
            
            modals.composer.classList.remove('active');
            playSequence(sequence);
        });

        document.getElementById('btn-clear-compose').addEventListener('click', () => {
            document.getElementById('composer-text').value = '';
        });

        // --- Keyboard Controls (เหมือนเดิมแต่จัดให้อยู่ร่วมกับระบบใหม่) ---
        const keyMap = {
            'z':{s:0,p:0},'x':{s:0,p:10},'c':{s:0,p:20},'v':{s:0,p:30},'b':{s:0,p:40},'n':{s:0,p:50},'m':{s:0,p:60},
            'a':{s:1,p:0},'s':{s:1,p:10},'d':{s:1,p:20},'f':{s:1,p:30},'g':{s:1,p:40},'h':{s:1,p:50},'j':{s:1,p:60},'k':{s:1,p:70},
            'q':{s:2,p:0},'w':{s:2,p:10},'e':{s:2,p:20},'r':{s:2,p:30},'t':{s:2,p:40},'y':{s:2,p:50},'u':{s:2,p:60},'i':{s:2,p:70},
            '1':{s:3,p:0},'2':{s:3,p:10},'3':{s:3,p:20},'4':{s:3,p:30},'5':{s:3,p:40},'6':{s:3,p:50},'7':{s:3,p:60},'8':{s:3,p:70}
        };
        const activeKeys = {};

        document.addEventListener('keydown', (e) => {
            if (e.repeat || activeKeys[e.key] || isAutoPlaying) return;
            // ป้องกันการเล่นตอนพิมพ์ข้อความใน textarea
            if(e.target.tagName === 'TEXTAREA') return;

            const data = keyMap[e.key.toLowerCase()];
            if (data) {
                initAudio();
                const strContainer = strings[data.s];
                const baseFreq = parseFloat(strContainer.dataset.baseFreq);
                const freq = calculateFrequency(baseFreq, data.p);
                
                const marker = strContainer.querySelector('.finger-marker');
                const stringVisual = strContainer.querySelector('.string');
                marker.style.display = 'block';
                marker.style.top = data.p + '%';
                marker.style.left = '50%';
                stringVisual.classList.add('string-active');

                const sound = playTone(freq);
                activeKeys[e.key] = { sound, visual: { marker, stringVisual } };
            }
        });

        document.addEventListener('keyup', (e) => {
            const keyData = activeKeys[e.key];
            if (keyData) {
                keyData.sound.stop();
                keyData.visual.marker.style.display = 'none';
                keyData.visual.stringVisual.classList.remove('string-active');
                delete activeKeys[e.key];
            }
        });

    </script>
</body>
</html>
